<title>競馬ファクター新聞</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Shippori+Mincho:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#f5f0e6;--p2:#ede8d8;--p3:#e5dfc8;--ink:#1a1410;--dim:#7a7060;--lt:#a09888;--red:#c41e3a;--grn:#2d6a30;--blu:#1a4488;--gld:#b8860b;--bdr:#c8c0a8;--bdt:#8a8068;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;background:#d8d0b8;color:var(--ink);min-height:100vh;min-height:100dvh;padding-bottom:var(--safe-bottom);overscroll-behavior-y:contain}
/* Header - sticky on mobile */
.hd{background:var(--p);border-bottom:4px double var(--bdt);text-align:center;padding:calc(var(--safe-top) + 8px) 16px 8px;position:sticky;top:0;z-index:100}
.hd::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
.hd h1{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:800;letter-spacing:4px}
.hd-date{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:2px}
.hd-ver{font-size:9px;color:var(--lt);letter-spacing:1px;margin-top:2px}
/* Nav - bottom fixed tab bar on mobile */
.nav{display:flex;gap:0;justify-content:center;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--p);border-top:2px solid var(--bdt);padding-bottom:var(--safe-bottom)}
.nav button{flex:1;padding:12px 4px;background:var(--p);border:none;border-top:3px solid transparent;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;color:var(--dim);letter-spacing:0;transition:background .15s;touch-action:manipulation}
.nav button.on{background:var(--p2);color:var(--ink);border-top-color:var(--gld)}
.nav button:active{opacity:.7}
.ct{max-width:900px;margin:0 auto;padding:8px;padding-bottom:calc(60px + var(--safe-bottom))}
/* Panels */
.pnl{background:var(--p);border:2px solid var(--bdt);padding:12px;margin-bottom:8px;border-radius:4px}
.pnl h3{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.pnl h3.r{color:var(--red)}.pnl h3.g{color:var(--grn)}.pnl h3.b{color:var(--blu)}
/* Inputs - larger touch targets */
textarea{width:100%;background:var(--p2);border:1px solid var(--bdr);padding:12px;font-size:14px;line-height:1.7;font-family:monospace;color:var(--ink);resize:vertical;border-radius:4px;min-height:120px}
textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(196,30,58,.15)}
input[type="number"]{font-size:16px;padding:8px;border-radius:4px;border:1px solid var(--bdr);background:var(--p2)}
input[type="number"]:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 2px rgba(26,68,136,.15)}
/* Buttons - larger for touch */
.btn{padding:12px 24px;border:none;border-radius:6px;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;touch-action:manipulation;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-r{background:var(--red);color:#fff}
.btn-b{background:var(--blu);color:#fff}
.btn-s{background:var(--p);color:var(--ink);font-size:13px;padding:8px 16px;border:1px solid var(--bdr);border-radius:4px;touch-action:manipulation}
.btn-s:active{background:var(--p3)}
/* Horse rows */
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--bdr);flex-wrap:wrap;min-height:44px}
.wk{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.sc{font-weight:900;font-size:18px;color:var(--red);margin-left:auto;min-width:36px;text-align:right}
/* Tags */
.tag{display:inline-block;padding:3px 7px;font-size:11px;font-weight:700;border-radius:3px;margin:2px 1px}
.tag-g{background:rgba(45,106,48,.12);color:var(--grn)}.tag-n{background:rgba(184,134,11,.12);color:var(--gld)}.tag-b{background:rgba(196,30,58,.12);color:var(--red)}
/* Cards - larger touch targets */
.card{background:var(--p);border:2px solid var(--bdt);padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:6px;min-height:52px;touch-action:manipulation;transition:background .1s}
.card:active{background:var(--p3)}
.card.hit{border-color:var(--grn);border-left:5px solid var(--grn)}.card.miss{border-color:var(--red);border-left:5px solid var(--red)}.card.pend{border-color:var(--gld);border-left:5px solid var(--gld)}
/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--p2);border:1px solid var(--bdr);padding:10px 6px;text-align:center;border-radius:4px}
.stat .v{font-size:20px;font-weight:900}.stat .l{font-size:10px;color:var(--dim)}
/* Bet */
.bet-box{background:rgba(45,106,48,.06);border:2px solid var(--grn);padding:14px;border-radius:6px}
.bet-nums{font-family:'Shippori Mincho',serif;font-size:28px;font-weight:900;letter-spacing:4px}
.exc{background:var(--p3);border:1px dashed var(--bdr);padding:8px 12px;opacity:.6;font-size:12px;margin-bottom:8px;border-radius:4px}
.res-preview{background:rgba(26,68,136,.06);border:1px solid var(--blu);padding:10px 12px;margin:8px 0;font-size:13px;border-radius:4px}
.reasons{background:rgba(196,30,58,.06);border:1px solid var(--red);padding:12px 14px;margin-top:8px;border-radius:4px}
.reasons h4{font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px}
.trend-bar{width:60px;height:8px;background:var(--bdr);border-radius:4px;display:inline-block;vertical-align:middle}
.trend-fill{height:100%;background:var(--red);border-radius:4px}
.hidden{display:none}
/* Sync */
.sync-url{width:100%;padding:10px;font-size:13px;border:1px solid var(--bdr);background:var(--p2);border-radius:4px;font-family:monospace;color:var(--ink)}
.sync-url:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 2px rgba(26,68,136,.15)}
.sync-status{padding:10px;border-radius:4px;font-size:13px;margin-top:8px;line-height:1.6}
.sync-ok{background:rgba(45,106,48,.08);border:1px solid var(--grn);color:var(--grn)}
.sync-err{background:rgba(196,30,58,.08);border:1px solid var(--red);color:var(--red)}
.sync-info{background:rgba(26,68,136,.08);border:1px solid var(--blu);color:var(--blu)}
.sync-time{font-size:11px;color:var(--lt);margin-top:4px}
.fs-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;vertical-align:middle;margin-left:6px}
.fs-on{background:rgba(45,106,48,.15);color:var(--grn);border:1px solid var(--grn)}
.fs-off{background:rgba(196,30,58,.1);color:var(--lt);border:1px solid var(--bdr)}
/* Desktop */
@media(min-width:601px){
  .hd h1{font-size:26px;letter-spacing:5px}
  .hd{padding:12px 16px}
  .nav{position:sticky;top:52px;bottom:auto;border-top:none;border-bottom:2px solid var(--bdt);padding-bottom:0}
  .ct{padding:10px;padding-bottom:20px}
  .nav button{padding:8px 18px;font-size:12px}
  .row{gap:8px}
}
/* Small phone */
@media(max-width:380px){
  .hd h1{font-size:18px;letter-spacing:2px}
  .nav button{font-size:10px;padding:7px 2px}
  .tag{font-size:9px;padding:2px 4px}
  .sc{font-size:16px}
  .bet-nums{font-size:24px}
  .stat .v{font-size:16px}
}
</style>

<body>

</header>

<button class="on" onclick="showView('input')">＋ 入力</button>
<button onclick="showView('list')">📋 予想<span id="countBadge"></span></button>

<script>
// ===== STORAGE (File System Access API + localStorage fallback) =====
const SK='keiba-races-v2';
const HK='keiba-horsedb-v1';
const SETTINGS_KEY='keiba-settings-v1';

// --- File System Access API ---
let _dirHandle=null; // 保存先フォルダのハンドル
const HAS_FS=!!window.showDirectoryPicker;

async function _fsWrite(name,data){
  if(!_dirHandle)return false;
  try{
    const fh=await _dirHandle.getFileHandle(name,{create:true});
    const wr=await fh.createWritable();
    await wr.write(data);
    await wr.close();
    return true;
  }catch(e){console.error('FS write error:',name,e);return false}
}
async function _fsRead(name){
  if(!_dirHandle)return null;
  try{
    const fh=await _dirHandle.getFileHandle(name);
    const f=await fh.getFile();
    return await f.text();
  }catch{return null}
}

// フォルダ選択＆権限チェック
async function connectFolder(){
  try{
    _dirHandle=await window.showDirectoryPicker({id:'keiba-data',mode:'readwrite',startIn:'documents'});
    // IndexedDBにハンドルを永続化
    await _idbSave('dirHandle',_dirHandle);
    return true;
  }catch(e){
    if(e.name!=='AbortError')console.error('Folder pick error:',e);
    return false;
  }
}
// 起動時にIndexedDBからハンドルを復元
async function restoreFolder(){
  try{
    const h=await _idbLoad('dirHandle');
    if(!h)return false;
    // 権限確認
    if(await h.queryPermission({mode:'readwrite'})==='granted'){
      _dirHandle=h;return true;
    }
    // 権限再要求（ユーザー操作が必要な場合がある）
    if(await h.requestPermission({mode:'readwrite'})==='granted'){
      _dirHandle=h;return true;
    }
    return false;
  }catch{return false}
}

// --- IndexedDB (ハンドル永続化用) ---
function _idbOpen(){
  return new Promise((ok,ng)=>{
    const req=indexedDB.open('keiba-fs',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('kv');
    req.onsuccess=()=>ok(req.result);
    req.onerror=()=>ng(req.error);
  });
}
async function _idbSave(k,v){
  const db=await _idbOpen();
  return new Promise((ok,ng)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v,k);
    tx.oncomplete=()=>ok();tx.onerror=()=>ng(tx.error);
  });
}
async function _idbLoad(k){
  const db=await _idbOpen();
  return new Promise((ok,ng)=>{
    const tx=db.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(k);
    req.onsuccess=()=>ok(req.result);req.onerror=()=>ng(req.error);
  });
}

// --- 統合ストレージ (FS優先、localStorage併用) ---
// 書き込みキュー（高頻度の保存をバッチ化）
let _writeQueue={};
let _writeTimer=null;
function _scheduleWrite(name,data){
  _writeQueue[name]=data;
  if(!_writeTimer){
    _writeTimer=setTimeout(async()=>{
      const q={..._writeQueue};_writeQueue={};_writeTimer=null;
      for(const[n,d]of Object.entries(q)){
        await _fsWrite(n,d);
      }
    },300);
  }
}

function loadR(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch{return[]}}
function saveR(r){
  r.sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  const json=JSON.stringify(r);
  try{localStorage.setItem(SK,json)}catch(e){
    r.forEach(x=>{if(x.id?.startsWith('bulk_')&&x.result)delete x.result.payouts});
    try{localStorage.setItem(SK,JSON.stringify(r))}catch{}
  }
  if(_dirHandle)_scheduleWrite('races.json',json);
  HORSE_DB=buildHorseDB();
  updateCountBadge();
}
function loadHorseStore(){try{return JSON.parse(localStorage.getItem(HK))||{}}catch{return{}}}
function saveHorseStore(db){
  const json=JSON.stringify(db);
  try{localStorage.setItem(HK,json)}catch(e){console.error('馬DB保存エラー:',e)}
  if(_dirHandle)_scheduleWrite('horse_store.json',json);
}
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY))||{}}catch{return{}}}
function saveSettings(s){
  const json=JSON.stringify(s);
  try{localStorage.setItem(SETTINGS_KEY,json)}catch{}
  if(_dirHandle)_scheduleWrite('settings.json',json);
}

let RACES=loadR();
// 起動時クリーンアップ: 取込データの肥大化を防止
(function cleanupRaces(){
  let changed=false;
  RACES.forEach(r=>{
    if(r.result?.allResults&&r.id?.startsWith('bulk_')){
      delete r.result.allResults;
      delete r.result.harlonTime;
      delete r.result.racePace;
      delete r.result.corners;
      changed=true;
    }
  });
  if(changed){
    try{localStorage.setItem(SK,JSON.stringify(RACES))}catch(e){
      RACES=RACES.filter(r=>!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_'));
      try{localStorage.setItem(SK,JSON.stringify(RACES))}catch{}
    }
  }
})();
let HORSE_STORE=loadHorseStore();

// ファイルからの初回読み込み（起動時）
async function initFileStorage(){
  if(!HAS_FS)return false;
  const restored=await restoreFolder();
  if(!restored)return false;
  // ファイルからデータ読み込み → localStorageより新しければ採用
  try{
    const rJson=await _fsRead('races.json');
    if(rJson){
      const rData=JSON.parse(rJson);
      if(rData.length>=RACES.length){
        RACES=rData;
        try{localStorage.setItem(SK,rJson)}catch{}
      }
    }
    const hJson=await _fsRead('horse_store.json');
    if(hJson){
      const hData=JSON.parse(hJson);
      if(Object.keys(hData).length>=Object.keys(HORSE_STORE).length){
        HORSE_STORE=hData;
        try{localStorage.setItem(HK,hJson)}catch{}
      }
    }
    const sJson=await _fsRead('settings.json');
    if(sJson){
      try{localStorage.setItem(SETTINGS_KEY,sJson)}catch{}
    }
  }catch(e){console.error('FS initial load error:',e)}
  return true;
}

// ===== 蓄積馬データベース =====
function buildHorseDB(){
  const db={};
  // ソース1: レース結果から構築
  RACES.forEach(r=>{
    if(!r.result?.allResults)return;
    const inf=r.info||{};
    r.result.allResults.forEach(ar=>{
      const name=ar.name;if(!name)return;
      if(!db[name])db[name]=[];
      db[name].push({
        date:inf.date||'',
        venue:(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
        dist:inf.dist||0,
        surface:inf.type||'',
        cond:inf.cond||'',
        rank:ar.rank,
        runners:r.result.allResults.length,
        time:ar.time||'',
        last3f:ar.last3f||0,
        positions:ar.positions||null,
        jockey:ar.jockey||'',
        bodyWeight:ar.bodyWeight||''
      });
    });
  });
  // ソース2: 一括取り込み分（別ストレージ）
  Object.entries(HORSE_STORE).forEach(([name,runs])=>{
    if(!db[name])db[name]=[];
    runs.forEach(r=>{
      // 重複チェック（同日・同順位は追加しない）
      const dup=db[name].some(x=>x.date===r.date&&x.rank===r.rank&&x.dist===r.dist);
      if(!dup)db[name].push(r);
    });
  });
  Object.values(db).forEach(arr=>arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
  return db;
}
let HORSE_DB=buildHorseDB();

// ===== DATE =====
document.getElementById('dateStr').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

// ===== WAKU =====
const WC={1:'#eee8d8',2:'#1a1a1a',3:'#c41e3a',4:'#1a4488',5:'#d4a017',6:'#2d6a30',7:'#d4650b',8:'#c4507a'};
const WT={1:'#1a1a1a',2:'#fff',3:'#fff',4:'#fff',5:'#1a1a1a',6:'#fff',7:'#fff',8:'#fff'};

// ===== 設定 =====
const CUTOFF_DATE='2026/3/15';
const CUTOFF_KEY='20260315';
function dateToKey(d){if(!d)return'99999999';const p=d.split('/');if(p.length!==3)return'99999999';return p[0]+p[1].padStart(2,'0')+p[2].padStart(2,'0')}
function isPastOnly(race){const dk=dateToKey(race?.info?.date||'');return dk!=='99999999'&&dk<=CUTOFF_KEY}
function updateCountBadge(){const el=document.getElementById('countBadge');if(el)el.textContent=RACES.length?'('+RACES.length+')':''}

// ===== SIRE/JOCKEY DB =====
const SDB={
  // {d:ダート適性, t:芝適性} ◎=非常に合う ○=合う △=微妙 ×=不向き
  キズナ:{d:'○',t:'◎'},ディープインパクト:{d:'△',t:'◎'},ハービンジャー:{d:'△',t:'◎'},
  シュヴァルグラン:{d:'△',t:'◎'},ロードカナロア:{d:'○',t:'◎'},エピファネイア:{d:'△',t:'◎'},
  ハーツクライ:{d:'△',t:'◎'},ドゥラメンテ:{d:'○',t:'◎'},モーリス:{d:'○',t:'◎'},
  サトノダイヤモンド:{d:'△',t:'○'},ブリックスアンドモルタル:{d:'○',t:'○'},
  アドマイヤマーズ:{d:'○',t:'○'},ダノンキングリー:{d:'○',t:'○'},
  スワーヴリチャード:{d:'○',t:'○'},サトノクラウン:{d:'○',t:'○'},
  シニスターミニスター:{d:'◎',t:'×'},パイロ:{d:'◎',t:'×'},ドレフォン:{d:'◎',t:'△'},
  マジェスティックウォリアー:{d:'◎',t:'×'},クリソベリル:{d:'◎',t:'△'},
  ヘニーヒューズ:{d:'◎',t:'×'},ホッコータルマエ:{d:'◎',t:'×'},
  ルーラーシップ:{d:'○',t:'◎'},オルフェーヴル:{d:'○',t:'◎'},
  ダンカーク:{d:'○',t:'△'},アジアエクスプレス:{d:'○',t:'△'},
  ビッグアーサー:{d:'△',t:'○'},ラニ:{d:'◎',t:'△'},
  ラブリーデイ:{d:'○',t:'○'},ロージズインメイ:{d:'◎',t:'△'},
  サトノアラジン:{d:'△',t:'○'},サンダースノー:{d:'◎',t:'△'},
  ディーマジェスティ:{d:'○',t:'○'}
};
const JDB={'川田将雅':5,'川田 将雅':5,'ルメール':5,'C.ルメール':5,
'坂井瑠星':5,'坂井 瑠星':5,'横山武史':5,'横山 武史':5,
'松山弘平':4,'松山 弘平':4,'戸崎圭太':4,'戸崎 圭太':4,
'レーン':5,'D.レーン':5,'モレイラ':5,'J.モレイラ':5,
'武豊':4,'武 豊':4,
'池添謙一':4,'池添 謙一':4,'北村友一':4,'北村 友一':4,
'横山和生':4,'横山 和生':4,'吉田隼人':3,'吉田 隼人':3,
'西村淳也':4,'西村 淳也':4,'鮫島克駿':3,'鮫島 克駿':3,

// ===== PARSER =====
function parse(t){const r={info:{},horses:[]};let m;m=t.match(/(\d{4})年(\d{1,2})月(\d{1,2})日[（(](.+?)[)）]/);if(m)r.info.date=`${m[1]}/${m[2]}/${m[3]}`;m=t.match(/(\d+回\S+\d+日)/);if(m)r.info.course=m[1];m=t.match(/(\d+)レース/);if(m)r.info.raceNum=m[1];m=t.match(/(3歳未勝利|3歳新馬|4歳以上\S+|[^\n]*(?:オープン|リステッド|G[ⅠⅡⅢ123]))/);if(m)r.info.cls=m[1];m=t.match(/コース：([\d,]+)メートル[（(](.+?)[)）]/);if(m){r.info.dist=parseInt(m[1].replace(',',''));r.info.surf=m[2];r.info.dir=m[2].includes('左')?'左':m[2].includes('右')?'右':null}m=t.match(/(芝|ダート)\s+(良|稍重|重|不良)/);if(m){r.info.type=m[1];r.info.cond=m[2]}
// コース方向フォールバック：競馬場名から自動判定
if(!r.info.dir){const vn=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');if(LEFT_VENUES.some(v=>vn.includes(v)))r.info.dir='左';else if(RIGHT_VENUES.some(v=>vn.includes(v)))r.info.dir='右'}
const secs=t.split(/(?=枠\d)/);for(const sec of secs){if(!sec.startsWith('枠'))continue;const h={};m=sec.match(/枠(\d+)/);if(m)h.waku=+m[1];m=sec.match(/枠\d+\S*\s+(\d+)/);if(m)h.num=+m[1];h.bl=/ブリンカー着用/.test(sec);const L=sec.split('\n').map(l=>l.trim()).filter(Boolean);
// 馬名検出（カタカナ3文字以上、英字混在も許容）
for(let i=0;i<Math.min(L.length,8);i++){
  const ln=L[i];
  // 「枠」「ブリンカー」「番人気」「kg」「父：」「母：」「勝負服」を除外
  if(ln.match(/^枠|ブリンカー|番人気|^\(|^父：|^母：|勝負服|kg$|^\d+\.\d|万円$|^[\d.]+$/))continue;
  // カタカナ3文字以上を含む行（英字混在OK）
  if(ln.match(/[ァ-ヶー]{3,}/)&&!ln.match(/クラス|コース|メートル|レース|未勝利|新馬|オープン|指定|定量|馬齢|牝|牡|せん/)){
    h.name=ln.replace(/\t.*$/,'').trim();break;
  }
}
// フォールバック：数字の次の行
if(!h.name)for(let i=0;i<L.length;i++){if(/^\d+$/.test(L[i])&&i+1<L.length){let nx=L[i+1];if(nx&&!nx.match(/^[\d.(]/)&&nx!=='ブリンカー着用'){h.name=nx.replace(/\t.*$/,'').trim();break}if(nx==='ブリンカー着用'&&i+2<L.length){h.name=L[i+2].replace(/\t.*$/,'').trim();break}}}
m=sec.match(/([\d.]+)\s*\n\s*\((\d+)番人気\)/);if(m){h.odds=parseFloat(m[1]);h.pop=+m[2]}m=sec.match(/\((\d+\.\d+\.\d+\.\d+)\)/);if(m){const p=m[1].split('.');h.rec={w:+p[0],s:+p[1],t:+p[2],o:+p[3]};h.starts=+p[0]+ +p[1]+ +p[2]+ +p[3]}m=sec.match(/(\d{3,})kg\s*\(([+\-\d初出走]+)\)/);if(m){h.wt=+m[1];h.wc=m[2]==='初出走'?null:parseInt(m[2])}m=sec.match(/(牡|牝|せん)(\d)/);if(m){h.sex=m[1];h.age=+m[2]}
for(let i=0;i<L.length;i++){if(/^\d+\.\dkg$/.test(L[i])){for(let j=i+1;j<L.length;j++){const c=L[j];if(c&&!c.match(/^\d{4}年/)&&!c.match(/^父/)&&!c.match(/^母/)&&c.length<20&&(c.match(/[◇△▲★☆◆]/)||c.match(/[一-龥]{1,4}\s/)||c.match(/[ぁ-ん]/))){const dm=c.match(/^([◆◇])/);h.jkDiscount=dm?dm[1]:null;h.jk=c.replace(/[◇△▲★☆◆]/g,'').trim();h.imp=parseFloat(L[i]);break}}break}}
m=sec.match(/父：(.+)/);if(m)h.sire=m[1].trim();m=sec.match(/母の父：(.+)/);if(m)h.bms=m[1].trim();if(!h.bms){m=sec.match(/母父[:：]\s*(.+)/);if(m)h.bms=m[1].trim()}m=sec.match(/([^\n]+)\((美浦|栗東)\)/);if(m)h.trainer=m[1].trim();
// 総賞金（馬ごとのsec内から取得）
m=sec.match(/([0-9,]+)\s*万円/);if(m){const pv=parseInt(m[1].replace(/,/g,''));if(pv>0&&pv<100000)h.prize=pv}
h.prev=[];const pp=/(\d{4})年(\d{1,2})月(\d{1,2})日\s+(\S+)\s*\n\s*([^\n]+)\s*\n\s*(\d+)着\s+(\d+)頭/g;let pm;while((pm=pp.exec(sec))!==null){const pr={fin:+pm[6],run:+pm[7],dateKey:pm[1]*10000+ +pm[2]*100+ +pm[3],venue:pm[4],cls:pm[5]};const af=sec.substring(pm.index+pm[0].length);let x=af.match(/3F\s+([\d.]+)/);if(x)pr.f3=parseFloat(x[1]);x=af.match(/(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s*\n?\s*3F/);if(x)pr.pos=[+x[1],+x[2],+x[3],+x[4]];x=af.match(/(\d{4})(芝|ダ)/);if(x){pr.dist=+x[1];pr.surface=x[2]}
// 前走馬場状態
x=af.match(/(良|稍重|重|不良)/);if(x)pr.cond=x[1];
// 前走斤量・騎手
const wLines=af.split('\n').map(l=>l.trim()).filter(Boolean);
for(let wi=0;wi<wLines.length;wi++){if(wLines[wi].match(/^\d{2}\.\d$/)){pr.weight=parseFloat(wLines[wi]);if(wi+1<wLines.length){const jl=wLines[wi+1];if(jl&&jl.match(/^[一-龥ぁ-ん]/)&&jl.length<15)pr.jockey=jl.replace(/[◆◇△▲★☆]/g,'').trim()}break}}
// 前走の回り方向
if(LEFT_VENUES.some(v=>(pr.venue||'').includes(v)))pr.dir='左';else if(RIGHT_VENUES.some(v=>(pr.venue||'').includes(v)))pr.dir='右';
// 着差（1着馬との差）: "馬名(0.6)" パターン
x=af.match(/\n([ァ-ヶー\u3000-\u9FFFa-zA-Z]+)\(([\d.]+)\)/);if(x)pr.gap=parseFloat(x[2]);

h.prev.sort((a,b)=>b.dateKey-a.dateKey);
if(h.name&&h.num)r.horses.push(h)}
// === オッズデータは券種別テキストエリアから取得（doAnalyze側で処理） ===
r._marketOdds={tansho:{},wakuren:{},umaren:{},wide:{},umatan:{},sanrenpuku:{},sanrentan:{}};
return r}

// ===== SCORING =====
function score(race){const hs=race.horses,inf=race.info,dist=inf.dist||1800,surf=inf.type||'ダート';
const isDirt=surf==='ダート';
const raceDir=inf.dir||null;
const raceCond=inf.cond||'良';
const isHeavy=raceCond==='重'||raceCond==='不良';
const isSlight=raceCond==='稍重';

// --- STEP1: 各馬から「今回の条件に近い前走」を探す ---
// 条件一致度: 同芝ダ＋距離差200m以内→best、同芝ダのみ→ok、それ以外→前走[0]
function findMatchRace(h){
  if(!h.prev||h.prev.length===0)return null;
  // 完全一致（同芝ダ＋距離±200m）
  const surfKey=isDirt?'ダ':'芝';
  let best=h.prev.find(p=>p.dist&&Math.abs(p.dist-dist)<=200&&p.surface===surfKey);
  if(best)return best;
  // 芝ダ一致のみ
  best=h.prev.find(p=>p.surface===surfKey);
  if(best)return best;
  // 距離一致のみ
  best=h.prev.find(p=>p.dist&&Math.abs(p.dist-dist)<=200);
  if(best)return best;
  return h.prev[0];
}
hs.forEach(h=>{h._matchRace=findMatchRace(h)});

// --- STEP2: 条件一致レースの上がり3Fを集めて相対評価 ---
const f3list=hs.map(h=>h._matchRace?.f3).filter(v=>v&&v>0);
const f3avg=f3list.length>0?f3list.reduce((a,b)=>a+b,0)/f3list.length:38.5;
const f3sorted=[...f3list].sort((a,b)=>a-b); // 速い順

// --- STEP3: 展開予測（逃げ馬の数→ペース判定） ---
const escapes=hs.filter(h=>{
  if(!h.prev)return false;
  const ps=h.prev.filter(p=>p.pos?.length>=2).map(p=>p.pos[0]);
  if(ps.length===0)return false;
  return ps.reduce((a,b)=>a+b,0)/ps.length<=2; // 平均通過順位2番手以内＝逃げ馬
});
const leaders=hs.filter(h=>{
  if(!h.prev)return false;
  const ps=h.prev.filter(p=>p.pos?.length>=2).map(p=>p.pos[0]);
  if(ps.length===0)return false;
  const avg=ps.reduce((a,b)=>a+b,0)/ps.length;
  return avg<=4; // 4番手以内＝先行馬
});
// ペース判定: 逃げ馬2頭以上→ハイペース（差し有利）、0-1頭→スローペース（前残り）
const paceType=escapes.length>=3?'H超':escapes.length>=2?'H':leaders.length<=2?'S':'M';
const paceLabel=paceType==='H超'?'超ハイペース予想':paceType==='H'?'ハイペース予想':paceType==='S'?'スローペース予想':'ミドルペース予想';
const paceAdvantage=paceType==='H超'||paceType==='H'?'差し追込':'先行';

// --- STEP4: 各馬のスコアリング ---
// ファクター重み(g評価の加点に掛ける倍率。b評価の減点はそのまま)
const FW={'騎手':2.0,'前走':1.8,'着差':1.8,'蓄積':1.7,'安定':1.5,'上がり':1.5,'距離':1.0,'回り':0.7,'血統':0.2,'間隔':0};
const fw=(k,pts)=>Math.round(pts*(FW[k]!=null?FW[k]:1)); // 重み付き加点

hs.forEach(h=>{let s=50;const f={};
const l=h.prev?.[0];
const mr=h._matchRace;

// 前走着順 (重み1.8)
if(l){const r=l.fin/l.run;if(r<=.2){s+=fw('前走',18);f['前走']={v:l.fin+'着/'+l.run+'頭',c:'g'}}else if(r<=.4){s+=fw('前走',12);f['前走']={v:l.fin+'着/'+l.run+'頭',c:'g'}}else if(r<=.6){s+=5;f['前走']={v:l.fin+'着/'+l.run+'頭',c:'n'}}else{s-=5;f['前走']={v:l.fin+'着/'+l.run+'頭',c:'b'}}}

  else if(pct<=0.4){s+=fw('上がり',5);f['上がり']={v:mr.f3+'s(好)',c:'g'}}
  else if(pct<=0.7){f['上がり']={v:mr.f3+'s',c:'n'}}
  else{s-=3;f['上がり']={v:mr.f3+'s(下位)',c:'b'}}
}else if(mr?.f3){

  const diff=mr.f3-base;
  if(diff<=-1.0){s+=fw('上がり',8);f['上がり']={v:mr.f3+'s(速)',c:'g'}}
  else if(diff<=0.5){s+=3;f['上がり']={v:mr.f3+'s',c:'n'}}
  else{s-=2;f['上がり']={v:mr.f3+'s(遅)',c:'b'}}
}

// 戦績（複勝率をしっかり評価）
if(h.rec){const tot=h.starts||1;const inf2=h.rec.w+h.rec.s+h.rec.t;const fRate=inf2/tot;
  if(h.rec.w>0){s+=8;f['勝利']={v:'有('+h.rec.w+'勝)',c:'g'}}

  if(fRate>=0.5){s+=6;f['複勝率']={v:Math.round(fRate*100)+'%',c:'g'}}
  else if(fRate>=0.3){s+=3;f['複勝率']={v:Math.round(fRate*100)+'%',c:'g'}}
  else if(fRate>=0.15){f['複勝率']={v:Math.round(fRate*100)+'%',c:'n'}}
  else if(tot>=5){s-=3;f['複勝率']={v:Math.round(fRate*100)+'%',c:'b'}}
}

// 距離適性
if(h.prev?.length>0){let dm=0,bf=99;h.prev.forEach(p=>{if(p.dist&&Math.abs(p.dist-dist)<=200){dm=1;if(p.fin<bf)bf=p.fin}});if(dm&&bf<=5){s+=fw('距離',10);f['距離']={v:'◎',c:'g'}}else if(dm){s+=4;f['距離']={v:'○',c:'n'}}else{f['距離']={v:'△',c:'b'}}}

  else if(rating==='△'){s-=1;f['血統']={v:'△',c:'b'}}

// 体重変動（配点縮小。個体差が大きい）
if(h.wc!=null){const w=Math.abs(h.wc);if(w<=4){s+=2;f['体重']={v:(h.wc>=0?'+':'')+h.wc+'kg',c:'g'}}else if(w>10){s-=2;f['体重']={v:(h.wc>=0?'+':'')+h.wc+'kg',c:'b'}}else if(w>6){f['体重']={v:(h.wc>=0?'+':'')+h.wc+'kg',c:'n'}}}

// 騎手（DBにない騎手も見習い記号で評価、DBにないベテランは中立）
if(h.jk){const j=JDB[h.jk];if(j>=5){s+=fw('騎手',8);f['騎手']={v:'★',c:'g'}}else if(j>=4){s+=fw('騎手',5);f['騎手']={v:'◎',c:'g'}}else if(j>=3){s+=2;f['騎手']={v:'○',c:'n'}}else{f['騎手']={v:'-',c:'n'}}

if(h.jkDiscount==='◆'){s+=4;f['減量']={v:'2kg減',c:'g'}}else if(h.jkDiscount==='◇'){s+=2;f['減量']={v:'1kg減',c:'g'}}}

// 斤量（出走馬の中での相対評価）

  const allImp=hs.filter(x=>x.imp).map(x=>x.imp);
  if(allImp.length>=3){
    const avgImp=allImp.reduce((a,b)=>a+b,0)/allImp.length;
    const diff=h.imp-avgImp;
    if(diff<=-2){s+=6;f['斤量']={v:h.imp+'kg(軽)',c:'g'}}
    else if(diff<=-1){s+=3;f['斤量']={v:h.imp+'kg(やや軽)',c:'g'}}
    else if(diff>=2){s-=4;f['斤量']={v:h.imp+'kg(重)',c:'b'}}
    else if(diff>=1){s-=2;f['斤量']={v:h.imp+'kg(やや重)',c:'b'}}
    else{f['斤量']={v:h.imp+'kg',c:'n'}}
  }
}

// ブリンカー（表示のみ、スコア影響なし）
if(h.bl){f['B']={v:'着',c:'n'}}

// 脚質＋展開予測（表示のみ、スコア影響ゼロ。馬の能力ではなく傾向のため）
if(h.prev?.length>0){const ps=h.prev.filter(p=>p.pos?.length>=2).map(p=>p.pos[0]);if(ps.length){const a=ps.reduce((x,y)=>x+y,0)/ps.length;
  const style=a<=2?'逃げ':a<=4?'先行':a<=7?'中団':'追込';

}}

// 安定感
if(h.prev?.length>=2){const rg=h.prev.slice(0,3).filter(p=>p.fin<=5).length;if(rg>=2){s+=fw('安定',6);f['安定']={v:'◎',c:'g'}}else if(rg>=1){s+=2}else{s-=2;f['安定']={v:'△',c:'b'}}}

// ★着差（前走着順の補足情報。配点は控えめに）
if(l?.gap!=null){
  if(l.gap===0){s+=fw('着差',5);f['着差']={v:'1着',c:'g'}}
  else if(l.gap<=0.3){s+=fw('着差',4);f['着差']={v:l.gap+'秒差(僅差)',c:'g'}}

// ===== BET (v19: 全券種から最適自動選択、レース質判定付き、最大3点300円) =====
function genBet(scored,raceInfo,marketOdds){

  function getActualOdds(type,horses){

          allCands.push({priority:isMixedRace?2.5:4,ticket:{type:'3連複',
            desc:top3.map(h=>h.num).sort((a,b)=>a-b).join('─'),amount:100,horses:[...top3],
            actualOdds:actual,grade:isMixedRace?'◎':'○',
            gradeLabel:isMixedRace?'混戦向き・高配当':'スコア上位3頭',
            reason:top3.map(h=>h.num).join('・')+'番が3着以内で的中'}});
        }
      }

      // ⑤ ワイド: スコア上位馬同士・3倍以上（断然人気時は除外、混戦時は優先度UP）
      if(hasOddsFor('ワイド')&&!isDanzenFav){
        for(let i=0;i<highPool.length&&i<4;i++){
          for(let j=i+1;j<highPool.length&&j<4;j++){
            const actual=getActualOdds('ワイド',[highPool[i],highPool[j]]);
            if(actual!=null&&actual>=3){
              allCands.push({priority:isMixedRace?3.5:5,ticket:{type:'ワイド',
                desc:highPool[i].num+'─'+highPool[j].num,amount:100,horses:[highPool[i],highPool[j]],
                actualOdds:actual,grade:'△',gradeLabel:isMixedRace?'混戦向き':'補完',
                reason:highPool[i].num+'番─'+highPool[j].num+'番が3着以内で的中'}});
            }
          }
        }
      }

      // ⑥ 枠連: 馬連が取れない場合の代替・5倍以上（断然人気時は除外）
      if(hasOddsFor('枠連')&&!isDanzenFav){
        partners.forEach(p=>{
          if(!A.waku||!p.waku)return;
          const actual=getActualOdds('枠連',[A,p]);
          if(actual!=null&&actual>=5){
            allCands.push({priority:6,ticket:{type:'枠連',desc:A.waku+'枠─'+p.waku+'枠',amount:100,horses:[A,p],
              actualOdds:actual,grade:'△',gradeLabel:'馬連代替',
              reason:A.waku+'枠─'+p.waku+'枠が1・2着で的中'}});
          }
        });
      }

      // ⑦ 3連単: スコア差大きく順番明確・50倍以上
      if(hasOddsFor('3連単')&&isAxisDominant&&top3.length>=3&&top3[2].ns>=50){
        const others=top3.filter(h=>h!==A).slice(0,2);
        if(others.length>=2){
          const actual=getActualOdds('3連単',[A,...others]);
          if(actual!=null&&actual>=50){
            allCands.push({priority:7,ticket:{type:'3連単',
              desc:A.num+'→'+others.map(h=>h.num).join('→'),amount:100,horses:[A,...others],
              actualOdds:actual,grade:'○',gradeLabel:'順番明確・超高配当',
              reason:A.num+'番1着→'+others.map(h=>h.num).join('・')+'番が2・3着で的中'}});
          }
        }
      }

      // 優先順にソートして最大3点・300円以内を選択
      allCands.sort((a,b)=>a.priority-b.priority||(b.ticket.actualOdds||0)-(a.ticket.actualOdds||0));
      for(const c of allCands){
        if(tickets.length>=3)break;
        const isDup=tickets.some(t=>t.type===c.ticket.type&&t.desc===c.ticket.desc);
        if(!isDup)tickets.push(c.ticket);
      }

    }else{
      // ===== オッズ未入力: 単勝オッズのみで券種判断 =====
      const axisOdds=A?.odds||0;
      if(axisOdds>=5){
        const partners=[B,C].filter(Boolean);
        const extra=himoPool.filter(h=>h!==A&&h!==B&&h!==C).slice(0,1);
        [...partners,...extra].slice(0,3).forEach(p=>{
          tickets.push({type:'馬連',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
            actualOdds:null,grade:'-',gradeLabel:'※オッズ未入力',priority:99,
            reason:A.num+'番─'+p.num+'番が1・2着で的中'});
        });
      }else if(axisOdds>=3){
        const partners=[B,C].filter(Boolean).slice(0,3);
        partners.forEach(p=>{
          tickets.push({type:'ワイド',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
            actualOdds:null,grade:'-',gradeLabel:'※オッズ未入力',priority:99,
            reason:A.num+'番─'+p.num+'番が3着以内で的中'});
        });
      }else{
        skipRecommended=true;
      }
    }
  }
  if(!skipRecommended&&tickets.length===0)skipRecommended=true;
  const totalInv=tickets.reduce((s,t)=>s+t.amount,0);

  // 戦略説明
  const favNote=favIsOverrated
    ?'1番人気('+favOdds+'倍)は過剰人気→除外'
    :'1番人気('+favOdds+'倍)は実力通り';
  const raceType=isDanzenFav?'断然人気':isMixedRace?'混戦':isAxisClear?'軸馬明確':'通常';
  const types=[...new Set(tickets.map(t=>t.type))];
  const patName=skipRecommended?'見送り推奨':types.join('＋')+'×'+tickets.length+'点('+totalInv+'円)';
  const patReason=skipRecommended
    ?skipReason
    :'軸A='+A.num+'番(ns'+A.ns+'/'+A.pop+'番人気/EV'+axisEv+')。レース型：'+raceType+'。'+patName+'。【'+favNote+'】';

  const bestObj={type:types[0]||'',horses:[A,B],est:eU(A,B),ev:axisEv,prob:0,
    why:[whyPick(A),whyPick(B)],desc:A.num+'─'+B.num,strategy:patName};

  // レース質の警告文
  const rqWarning=poorRace?'⚠ レース質不良：'+raceQuality.reasons.join('・'):'';

  return{
    best:bestObj,tickets,patName,patReason,skipRecommended,
    warning:rqWarning||((!skipRecommended&&!C)?'ワイド候補不足（馬連のみ）':''),
    isTurf:(raceInfo?.type||'')!=='ダート',
    fav:favHorse,excluded,confidence,confLevel,
    raceQuality,favIsOverrated,favIsLegit,
    fukushoHorse:A,
    wideAmount:0,fukAmount:0,totalInv,
    wideHorseB:B,wideHorseC:C,
    alternatives:[]
  };
}

// ===== RESULT PARSER (全情報取得版) =====
function parseResult(text,horses){
  const results=[];
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  
  // === 1. 着順行を「数字+枠」パターンで検出し、後続行から全情報を収集 ===
  // 着順行の候補インデックスを収集
  const entryIdxs=[];
  for(let i=0;i<lines.length;i++){
    const tokens=lines[i].split(/[\t\s]+/).filter(Boolean);
    if(tokens.length>=2&&+tokens[0]>=1&&+tokens[0]<=18){
      // 2番目のトークンが「枠N」で始まるか確認
      if(tokens[1]?.match(/^枠\d/))entryIdxs.push(i);
      // またはタブ区切りで枠が含まれる
      else if(lines[i].match(/枠\d/))entryIdxs.push(i);
    }
  }
  
  for(let ei=0;ei<entryIdxs.length;ei++){
    const startIdx=entryIdxs[ei];
    const endIdx=ei+1<entryIdxs.length?entryIdxs[ei+1]:Math.min(startIdx+12,lines.length);
    const block=lines.slice(startIdx,endIdx);
    
    // 着順行からrank,numを取得
    const tokens=block[0].split(/[\t\s]+/).filter(Boolean);
    let rank=0,num=0,name='',sexAge='',weight=0,jockey='',time='',margin='';
    let idx=0;
    if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
    while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
    if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
    
    // 同じ行の残りトークンと後続行を全て結合してスキャン
    const restTokens=tokens.slice(idx);
    
    // 馬名：カタカナ3文字以上を含むトークン（ブリンカー着用を除去）
    for(const tk of restTokens){
      if(tk.match(/[ァ-ヶー]{3,}/)&&!tk.match(/^枠/)){name=tk.replace(/ブリンカー着用/,'').trim();break}
    }
    // 同じ行で馬名が取れなければ後続行から
    if(!name){
      for(let j=1;j<block.length&&j<=3;j++){
        const ln=block[j];
        if(ln.match(/[ァ-ヶー]{3,}/)&&!ln.match(/^枠|着順|馬番/)){
          name=ln.replace(/ブリンカー着用/,'').replace(/\t.*/,'').trim();break;
        }
      }
    }
    
    // ブロック全体から各情報を抽出
    const fullText=block.join('\t');
    // 性齢
    let sm=fullText.match(/(牡|牝|せん)\d/);if(sm)sexAge=sm[0];
    // 斤量
    sm=fullText.match(/(?:牡|牝|せん)\d[\t\s]+(\d+\.\d)/);if(sm)weight=parseFloat(sm[1]);
    // タイム
    sm=fullText.match(/(\d:\d{2}\.\d)/);if(sm)time=sm[1];
    // 騎手名
    sm=fullText.match(/(?:\d+\.\d)[\t\s]+([▲△☆◇]?[一-龥]+[\s　]*[一-龥ぁ-ん]+)/);if(sm)jockey=sm[1].replace(/[▲△☆◇]/g,'').trim();
    // 着差（タイムの後のトークン）
    sm=fullText.match(/\d:\d{2}\.\d[\t\s]+([\S]+)/);
    if(sm&&!sm[1].match(/^\d|^枠|^[一-龥]/))margin=sm[1];
    
    // 通過順位・上がり・馬体重・調教師
    let positions=null,last3f=null,bodyWeight='',trainer='',popularity=0;
    for(let j=1;j<block.length;j++){
      const nl=block[j];
      if(!positions&&nl.match(/^\d{1,2}\s+\d{1,2}(\s+\d{1,2}){0,2}$/)&&!nl.match(/枠|\./)){ 
        positions=nl.split(/\s+/).map(Number);continue;
      }
      if(!last3f&&nl.match(/^\d{2}\.\d/)){
        const parts=nl.split(/\t/).filter(Boolean);
        last3f=parseFloat(parts[0]);
        for(const p of parts){
          if(!bodyWeight&&p.match(/^\d{3}\(/))bodyWeight=p;
          if(+p>=1&&+p<=18&&p===parts[parts.length-1])popularity=+p;
        }
        for(const p of parts){
          if(!trainer&&p.match(/^[一-龥]/)&&!p.match(/^\d/)&&!p.match(/\(/))trainer=p.trim();
        }
        continue;
      }
      if(!bodyWeight&&nl.match(/^\d{3}\([+\-\d初]/)){bodyWeight=nl;continue}
    }
    
    results.push({rank,num,name,sexAge,weight,jockey,time,margin,positions,last3f,bodyWeight,trainer,popularity});
  }
  
  // フォールバック（性齢が取れない場合）
  if(results.length<3){
    results.length=0;
    for(const line of lines){
      if(line.match(/着順|馬番|馬名|払戻|単勝|複勝|枠連|馬連|ワイド|3連|コーナー|ハロン|レース映像|PLAY|パトロール|勝馬の紹介|開催選択|印刷用|更新/))continue;
      if(!line.match(/[ァ-ヶー]{3,}/))continue;
      const tokens=line.split(/[\t\s]+/).filter(Boolean);
      if(tokens.length<3)continue;
      let rank=0,num=0,name='';let idx=0;
      if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
      while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
      if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
      if(idx<tokens.length)name=tokens[idx];
      if(rank>0&&num>0)results.push({rank,num,name});
    }
  }
  
  // === 2. レース全体のタイム情報 ===
  let harlonTime='',racePace='';
  const htMatch=text.match(/ハロンタイム[\s\t]*([\d\s\-\.]+)/);
  if(htMatch)harlonTime=htMatch[1].trim();
  const paceMatch=text.match(/上り[\s\t]*(4F[\s\d\.\-]+3F[\s\d\.\-]+)/);
  if(paceMatch)racePace=paceMatch[1].trim();
  
  // === 3. コーナー通過順位（全体） ===
  let corners={};
  const cornerPattern=/([\d]コーナー)[\s\t]*(.+)/g;
  let cm;while((cm=cornerPattern.exec(text))!==null){corners[cm[1]]=cm[2].trim()}
  
  // === 4. 払戻金（全券種） ===
  let payouts={};
  const payTypes=['単勝','複勝','枠連','ワイド','馬連','馬単','3連複','3連単'];
  payTypes.forEach(pt=>{
    const re=new RegExp(pt+'\\s*\\n([\\s\\S]*?)(?='+payTypes.filter(x=>x!==pt).join('|')+'|$)');
    const pm=text.match(re);
    if(pm){
      const allPay=[...pm[1].matchAll(/(\d[\d\-]+)\s+(\d[\d,]+)円/g)];
      payouts[pt]=allPay.map(m=>({combo:m[1],amount:parseInt(m[2].replace(/,/g,''))}));
    }
  });
  
  // ワイド最初の払戻金を取得
  let payout=0;
  if(payouts['ワイド']?.length>0)payout=payouts['ワイド'][0].amount;
  
  // 重複排除＆着順ソート
  const seen=new Set();const unique=[];
  results.sort((a,b)=>a.rank-b.rank);
  for(const r of results){if(!seen.has(r.num)){seen.add(r.num);unique.push(r)}}
  const top3=unique.slice(0,3).map(r=>r.num);
  
  return{
    top3,payout,
    allResults:unique,     // 全馬の詳細着順データ
    harlonTime,            // ハロンタイム
    racePace,              // ペース（上り4F/3F）
    corners,               // コーナー通過順位
    payouts                // 全券種の払戻金
  };
}

// ===== 払戻金マッチング =====
function findPayout(payouts,type,nums){
  if(!payouts||!payouts[type])return 0;
  // 馬単・3連単は順番が意味を持つのでソートしない
  const ordered=(type==='馬単'||type==='3連単');
  const key=ordered?nums.join('-'):nums.slice().sort((a,b)=>a-b).join('-');
  const found=payouts[type].find(p=>{
    const parts=p.combo.split('-').map(Number);
    const pk=ordered?parts.join('-'):parts.sort((a,b)=>a-b).join('-');
    return pk===key;
  });
  return found?found.amount:0;
}

// ===== 全券種的中判定 =====
function checkAllTickets(r){
  // 予想の馬番（A=スコア1位, B=スコア2位, C=スコア3位 ※1番人気除外後）
  const bt=r.bet;
  let betNums=[];
  if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
  else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
  else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  
  const res=r.result;if(!res?.top3||res.top3.length<3)return null;
  const t3=res.top3.map(n=>+n); // [1着馬番, 2着馬番, 3着馬番]
  const pays=res.payouts||{};
  const A=betNums[0],B=betNums[1];
  // C = 予想3位の馬（買い目に入っていない次の候補）
  const scored=r.scored||[];
  const excl=scored.filter(h=>h.odds&&h.odds<3.0);
  const elig=scored.filter(h=>!h.odds||h.odds>=3.0);
  const useElig=elig.length>=2?elig:scored.filter(h=>h!==scored.slice().sort((a,b)=>(a.odds||999)-(b.odds||999))[0]);
  const C=useElig.find(h=>h.num!==A&&h.num!==B)?.num||0;
  
  const results={};
  // 単勝：Aが1着
  results['単勝']={hit:t3[0]===A,pay:findPayout(pays,'単勝',[A])||0};
  // 複勝A
  results['複勝A']={hit:t3.includes(A),pay:findPayout(pays,'複勝',[A])||0,num:A};
  // 複勝B
  results['複勝B']={hit:t3.includes(B),pay:findPayout(pays,'複勝',[B])||0,num:B};
  // ワイド
  results['ワイド']={hit:t3.includes(A)&&t3.includes(B),pay:findPayout(pays,'ワイド',[A,B])||0};
  // 馬連
  results['馬連']={hit:t3.slice(0,2).includes(A)&&t3.slice(0,2).includes(B),pay:findPayout(pays,'馬連',[A,B])||0};
  // 馬単 A→B
  results['馬単']={hit:t3[0]===A&&t3[1]===B,pay:findPayout(pays,'馬単',[A,B])||0};
  // 3連複
  results['3連複']={hit:t3.includes(A)&&t3.includes(B)&&t3.includes(C),pay:findPayout(pays,'3連複',[A,B,C])||0,third:C};
  // 3連単 A→B→C
  results['3連単']={hit:t3[0]===A&&t3[1]===B&&t3[2]===C,pay:findPayout(pays,'3連単',[A,B,C])||0,third:C};
  
  return results;
}

// ===== 的中判定・回収計算ヘルパー =====
// 推奨した馬券種のみで的中判定を行う（他券種の偶然の的中は計上しない）
function getHitInfo(r){
  const res=r.result,bt=r.bet;
  if(!res?.top3||res.top3.length<3)return{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0,tickets:null,skip:false,hitTickets:[]};
  if(bt?.skipRecommended||bt?.totalInv===0){
    return{wideHit:false,wideTicketHit:false,fukHit:false,anyHit:false,label:'見送り',ret:0,inv:0,tickets:null,skip:true,hitTickets:[]};
  }

  const t3=res.top3.map(n=>+n);
  const pays=res.payouts||{};
  const inv=(bt?.totalInv!=null?bt.totalInv:((bt?.wideAmount||0)+(bt?.fukAmount||0)))||0;

  // === 推奨チケットごとに的中判定（推奨券種のみ） ===
  let ret=0;
  const hitTickets=[];

  if(bt?.tickets?.length>0){
    bt.tickets.forEach(tk=>{
      const nums=tk.horses?.map(h=>h.num)||[];
      let hit=false;
      switch(tk.type){
        case '単勝': hit=nums.length>=1&&t3[0]===nums[0]; break;
        case '馬連': hit=nums.length>=2&&t3.slice(0,2).includes(nums[0])&&t3.slice(0,2).includes(nums[1]); break;
        case 'ワイド': hit=nums.length>=2&&t3.includes(nums[0])&&t3.includes(nums[1]); break;
        case '馬単': hit=nums.length>=2&&t3[0]===nums[0]&&t3[1]===nums[1]; break;
        case '枠連': {const wk=tk.horses?.map(h=>h.waku)||[];hit=wk.length>=2&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[0]})&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[1]});} break;
        case '3連複': hit=nums.length>=3&&t3.includes(nums[0])&&t3.includes(nums[1])&&t3.includes(nums[2]); break;
        case '3連単': hit=nums.length>=3&&t3[0]===nums[0]&&t3[1]===nums[1]&&t3[2]===nums[2]; break;
      }
      if(hit){
        const sortedNums=tk.type==='馬単'||tk.type==='3連単'?nums:[...nums].sort((a,b)=>a-b);
        const pay=findPayout(pays,tk.type,sortedNums)||0;
        ret+=pay*(tk.amount/100);
        hitTickets.push({type:tk.type,desc:tk.desc,pay,amount:tk.amount});
      }
    });
  }
  // v13以前（従来ロジック: tickets配列なし）
  else{
    let betNums=[];
    if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
    else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
    else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
    const wAmt=bt?.wideAmount||0;const fAmt=bt?.fukAmount||0;const fukNum=bt?.fukushoHorse?.num;
    const wHit=betNums.length>=2&&t3.slice(0,2).includes(betNums[0])&&t3.slice(0,2).includes(betNums[1]);
    if(wHit){const p=findPayout(pays,'ワイド',betNums)||res.payout||0;ret+=p*((wAmt||300)/100);hitTickets.push({type:'馬連',desc:betNums.join('─'),pay:p});}
    const fHit=!!(fukNum&&fAmt>0&&t3.includes(fukNum));
    if(fHit){const p=findPayout(pays,'複勝',[fukNum])||0;if(p>0)ret+=p*(fAmt/100);hitTickets.push({type:'複勝',desc:String(fukNum),pay:p});}
  }

  const anyHit=hitTickets.length>0;
  const label=anyHit?hitTickets.map(h=>h.type+'的中').join('・'):'不的中';
  // 互換用フラグ
  const wideHit=hitTickets.some(h=>h.type==='馬連');
  const wideTicketHit=hitTickets.some(h=>h.type==='ワイド');
  const fukHit=hitTickets.some(h=>h.type==='複勝');

  // 全券種照合（参考表示用）
  const tickets=checkAllTickets(r);

  return{wideHit,wideTicketHit,fukHit,anyHit,label,ret:Math.round(ret),inv,tickets,skip:false,hitTickets};
}

// ===== LOSS ANALYSIS =====
function analyzeLoss(rd,top3){
  if(!top3||top3.length<3)return[];
  const bt=rd.bet;
  let betNums=[];
  if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
  else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
  else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  if(betNums.length<2)return['買い目なし'];
  
  const t3=top3.map(n=>+n);
  const sc=rd.scored;const fH=n=>sc.find(h=>h.num===n);
  const inTop3=betNums.filter(n=>t3.includes(n));
  const fukNum=bt?.fukushoHorse?.num;
  const fukHit=fukNum&&t3.includes(fukNum);
  
  if(inTop3.length>=2)return['的中'];
  
  const reasons=[];
  if(fukHit)reasons.push('複勝的中');
  
  if(inTop3.length===1){
    const missN=betNums.find(n=>!t3.includes(n));
    const mh=fH(missN);
    if(mh)reasons.push(mh.num+'番'+mh.name+'が圏外（相手選びが課題）');
    reasons.push('1頭は3着以内→相手の精度向上で的中に近づく');
  }else{
    const winners=t3.map(n=>fH(n)).filter(Boolean);
    const bh=betNums.map(n=>fH(n)).filter(Boolean);
    if(bh.length>0&&bh.every(h=>h.ns<50))reasons.push('選出馬の実力不足');
    const favW=winners.filter(w=>w.odds&&w.odds<=5);
    if(favW.length>=2)reasons.push('人気馬で決着（堅いレース）');
    const big=winners.filter(w=>w.odds&&w.odds>=30);
    if(big.length)reasons.push('大穴馬が激走（予測困難）');
    if(reasons.length<=(fukHit?1:0))reasons.push('選出馬が2頭とも圏外');
  }
  return reasons;
}

// ===== TRENDS =====
function getTrends(){
  const done=RACES.filter(r=>r.result?.top3?.length>=3&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!isPastOnly(r));
  if(done.length<2)return null;
  const tot=done.length;
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const anyHits=hits;
  const inv=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const ret=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const causes={};
  done.forEach(r=>{(r.result.reasons||[]).forEach(x=>{if(x!=='的中'&&!x.includes('複勝的中')&&!x.includes('取込')){const k=x.split('（')[0].split('→')[0].trim();causes[k]=(causes[k]||0)+1}})});
  const topC=Object.entries(causes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  // 騎手別・厩舎別・血統別成績（scored起点で集計、allResults/top3から着順取得）
  const jockeyStats={},trainerStats={},sireStats={};
  done.forEach(r=>{
    if(!r.scored)return;
    const allRes=r.result?.allResults||[];
    const top3=r.result?.top3||[];
    r.scored.forEach(horse=>{
      // 着順: allResultsから取得、なければtop3から推定
      const ar=allRes.find(a=>a.num===horse.num);
      let rank=ar?.rank||0;
      if(!rank){
        const idx=top3.findIndex(n=>+n===horse.num);
        if(idx>=0)rank=idx+1;
      }
      // 騎手: scored.jk → allResults.jockey の順でフォールバック
      const jk=horse.jk||ar?.jockey;
      if(jk){
        if(!jockeyStats[jk])jockeyStats[jk]={total:0,w1:0,w2:0,w3:0};
        jockeyStats[jk].total++;
        if(rank===1)jockeyStats[jk].w1++;
        if(rank>=1&&rank<=2)jockeyStats[jk].w2++;
        if(rank>=1&&rank<=3)jockeyStats[jk].w3++;
      }
      // 厩舎: scored.trainer → allResults.trainer
      const tr=horse.trainer||ar?.trainer;
      if(tr){
        if(!trainerStats[tr])trainerStats[tr]={total:0,w1:0,w2:0,w3:0};
        trainerStats[tr].total++;
        if(rank===1)trainerStats[tr].w1++;
        if(rank>=1&&rank<=2)trainerStats[tr].w2++;
        if(rank>=1&&rank<=3)trainerStats[tr].w3++;
      }
      // 血統（種牡馬）
      const sire=horse.sire;
      if(sire){
        if(!sireStats[sire])sireStats[sire]={total:0,w1:0,w2:0,w3:0};
        sireStats[sire].total++;
        if(rank===1)sireStats[sire].w1++;
        if(rank>=1&&rank<=2)sireStats[sire].w2++;
        if(rank>=1&&rank<=3)sireStats[sire].w3++;
      }
    });
  });

  // 人気別着順分布（結果入力済みレースの全馬データから集計）
  const popStats={}; // {1:{total,w1,w2,w3,w5}, 2:{...}, ...}
  done.forEach(r=>{
    if(!r.result?.allResults||!r.scored)return;
    r.result.allResults.forEach(ar=>{
      // 出馬表のpop（人気）を取得
      const horse=r.scored.find(h=>h.num===ar.num);
      const pop=horse?.pop;
      if(!pop||pop<1||pop>18)return;
      if(!popStats[pop])popStats[pop]={total:0,w1:0,w2:0,w3:0,w5:0};
      const ps=popStats[pop];
      ps.total++;
      if(ar.rank===1)ps.w1++;
      if(ar.rank<=2)ps.w2++;
      if(ar.rank<=3)ps.w3++;
      if(ar.rank<=5)ps.w5++;
    });
  });
  
  return{tot,hits,fukHits,anyHits,rate:Math.round(hits/tot*100),inv,ret,roi:inv>0?Math.round(ret/inv*100):0,topC,popStats,jockeyStats,trainerStats,sireStats};
}

// === BULK IMPORT（過去結果一括取り込み）===
function doBulkImport(){
  const text=document.getElementById('bulkIn').value.trim();
  if(!text){alert('レース結果を貼り付けてください');return}
  const status=document.getElementById('bulkStatus');
  const preview=document.getElementById('bulkPreview');
  status.textContent='解析中...';
  preview.innerHTML='';
  
  if(!text.match(/着順/)&&!text.match(/枠\d/)&&!text.match(/レース/)&&!text.match(/\d+メートル/)){
    status.textContent='';
    preview.innerHTML='<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red)">レース結果データが見つかりません。</div>';
    return;
  }
  
  setTimeout(()=>{
  try{
  
  // レースごとに分割
  const raceBlocks=[];
  const lines=text.split('\n');
  let currentBlock=[];

  for(const line of lines){
    const trimmed=line.trim();
    const isNewRace=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed)&&/発走時刻/.test(trimmed);
    const isDateLine=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed);
    const isPageTop=trimmed==='ページトップへ戻る';

    if((isPageTop||isNewRace||(isDateLine&&currentBlock.length>20))&&currentBlock.length>15){
      raceBlocks.push(currentBlock.join('\n'));
      currentBlock=[];
      if(isPageTop)continue;
    }
    currentBlock.push(line);
  }
  if(currentBlock.length>10)raceBlocks.push(currentBlock.join('\n'));

  // ブロックが1つもなければテキスト全体を1ブロックとして処理
  if(raceBlocks.length===0)raceBlocks.push(text);

  // 着順データを含まないブロック（払戻金のみ等）を除外し、前のレースブロックにマージ
  const mergedBlocks=[];
  for(const block of raceBlocks){
    const hasEntry=block.match(/枠\d/) && (block.match(/[ァ-ヶー]{3,}/) || block.match(/\d:\d{2}\.\d/));
    if(hasEntry){
      mergedBlocks.push(block);
    }else if(mergedBlocks.length>0){
      // 払戻金等のデータは直前のレースブロックに結合
      mergedBlocks[mergedBlocks.length-1]+='\n'+block;
    }
    // 先頭で着順なしのブロックは捨てる
  }
  if(mergedBlocks.length===0)mergedBlocks.push(text); // フォールバック
  
  let totalHorses=0,totalRaces=0,errors=0,errMsgs=[];
  const imported=[];
  
  mergedBlocks.forEach((block,bi)=>{
    try{
      let m,info={};
      m=block.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m)info.date=`${m[1]}/${m[2]}/${m[3]}`;
      m=block.match(/(\d+回\S+\d+日)/);if(m)info.course=m[1];
      m=block.match(/(\d+)レース/);if(m)info.raceNum=m[1];
      m=block.match(/コース[：:][\s]*([\d,]+)メートル[（(](.+?)[)）]/);
      if(m){info.dist=parseInt(m[1].replace(',',''));info.surf=m[2]}
      m=block.match(/(芝|ダート)\s+(良|稍重|重|不良)/);
      if(m){info.type=m[1];info.cond=m[2]}
      
      const pr=parseResult(block,[]);
      if(!pr.allResults||pr.allResults.length<3){
        // 着順データがないブロックは静かにスキップ（払戻のみ等）
        const cnt=(pr.allResults||[]).length;
        if(cnt===0)return; // 着順ゼロ = レースデータではないブロック
        errors++;
        errMsgs.push('ブロック'+(bi+1)+': 着順'+cnt+'頭(3頭未満)');
        return;
      }
      
      const venue=(info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      
      // 馬DB専用ストレージに追加（詳細データ）
      pr.allResults.forEach(ar=>{
        const name=ar.name;if(!name)return;
        if(!HORSE_STORE[name])HORSE_STORE[name]=[];
        const dup=HORSE_STORE[name].some(x=>x.date===(info.date||'')&&x.rank===ar.rank&&x.dist===(info.dist||0));
        if(!dup){
          HORSE_STORE[name].push({
            date:info.date||'',venue,dist:info.dist||0,surface:info.type||'',
            cond:info.cond||'',rank:ar.rank,runners:pr.allResults.length,
            time:ar.time||'',last3f:ar.last3f||0,
            positions:ar.positions||null,jockey:ar.jockey||'',bodyWeight:ar.bodyWeight||''
          });
        }
      });
      
      // RACESにも超軽量エントリ（一覧表示用のみ）
      const id='bulk_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)+'_'+bi;
      const dupRace=RACES.some(r=>r.info?.date===info.date&&r.info?.raceNum===info.raceNum&&(r.info?.course||'').includes(venue));
      if(!dupRace){
        const t1=pr.allResults[0],t2=pr.allResults[1],t3=pr.allResults[2];
        RACES.push({
          id,
          label:(info.date||'?')+' '+venue+' '+(info.raceNum||'?')+'R',
          sortKey:(info.date?info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999')+String(info.raceNum||0).padStart(2,'0'),
          info:{date:info.date,course:info.course,raceNum:info.raceNum,dist:info.dist,surf:info.surf,type:info.type,cond:info.cond},
          scored:[],
          bet:{best:null,tickets:[],totalInv:0,wideAmount:0,fukAmount:0},
          result:{top3:pr.top3.map(String),payout:pr.payout||0,reasons:['取込データ']}
        });
      }
      
      totalRaces++;
      totalHorses+=pr.allResults.length;
      imported.push({venue,raceNum:info.raceNum,horses:pr.allResults.length,date:info.date});
    }catch(e){errors++;errMsgs.push('ブロック'+(bi+1)+': '+e.message);console.error('一括取込エラー:',e)}
  });
  
  if(totalRaces>0){
    saveHorseStore(HORSE_STORE);
    saveR(RACES);
    HORSE_DB=buildHorseDB();
  }
  
  let h='';
  if(totalRaces>0){
    h+=`<div style="padding:8px;border:1px solid var(--grn);background:rgba(45,106,48,.06);font-size:13px;line-height:1.7">`;
    h+=`<div style="font-weight:700;color:var(--grn);margin-bottom:4px">✓ ${totalRaces}レース・${totalHorses}頭を取り込みました</div>`;
    imported.forEach(r=>{h+=`<div>${r.date} ${r.venue}${r.raceNum}R：${r.horses}頭</div>`});
    h+=`<div style="margin-top:6px;color:var(--dim)">馬DB：${Object.keys(HORSE_DB).length}頭</div>`;
    if(errors>0)h+=`<div style="color:var(--red);margin-top:4px">${errors}ブロック失敗</div>`;
    h+=`</div>`;
    status.textContent=`完了（${totalRaces}R/${totalHorses}頭）`;
  }else{
    h+=`<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red);line-height:1.7">`;
    h+=`検出できませんでした（${mergedBlocks.length}ブロック解析、${errors}失敗）<br>`;
    if(errMsgs.length>0)h+=errMsgs.slice(0,5).join('<br>');
    h+=`</div>`;
    status.textContent='失敗';
  }
  preview.innerHTML=h;
  document.getElementById('bulkIn').value='';
  
  }catch(e){
    status.textContent='エラー';
    preview.innerHTML='<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red)">処理中にエラーが発生しました：'+e.message+'</div>';
    console.error('一括取込全体エラー:',e);
  }
  },50);
}

// ===== オッズテキストパーサー（全券種対応） =====
// JRA連結形式: "1229.83788.14199.0..." = 軸1, 相手2:29.8, 相手3:788.1, ...
// 軸番号の後に相手番号＋オッズが区切りなく連続する
// mode: 'pair'(2頭組), 'trio'(3頭組), 'single'(単体), 'wide'(下限-上限), 'ordered'(馬単)
function parseOddsText(text,mode){
  if(!text||!text.trim())return {};
  const lines=text.split('\n');
  const result={};

  // --- JRA連結形式パーサー（相手番号の順序を知っているので正確に分割できる） ---
  // 軸Kの相手番号列: pair/wide→K+1,K+2,...,18  ordered→1,2,...(K除く)
  function parseConcatLine(line,mode){
    const s=line.replace(/[\s,]+/g,''); // 空白・カンマ除去
    if(!s||!/^\d/.test(s)||!s.includes('.'))return {};
    // 軸番号を取得: 1桁を先に試し、パース結果が多い方を採用
    let axis,rest;
    const one=parseInt(s.substring(0,1));
    const two=parseInt(s.substring(0,2));
    // まず1桁軸で試す
    if(one>=1&&one<=9){axis=one;rest=s.substring(1);}
    // 1桁軸で相手が見つからなければ2桁軸を試す
    else if(two>=10&&two<=18&&s.length>2){axis=two;rest=s.substring(2);}
    else return {};
    // 相手番号の順序を決定
    let partners=[];
    if(mode==='ordered'){
      // 馬単: 1〜18（軸を除く）
      for(let i=1;i<=18;i++){if(i!==axis)partners.push(i);}
    }else{
      // 馬連/ワイド/枠連: 軸+1〜18
      for(let i=axis+1;i<=18;i++)partners.push(i);
    }
    const out={};let pi=0;
    while(rest.length>0&&pi<partners.length){
      const p=partners[pi];
      const pStr=String(p);
      if(rest.startsWith(pStr)){
        rest=rest.substring(pStr.length);
        // オッズ値を取得（JRAは小数1桁: 数字.数字1桁）
        const om=rest.match(/^(\d+\.\d)/);
        if(om){
          const v=parseFloat(om[1]);
          if(mode==='ordered'){
            out[axis+'-'+p]=v;
          }else{
            const a=Math.min(axis,p),b=Math.max(axis,p);
            out[a+'-'+b]=v;
          }
          rest=rest.substring(om[1].length);
        }else break;
      }
      pi++;
    }
    return out;
  }

  // --- single（単勝・複勝）---
  if(mode==='single'){
    for(const raw of lines){
      const s=raw.replace(/[\s,]+/g,'');
      if(!s)continue;
      // 空白区切り形式: "1 2.5"
      const spaced=raw.replace(/[\t ]+/g,' ').trim();
      const m=spaced.match(/^(\d{1,2})\s+([\d.]+)/);
      if(m){result[String(parseInt(m[1]))]=parseFloat(m[2]);continue;}
      // 連結形式: "12.523.4312.1..." → 番号1:2.5, 番号2:3.4, 番号3:12.1...
      if(/^\d/.test(s)&&s.includes('.')){
        let rest=s,num=1;
        while(rest.length>0&&num<=18){
          const ns=String(num);
          if(rest.startsWith(ns)){
            rest=rest.substring(ns.length);
            const om=rest.match(/^(\d+\.\d)/);
            if(om){result[String(num)]=parseFloat(om[1]);rest=rest.substring(om[1].length);}
            else break;
          }
          num++;
        }
      }
    }
    console.log('[ODDS PARSE] 単勝:',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+'番:'+v+'倍').join(', '));
    return result;
  }

  // --- trio（3連複・3連単）---
  if(mode==='trio'){
    let axis=0;
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue}
      if(!axis)continue;
      const m3=line.match(/^(\d{1,2})\s*[-ー－]\s*(\d{1,2})\s+([\d,.]+)/)||line.match(/^(\d{1,2})\s+(\d{1,2})\s+([\d,.]+)/);
      if(m3){const a=parseInt(m3[1]),b=parseInt(m3[2]);const v=parseFloat(m3[3].replace(/,/g,''));
        if(v>=1.0){const nums=[axis,a,b].sort((x,y)=>x-y);result[nums.join('-')]=v;}}
    }
    console.log('[ODDS PARSE] 3連:',Object.keys(result).length+'件');
    return result;
  }

  // --- pair / wide / ordered（馬連・ワイド・馬単・枠連）---
  // まず連結形式を試す
  for(const raw of lines){
    const out=parseConcatLine(raw,mode);
    Object.assign(result,out);
  }
  // 連結形式で取れた場合はそれを使う
  if(Object.keys(result).length>0){
    const label=mode==='wide'?'ワイド':mode==='ordered'?'馬単':'馬連/枠連';
    console.log('[ODDS PARSE]',label+'(連結):',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
    return result;
  }
  // フォールバック: 空白区切り形式（軸番号行＋相手番号\tオッズ行）
  let axis=0;
  for(const raw of lines){
    const line=raw.replace(/[\t ]+/g,' ').trim();
    if(!line)continue;
    if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue}
    if(!axis)continue;
    if(mode==='wide'){
      const mw=line.match(/^(\d{1,2})\s+([\d,.]+)\s*[-ー－~〜]\s*([\d,.]+)/);
      if(mw){const partner=parseInt(mw[1]);const lo=parseFloat(mw[2].replace(/,/g,''));
        const a=Math.min(axis,partner),b=Math.max(axis,partner);
        result[a+'-'+b]=lo;continue;}
    }
    const mu=line.match(/^(\d{1,2})\s+([\d,.]+)$/);
    if(mu){const partner=parseInt(mu[1]);const v=parseFloat(mu[2].replace(/,/g,''));
      if(v>=1.0){
        if(mode==='ordered'){result[axis+'-'+partner]=v;}
        else{const a=Math.min(axis,partner),b=Math.max(axis,partner);result[a+'-'+b]=v;}
      }
    }
  }
  if(Object.keys(result).length>0){
    const label=mode==='wide'?'ワイド':mode==='ordered'?'馬単':'馬連/枠連';
    console.log('[ODDS PARSE]',label+'(行区切り):',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
  }
  return result;
}

function doAnalyze(){
  try{
  const t=document.getElementById('raceIn').value.trim();
  if(!t){alert('出馬表を貼り付けてください');return}
  const parsed=parse(t);
  if(parsed.horses.length===0){
    const wakuCount=t.split('\n').filter(l=>l.trim().startsWith('枠')).length;
    const errDiv=document.getElementById('analyzeError');
    if(errDiv){errDiv.innerHTML=`<div style="padding:10px 14px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red);border-radius:4px;margin-top:8px">
      馬が検出できませんでした。JRAの出馬表ページを「枠」から始まるテキスト形式でコピーしてください。<br>
      <span style="font-size:11px;color:var(--dim)">（ヒント：検出できた「枠」行数が ${wakuCount} 行でした）</span>
    </div>`;errDiv.classList.remove('hidden')}
    return;
  }
  // 日付チェック：2026/3/15以前は分析不可
  const pdk=dateToKey(parsed.info.date||'');
  if(pdk!=='99999999'&&pdk<=CUTOFF_KEY){
    alert('【'+(parsed.info.date||'日付不明')+'】\nこのレースは '+CUTOFF_DATE+' 以前のため、出馬表分析はできません。\n\n過去レースの結果は「一括取り込み」から登録してください。');
    return;
  }
  const errDiv2=document.getElementById('analyzeError');if(errDiv2)errDiv2.classList.add('hidden');
  const scored=score(parsed);
  // 券種別テキストエリアからオッズを収集
  const marketOdds={tansho:{},wakuren:{},umaren:{},wide:{},umatan:{},sanrenpuku:{},sanrentan:{}};
  const getEl=eid=>document.getElementById(eid)?.value||'';
  Object.assign(marketOdds.tansho,parseOddsText(getEl('oddsTansho'),'single'));
  Object.assign(marketOdds.wakuren,parseOddsText(getEl('oddsWakuren'),'pair'));
  Object.assign(marketOdds.umaren,parseOddsText(getEl('oddsUmaren'),'pair'));
  Object.assign(marketOdds.wide,parseOddsText(getEl('oddsWide'),'wide'));
  Object.assign(marketOdds.umatan,parseOddsText(getEl('oddsUmatan'),'ordered'));
  Object.assign(marketOdds.sanrenpuku,parseOddsText(getEl('oddsSanrenpuku'),'trio'));
  Object.assign(marketOdds.sanrentan,parseOddsText(getEl('oddsSanrentan'),'trio'));
  const oddsCounts=Object.entries(marketOdds).map(([k,v])=>[k,Object.keys(v).length]).filter(([,c])=>c>0);
  const hasOdds=oddsCounts.length>0;
  console.log('[ODDS] 取得結果:',oddsCounts.map(([k,c])=>k+':'+c+'組').join(', ')||'なし');

  // === レース不一致チェック: オッズの馬番が出馬表に存在するか ===
  if(hasOdds){
    const raceNums=new Set(parsed.horses.map(h=>h.num));
    const maxRaceNum=Math.max(...raceNums);
    const oddsNums=new Set();
    const nameMap={tansho:'単勝',wakuren:'枠連',umaren:'馬連',wide:'ワイド',umatan:'馬単',sanrenpuku:'3連複',sanrentan:'3連単'};
    // 各券種のキーから馬番を抽出
    for(const[type,odds]of Object.entries(marketOdds)){
      if(!odds||Object.keys(odds).length===0)continue;
      for(const key of Object.keys(odds)){
        key.split('-').forEach(n=>{const num=parseInt(n);if(num)oddsNums.add(num);});
      }
    }
    // 出馬表に存在しない馬番のオッズを除外（JRAは最大頭数分のデータを出力するため）
    let filtered=0;
    for(const[type,odds]of Object.entries(marketOdds)){
      if(!odds)continue;
      for(const key of Object.keys(odds)){
        const nums=key.split('-').map(Number);
        if(nums.some(n=>n>maxRaceNum)){delete odds[key];filtered++;}
      }
    }
    if(filtered>0)console.log('[ODDS] 出馬表外の馬番を'+filtered+'件除外（'+raceNums.size+'頭立て・最大'+maxRaceNum+'番）');
  }

  const bet=genBet(scored,parsed.info,marketOdds);
  const id=Date.now().toString();
  const venue=(parsed.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  const label=(parsed.info.date||'?')+' '+venue+' '+(parsed.info.raceNum||'?')+'R '+(parsed.info.dist||'')+'m '+(parsed.info.surf||'');
  const sk=parsed.info.date?parsed.info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999';
  const sortKey=sk+String(parsed.info.raceNum||0).padStart(2,'0');
  const race={id,label,sortKey,info:parsed.info,scored,bet,result:null,_scoreVer:'v3.0.0',_marketOdds:hasOdds?marketOdds:undefined};
  RACES.unshift(race);saveR(RACES);
  // テキストエリアをクリア
  document.getElementById('raceIn').value='';
  ['oddsTansho','oddsWakuren','oddsUmaren','oddsWide','oddsUmatan','oddsSanrenpuku','oddsSanrentan'].forEach(eid=>{const e=document.getElementById(eid);if(e)e.value=''});
  CUR=id;showView('detail');
  }catch(e){alert('分析エラー: '+e.message+'\n'+e.stack)}
}

// === LIST ===
function renderList(){
  let needSave=false;
  RACES.forEach(r=>{
    if(r.info?.date&&r.sortKey){
      const correct=r.info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('')+String(r.info.raceNum||0).padStart(2,'0');
      if(r.sortKey!==correct){r.sortKey=correct;needSave=true}
    }
  });
  if(needSave)saveR(RACES);
  document.getElementById('countBadge').textContent='('+RACES.length+')';
  let h='';
  if(!RACES.length){h='<div style="text-align:center;padding:40px;color:var(--dim)">レースデータなし</div>';document.getElementById('vList').innerHTML=h;return}
  
  // 日付グループ化
  const sorted=[...RACES].sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  const groups={};
  sorted.forEach(r=>{const dt=r.info.date||'日付不明';if(!groups[dt])groups[dt]=[];groups[dt].push(r)});
  const padDate=d=>d.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('/');
  const dates=Object.keys(groups).sort((a,b)=>padDate(b).localeCompare(padDate(a)));
  const latestDate=dates[0]||'';
  const pastDates=dates.slice(1);
  
  // 通算収支（見送り・取込を除外）
  const allAnalyzed=RACES.filter(r=>r.result?.top3?.length>=3&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!isPastOnly(r));
  const skipped=allAnalyzed.filter(r=>getHitInfo(r).skip).length;
  const done=allAnalyzed.filter(r=>!getHitInfo(r).skip);
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const totalBet=done.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
  const totalReturn=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const profit=totalReturn-totalBet;

  // 軸馬的中率（A馬が3着以内に入った率）
  let axisIn3=0,axisTotal=0;
  done.forEach(r=>{
    if(!r.bet?.best?.horses?.[0]||!r.result?.top3)return;
    axisTotal++;
    const anum=r.bet.best.horses[0].num;
    if(r.result.top3.map(Number).includes(anum))axisIn3++;
  });

  // スコア帯別的中率
  const scoreBands=[{label:'90-100',min:90,max:100},{label:'80-89',min:80,max:89},{label:'70-79',min:70,max:79}];
  const bandStats=scoreBands.map(b=>{
    const rs=done.filter(r=>r.scored?.[0]?.ns>=b.min&&r.scored?.[0]?.ns<=b.max);
    const h2=rs.filter(r=>getHitInfo(r).anyHit).length;
    return{label:b.label,total:rs.length,hit:h2,rate:rs.length>0?Math.round(h2/rs.length*100):0};
  });

  h+=`<div class="pnl" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-weight:700;font-size:13px">📊 通算収支</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px">
        <span>購入 <b>${done.length}</b>R</span>
        <span style="color:var(--lt)">見送り <b>${skipped}</b>R</span>
        <span style="color:var(--grn)">的中 <b>${hits}</b></span>
        ${fukHits>0?`<span style="color:var(--blu)">複勝的中 <b>${fukHits}</b></span>`:''}
        <span style="color:var(--red)">不的中 <b>${done.length-hits-fukHits}</b></span>
      </div>
    </div>`;
  if(done.length>0){
    h+=`<div style="display:flex;align-items:baseline;gap:16px;margin-top:8px;flex-wrap:wrap;border-top:1px solid var(--bdr);padding-top:8px">
      <div style="font-size:12px;color:var(--dim)">投資 <b>${totalBet.toLocaleString()}円</b></div>
      <div style="font-size:12px;color:var(--dim)">回収 <b>${totalReturn.toLocaleString()}円</b></div>
      <div style="font-size:18px;font-weight:900;color:${profit>=0?'var(--grn)':'var(--red)'}">${profit>=0?'+':''}${profit.toLocaleString()}円</div>
      <div style="font-size:12px;color:${totalReturn>=totalBet?'var(--grn)':'var(--red)'}">回収率 <b>${totalBet>0?Math.round(totalReturn/totalBet*100):0}%</b></div>
    </div>`;
    h+=`<div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)">
      <span>軸馬3着内率 <b>${axisTotal>0?Math.round(axisIn3/axisTotal*100):0}%</b>(${axisIn3}/${axisTotal})</span>
      ${bandStats.filter(b=>b.total>0).map(b=>`<span>ns${b.label}: <b>${b.rate}%</b>(${b.hit}/${b.total})</span>`).join('')}
    </div>`;
  }
  h+=`</div>`;
  
  // 全日付を統一表示
  const showDates=[latestDate,...pastDates].filter(Boolean);
  
  showDates.forEach(dt=>{
    if(!dt||!groups[dt])return;
    const dayRaces=groups[dt];
    const dayDone=dayRaces.filter(r=>r.result?.top3?.length>=3&&!isPastOnly(r)&&!getHitInfo(r).skip);
    const dayHits=dayDone.filter(r=>getHitInfo(r).anyHit).length;
    const dayFuk=0;
    const dayInv=dayDone.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
    const dayRet=dayDone.reduce((s,r)=>s+getHitInfo(r).ret,0);
    const dayProfit=dayRet-dayInv;
    const dayRoi=dayInv>0?Math.round(dayRet/dayInv*100):0;
    const dayPending=dayRaces.length-dayDone.length;
    const dp=dt.split('/');
    let dow='';
    if(dp.length===3){const d=new Date(+dp[0],+dp[1]-1,+dp[2]);dow=['日','月','火','水','木','金','土'][d.getDay()]||''}
    
    const gid='dg_'+dt.replace(/\//g,'');
    h+=`<div style="margin-top:8px">`;
    h+=`<div onclick="document.getElementById('${gid}').classList.toggle('hidden')" style="cursor:pointer;padding:10px 14px;background:var(--ink);color:var(--p);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'Shippori Mincho',serif;font-size:16px;font-weight:900;color:var(--gld)">${dt}${dow?'（'+dow+'）':''}</span>
        <span style="font-size:12px">${dayRaces.length}R</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px">
        <span style="color:var(--grn)">✓${dayHits}</span>
        ${dayFuk>0?`<span style="color:var(--blu)">△${dayFuk}</span>`:''}
        <span style="color:var(--red)">✗${dayDone.length-dayHits-dayFuk}</span>
        ${dayPending>0?`<span style="color:var(--gld)">未${dayPending}</span>`:''}
        ${dayDone.length>0?`<span style="font-weight:700;color:${dayProfit>=0?'var(--grn)':'var(--red)'}">${dayProfit>=0?'+':''}${dayProfit.toLocaleString()}円</span>
        <span style="color:${dayRoi>=100?'var(--grn)':'var(--red)'}">回収率${dayRoi}%</span>`:''}
      </div>
    </div>`;
    
    // 最新日は展開、過去は折りたたみ
    h+=`<div id="${gid}"${dt===latestDate?'':' class="hidden"'}>`;
    dayRaces.forEach(r=>{
      const hasR=r.result?.top3?.length>=3;
      const hi=getHitInfo(r);
      const isSkip=hi.skip;
      const cls=hasR?(isSkip?'pend':hi.anyHit?'hit':'miss'):'pend';
      const betInfo=(!isSkip&&r.bet?.best)?r.bet.best.type+' '+r.bet.best.desc:'';
      const inv=hi.inv||0;
      let profitStr='';
      if(hasR&&!isSkip){const p=hi.ret-inv;profitStr=p>=0?`+${Math.round(p).toLocaleString()}円`:`${Math.round(p).toLocaleString()}円`}
      const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      const pastLabel=isPastOnly(r)?`<span style="font-size:10px;color:var(--gld);font-weight:700;background:rgba(184,134,11,.12);padding:1px 6px;border-radius:3px;margin-left:5px">取込</span>`:'';

      h+=`<div class="card ${cls}" onclick="CUR='${r.id}';showView('detail')">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px"><span style="font-weight:900">${venue}</span> ${r.info.raceNum||'?'}R${pastLabel}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:1px">${r.info.dist||''}m ${r.info.surf||''}${r.info.cond?' / '+r.info.cond:''}${(!r.info.surf||!r.info.cond)?'<span style="color:var(--red);font-weight:700"> ⚠馬場未入力</span>':''}${betInfo?' ／ '+betInfo:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${isSkip?`<div style="font-size:11px;color:var(--lt);font-weight:700">見送り</div>`
          :hasR?`<div style="font-weight:900;font-size:12px;color:${hi.anyHit?'var(--grn)':'var(--red)'}">${hi.anyHit?'✓ '+hi.label:'✗'}</div>
          <div style="font-size:11px;font-weight:700;color:${hi.ret>=inv?'var(--grn)':'var(--red)'}">${profitStr}</div>`
          :`<div style="font-size:11px;color:var(--gld);font-weight:700">未入力</div>`}
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  
  if(showDates.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--dim)">データなし</div>`;
  }
  
  if(RACES.length>0){
    h+=`<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn-s" onclick="recalcAll()" style="padding:6px 20px;color:var(--blu)">🔄 全レース再分析</button>
      <button class="btn-s" onclick="downloadCSV()" style="padding:6px 20px">📥 CSVダウンロード</button>
      <button class="btn-s" onclick="downloadAnalysisCSV()" style="padding:6px 20px;color:var(--blu)">🔬 検証データCSV</button>
      <button class="btn-s" onclick="if(confirm('保存データを全て削除しますか？（元に戻せません）')){RACES=[];saveR(RACES);renderList()}" style="padding:6px 20px;color:var(--red)">🗑 全データ削除</button>
    </div>`;
  }
  document.getElementById('vList').innerHTML=h;
}

function recalcAll(){
  if(!confirm('全'+RACES.length+'レースを最新ロジックで再分析します。\n買い目・的中判定が変わります。結果データ（着順・払戻金）は保持されます。\n\n実行しますか？'))return;
  let count=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0)return;
    const race={horses:r.scored.map(h=>({
      num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
      rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
      jk:h.jk,imp:h.imp,sire:h.sire,trainer:h.trainer,bl:h.bl,prev:h.prev||[]
    })),info:r.info};
    try{
      const newScored=score(race);
      const newBet=genBet(newScored,r.info,r._marketOdds);
      r.scored=newScored;
      r.bet=newBet;
      if(r.result?.top3?.length>=3){
        const reasons=analyzeLoss(r,r.result.top3);
        r.result.reasons=reasons;
      }
      count++;
    }catch(e){console.error('再分析エラー:',r.label,e)}
  });
  saveR(RACES);
  renderList();
  alert(count+'レースを再分析しました。買い目・的中判定が最新ロジックに更新されました。');
}

function downloadCSV(){
  const BOM='\uFEFF';
  const header=['日付','競馬場','レース','距離','コース','馬場','券種','買目','馬名','結果','1着','2着','3着','配当(100円あたり)','回収額','投資','利益','回収率','信頼度','軸馬EV','◎馬番','◎スコア','◎EV','○馬番','○スコア','○EV'];
  const rows=[];
  const sorted=[...RACES].filter(r=>!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')).sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  sorted.forEach(r=>{
    const hasR=r.result?.top3?.length>=3;
    const hi=hasR?getHitInfo(r):{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0};
    const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    const betType=r.bet?.best?.type||'';
    const betNums=r.bet?.best?.desc||'';
    const betNames=r.bet?.best?.horses?.map(h=>h.name).join('×')||'';
    const payout=r.result?.payout||0;
    const ret=hi.ret;
    const inv=hi.inv||0;
    const profit=ret-inv;
    const nameOf=n=>{const h=r.scored?.find(x=>x.num===+n);return h?h.name:''};
    const t1=hasR?r.result.top3[0]:'';
    const t2=hasR?r.result.top3[1]:'';
    const t3=hasR?r.result.top3[2]:'';
    rows.push([
      r.info.date||'',
      venue,
      (r.info.raceNum||'')+'R',
      (r.info.dist||'')+'m',
      r.info.surf||'',
      r.info.cond||'',
      betType,
      betNums,
      betNames,
      hi.skip?'見送り':hasR?hi.label:'未入力',
      hasR?t1+'番 '+nameOf(t1):'',
      hasR?t2+'番 '+nameOf(t2):'',
      hasR?t3+'番 '+nameOf(t3):'',
      hasR&&!hi.skip?payout:'',
      hi.skip?'':hasR?ret:'',
      hi.skip?'':inv,
      hi.skip?'':hasR?profit:'',
      hi.skip?'':hasR&&inv>0?Math.round(ret/inv*100)+'%':'',
      r.bet?.confidence||'',
      r.bet?.best?.ev||r.scored?.[0]?.ev||'',
      r.scored?.[0]?.num||'',r.scored?.[0]?.ns||'',r.scored?.[0]?.ev||'',
      r.scored?.[1]?.num||'',r.scored?.[1]?.ns||'',r.scored?.[1]?.ev||''
    ]);
  });
  // 合計行
  const done=RACES.filter(r=>r.result?.top3?.length>=3&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!getHitInfo(r).skip);
  const totalBet=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const totalRet=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  rows.push([]);
  rows.push(['合計','','','','','','','','','',
    '','','','',totalRet,totalBet,totalRet-totalBet,totalBet>0?Math.round(totalRet/totalBet*100)+'%':'','','','','','','','','']);
  
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{
    const s=String(cell==null?'':cell);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='keiba_results_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function buildAnalysisSnapshot(r){
  if(!r.scored||!r.result)return null;
  const top3=r.result.top3?.map(n=>+n)||[];
  const allResults=r.result.allResults||[];
  const payouts=r.result.payouts||{};
  return{
    raceInfo:{
      date:r.info?.date,
      venue:(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
      dist:r.info?.dist,
      surface:r.info?.type,
      cond:r.info?.cond,
      dir:r.info?.dir,
      headCount:r.scored.length,
      cls:r.info?.cls
    },
    horses:r.scored.map(h=>{
      const ar=allResults.find(a=>a.num===h.num);
      const actualRank=ar?.rank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:null);
      return{
        num:h.num,name:h.name,odds:h.odds,pop:h.pop,ns:h.ns,score:h.score,
        factors:Object.fromEntries(Object.entries(h.f||{}).map(([k,v])=>[k,{v:v.v,c:v.c}])),
        actualRank,inTop3:top3.includes(h.num),
        isA:r.bet?.best?.horses?.[0]?.num===h.num,
        isB:r.bet?.best?.horses?.[1]?.num===h.num,

      };
    }),

      wideDesc:r.bet?.wideHorseB&&r.bet?.wideHorseC?r.bet.wideHorseB.num+'─'+r.bet.wideHorseC.num:null,

    },

    }

function doSaveResult(id){
  const ta=document.getElementById('resIn');
  if(!ta)return;
  const r=RACES.find(x=>x.id===id);if(!r)return;
  const pr=parseResult(ta.value,r.scored);
  if(pr.top3.length<3){alert('着順を読み取れませんでした。\n1着〜3着の馬番が含まれるテキストを貼り付けてください。');return}
  const pay=parseInt(document.getElementById('payIn')?.value)||pr.payout||0;
  const reasons=analyzeLoss(r,pr.top3);
  r.result={
    top3:pr.top3.map(String),
    payout:pay,
    reasons,
    allResults:pr.allResults,
    harlonTime:pr.harlonTime,
    racePace:pr.racePace,
    corners:pr.corners,
    payouts:pr.payouts
  };
  // 検証用スナップショット（フェーズ2でのファクター検証に使用）
  try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){console.warn('snapshot生成失敗:',e)}
  saveR(RACES);renderDetail(id);
  updatePhaseBanner();
}

function resetResult(id){
  const r=RACES.find(x=>x.id===id);if(!r)return;
  r.result=null;saveR(RACES);renderDetail(id);
}

function deleteRace(id){
  RACES=RACES.filter(x=>x.id!==id);saveR(RACES);showView('list');
}

  try{

// GitHub自動復元: ローカルデータが空でトークンがあれば自動取得
async function autoRestoreFromGithub(){
  const token=await restoreGhToken();
  if(!token)return false;
  // ローカルにデータがあれば復元不要
  const localRaces=RACES.filter(r=>!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_'));
  if(localRaces.length>0&&Object.keys(HORSE_STORE).length>0)return false;
  // GitHubからデータ取得を試行
  try{
    console.log('GitHub自動復元を開始...');
    const [rFile,hFile]=await Promise.all([
      ghGet('data/races.json',token),
      ghGet('data/horse_store.json',token)
    ]);
    if(!rFile)return false;
    const races=JSON.parse(decodeURIComponent(escape(atob(rFile.content.replace(/\n/g,'')))));
    if(races.length<=RACES.length)return false; // リモートの方が少なければ不要
    RACES=races;saveR(RACES);
    if(hFile){
      HORSE_STORE=JSON.parse(decodeURIComponent(escape(atob(hFile.content.replace(/\n/g,'')))));
      saveHorseStore(HORSE_STORE);
    }
    HORSE_DB=buildHorseDB();
    console.log('GitHub自動復元完了: '+RACES.length+'レース, '+Object.keys(HORSE_STORE).length+'頭');
    return true;
  }catch(e){console.warn('GitHub自動復元失敗:',e.message);return false}
}

// --- GitHub API helpers ---
async function ghGet(path,token){
  const res=await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`,{
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}
  });
  if(res.status===404)return null;
  if(!res.ok)throw new Error(`GitHub GET ${res.status}: ${(await res.json()).message}`);
  return await res.json();
}
async function ghPut(path,content,token,sha){
  const body={message:`sync: update ${path}`,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  const res=await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`,{
    method:'PUT',
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok){const e=await res.json();throw new Error(`GitHub PUT ${res.status}: ${e.message}`)}
  return await res.json();
}
