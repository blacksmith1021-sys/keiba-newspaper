// === 馬DBデータCSV出力 ===
function downloadHorseDBCSV(){
  const BOM='\uFEFF';
  const header=['馬名','競馬場','距離','コース','馬場','着順','頭数','着差','上がりタイム','上がり順位',
    '通過順位','騎手','斤量','馬体重','レース格','日付'];
  const rows=[];
  Object.entries(HORSE_STORE).forEach(([name,runs])=>{
    if(!runs||!Array.isArray(runs))return;
    runs.forEach(run=>{
      // 通過順位
      let pos='';
      if(run.positions&&Array.isArray(run.positions))pos=run.positions.join('-');

      // 斤量（bodyWeightから分離できないためそのまま）
      // bodyWeightは "490(+8)" のような形式
      let bw='',bwChange='';
      if(run.bodyWeight){
        const m=String(run.bodyWeight).match(/(\d+)\(([+\-\d]+)\)/);
        if(m){bw=m[1];bwChange=m[2]}
        else bw=run.bodyWeight;
      }

      // 上がり順位は保存されていないため空
      rows.push([
        name,
        run.venue||'',
        run.dist||'',
        run.surface||'',
        run.cond||'',
        run.rank||'',
        run.runners||'',
        run.gap!=null?run.gap:'',
        run.last3f||'',
        '',
        pos,
        run.jockey||'',
        run.weight||'',
        bw||(run.bodyWeight||''),
        run.cls||'',
        run.date||''
      ]);
    });
  });
  if(rows.length===0){alert('馬DBにデータがありません。\nHORSE_STORE: '+Object.keys(HORSE_STORE).length+'頭');return}
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{const s=String(cell==null?'':cell);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='horse_db_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  alert('馬DBデータ出力完了: '+rows.length+'走（'+Object.keys(HORSE_STORE).length+'頭）');
}

// === CSV IMPORT / RESTORE ===
function triggerCSVImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>importAnalysisCSV(ev.target.result,file.name);
    reader.readAsText(file);
  };
  inp.click();
}

function parseCSVLine(line){
  const cells=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'&&line[i+1]==='"'){cur+='"';i++}
      else if(c==='"')inQ=false;
      else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){cells.push(cur);cur=''}
      else cur+=c;
    }
  }
  cells.push(cur);
  return cells;
}

function importAnalysisCSV(text,fileName){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){alert('CSVが空です');return}
  const hdr=parseCSVLine(lines[0]);
  const idx={};
  hdr.forEach((h,i)=>idx[h.trim()]=i);

  // 必須列: 日付・競馬場・馬名のみ。レース・馬番・スコアはオプション
  const need=['日付','競馬場','馬名'];
  const missing=need.filter(k=>idx[k]===undefined);
  if(missing.length>0){alert('必須列が見つかりません: '+missing.join(', ')+'\n\nCSVには最低限「日付」「競馬場」「馬名」列が必要です。');return}

  const g=k=>idx[k]!==undefined;
  // レースごとにグルーピング
  const raceMap=new Map();
  for(let i=1;i<lines.length;i++){
    const c=parseCSVLine(lines[i]);
    if(c.length<3)continue;
    const date=c[idx['日付']]||'';
    const venue=c[idx['競馬場']]||'';
    const raceStr=g('レース')?(c[idx['レース']]||''):(g('レース番号')?(c[idx['レース番号']]||''):'');
    const dist=g('距離')?parseInt(c[idx['距離']])||0:0;
    // レースキー: レース番号があればそれを使い、なければ日付+競馬場+距離
    const raceKey=raceStr?date+'_'+venue+'_'+raceStr:date+'_'+venue+'_'+dist;
    if(!raceMap.has(raceKey))raceMap.set(raceKey,{date,venue,raceStr,rows:[]});
    raceMap.get(raceKey).rows.push(c);
  }

  let imported=0,skipped=0,horseAccumulated=0;
  const factorKeys=['前走','上がり','距離','血統','騎手','安定','トレンド','着差','間隔','蓄積','回り','馬場'];

  for(const [raceKey,rd] of raceMap){
    const {date,venue,raceStr,rows}=rd;
    const raceNum=(raceStr||'').replace(/R$/i,'');
    const distStr=g('距離')?rows[0][idx['距離']]:'';
    const dist=parseInt(distStr)||0;
    const surf=g('コース')?rows[0][idx['コース']]:'';
    const cond=g('馬場')?rows[0][idx['馬場']]:(g('馬場状態')?rows[0][idx['馬場状態']]:'');
    const cls=g('クラス')?rows[0][idx['クラス']]:'';
    const headCount=g('頭数')?parseInt(rows[0][idx['頭数']])||rows.length:rows.length;

    // 重複チェック
    const sortKey=date.replace(/\//g,'')+(raceNum?('0'+raceNum).slice(-2):'00');
    const dupLabel=date+' '+venue+' '+(raceNum||'?')+'R';
    const exists=RACES.some(r=>{
      if(r.label===dupLabel)return true;
      if(r.sortKey===sortKey&&r.info?.date===date)return true;
      return false;
    });
    if(exists){skipped++;continue}

    // コース種別推定
    let type='';
    if(surf){
      if(surf.includes('ダート')||surf==='ダ')type='ダート';
      else if(surf.includes('芝'))type='芝';
    }

    // 馬データ構築（scored 配列 + HORSE_STORE蓄積）
    const scoredHorses=[];
    let hasResult=false;
    rows.forEach((c,rowIdx)=>{
      const num=g('馬番')?parseInt(c[idx['馬番']])||rowIdx+1:rowIdx+1;
      const name=(c[idx['馬名']]||'').trim();
      if(!name)return;
      const odds=g('単勝オッズ')?parseFloat(c[idx['単勝オッズ']])||0:0;
      const pop=g('人気')?parseInt(c[idx['人気']])||0:0;
      const ns=g('スコア(ns)')?parseFloat(c[idx['スコア(ns)']])||0:(g('スコア合計')?parseFloat(c[idx['スコア合計']])||0:0);
      const actualRank=g('実際着順')?parseInt(c[idx['実際着順']])||null:null;
      const inTop3=g('3着以内')?(c[idx['3着以内']]==='1'):actualRank!=null&&actualRank<=3;
      if(actualRank)hasResult=true;

      const waku=g('枠番')?parseInt(c[idx['枠番']])||0:0;
      const jk=g('騎手名')?(c[idx['騎手名']]||''):'';
      const trainer='';
      const wt=g('馬体重')?parseInt(c[idx['馬体重']])||0:0;
      const wc=g('馬体重増減')?parseInt(c[idx['馬体重増減']])||0:0;
      const sexAge=g('性齢')?(c[idx['性齢']]||''):'';
      const sexM=sexAge.match(/(牡|牝|せん)(\d)/);
      const sex=sexM?sexM[1]:'';
      const age=sexM?+sexM[2]:0;
      const imp=g('斤量')?parseFloat(c[idx['斤量']])||0:0;
      const bl=g('ブリンカー')?(c[idx['ブリンカー']]||'').trim():'';
      const sire=g('父')?(c[idx['父']]||''):'';
      const last3f=g('実際上がりタイム')?parseFloat(c[idx['実際上がりタイム']])||0:0;
      const posStr=g('実際通過順位')?(c[idx['実際通過順位']]||''):'';
      const positions=posStr?posStr.split('-').map(Number).filter(n=>!isNaN(n)):[];

      // --- 前走データ → prev 配列を構築 ---
      const prev=[];
      const prevDate=g('前走日付')?(c[idx['前走日付']]||'').trim():'';
      if(prevDate){
        const prevVenue=g('前走競馬場')?(c[idx['前走競馬場']]||''):'';
        const prevDist=g('前走距離')?parseInt(c[idx['前走距離']])||0:0;
        const prevCourse=g('前走コース')?(c[idx['前走コース']]||''):'';
        const prevCond=g('前走馬場')?(c[idx['前走馬場']]||''):'';
        const prevRank=g('前走着順')?parseInt(c[idx['前走着順']])||0:0;
        const prevRun=g('前走頭数')?parseInt(c[idx['前走頭数']])||0:0;
        const prevGap=g('前走着差')?parseFloat(c[idx['前走着差']]):null;
        const prevF3=g('前走上がりタイム')?parseFloat(c[idx['前走上がりタイム']])||0:0;
        const prevCls=g('前走レース格')?(c[idx['前走レース格']]||''):'';
        const prevSurf=prevCourse.includes('ダート')||prevCourse==='ダ'?'ダ':prevCourse.includes('芝')?'芝':prevCourse;
        const dp=prevDate.split('/');
        const dateKey=dp.length>=3?(+dp[0]*10000+ +dp[1]*100+ +dp[2]):0;
        prev.push({
          fin:prevRank,run:prevRun,dist:prevDist,surface:prevSurf,
          cond:prevCond,venue:prevVenue,cls:prevCls,
          gap:prevGap!=null&&!isNaN(prevGap)?prevGap:null,
          f3:prevF3,dateKey,pos:null
        });
      }

      // ファクター復元
      const f={};
      factorKeys.forEach(fk=>{
        const col='F_'+fk;
        if(!g(col))return;
        const val=c[idx[col]]||'';if(!val)return;
        if(fk==='昇降級')return;
        f[fk]={v:0,c:val.startsWith('g')?'g':val.startsWith('b')?'b':'n'};
      });

      scoredHorses.push({
        num,name,waku,odds,pop,ns,score:ns,
        jk,trainer,wt,wc,sex,age,imp,bl:bl?true:false,sire,
        prev,f,
        _resultRank:actualRank,
        _resultLast3f:last3f,
        _resultPositions:positions.length>0?positions:null,
        _resultOdds:odds,
        _resultPopularity:pop
      });

      // --- HORSE_STORE に蓄積 ---
      if(actualRank&&name){
        if(!HORSE_STORE[name])HORSE_STORE[name]=[];
        const dup=HORSE_STORE[name].some(x=>x.date===date&&x.rank===actualRank&&x.dist===dist);
        if(!dup){
          HORSE_STORE[name].push({
            date,venue,dist,surface:type||surf,cond,
            rank:actualRank,runners:headCount,
            time:'',last3f,positions:positions.length>0?positions:null,
            jockey:jk,bodyWeight:wt?String(wt):''
          });
          horseAccumulated++;
        }
      }
    });

    // scored をスコア降順ソート
    scoredHorses.sort((a,b)=>(b.ns||0)-(a.ns||0));

    // top3復元
    const top3=scoredHorses.filter(h=>h._resultRank&&h._resultRank<=3)
      .sort((a,b)=>a._resultRank-b._resultRank).map(h=>String(h.num));

    // 信頼度・レース質
    const confidence=g('信頼度')?rows[0][idx['信頼度']]:'';
    const raceQualityScore=g('レース質スコア')?parseInt(rows[0][idx['レース質スコア']])||0:0;
    const skipStr=g('見送り')?rows[0][idx['見送り']]:'';
    const skipRecommended=skipStr==='見送り';
    const inv=g('投資額')?parseInt(rows[0][idx['投資額']])||0:0;
    const ret=g('回収額')?parseInt(rows[0][idx['回収額']])||0:0;

    const raceId='csv_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+imported;
    const raceObj={
      id:raceId,
      label:date+' '+venue+' '+(raceNum||'?')+'R',
      sortKey,
      info:{date,course:venue,raceNum:raceNum||'',dist,surf:surf||'',type:type||'',cond:cond||'',cls:cls||''},
      scored:scoredHorses,
      bet:{best:null,tickets:[],totalInv:inv,confidence,skipRecommended,
        raceQuality:{score:raceQualityScore,reasons:[]}},
      result:{
        top3:top3.length>=3?top3:[],
        payout:ret,
        reasons:['CSV取込データ'],
        allResults:scoredHorses.filter(h=>h._resultRank).map(h=>({
          rank:h._resultRank,num:h.num,name:h.name,
          jockey:h.jk,last3f:h._resultLast3f,
          positions:h._resultPositions,
          popularity:h._resultPopularity,
          odds:h._resultOdds,
          bodyWeight:h.wt?String(h.wt):''
        })).sort((a,b)=>a.rank-b.rank)
      },
      _scoreVer:'csv_import_v2'
    };

    RACES.push(raceObj);
    imported++;
  }

  if(imported>0||horseAccumulated>0){
    saveR(RACES);
    try{localStorage.setItem(HK,JSON.stringify(HORSE_STORE))}catch{}
    HORSE_DB=buildHorseDB();
    // 前走データの自力構築
    const prevFilled=buildPreviousFromHistory();
    if(prevFilled>0)saveR(RACES);
    renderList();
    alert(`CSV取込完了\n\n取込: ${imported} レース\nスキップ（重複）: ${skipped} レース\n馬DB蓄積: ${horseAccumulated} 出走\n前走自力構築: ${prevFilled} 頭\nファイル: ${fileName}`);
  }else{
    alert(`取込なし（全レースが重複でスキップされました）`);
  }
}

// === 騎手・調教師複勝率ヘルパー ===
function calcJkRateForDetail(jkName){
  if(!jkName)return null;
  let total=0,w3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{if(h.jk!==jkName)return;const rank=h._resultRank||(top3.includes(h.num)?top3.indexOf(h.num)+1:0);if(!rank)return;total++;if(rank<=3)w3++});
    (r.result?.allResults||[]).forEach(ar=>{const sc=(r.scored||[]).find(h=>h.num===ar.num);if((ar.jockey||sc?.jk||'')!==jkName)return;total++;if(ar.rank<=3)w3++});
  });
  return total>=3?{rate:Math.round(w3/total*100),total}:null;
}
function calcTrRateForDetail(trName){
  if(!trName)return null;
  let total=0,w3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{if(h.trainer!==trName)return;const rank=h._resultRank||(top3.includes(h.num)?top3.indexOf(h.num)+1:0);if(!rank)return;total++;if(rank<=3)w3++});
  });
  return total>=3?{rate:Math.round(w3/total*100),total}:null;
}

  const r=RACES.find(x=>x.id===id);if(!r)return;
  const s=r.scored;let b=r.bet;const hasR=r.result?.top3?.length>=3;
  // bet が未定義または不正な場合は genBet を再実行して修復
  if((!b||b.totalInv===undefined)&&s?.length>0){
    try{b=genBet(s,r.info);r.bet=b}catch(e){console.warn('bet再生成失敗:',e.message)}
  }
  const hi=hasR?getHitInfo(r):{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0};
  const isHit=hi.wideHit;
  // 旧データ互換：bets配列→best単体に変換

function buildAnalysisSnapshot(r){
  if(!r.scored||!r.result)return null;
  const top3=r.result.top3?.map(n=>+n)||[];
  const allResults=r.result.allResults||[];
  const payouts=r.result.payouts||{};
  return{
    raceInfo:{
      date:r.info?.date,
      venue:(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
      dist:r.info?.dist,
      surface:r.info?.type,
      cond:r.info?.cond,
      dir:r.info?.dir,
      headCount:r.scored.length,
      cls:r.info?.cls
    },
    horses:r.scored.map(h=>{
      const ar=allResults.find(a=>a.num===h.num);
      const actualRank=ar?.rank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:null);
      return{
        num:h.num,name:h.name,odds:h.odds,pop:h.pop,ns:h.ns,score:h.score,
        factors:Object.fromEntries(Object.entries(h.f||{}).map(([k,v])=>[k,{v:v.v,c:v.c}])),
        actualRank,inTop3:top3.includes(h.num),
        isA:r.bet?.best?.horses?.[0]?.num===h.num,
        isB:r.bet?.best?.horses?.[1]?.num===h.num,
        isC:r.bet?.wideHorseC?.num===h.num
      };
    }),
    betResult:{
      type:r.bet?.best?.type,desc:r.bet?.best?.desc,
      wideDesc:r.bet?.wideHorseB&&r.bet?.wideHorseC?r.bet.wideHorseB.num+'─'+r.bet.wideHorseC.num:null,
      totalInv:r.bet?.totalInv||0,confidence:r.bet?.confidence,confLevel:r.bet?.confLevel,
      raceQualityScore:r.bet?.raceQuality?.score,skipRecommended:r.bet?.skipRecommended
    },
    hitResult:(()=>{const hi=getHitInfo(r);return{wideHit:hi.wideHit,wideTicketHit:hi.wideTicketHit,anyHit:hi.anyHit,label:hi.label,ret:hi.ret,inv:hi.inv,profit:hi.ret-hi.inv,roi:hi.inv>0?Math.round(hi.ret/hi.inv*100):0}})(),
    keyPayouts:{
      wide:payouts['ワイド']?.slice(0,3)||[],
      umaren:payouts['馬連']?.slice(0,3)||[],
      tansho:payouts['単勝']?.slice(0,3)||[]
    }
  };
}

function doSaveResult(id){
  const ta=document.getElementById('resIn');
  if(!ta)return;
  const r=RACES.find(x=>x.id===id);if(!r)return;
  const pr=parseResult(ta.value,r.scored);
  if(pr.top3.length<3){alert('着順を読み取れませんでした。\n1着〜3着の馬番が含まれるテキストを貼り付けてください。');return}
  const pay=parseInt(document.getElementById('payIn')?.value)||pr.payout||0;
  const reasons=analyzeLoss(r,pr.top3);
  r.result={
    top3:pr.top3.map(String),
    payout:pay,
    reasons,
    allResults:pr.allResults,
    harlonTime:pr.harlonTime,
    racePace:pr.racePace,
    corners:pr.corners,
    payouts:pr.payouts
  };
  // allResultsのオッズ・人気・着順をscoredに反映
  if(pr.allResults&&r.scored){
    pr.allResults.forEach(ar=>{
      const h=r.scored.find(x=>x.num===ar.num);
      if(!h)return;
      h._resultRank=ar.rank;
      if(ar.odds)h._resultOdds=ar.odds;
      if(ar.popularity)h._resultPopularity=ar.popularity;
      if(ar.last3f)h._resultLast3f=ar.last3f;
      // オッズが未入力だった馬に結果のオッズを補完
      if(!h.odds&&ar.odds)h.odds=ar.odds;
      if(!h.pop&&ar.popularity)h.pop=ar.popularity;
    });
  }
  // 検証用スナップショット（フェーズ2でのファクター検証に使用）
  try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){console.warn('snapshot生成失敗:',e)}
  saveR(RACES);

// === 着順予想コメント（ルールベース自動生成） ===
// === 競馬新聞形式：馬ごとのコメント生成 ===
function generateHorseComment(h,r){
  const inf=r.info;const dist=inf.dist||0;
  const raceVenue=(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  const raceCond=inf.cond||'良';
  const isDirt=(inf.type||'')==='ダート';
  const surfLabel=isDirt?'ダート':'芝';
  const condOrder=['良','稍重','重','不良'];
  const l=h.prev?.[0];const l2=h.prev?.[1];
  const lines=[];

  // === 能力コメント ===
  if(l){
    const venue=l.venue||'';const ld=l.dist||0;
    const loc=venue+(ld?ld+'m':'');
    if(l.fin===1)lines.push('前走は'+loc+'で1着と好調。');
    else if(l.fin<=3)lines.push('前走は'+loc+'で'+l.fin+'着と好走。');
    else if(l.fin<=6)lines.push('前走は'+loc+'で'+l.fin+'着。');
    else lines.push('前走は'+loc+'で'+l.fin+'着と苦戦。');

    if(l.gap!=null&&l.gap>0&&l.gap<=0.2)lines.push('着差'+l.gap+'秒と僅差の内容。');
    else if(l.gap!=null&&l.gap>=0.5)lines.push('着差'+l.gap+'秒と差をつけられた。');
  }

  // 上がり
  if(h.f?.['上がり']){
    const m=h.f['上がり'].v.match(/(\d+)位\/(\d+)頭/);
    if(m){
      const rank=+m[1],total=+m[2];
      if(rank<=2)lines.push('上がりは'+total+'頭中'+rank+'位と末脚が光る。');
      else if(rank<=5)lines.push('上がりは'+total+'頭中'+rank+'位と標準的。');
      else lines.push('上がりは'+total+'頭中'+rank+'位と伸び切れず。');
    }
  }

  // トレンド
  if(l&&l2){
    if(l.fin<l2.fin)lines.push('近走は着順が改善傾向。');
    else if(l.fin>l2.fin)lines.push('近走は着順が悪化傾向。注意が必要。');
  }

  // === 条件コメント ===
  if(l?.dist&&dist){
    const dd=dist-l.dist;const sameV=l.venue&&l.venue===raceVenue;
    if(dd===0&&sameV)lines.push('今回は前走と同じ'+dist+'mの'+raceVenue+'。条件はベスト。');
    else if(dd===0)lines.push('今回は前走と同じ'+dist+'m。距離は合う。');
    else if(dd>0)lines.push('前走より'+dd+'m長い距離への延長。スタミナが問われる。');
    else lines.push('前走より'+Math.abs(dd)+'m短い距離への短縮。速い流れへの対応がポイント。');
  }

  if(l?.surface){
    const surfKey=isDirt?'ダ':'芝';
    if(l.surface!==surfKey){
      const from=l.surface==='ダ'?'ダート':'芝';
      lines.push('前走'+from+'から今回'+surfLabel+'へのコース変更。適性がポイント。');
    }
  }

  if(l?.cond&&raceCond){
    const ci=condOrder.indexOf(raceCond),pi=condOrder.indexOf(l.cond);
    if(ci>=0&&pi>=0&&ci>pi)lines.push('前走より馬場が悪い条件。道悪適性が問われる。');
  }

  // === 状態コメント ===
  if(h.wc!=null){
    const w=Math.abs(h.wc);
    if(w<=2)lines.push('馬体重は前走とほぼ変わらず安定。');
    else if(h.wc>=6)lines.push('馬体重が前走比+'+h.wc+'kgと大幅増。');
    else if(h.wc<=-6)lines.push('馬体重が前走比'+h.wc+'kgと大幅減。');
  }

  if(h.f?.['間隔']){
    const iv=h.f['間隔'].v;
    const wm=iv.match(/中(\d+)週/);
    if(wm){
      const w=+wm[1];
      if(w>=13)lines.push(w+'週ぶりの出走。休み明けの影響に注意。');
      else if(w>=2&&w<=4)lines.push('中'+w+'週の間隔で状態維持が期待できる。');
    }
  }

  if(h.f?.['斤量']){
    const v=h.f['斤量'].v;
    if(v.includes('最軽量'))lines.push('斤量はレース最軽量の'+h.imp+'kg。斤量面で有利。');
    else if(v.includes('最重量'))lines.push('斤量はレース最重量の'+h.imp+'kg。斤量面では厳しい。');
  }

  // フォールバック
  if(lines.length===0){
    if(!h.prev||h.prev.length===0)lines.push('出走データが少なく判断材料に乏しい。');
    else lines.push('特筆すべき加点・減点材料は見当たらない。');
  }

  return lines.join('');
}

// レース1件から振り返りレコードを生成
function generateReview(r){
  if(!r||!r.scored||!r.result?.top3?.length)return null;
  const v6=r.v6||(typeof computeV6==='function'?computeV6(r.scored,r.info):null);
  const top3=r.result.top3.map(n=>+n);
  const winnerNum=top3[0];
  const winner=r.scored.find(h=>h.num===winnerNum);
  const allRes=r.result.allResults||[];
  const rankOf=n=>{const ar=allRes.find(a=>a.num===n);if(ar?.rank)return ar.rank;const i=top3.indexOf(n);return i>=0?i+1:null};
  const axNum=v6?.picks?.axis;
  const anNum=v6?.picks?.ana;
  const ax=axNum?r.scored.find(h=>h.num===axNum):null;
  const an=anNum?r.scored.find(h=>h.num===anNum):null;
  const inv=getHitInfo(r).inv||0;
  const ret=getHitInfo(r).ret||0;
  return{
    id:r.id,
    日付:r.info?.date||'',
    競馬場:(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
    レース番号:r.info?.raceNum||'',
    距離:r.info?.dist||0,
    コース:r.info?.type||'',
    分類:v6?.raceType||'?',
    買い目:(v6?.bet?.bets||[]).map(b=>`${b.kind}${b.desc}`).join(' / '),
    投資額:inv,
    回収額:ret,
    損益:ret-inv,
    '◎の馬名':ax?.name||'',
    '◎の結果':ax?`${ax.name} ${rankOf(ax.num)||'-'}着`:'',
    '◎の根拠':ax?`${ax.pop||'?'}番人気 sf${ax.v6sf!=null?ax.v6sf:'-'}`:'',
    '穴馬の結果':an?`${an.name} ${rankOf(an.num)||'-'}着`:'なし',
    '勝馬':winner?`${winner.name}（${winner.pop||'?'}番人気）`:`${winnerNum}番`,
    判定:ret>inv?'的中':'不的中',
  };
}

// v6 STEP 9: 勝ちパターン自動検出（コース×距離帯×分類でROI集計）
function detectWinPattern(reviews){
  const buckets={};
  const distBand=d=>!d?'?':d<1400?'短':d<1800?'マ':d<2200?'中':'長';
  reviews.forEach(r=>{
    const key=`${r.コース||'?'}_${distBand(r.距離)}_${r.分類||'?'}`;
    if(!buckets[key])buckets[key]={key,inv:0,ret:0,n:0,hit:0};
    buckets[key].inv+=r.投資額;
    buckets[key].ret+=r.回収額;
    buckets[key].n++;
    if(r.判定==='的中')buckets[key].hit++;
  });
  return Object.values(buckets)
    .filter(b=>b.n>=10&&b.inv>0&&b.ret/b.inv>=1.20)
    .map(b=>({...b,roi:b.ret/b.inv*100,hitRate:b.hit/b.n*100}))
    .sort((a,b)=>b.roi-a.roi);
}

  filteredRaces.forEach(r=>{

        const tr=ar.trainer||horse?.trainer;
        if(tr){if(!accTrainer[tr])accTrainer[tr]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accTrainer[tr];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}
        const pop=ar.popularity||horse?.pop||horse?._resultPopularity||0;
        if(pop>=1&&pop<=18){if(!accPop[pop])accPop[pop]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accPop[pop];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}

    h+=`<tr style="background:var(--ink);color:var(--p)"><th style="padding:6px 8px;text-align:left">調教師</th><th style="padding:6px 8px;text-align:right">出走</th><th style="padding:6px 8px;text-align:right">勝率</th><th style="padding:6px 8px;text-align:right">連対率</th><th style="padding:6px 8px;text-align:right">複勝率</th><th style="padding:6px 8px;text-align:right">掲示板率</th></tr>`;
    trEntries.slice(0,30).forEach(([name,s],i)=>{

      h+=`<tr style="background:${bg}"><td style="padding:4px 8px;font-weight:700">${name}</td><td style="padding:4px 8px;text-align:right">${s.total}</td><td style="padding:4px 8px;text-align:right;color:${s.w1/s.total>=.15?'var(--gld)':'var(--dim)'}">${Math.round(s.w1/s.total*100)}%</td><td style="padding:4px 8px;text-align:right">${Math.round(s.w2/s.total*100)}%</td><td style="padding:4px 8px;text-align:right;font-weight:700;color:${s.w3/s.total>=.3?'var(--grn)':'var(--dim)'}">${Math.round(s.w3/s.total*100)}%</td><td style="padding:4px 8px;text-align:right">${Math.round(s.w5/s.total*100)}%</td></tr>`;

  document.getElementById('vTrends').innerHTML=h;
}

// バックテスト実行
function runBacktest(){
  const btn=document.getElementById('backtestBtn');
  if(btn)btn.disabled=true;
  const out=document.getElementById('backtestResult');
  if(out)out.innerHTML='<div style="color:var(--dim)">実行中...</div>';

  setTimeout(()=>{
    let totalInv=0,totalRet=0,betsMade=0,racesSkipped=0,racesTotal=0;
    const details=[];

    RACES.forEach(r=>{
      if(!r.result?.top3?.length||r.result.top3.length<3)return;
      if(!r.scored||r.scored.length<3)return;
      racesTotal++;

      const ib=buildIntegratedBet(r.scored,r.info);
      if(!ib||ib.action==='SKIP'){racesSkipped++;return}

      const t3=r.result.top3.map(n=>+n);
      const pays=r.result?.payouts||{};

      (ib.bets||[]).forEach(bet=>{
        const amount=100;
        totalInv+=amount;
        betsMade++;
        let ret=0;

        if(bet.type==='単勝'){
          const target=parseInt(bet.desc);
          if(t3[0]===target){
            const p=findPayout(pays,'単勝',[target]);
            ret=p>0?amount*p/100:0;
          }
        }else if(bet.type==='ワイド'){
          const nums=bet.desc.split('—').map(Number);
          if(nums.length>=2&&t3.includes(nums[0])&&t3.includes(nums[1])){
            const p=findPayout(pays,'ワイド',nums.sort((a,b)=>a-b));
            ret=p>0?amount*p/100:amount*3;// 払戻データなければ仮3倍
          }
        }else if(bet.type==='3連複'){
          const nums=bet.desc.split('—').map(Number);
          if(nums.length>=3&&nums.every(n=>t3.includes(n))){
            const p=findPayout(pays,'3連複',nums.sort((a,b)=>a-b));
            ret=p>0?amount*p/100:amount*15;// 仮15倍
          }
        }
        totalRet+=ret;
      });
    });

    const roi=totalInv>0?((totalRet/totalInv-1)*100):0;
    const profit=Math.round(totalRet-totalInv);

    let html=`<div style="padding:10px;border:2px solid ${roi>=0?'var(--grn)':'var(--red)'};border-radius:6px;font-size:13px;line-height:1.8">`;

    html+=`<div>対象: ${racesTotal}R / 購入: ${racesTotal-racesSkipped}R / 見送り: ${racesSkipped}R</div>`;
    html+=`<div>買い点数: ${betsMade}点</div>`;
    html+=`<div>投資: ${totalInv.toLocaleString()}円 → 回収: ${Math.round(totalRet).toLocaleString()}円（${profit>=0?'+':''}${profit.toLocaleString()}円）</div>`;
    html+=`<div style="font-size:11px;color:var(--dim);margin-top:4px">※ ワイド・3連複の払戻データがないレースは仮配当（×3/×15）で計算</div>`;
    html+=`</div>`;
    if(out)out.innerHTML=html;
    if(btn)btn.disabled=false;
  },100);
}

// ===== CLOUD SYNC (GitHub Gist API) =====
const GH_API='https://api.github.com';
const GH_TOKEN_IDB_KEY='ghToken';
const GIST_ID_IDB_KEY='gistId';

// --- トークン・Gist ID の永続化 ---
// Gist IDの唯一の永続ソース = URLハッシュ (#gist=xxx)
// トークンは localStorage + IndexedDB（URLには含めない）
function getGhToken(){return loadSettings().ghToken||''}
function getGistId(){return loadSettings().gistId||''}
function _getGistIdFromHash(){
  const m=location.hash.match(/[#&]gist=([a-f0-9]+)/);
  return m?m[1]:'';
}
function _setGistIdToHash(id){
  if(!id)return;
  if(location.hash.match(/[#&]gist=/)){
    location.hash=location.hash.replace(/gist=[a-f0-9]*/,'gist='+id);
  }else{
    location.hash=(location.hash||'#')+(location.hash.length>1?'&':'')+'gist='+id;
  }
}
function setGhToken(t){
  const s=loadSettings();s.ghToken=t;saveSettings(s);
  _idbSave(GH_TOKEN_IDB_KEY,t).catch(()=>{});
}
function setGistId(id){
  const s=loadSettings();s.gistId=id;saveSettings(s);
  _idbSave(GIST_ID_IDB_KEY,id).catch(()=>{});
  _setGistIdToHash(id);
}
async function restoreGhToken(){
  // 1. localStorage
  const ls=getGhToken();if(ls)return ls;
  // 2. IndexedDB
  try{const t=await _idbLoad(GH_TOKEN_IDB_KEY);if(t){const s=loadSettings();s.ghToken=t;saveSettings(s);return t}}catch{}
  return '';
}
async function restoreGistId(){
  // 1. URLハッシュ（全キャッシュ削除後も残る唯一のソース）
  const fromHash=_getGistIdFromHash();
  if(fromHash){
    const s=loadSettings();if(s.gistId!==fromHash){s.gistId=fromHash;saveSettings(s)}
    _idbSave(GIST_ID_IDB_KEY,fromHash).catch(()=>{});
    return fromHash;
  }
  // 2. localStorage
  const ls=getGistId();
  if(ls){_setGistIdToHash(ls);_idbSave(GIST_ID_IDB_KEY,ls).catch(()=>{});return ls}
  // 3. IndexedDB
  try{const id=await _idbLoad(GIST_ID_IDB_KEY);if(id){const s=loadSettings();s.gistId=id;saveSettings(s);_setGistIdToHash(id);return id}}catch{}
  return '';
}
function getLastSync(){return loadSettings().lastSync||''}
function setLastSync(t){const s=loadSettings();s.lastSync=t;saveSettings(s)}

// --- Gist API helpers ---
async function gistGet(gistId,token){
  const headers={'Accept':'application/vnd.github.v3+json'};
  if(token)headers['Authorization']='token '+token;
  const res=await fetch(`${GH_API}/gists/${gistId}`,{headers});
  if(res.status===404)return null;
  if(!res.ok)throw new Error(`Gist GET ${res.status}: ${(await res.json()).message}`);
  return await res.json();
}
async function gistCreate(token){
  const res=await fetch(`${GH_API}/gists`,{
    method:'POST',
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({
      description:'競馬ファクター新聞 データ保存',
      public:false,
      files:{
        'races.json':{content:JSON.stringify(RACES)||'[]'},
        'horse_store.json':{content:JSON.stringify(HORSE_STORE)||'{}'},
        'settings.json':{content:JSON.stringify(loadSettings())||'{}'}
      }
    })
  });
  if(!res.ok){const e=await res.json();throw new Error(`Gist POST ${res.status}: ${e.message}`)}
  return await res.json();
}
async function gistUpdate(gistId,token){
  const res=await fetch(`${GH_API}/gists/${gistId}`,{
    method:'PATCH',
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({
      files:{
        'races.json':{content:JSON.stringify(RACES)},
        'horse_store.json':{content:JSON.stringify(HORSE_STORE)},
        'settings.json':{content:JSON.stringify(loadSettings())}
      }
    })
  });
  if(!res.ok){const e=await res.json();throw new Error(`Gist PATCH ${res.status}: ${e.message}`)}
  return await res.json();
}
function gistParseFile(gistData,filename){
  const f=gistData?.files?.[filename];
  return f?.content||null;
}

// --- 自動バックアップ（デバウンス付き） ---
let _gistSyncTimer=null;
async function scheduleGistSync(){
  if(_gistSyncTimer)clearTimeout(_gistSyncTimer);
  _gistSyncTimer=setTimeout(async()=>{
    const token=await restoreGhToken();
    const gistId=await restoreGistId();
    if(!token||!gistId)return;
    try{
      await gistUpdate(gistId,token);
      setLastSync(new Date().toLocaleString('ja-JP'));
      showSaveStatus('☁️ Gist同期完了','ok');updateSyncBadge();
    }catch(e){
      console.warn('Gist自動同期失敗:',e.message);
    }
  },2000);
}

// --- Gist自動復元: GistIDがあればトークン不要で読み取り復元 ---
async function autoRestoreFromGithub(){
  const token=await restoreGhToken();
  const gistId=await restoreGistId();
  if(!gistId)return false;
  try{
    const gist=await gistGet(gistId,token||'');
    if(!gist)return false;
    const rJson=gistParseFile(gist,'races.json');
    const hJson=gistParseFile(gist,'horse_store.json');
    if(!rJson)return false;
    const remoteRaces=JSON.parse(rJson);
    const remoteHorses=hJson?JSON.parse(hJson):{};
    let restored=false;
    if(remoteRaces.length>RACES.length){
      RACES=remoteRaces;
      try{localStorage.setItem(SK,rJson)}catch{}
      restored=true;
      console.log('Gistから復元:',remoteRaces.length,'レース');
    }
    if(Object.keys(remoteHorses).length>Object.keys(HORSE_STORE).length){
      HORSE_STORE=remoteHorses;
      try{localStorage.setItem(HK,hJson)}catch{}
      restored=true;
    }
    if(restored){
      HORSE_DB=buildHorseDB();
      updateCountBadge();
    }
    return restored;
  }catch(e){console.warn('Gist自動復元失敗:',e.message);return false}
}

function doJsonBackup(){
  try{
    const backup={
      version:APP_VERSION,
      schemaVersion:DATA_SCHEMA_VERSION,
      exportedAt:new Date().toISOString(),
      data:{
        races:RACES,
        horseStore:HORSE_STORE,
        settings:loadSettings()
      },
      stats:{raceCount:RACES.length,horseCount:Object.keys(HORSE_STORE).length}
    };
    const json=JSON.stringify(backup);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const now=new Date();
    const ts=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    a.href=url;a.download='keiba_backup_'+ts+'.json';a.click();
    URL.revokeObjectURL(url);
    const s=loadSettings();s.lastJsonBackup=now.toLocaleString('ja-JP');saveSettings(s);
    const el=document.getElementById('jsonBackupStatus');
    if(el)el.innerHTML='<div class="sync-status sync-ok" style="margin-top:8px">✅ バックアップ保存完了（'+RACES.length+'レース, '+Object.keys(HORSE_STORE).length+'頭）</div>';
  }catch(e){
    const el=document.getElementById('jsonBackupStatus');
    if(el)el.innerHTML='<div class="sync-status sync-err" style="margin-top:8px">❌ '+e.message+'</div>';
  }
}
function doJsonRestore(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    const el=document.getElementById('jsonBackupStatus');
    try{
      const text=await file.text();
      const backup=JSON.parse(text);
      if(!backup.data?.races||!Array.isArray(backup.data.races))throw new Error('無効なバックアップファイルです');
      const rc=backup.data.races.length;
      const hc=backup.data.horseStore?Object.keys(backup.data.horseStore).length:0;
      if(!confirm('バックアップから復元します。\n\nバックアップ: '+rc+'レース, '+hc+'頭\n現在: '+RACES.length+'レース, '+Object.keys(HORSE_STORE).length+'頭\n\n実行しますか？'))return;
      RACES=backup.data.races;saveR(RACES);
      if(backup.data.horseStore){HORSE_STORE=backup.data.horseStore;saveHorseStore(HORSE_STORE)}
      if(backup.data.settings){const s={...loadSettings(),...backup.data.settings};saveSettings(s)}
      HORSE_DB=buildHorseDB();updateCountBadge();
      if(el)el.innerHTML='<div class="sync-status sync-ok" style="margin-top:8px">✅ 復元完了！ '+rc+'レース, '+hc+'頭</div>';
    }catch(e){
      if(el)el.innerHTML='<div class="sync-status sync-err" style="margin-top:8px">❌ '+e.message+'</div>';
    }
  };
  inp.click();
}

  const token=document.getElementById('ghTokenInput').value.trim();
  const gistId=document.getElementById('gistIdInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  if(!gistId){showSyncStatus('Gist IDを入力してください。初回は「新規Gist作成」を押してください。','err');return}
  setGhToken(token);setGistId(gistId);
  if(RACES.length===0&&Object.keys(HORSE_STORE).length===0){
    showSyncStatus('❌ ローカルにデータがありません。空データでGistを上書きすることはできません。','err');return;
  }
  const btn=document.getElementById('syncSaveBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  try{
    const existing=await gistGet(gistId,token);
    if(existing){
      const rJson=gistParseFile(existing,'races.json');
      if(rJson){
        try{
          const remote=JSON.parse(rJson);
          if(remote.length>0&&RACES.length<remote.length){
            if(!confirm(`⚠️ Gistにはレース${remote.length}件ありますが、ローカルは${RACES.length}件です。\nデータが減ります。本当に上書きしますか？`)){
              btn.disabled=false;btn.textContent='📤 Gistに保存';return;
            }
          }
        }catch{}
      }
    }
    btn.textContent='⏳ 保存中...';
    showSyncStatus('Gistにアップロード中...','info');
    await gistUpdate(gistId,token);
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 保存完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭<br><span class="sync-time">保存日時: ${now}</span>`,'ok');
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📤 Gistに保存';
  }
}

async function doGhLoad(){
  const token=document.getElementById('ghTokenInput').value.trim();
  const gistId=document.getElementById('gistIdInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  if(!gistId){showSyncStatus('Gist IDを入力してください','err');return}
  setGhToken(token);setGistId(gistId);
  const btn=document.getElementById('syncLoadBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  showSyncStatus('Gistのデータを確認中...','info');
  try{
    const gist=await gistGet(gistId,token);
    if(!gist)throw new Error('Gistが見つかりません。Gist IDを確認してください。');
    const rJson=gistParseFile(gist,'races.json');
    const hJson=gistParseFile(gist,'horse_store.json');
    if(!rJson)throw new Error('Gistにレースデータがありません。先にGistに保存してください。');
    const remoteRaces=JSON.parse(rJson);
    const remoteHorses=hJson?JSON.parse(hJson):{};
    if(remoteRaces.length===0&&Object.keys(remoteHorses).length===0){
      throw new Error('Gistのデータが空です（レース0件、馬DB0頭）。');
    }
    if(!confirm(`Gistのデータで上書きします。\n\nリモート: レース${remoteRaces.length}件, 馬DB${Object.keys(remoteHorses).length}頭\nローカル: レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭\n\n実行しますか？`))
    {btn.disabled=false;btn.textContent='📥 Gistから復元';return}
    btn.textContent='⏳ 読込中...';
    RACES=remoteRaces;
    saveR(RACES);
    HORSE_STORE=remoteHorses;
    saveHorseStore(HORSE_STORE);
    HORSE_DB=buildHorseDB();
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 復元完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭`,'ok');
    updateCountBadge();
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📥 Gistから復元';
  }
}

// Init
(async()=>{
  // 0. URLハッシュからGist IDを復元（全キャッシュ削除後も残る唯一のソース）
  const hashGistId=_getGistIdFromHash();
  if(hashGistId){
    const curr=loadSettings();
    if(!curr.gistId||curr.gistId!==hashGistId){
      curr.gistId=hashGistId;
      try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(curr))}catch{}
      console.log('URLハッシュからGist ID復元:',hashGistId);
    }
  }

  // 1. IndexedDBからデータ復元（localStorage→IDB初回マイグレーション含む）
  const idbRestored=await _loadFromIdb();
  if(idbRestored){HORSE_DB=buildHorseDB();console.log('IndexedDBからデータ復元完了')}
  const fsOk=await initFileStorage();
  if(fsOk)console.log('ファイルストレージ接続済み');
  // 2. Gist自動復元（ローカルが空の場合のみ）
  const ghRestored=await autoRestoreFromGithub();
  if(ghRestored){
    const isReadOnly=!getGhToken();
    const banner=document.createElement('div');
    banner.style.cssText='position:fixed;top:0;left:0;right:0;background:'+(isReadOnly?'var(--blu)':'var(--grn)')+';color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;z-index:9999;';
    banner.textContent=isReadOnly
      ?'📱 Gistからデータを読み込みました（'+RACES.length+'レース）— 閲覧専用'
      :'✅ Gistからデータを自動復元しました（'+RACES.length+'レース）';
    document.body.prepend(banner);setTimeout(()=>banner.remove(),5000);
  }
  // 3. 起動時に全レースをv2スコアリングで再計算（バージョンフラグで制御）
  const SCORE_VER='v6.0.0';
  HORSE_DB=buildHorseDB();
  let rescored=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0||r.id?.startsWith('bulk_')||r.id?.startsWith('csv_'))return;
    if(r._scoreVer===SCORE_VER)return; // 既に最新バージョンで計算済み
    if(r.result?.top3?.length>=3)return; // 結果入力済みレースは再スコアリングしない（データリーケージ防止）
    try{
      const race={horses:r.scored.map(h=>({
        num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
        rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
        jk:h.jk,jkDiscount:h.jkDiscount,imp:h.imp,sire:h.sire,bms:h.bms,trainer:h.trainer,bl:h.bl,prev:h.prev||[],prize:h.prize
      })),info:r.info};
      const oldTop=r.scored[0]?.ns||0;
      r.scored=score(race);
      r.bet=genBet(r.scored,r.info,r._marketOdds);
      r.v6=computeV6(r.scored,r.info);
      r._scoreVer=SCORE_VER;
      const newTop=r.scored[0]?.ns||0;
      if(rescored===0)console.log('再スコア例: '+r.label+' 旧top='+oldTop+' → 新top='+newTop+' EV='+r.scored[0]?.ev);
      rescored++;
    }catch(e){console.warn('再スコア失敗:',r.label,e)}
  });
  if(rescored>0){saveR(RACES);console.log(rescored+'レースをSCORE_VER='+SCORE_VER+'で再スコアリング完了')}
  // snapshotの遡及生成
  RACES.forEach(r=>{
    if(r.result?.top3?.length>=3&&r.scored?.length>0&&!r.result.analysisSnapshot&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!isPastOnly(r)){
      try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){}
    }
  });
  updateCountBadge();
  updateSyncBadge();
  showView('input');
  // Service Worker 登録
  if('serviceWorker'in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            showSaveStatus('🔄 アプリが更新されました。再読み込みで反映されます。','ok');
          }
        });
      });
    }).catch(e=>console.warn('SW登録失敗:',e));
  }
})();

function showJkAptPopup(e,jkName){
  e.stopPropagation();
  let popup=document.getElementById('jkAptPopup');
  if(!popup){popup=document.createElement('div');popup.id='jkAptPopup';document.body.appendChild(popup)}
  popup.innerHTML=renderJockeyPopupHTML(jkName);
  popup.style.display='block';
  // モバイル対応：画面内に収める
  const rect=e.target.getBoundingClientRect();
  let top=rect.bottom+4;let left=rect.left;
  if(left+320>window.innerWidth)left=window.innerWidth-330;
  if(left<10)left=10;
  if(top+200>window.innerHeight)top=rect.top-210;
  popup.style.top=top+'px';popup.style.left=left+'px';
}
document.addEventListener('click',()=>{const p=document.getElementById('jkAptPopup');if(p)p.style.display='none'});
