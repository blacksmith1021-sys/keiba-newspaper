// ===== 回収率モデル v3（CLAUDE.md: 6因子+期待値+前走補正） =====
const STAT_TOP9_JOCKEYS=['C.ルメール','Ｃ．ルメール','川田 将雅','戸崎 圭太','岩田 望来','R.キング','西村 淳也','坂井 瑠星','武 豊','松山 弘平'];

// --- 6因子スコア（人気を含まない: オッズとの二重カウント防止） ---
function calcStatScore(h,raceInfo){
  let s=0;const detail=[];
  const jk=(h.jk||'').replace(/[\s　]+/g,' ').trim();
  if(STAT_TOP9_JOCKEYS.some(j=>j.replace(/[\s　]+/g,' ')===jk)){s+=15;detail.push('騎手+15')}
  const wt=h.wt||0;
  if(wt>=520){s+=8;detail.push('520kg+8')}else if(wt>=480){s+=5;detail.push('480kg+5')}else if(wt>=460){s+=2}else if(wt>0&&wt<440){s-=8;detail.push('<440kg-8')}
  const imp=h.imp||0;
  if(imp>=57){s+=5;detail.push('斤量+5')}else if(imp>0&&imp<54){s-=8;detail.push('斤量-8')}
  // --- トラックバイアス補正（枠順 × 馬場バイアス） ---
  const course=raceInfo?.type||'';const dist=raceInfo?.dist||0;const gate=h.num||0;
  if(course==='芝'&&gate>0){
    const runners=16;
    const isInnerGate=gate<=Math.ceil(runners*0.25);
    const isOuterGate=gate>=Math.ceil(runners*0.75);
    const km=(raceInfo?.course||'').match(/(\d+)日/);
    const kd=km?parseInt(km[1]):4;
    const cv=raceInfo?.cond||'良';
    let bi=0;
    if(kd<=2)bi=2;else if(kd>=6)bi=-2;
    if(cv==='重'||cv==='不良')bi-=1;
    if(bi>=2){
      if(isInnerGate){s+=6;detail.push('内枠×内有利+6')}
      else if(isOuterGate){s-=4;detail.push('外枠×内有利-4')}
    }else if(bi<=-2){
      if(isOuterGate){s+=4;detail.push('外枠×外有利+4')}
      else if(isInnerGate){s-=3;detail.push('内枠×外有利-3')}
    }else{
      if(dist>=1500){
        if(isInnerGate){s+=2;detail.push('内枠+2')}
        else if(isOuterGate){s-=2;detail.push('外枠-2')}
      }
    }
  }else if(course==='ダート'&&gate>0){
    if(dist>=1500&&gate<=3){s+=2;detail.push('ダ内枠+2')}
  }
  // --- 脚質×馬場コンディション補正 ---
  const prevPos=h.prev?.[0]?.pos;
  const firstPos=prevPos?.[0]||0;
  const isLeader=firstPos>0&&firstPos<=3;
  const isCloser=firstPos>=8;
  const cv2=raceInfo?.cond||'良';
  const st2=raceInfo?.type||'芝';
  const hs2=(st2==='芝')?(cv2==='良'||cv2==='稍重'):(cv2==='重'||cv2==='不良');
  const tf2=!hs2;
  const km2=(raceInfo?.course||'').match(/(\d+)日/);
  const kd2=km2?parseInt(km2[1]):4;
  let bi2=0;if(st2==='芝'){if(kd2<=2)bi2=2;else if(kd2>=6)bi2=-2;if(cv2==='重'||cv2==='不良')bi2-=1}
  if(hs2&&isLeader){s+=3;detail.push('高速場×先行+3')}
  else if(tf2&&isCloser){s+=3;detail.push('タフ場×差し+3')}
  else if(hs2&&isCloser&&bi2>=2){s-=3;detail.push('高速内有利×追込-3')}
  else if(tf2&&isLeader&&bi2<=-2){s-=2;detail.push('タフ外有利×先行-2')}
  const sex=h.sex||'';
  if(sex==='牡'){s+=3;detail.push('牡+3')}else if(sex==='牝'){s-=3;detail.push('牝-3')}
  const wc=h.wc;
  if(wc!=null){if(Math.abs(wc)<=3){s+=3;detail.push('安定+3')}else if(Math.abs(wc)>=10){s-=5;detail.push('変動-5')}}
  return{score:s,detail};
}

// --- 推定好走率テーブル（人気 × 6因子帯） ---
// 推定好走率テーブル v3（12,502走検証 / 人気×6因子帯→[勝率,3着内率]）
const EV_RATE_TABLE={
  '1_高':[.397,.772],'1_中':[.330,.708],'1_低':[.318,.605],
  '2_高':[.215,.599],'2_中':[.169,.529],'2_低':[.176,.476],
  '3_高':[.160,.502],'3_中':[.125,.388],'3_低':[.137,.413],
  '4_高':[.109,.391],'4_中':[.092,.319],'4_低':[.076,.318],
  '5_高':[.090,.307],'5_中':[.064,.257],'5_低':[.056,.226],
  '6_高':[.063,.174],'6_中':[.051,.215],'6_低':[.074,.239],
  '7_高':[.039,.195],'7_中':[.036,.141],'7_低':[.030,.108],
  '8_高':[.026,.099],'8_中':[.021,.145],'8_低':[.026,.089],
  '9_高':[.036,.111],'9_中':[.022,.093],'9_低':[.007,.074],
  '10+':[.015,.076],'11+':[.009,.047],'12+':[.005,.030],
};
const EST_ODDS={1:2.5,2:4.5,3:7.0,4:11.0,5:16.0,6:22.0,7:32.0,8:45.0,9:60.0,10:80.0,11:100,12:130,13:160,14:200,15:250,16:300,17:350,18:400};
function getFactorTier(sf,pop){
  if(pop<=5)return sf>=16?'高':sf>=8?'中':'低';
  return sf>=13?'高':sf>=3?'中':'低';
}
function getEstimatedRates(pop,sf){
  if(pop>=12)return EV_RATE_TABLE['12+']||[.005,.030];
  if(pop>=11)return EV_RATE_TABLE['11+']||[.009,.047];
  if(pop>=10)return EV_RATE_TABLE['10+']||[.015,.076];
  const tier=getFactorTier(sf,pop);
  return EV_RATE_TABLE[pop+'_'+tier]||[.005,.030];
}

// --- 穴馬判定（v4: 6番人気以下の好走確率を引き上げる5因子） ---
function calcAnaFactor(h){
  const pop=h.pop||0;
  if(pop>=1&&pop<=5)return null; // 人気馬には適用しない
  let s=0;const detail=[];
  if(STAT_TOP9_JOCKEYS.some(j=>j.replace(/[\s　]+/g,' ')===(h.jk||'').replace(/[\s　]+/g,' ').trim())){s++;detail.push('TOP9騎手')}
  if((h.wt||0)>=480){s++;detail.push('480kg↑')}
  if(h.wc!=null&&Math.abs(h.wc)<=6){s++;detail.push('体重安定')}
  if(h.sex==='牡'||h.sex==='せん'){s++;detail.push(h.sex==='牡'?'牡馬':'せん馬')}
  if((h.imp||0)>=55){s++;detail.push('斤量55↑')}
  return{score:s,detail};
}
function isAnaUma(h){
  const af=calcAnaFactor(h);
  return af!==null&&af.score>=4;
}

// --- 前走スコア（簡易版） ---
function calcPrevScore(h){
  const l=h.prev?.[0];if(!l||!l.fin)return null;
  let s=0;
  if(l.fin<=3)s+=36-(l.fin-1)*6;else if(l.fin<=5)s+=18-(l.fin-4)*6;else if(l.fin<=8)s+=6;
  if(h.f?.['距離']?.c==='g')s+=8;
  if(h.f?.['コース']?.c==='g')s+=4;
  if(h.f?.['競馬場']?.c==='g')s+=4;
  if(l.run&&l.fin<=3){if(l.run>=14)s+=6;else if(l.run>=10)s+=3}
  return s;
}

// --- 前走補正 ---
function adjustRateByPrev(wr,pr,prevScore){
  if(prevScore==null)return[wr,pr];
  let m=1.0;
  if(prevScore>=40)m=1.20;else if(prevScore>=25)m=1.10;else if(prevScore<10)m=0.85;
  return[Math.min(wr*m,.60),Math.min(pr*m,.90)];
}

// --- 期待値判定（1馬分） ---
function judgeHorse(h,raceInfo){
  const pop=h.pop;const sf=h.statNs||0;
  const prevScore=calcPrevScore(h);
  const existing=(h.adjNs!=null?h.adjNs:h.ns)||0;
  const hasExisting=existing>=70;
  // オッズ
  let odds=h.odds||h._resultOdds||0;
  let oddsSrc='実績';
  if(!odds&&pop){odds=EST_ODDS[Math.min(pop,10)]||100;oddsSrc='推定'}
  if(!odds||!pop)return{verdict:'SKIP',reason:'データ不足',ev:0,wr:0,pr:0,odds:0,oddsSrc:'',sf,prevScore,existing};
  // 推定好走率
  const [baseWr,basePr]=getEstimatedRates(pop,sf);
  const [adjWr,adjPr]=adjustRateByPrev(baseWr,basePr,prevScore);
  // 期待値
  const ev=adjWr*odds-1;
  // 判定
  let verdict;
  if(ev>0.05)verdict=hasExisting?'EDGE':'BET';
  else if(ev>-0.05&&hasExisting)verdict='BET';
  else verdict='SKIP';
  // 推定オッズのみの場合、閾値を厳しくする
  if(oddsSrc==='推定'&&ev<0.15)verdict='SKIP';
  return{verdict,ev,wr:adjWr,pr:adjPr,odds,oddsSrc,sf,prevScore,existing};
}

// ===== v6: 穴馬パターン検出（STEP 3） =====
// 巻き返し: 前走人気<=5 && 前走着順>=4 && 今走人気>=6（好走率17%、平均の1.8倍）
// 実績降格: 前走人気<=5 && 前走着順<=3 && 今走人気>=6（好走率23.5%、平均の2.6倍）
// 隠れ末脚: 前走上がりrank<=3 && 今走人気>=6（好走率15.6%、平均の1.7倍）
function detectPatterns(h){
  h.巻き返し=false;h.実績降格=false;h.隠れ末脚=false;
  const pop=h.pop||0;
  if(pop<6)return;
  const p=h.prev?.[0];
  if(!p)return;
  if(p.prevPop&&p.prevPop<=5&&p.fin>=4)h.巻き返し=true;
  if(p.prevPop&&p.prevPop<=5&&p.fin>=1&&p.fin<=3)h.実績降格=true;
  if(h._prevAgariRank&&h._prevAgariRank<=3)h.隠れ末脚=true;
}
// 全馬の前走上がりrankを算出してdetectPatternsを実行
function applyPatterns(horses){
  const withF3=horses.filter(h=>h.prev?.[0]?.f3).map(h=>({h,f3:h.prev[0].f3}));
  withF3.sort((a,b)=>a.f3-b.f3);
  withF3.forEach((x,i)=>{x.h._prevAgariRank=i+1});
  horses.forEach(detectPatterns);
}

// ===== v6: レース3分類（STEP 4） =====
// SOLID: ◎sf>=20 かつ パターン馬なし → 堅いレース（W1点100円）
// UPSET: パターン馬あり → 荒れ予兆（W+馬連+複勝 最大300円）
// SKIP : それ以外 → 見送り
function classifyRace(horses){
  if(!horses||!horses.length)return'SKIP';
  const fav1=horses.find(h=>h.pop===1);
  const fav1_sf=fav1?(fav1.statNs||0):0;
  const hasPattern=horses.some(h=>h.巻き返し||h.実績降格||h.隠れ末脚);
  if(fav1_sf>=20&&!hasPattern)return'SOLID';
  if(hasPattern)return'UPSET';
  return'SKIP';
}

// --- レース推奨生成（モード自動切替: オッズあり→回収率 / なし→スコア） ---
function buildIntegratedBet(scored,raceInfo){
  if(!scored||scored.length===0)return null;
  const hasRealOdds=scored.some(h=>h.odds&&h.odds>0);
  const mode=hasRealOdds?'ROI':'SCORE';
  const sf=h=>h.statNs||0;

  // 全馬の基礎データを構築
  const horses=scored.map(h=>{
    const j=judgeHorse(h,raceInfo);
    const prevScore=calcPrevScore(h);
    const intScore=(h.statNs||0)+(prevScore>=40?15:prevScore>=25?8:prevScore>=10?3:0);
    return{...h,verdict:j.verdict,ev:j.ev,estWr:j.wr,estPr:j.pr,
      evOdds:j.odds,oddsSrc:j.oddsSrc,prevScore,intScore,sMark:'△',sLabel:'押さえ'};
  });

  // v6 STEP3: 穴馬パターン検出（巻き返し/実績降格/隠れ末脚）
  applyPatterns(horses);

  // ===== v5: 印の決定（◎は必ず1-3番人気から） =====
  const used=new Set();
  const picks=[];

  // ◎: 1-3番人気の中で6因子最高
  const tier1=horses.filter(h=>h.pop>=1&&h.pop<=3).sort((a,b)=>sf(b)-sf(a));
  // フォールバック: 1-3番人気がいなければ4-5番人気
  const tier1fb=tier1.length>0?tier1:horses.filter(h=>h.pop>=1&&h.pop<=5).sort((a,b)=>sf(b)-sf(a));
  if(tier1fb.length>0){
    tier1fb[0].sMark='◎';tier1fb[0].sLabel='本命';
    picks.push(tier1fb[0]);used.add(tier1fb[0].num);
  }

  // ○: 1-5番人気で◎以外の6因子最高
  const tier2=horses.filter(h=>h.pop>=1&&h.pop<=5&&!used.has(h.num)).sort((a,b)=>sf(b)-sf(a));
  if(tier2.length>0){
    tier2[0].sMark='○';tier2[0].sLabel='対抗';
    picks.push(tier2[0]);used.add(tier2[0].num);
  }

  // ▲: 1-5番人気で◎○以外の6因子最高
  const tier3=horses.filter(h=>h.pop>=1&&h.pop<=5&&!used.has(h.num)).sort((a,b)=>sf(b)-sf(a));
  if(tier3.length>0){
    tier3[0].sMark='▲';tier3[0].sLabel='単穴';
    picks.push(tier3[0]);used.add(tier3[0].num);
  }

  // 穴: v6パターン馬の最有力（実績降格 > 巻き返し > 隠れ末脚）
  const anaPicker=(pred)=>horses.filter(h=>pred(h)&&!used.has(h.num)).sort((a,b)=>sf(b)-sf(a))[0];
  const anaCand=anaPicker(h=>h.実績降格)||anaPicker(h=>h.巻き返し)||anaPicker(h=>h.隠れ末脚);
  const tierAna=anaCand?[anaCand]:[];
  if(tierAna.length>0&&picks.length<4){
    tierAna[0].sMark='穴';tierAna[0].sLabel='穴';
    picks.push(tierAna[0]);used.add(tierAna[0].num);
  }

  // 残りは△
  horses.forEach(h=>{if(!used.has(h.num)){h.sMark='△';h.sLabel=''}});

  // ===== 回収率モード: EVフィルタ =====
  if(mode==='ROI'&&picks.length>0){
    // 各pickのEVを計算
    picks.forEach(h=>{
      const [wr]=getEstimatedRates(h.pop||9,h.statNs||0);
      let mult=1.0;
      if(h.prevScore>=40)mult=1.20;else if(h.prevScore>=25)mult=1.10;
      else if(h.prevScore!=null&&h.prevScore<10)mult=0.85;
      h.estWr=Math.min(wr*mult,.60);
      h.ev=h.evOdds?h.estWr*h.evOdds-1:0;
    });
    // 全員EV-10%以下なら見送り
    if(picks.every(h=>h.ev<-0.10)){
      return{action:'SKIP',reason:'最高EV: '+(Math.max(...picks.map(h=>h.ev))*100).toFixed(1)+'%',bestEv:Math.max(...picks.map(h=>h.ev)),horses,mode};
    }
  }

  // ===== v6 STEP6: 式別自動選択（レース3分類で分岐） =====
  if(picks.length===0)return{action:'SKIP',reason:'該当馬なし',bestEv:0,horses,mode};
  const axis=picks[0]; // ◎（必ず1-3番人気）
  const partner=picks[1]; // ○
  const ana=picks.find(p=>p.sMark==='穴');
  const bets=[];

  if(!axis)return{action:'SKIP',reason:'◎不在',bestEv:0,horses,mode};

  // レース分類
  const raceType=classifyRace(horses);

  if(raceType==='SKIP'){
    return{action:'SKIP',reason:'見送り（堅い条件なし/穴パターン馬なし）',raceType,horses,mode,bets:[]};
  }

  if(raceType==='SOLID'){
    // 堅いレース: ワイド ◎—○ 100円のみ
    if(!partner)return{action:'SKIP',reason:'○不在',raceType,horses,mode};
    const w1=[Math.min(axis.num,partner.num),Math.max(axis.num,partner.num)];
    bets.push({type:'ワイド',cost:100,target:w1.join('—'),ev:0,desc:w1.join('—'),note:'堅実'});
  }else if(raceType==='UPSET'){
    // 荒れ予兆: ワイド ◎—穴 100円
    if(!ana)return{action:'SKIP',reason:'穴馬不在',raceType,horses,mode};
    const w=[Math.min(axis.num,ana.num),Math.max(axis.num,ana.num)];
    bets.push({type:'ワイド',cost:100,target:w.join('—'),ev:0,desc:w.join('—'),note:'穴狙い'});
    // ◎sf>=20 なら馬連も追加
    if((axis.statNs||0)>=20){
      bets.push({type:'馬連',cost:100,target:w.join('—'),ev:0,desc:w.join('—'),note:'◎強い'});
    }
    // 穴馬が実績降格なら複勝も追加
    if(ana.実績降格){
      bets.push({type:'複勝',cost:100,target:String(ana.num),ev:0,desc:String(ana.num),note:'実績降格'});
    }
  }

  const strategy=raceType==='SOLID'?'堅い（W1点）':'穴（W+α）';
  return{action:'BET',strategy,raceType,axis,partners:picks.slice(1),bets,horses,nEdge:0,nBet:picks.length,mode};
}

// 後方互換: statScoreToRate（旧コードから参照される場合用）
function statScoreToRate(s){
  if(s>=71)return 77.8;if(s>=61)return 66.3;if(s>=51)return 60.0;
  if(s>=41)return 51.1;if(s>=31)return 42.6;if(s>=21)return 33.7;
  if(s>=11)return 25.5;if(s>=1)return 15.3;if(s>=-9)return 10.0;
  return 4.4;
}

// ===== BET (v21: 単勝・馬連・ワイドの3択、レース質判定) =====
function getHorseStatBonus(horse,raceInfo){
  const reasons=[];
  let bonus=0;
  const jk=horse.jk||'';
  const tr=horse.trainer||'';
  const surf=raceInfo?.type||'';
  const dist=raceInfo?.dist||0;
  const venue=(raceInfo?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  let jkTotal=0,jkW3=0,trTotal=0,trW3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{
      const rank=h._resultRank||(top3.length>=3&&top3.includes(h.num)?top3.indexOf(h.num)+1:0);
      if(!rank)return;
      if(jk&&h.jk===jk){jkTotal++;if(rank<=3)jkW3++}
      if(tr&&h.trainer===tr){trTotal++;if(rank<=3)trW3++}
    });
    (r.result?.allResults||[]).forEach(ar=>{
      const sc=(r.scored||[]).find(h=>h.num===ar.num);
      const arJk=ar.jockey||sc?.jk||'';
      const arTr=ar.trainer||sc?.trainer||'';
      if(jk&&arJk===jk){jkTotal++;if(ar.rank<=3)jkW3++}
      if(tr&&arTr===tr){trTotal++;if(ar.rank<=3)trW3++}
    });
  });
  if(jkTotal>=3){const rate=jkW3/jkTotal;if(rate>=0.40){bonus+=15;reasons.push(jk+'複勝率'+Math.round(rate*100)+'%('+jkTotal+'走)')}else if(rate>=0.28){bonus+=8;reasons.push(jk+'複勝率'+Math.round(rate*100)+'%('+jkTotal+'走)')}else if(rate<0.15)bonus-=8}
  if(trTotal>=3){const rate=trW3/trTotal;if(rate>=0.45){bonus+=12;reasons.push(tr+'厩舎複勝率'+Math.round(rate*100)+'%')}else if(rate>=0.33){bonus+=6;reasons.push(tr+'厩舎複勝率'+Math.round(rate*100)+'%')}else if(rate<0.15)bonus-=6}
  if(horse.name&&HORSE_DB[horse.name]){
    const hist=HORSE_DB[horse.name];
    const cond=hist.filter(x=>x.surface===surf&&x.dist&&Math.abs(x.dist-dist)<=200);
    if(cond.length>=2){const w3=cond.filter(x=>x.rank<=3).length;const rate=w3/cond.length;if(rate>=0.5){bonus+=12;reasons.push('条件複勝率'+Math.round(rate*100)+'%')}else if(rate>=0.33)bonus+=6}
    if(venue){const vm=hist.filter(x=>x.venue===venue);if(vm.length>=2&&vm.filter(x=>x.rank<=3).length/vm.length>=0.5){bonus+=8;reasons.push(venue+'複勝率高')}}
  }
  // ns への代入は絶対にしない
  return{bonus,reasons};
}

// デバッグ: ブラウザコンソールで genBet(RACES[0].scored, RACES[0].info) を実行して確認可能
function genBet(scored,raceInfo,marketOdds){
  const marks=['◎','○','▲','△','×'];
  const eU=(a,b)=>{if(!a?.odds||!b?.odds)return 0;return Math.round(a.odds*b.odds*0.4*100)/100};
  const eW=(a,b)=>{if(!a?.odds||!b?.odds)return 0;return Math.round(a.odds*b.odds*0.15*100)/100};

  // ===== ① レース質スコア =====
  // 各条件でマイナス点を積み、合計が閾値を超えたら見送り
  const raceQuality={score:0,reasons:[]};
  const headCount=scored.length;

  // 出走頭数が少ない
  if(headCount<=6){raceQuality.score-=30;raceQuality.reasons.push('少頭数（'+headCount+'頭）')}
  else if(headCount<=8){raceQuality.score-=15;raceQuality.reasons.push('小頭数（'+headCount+'頭）')}
  // 頭数補正（統計: 少頭数ほど高スコア馬が活きる）
  if(headCount<=10){raceQuality.score+=10;raceQuality.reasons.push('少頭数有利('+headCount+'頭)')}
  else if(headCount>=17){raceQuality.score-=8;raceQuality.reasons.push('多頭数('+headCount+'頭)予測精度低下')}

  // 各馬に推定オッズ・期待値を付与
  scored.forEach(h=>{
    h._estOdds=estimateOdds(h);
    h._estW3Prob=estimateW3Prob(h);
    h._ev=h._estOdds>0&&h._estW3Prob>0?Math.round(h._estW3Prob*h._estOdds*100)/100:0;
  });
  // 断然1番人気（単勝2倍未満）：的中しても配当が低い
  const favHorse=scored.slice().sort((a,b)=>(a._estOdds||999)-(b._estOdds||999))[0];
  const favOdds=favHorse?._estOdds||99;
  const hasOddsData=scored.some(h=>h._estOdds&&h._estOdds>0);
  if(hasOddsData){
    if(favOdds<1.5){raceQuality.score-=40;raceQuality.reasons.push('断然人気('+favOdds+'倍)')}
    else if(favOdds<2.0){raceQuality.score-=25;raceQuality.reasons.push('強い1番人気('+favOdds+'倍)')}
    else if(favOdds<2.5){raceQuality.score-=10;raceQuality.reasons.push('1番人気('+favOdds+'倍)')}
  }

  // 上位2頭のスコア差が小さい（甲乙つけがたい混戦）
  const top2=scored.slice(0,2);
  if(top2.length>=2){
    const scoreDiff=top2[0].ns-top2[1].ns;
    if(scoreDiff<=5){raceQuality.score-=20;raceQuality.reasons.push('上位2頭スコア差小('+scoreDiff+')')}
    else if(scoreDiff<=10){raceQuality.score-=10;raceQuality.reasons.push('上位差やや小('+scoreDiff+')')}
  }

  // 蓄積データのある馬が少ない（予測根拠が薄い）
  const withHistory=scored.filter(h=>h.f['蓄積']||h.prev?.length>=2).length;
  const histRate=withHistory/Math.max(headCount,1);
  if(histRate<0.3){raceQuality.score-=20;raceQuality.reasons.push('データ不足('+withHistory+'頭のみ)')}
  else if(histRate<0.5){raceQuality.score-=10;raceQuality.reasons.push('データ少('+withHistory+'頭)')}

  // スコア1位の絶対値が低い（全馬の実力が僅差）
  if(scored[0]?.ns<60){raceQuality.score-=15;raceQuality.reasons.push('スコア低(top:'+scored[0]?.ns+')')}

  // 補正スコアと統計スコアの乖離チェック（統計: 乖離時の着外リスク高）
  const topHorse=scored[0];
  if(topHorse){
    const adjNs=topHorse.adjNs||topHorse.ns||0;
    const statNs=topHorse.statNs||0;
    // 補正スコアが高い（80+）のに統計スコアが低い（5以下）→過信リスク
    if(adjNs>=80&&statNs<=5){
      raceQuality.score-=12;
      raceQuality.reasons.push('軸馬スコア乖離(補正'+adjNs+'/統計'+statNs+')');
    }
    // 両方高い（補正80+ & 統計20+）→高信頼
    else if(adjNs>=80&&statNs>=20){
      raceQuality.score+=8;
      raceQuality.reasons.push('軸馬高信頼(補正'+adjNs+'/統計'+statNs+')');
    }
  }

  // レース質判定：-40以下で見送り
  const poorRace=raceQuality.score<=-40;

  // オッズデータがある場合のみ除外、なければ全馬対象
  const excluded=[];
  const eligible=scored;
  const useEligible=eligible;

  function stableScore(h){
    let s=0;
    if(h.prev?.length>0){
      const board=h.prev.filter(p=>p.fin<=5).length;
      s+=board*15;const l=h.prev[0];
      if(l&&l.fin<=3)s+=12;else if(l&&l.fin<=5)s+=6;else if(l&&l.fin<=8)s+=2;
      if(l?.gap!=null){if(l.gap<=0.3)s+=12;else if(l.gap<=0.6)s+=8;else if(l.gap<=1.0)s+=4;else if(l.gap>2.0)s-=6}
    }
    if(h.f['距離']?.c==='g')s+=10;if(h.f['コース']?.c==='g')s+=8;
    if(h.f['上がり']?.c==='g')s+=6;if(h.f['トレンド']?.c==='g')s+=8;
    if(h.f['馬場']?.c==='g')s+=5;if(h.f['競馬場']?.c==='g')s+=5;
    if(h.f['間隔']?.c==='g')s+=3;
    if(h.rec){const tot=h.starts||1;const fr=(h.rec.w+h.rec.s+h.rec.t)/tot;if(fr>=0.4)s+=10;else if(fr>=0.25)s+=5}
    return s;
  }
  function whyPick(h){
    const r=[];if(h.prev?.length>0){const board=h.prev.filter(p=>p.fin<=5).length;const l=h.prev[0];
    if(l&&l.fin<=3)r.push('前走'+l.fin+'着/'+l.run+'頭');else if(l&&l.fin<=5)r.push('前走'+l.fin+'着');else if(l)r.push('前走'+l.fin+'着/'+l.run+'頭');
    if(board>=2)r.push('掲示板'+board+'回');if(l?.gap!=null&&l.gap<=0.6)r.push('着差'+l.gap+'秒');}
    if(h.f['距離']?.c==='g')r.push('同距離');if(h.f['コース']?.c==='g')r.push('コース○');
    if(h.f['トレンド']?.c==='g')r.push('トレンド↑');if(h.f['競馬場']?.c==='g')r.push('同競馬場');
    if(h.f['馬場']?.c==='g')r.push('馬場一致');
    if(h.rec?.w>0)r.push('勝利有');const rank=scored.indexOf(h);if(rank>=0&&rank<5)r.push(marks[rank]);
    if(!r.length)r.push('総合スコア');return r;
  }

  // 統計ボーナスを付与（ns は変更しない、ソート順も変えない）
  scored.forEach(h=>{
    try{
      const sb=getHorseStatBonus(h,raceInfo);
      h.statBonus=sb.bonus||0;
      h.statReasons=sb.reasons||[];
      h.totalScore=(h.ns||0)+Math.round((sb.bonus||0)*0.5);
      if(sb.bonus!==0||sb.reasons.length>0)console.log('[StatBonus]',h.name,'ns:',h.ns,'bonus:',sb.bonus,'reasons:',sb.reasons);
    }catch(e){
      h.statBonus=0;h.statReasons=[];h.totalScore=h.ns||0;
      console.warn('[StatBonus error]',h.name,e.message);
    }
  });

  const stables=useEligible.map(h=>({h,ss:stableScore(h)})).sort((a,b)=>b.ss-a.ss);

  // ===== 軸馬選定（ns基準） =====
  const STRONG_F=['前走','着差','上がり','トレンド','距離','コース','馬場','競馬場'];
  function countG(h){return STRONG_F.filter(k=>h.f?.[k]?.c==='g').length}
  const himoPool=scored.filter(h=>h.ns>=50&&h.ns<80).sort((a,b)=>b.ns-a.ns);
  // 軸馬: 補正スコア(adjNs)基準（人気・オッズに依存しない）
  const useNs=h=>h.adjNs!=null?h.adjNs:h.ns;
  let A=scored.find(h=>useNs(h)>=80)||scored.find(h=>useNs(h)>=50)||null;
  let B=scored.filter(h=>h!==A).find(h=>useNs(h)>=50)||scored.filter(h=>h!==A)[0]||null;
  let C=scored.filter(h=>h!==A&&h!==B).find(h=>useNs(h)>=50)||null;

  // ===== レース質判定（補正スコア使用） =====
  const topNs=useNs(scored[0])||0;
  const nsDiff=scored.length>=2?(useNs(scored[0])-useNs(scored[1])):0;
  const top3=scored.slice(0,3);
  const top3diff=top3.length>=3?(useNs(top3[0])-useNs(top3[2])):99;
  // 3パターン判定（補正スコアで判定、人気・オッズに依存しない）
  const isAxisClear=A&&useNs(A)>=80&&nsDiff>=10;
  const isMixedRace=scored.length>=3&&top3diff<=8;
  const isStandard=!isAxisClear&&!isMixedRace&&A&&useNs(A)>=50;

  // 見送り判定
  let budgetOver=false;
  if(typeof getDailyBudget==='function'&&typeof getTodayInvested==='function'){
    if(getDailyBudget()-getTodayInvested()<100)budgetOver=true;
  }
  let skipRecommended=topNs<50||budgetOver;
  if(!A||!B)skipRecommended=true;

  // 信頼度
  const axisG=A?countG(A):0;
  let confidence='',confLevel=1;
  if(axisG>=5){confidence='★★★ 高';confLevel=3}
  else if(axisG>=3){confidence='★★ 中';confLevel=2}
  else{confidence='★ 低';confLevel=1}

  const skipReason=budgetOver?'本日の予算上限に到達':topNs<50?'最高スコア不足('+topNs+')':(!A||!B)?'候補馬不足':'条件を満たす買い目なし';

  if(!A||!B){
    return{best:null,tickets:[],fav:favHorse,excluded,confidence,confLevel,
      fukushoHorse:null,totalInv:0,wideAmount:0,fukAmount:0,raceQuality,
      patName:'候補不足',patReason:skipReason,warning:'候補馬不足',skipRecommended:true,alternatives:[]};
  }

  const favStableRank=stables.findIndex(x=>x.h===favHorse);
  const favInEligible=favStableRank>=0;
  const favIsOverrated=!favInEligible||(favStableRank>=2);
  const favIsLegit=favInEligible&&favStableRank<=1;

  const estU=eU(A,B);
  const estW=C?eW(B,C):0;

  // ===== 馬券選択: 単勝・馬連・ワイドの3択 =====
  const mktOdds=marketOdds||{tansho:{},umaren:{},wide:{}};
  const hasMarket=Object.values(mktOdds).some(v=>v&&Object.keys(v).length>0);

  function getActualOdds(type,horses){
    if(type==='単勝'){const k=String(horses[0]?.num);return mktOdds.tansho?.[k]!=null?mktOdds.tansho[k]:null;}
    const nums=horses.map(x=>x.num).sort((a,b)=>a-b);const key=nums.join('-');
    if(type==='馬連')return mktOdds.umaren?.[key]!=null?mktOdds.umaren[key]:null;
    if(type==='ワイド')return mktOdds.wide?.[key]!=null?mktOdds.wide[key]:null;
    return null;
  }

  let tickets=[];
  // レース質タイプ名
  let raceType='見送り';

  if(!skipRecommended){
    const partners=[B,C,...himoPool.filter(h=>h!==A&&h!==B&&h!==C)].filter(Boolean);

    if(isAxisClear){
      // ===== 軸馬明確レース: 単勝100円 + 馬連100円×2点 = 300円 =====
      raceType='軸馬明確';
      // 単勝
      const tOdds=hasMarket?getActualOdds('単勝',[A]):A.odds;
      if(tOdds==null||tOdds>=5){
        tickets.push({type:'単勝',desc:String(A.num),amount:100,horses:[A],
          actualOdds:hasMarket?tOdds:null,grade:'◎',gradeLabel:'軸馬単勝',
          reason:A.num+'番が1着で的中'});
      }
      // 馬連×2（スコア2位・3位）
      [B,C].filter(Boolean).forEach(p=>{
        const uOdds=hasMarket?getActualOdds('馬連',[A,p]):null;
        if(uOdds!=null&&uOdds<10)return; // オッズ入力時: 10倍未満除外
        tickets.push({type:'馬連',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
          actualOdds:uOdds,grade:'○',gradeLabel:'軸馬絡み',
          reason:A.num+'番─'+p.num+'番が1・2着で的中'});
      });

    }else if(isMixedRace){
      // ===== 混戦レース: ワイド100円×3点（上位3頭の組み合わせ）= 300円 =====
      raceType='混戦';
      const trio=[top3[0],top3[1],top3[2]].filter(Boolean);
      for(let i=0;i<trio.length;i++){
        for(let j=i+1;j<trio.length;j++){
          const wOdds=hasMarket?getActualOdds('ワイド',[trio[i],trio[j]]):null;
          if(wOdds!=null&&wOdds<3)continue; // オッズ入力時: 3倍未満除外
          tickets.push({type:'ワイド',desc:trio[i].num+'─'+trio[j].num,amount:100,horses:[trio[i],trio[j]],
            actualOdds:wOdds,grade:'○',gradeLabel:'混戦上位組',
            reason:trio[i].num+'番─'+trio[j].num+'番が3着以内で的中'});
        }
      }

    }else if(isStandard){
      // ===== 標準レース: 馬連100円×3点（軸馬×上位3頭）= 300円 =====
      raceType='標準';
      partners.slice(0,3).forEach(p=>{
        const uOdds=hasMarket?getActualOdds('馬連',[A,p]):null;
        if(uOdds!=null&&uOdds<10)return; // オッズ入力時: 10倍未満除外
        tickets.push({type:'馬連',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
          actualOdds:uOdds,grade:'○',gradeLabel:'軸馬絡み',
          reason:A.num+'番─'+p.num+'番が1・2着で的中'});
      });
    }

    // オッズフィルタ後に買い目が0点なら見送り
    if(tickets.length===0)skipRecommended=true;
  }

  if(!skipRecommended&&!hasMarket){
    // オッズ未入力時の注記
    tickets.forEach(tk=>{if(tk.actualOdds==null){tk.grade='-';tk.gradeLabel='※オッズ未入力'}});
  }

  if(skipRecommended)tickets=[];
  const totalInv=tickets.reduce((s,t)=>s+t.amount,0);

  // 戦略説明
  const favNote=favIsOverrated
    ?'1番人気('+favOdds+'倍)は過剰人気→除外'
    :'1番人気('+favOdds+'倍)は実力通り';
  const strategyMap={'軸馬明確':'単勝＋馬連戦略','標準':'馬連戦略','標準(ワイド)':'ワイド戦略','混戦':'ワイド戦略','見送り':'見送り'};
  const types=[...new Set(tickets.map(t=>t.type))];
  const patName=skipRecommended?'見送り推奨':types.join('＋')+'×'+tickets.length+'点('+totalInv+'円)';
  const bonusLabel=A?.statReasons?.length?'【統計補正: '+A.statReasons.join('・')+'】':'';
  const patReason=skipRecommended
    ?skipReason
    :'レース質：'+raceType+' → '+(strategyMap[raceType]||'')+'。軸A='+A.num+'番(ns'+A.ns+'/'+A.pop+'番人気)。'+bonusLabel+'【'+favNote+'】';

  const bestObj={type:types[0]||'',horses:[A,B],est:eU(A,B),ev:A?.ev||0,prob:0,
    why:[whyPick(A),whyPick(B)],desc:A.num+'─'+B.num,strategy:patName};

  // レース質の警告文
  const rqWarning=poorRace?'⚠ レース質不良：'+raceQuality.reasons.join('・'):'';

  return{
    best:bestObj,tickets,patName,patReason,skipRecommended,
    warning:rqWarning||((!skipRecommended&&!C)?'ワイド候補不足（馬連のみ）':''),
    isTurf:(raceInfo?.type||'')!=='ダート',
    fav:favHorse,excluded,confidence,confLevel,
    raceQuality,favIsOverrated,favIsLegit,
    fukushoHorse:A,
    wideAmount:0,fukAmount:0,totalInv,
    wideHorseB:B,wideHorseC:C,
    alternatives:[]
  };
}

// ===== RESULT PARSER (全情報取得版) =====
function parseResult(text,horses){
  const results=[];
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  
  // === 1. 着順行を「数字+枠」パターンで検出し、後続行から全情報を収集 ===
  // 着順行の候補インデックスを収集
  const entryIdxs=[];
  for(let i=0;i<lines.length;i++){
    const tokens=lines[i].split(/[\t\s]+/).filter(Boolean);
    if(tokens.length>=2&&+tokens[0]>=1&&+tokens[0]<=18){
      // 2番目のトークンが「枠N」で始まるか確認
      if(tokens[1]?.match(/^枠\d/))entryIdxs.push(i);
      // またはタブ区切りで枠が含まれる
      else if(lines[i].match(/枠\d/))entryIdxs.push(i);
    }
  }
  
  for(let ei=0;ei<entryIdxs.length;ei++){
    const startIdx=entryIdxs[ei];
    const endIdx=ei+1<entryIdxs.length?entryIdxs[ei+1]:Math.min(startIdx+12,lines.length);
    const block=lines.slice(startIdx,endIdx);
    
    // 着順行からrank,numを取得
    const tokens=block[0].split(/[\t\s]+/).filter(Boolean);
    let rank=0,num=0,name='',sexAge='',weight=0,jockey='',time='',margin='';
    let idx=0;
    if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
    while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
    if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
    
    // 同じ行の残りトークンと後続行を全て結合してスキャン
    const restTokens=tokens.slice(idx);
    
    // 馬名：カタカナ3文字以上を含むトークン（ブリンカー着用を除去）
    for(const tk of restTokens){
      if(tk.match(/[ァ-ヶー]{3,}/)&&!tk.match(/^枠/)){name=tk.replace(/ブリンカー着用/,'').trim();break}
    }
    // 同じ行で馬名が取れなければ後続行から
    if(!name){
      for(let j=1;j<block.length&&j<=3;j++){
        const ln=block[j];
        if(ln.match(/[ァ-ヶー]{3,}/)&&!ln.match(/^枠|着順|馬番/)){
          name=ln.replace(/ブリンカー着用/,'').replace(/\t.*/,'').trim();break;
        }
      }
    }
    
    // ブロック全体から各情報を抽出
    const fullText=block.join('\t');
    // 性齢
    let sm=fullText.match(/(牡|牝|せん)\d/);if(sm)sexAge=sm[0];
    // 斤量
    sm=fullText.match(/(?:牡|牝|せん)\d[\t\s]+(\d+\.\d)/);if(sm)weight=parseFloat(sm[1]);
    // タイム
    sm=fullText.match(/(\d:\d{2}\.\d)/);if(sm)time=sm[1];
    // 騎手名
    sm=fullText.match(/(?:牡|牝|せん)\d[\t\s]+\d+\.\d[\t\s]+([▲△☆◇★]?[^\t\d:（(][^\t:（(]*?)[\t]/);if(sm)jockey=sm[1].replace(/[▲△☆◇★]/g,'').trim();
    // 着差（タイムの後のトークン）
    sm=fullText.match(/\d:\d{2}\.\d[\t\s]+([\S]+)/);
    if(sm&&(!sm[1].match(/^\d|^枠|^[一-龥]/)||sm[1]==='大差'))margin=sm[1];
    
    // 通過順位・上がり・馬体重・調教師
    let positions=null,last3f=null,bodyWeight='',trainer='',popularity=0;
    for(let j=1;j<block.length;j++){
      const nl=block[j];
      if(!positions&&nl.match(/^\d{1,2}\s+\d{1,2}(\s+\d{1,2}){0,2}$/)&&!nl.match(/枠|\./)){ 
        positions=nl.split(/\s+/).map(Number);continue;
      }
      if(!last3f&&nl.match(/^\d{2}\.\d/)){
        const parts=nl.split(/\t/).filter(Boolean);
        last3f=parseFloat(parts[0]);
        for(const p of parts){
          if(!bodyWeight&&p.match(/^\d{3}\(/))bodyWeight=p;
          if(+p>=1&&+p<=18&&p===parts[parts.length-1])popularity=+p;
        }
        for(const p of parts){
          if(!trainer&&p.match(/^[一-龥]/)&&!p.match(/^\d/)&&!p.match(/\(/))trainer=p.trim();
        }
        continue;
      }
      if(!bodyWeight&&nl.match(/^\d{3}\([+\-\d初]/)){bodyWeight=nl;continue}
    }
    
    results.push({rank,num,name,sexAge,weight,jockey,time,margin,positions,last3f,bodyWeight,trainer,popularity});
  }
  
  // フォールバック（性齢が取れない場合）
  if(results.length<3){
    results.length=0;
    for(const line of lines){
      if(line.match(/着順|馬番|馬名|払戻|単勝|複勝|枠連|馬連|ワイド|3連|コーナー|ハロン|レース映像|PLAY|パトロール|勝馬の紹介|開催選択|印刷用|更新/))continue;
      if(!line.match(/[ァ-ヶー]{3,}/))continue;
      const tokens=line.split(/[\t\s]+/).filter(Boolean);
      if(tokens.length<3)continue;
      let rank=0,num=0,name='';let idx=0;
      if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
      while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
      if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
      if(idx<tokens.length)name=tokens[idx];
      if(rank>0&&num>0)results.push({rank,num,name});
    }
  }
  
  // === 2. レース全体のタイム情報 ===
  let harlonTime='',racePace='';
  const htMatch=text.match(/ハロンタイム[\s\t]*([\d\s\-\.]+)/);
  if(htMatch)harlonTime=htMatch[1].trim();
  const paceMatch=text.match(/上り[\s\t]*(4F[\s\d\.\-]+3F[\s\d\.\-]+)/);
  if(paceMatch)racePace=paceMatch[1].trim();
  
  // === 3. コーナー通過順位（全体） ===
  let corners={};
  const cornerPattern=/([\d]コーナー)[\s\t]*(.+)/g;
  let cm;while((cm=cornerPattern.exec(text))!==null){corners[cm[1]]=cm[2].trim()}
  
  // === 4. 払戻金（全券種） ===
  let payouts={};
  const payTypes=['単勝','複勝','枠連','ワイド','馬連','馬単','3連複','3連単'];
  // 「払戻金」ヘッダー以降のテキストに絞る（着順テーブルヘッダーの「単勝」誤マッチを防止）
  const paySec=text.match(/払戻金[\s\S]*$/);
  const payText=paySec?paySec[0]:text;
  payTypes.forEach(pt=>{
    const re=new RegExp(pt+'\\s*\\n([\\s\\S]*?)(?='+payTypes.filter(x=>x!==pt).join('|')+'|$)');
    const pm=payText.match(re);
    if(pm){
      const allPay=[...pm[1].matchAll(/(\d+(?:[\-ー－―]\d+)*)\s+(\d[\d,]+)円/g)];
      payouts[pt]=allPay.map(m=>({combo:m[1],amount:parseInt(m[2].replace(/,/g,''))}));
    }
  });
  
  // ワイド最初の払戻金を取得
  let payout=0;
  if(payouts['ワイド']?.length>0)payout=payouts['ワイド'][0].amount;
  
  // 単勝オッズを払戻金から各馬に付与
  // 単勝払戻: combo=馬番, amount=払戻金 → オッズ = amount / 100
  const tanshoMap={};
  if(payouts['単勝']){
    payouts['単勝'].forEach(p=>{
      const num=parseInt(p.combo);
      if(num>=1&&num<=18)tanshoMap[num]=p.amount/100;
    });
  }
  // 人気順を単勝オッズから推定（低い順=1番人気）
  const oddsEntries=Object.entries(tanshoMap).sort((a,b)=>a[1]-b[1]);
  const popFromOdds={};
  oddsEntries.forEach(([num,odds],i)=>{popFromOdds[+num]=i+1});

  results.forEach(r=>{
    if(tanshoMap[r.num])r.odds=tanshoMap[r.num];
    if(popFromOdds[r.num]&&!r.popularity)r.popularity=popFromOdds[r.num];
  });

  // 重複排除＆着順ソート
  const seen=new Set();const unique=[];
  results.sort((a,b)=>a.rank-b.rank);
  for(const r of results){if(!seen.has(r.num)){seen.add(r.num);unique.push(r)}}
  const top3=unique.slice(0,3).map(r=>r.num);

  return{
    top3,payout,
    allResults:unique,     // 全馬の詳細着順データ（odds, popularity付き）
    harlonTime,            // ハロンタイム
    racePace,              // ペース（上り4F/3F）
    corners,               // コーナー通過順位
    payouts                // 全券種の払戻金
  };
}

// ===== 払戻金マッチング =====
function findPayout(payouts,type,nums){
  if(!payouts||!payouts[type])return 0;
  // 馬単・3連単は順番が意味を持つのでソートしない
  const ordered=(type==='馬単'||type==='3連単');
  const key=ordered?nums.join('-'):nums.slice().sort((a,b)=>a-b).join('-');
  const found=payouts[type].find(p=>{
    // ハイフン・全角ダッシュ・全角マイナスなど各種区切り文字に対応
    const parts=p.combo.replace(/[ー－―\u2010-\u2015\u2212\uFF0D]/g,'-').split('-').map(Number).filter(n=>!isNaN(n));
    const pk=ordered?parts.join('-'):parts.sort((a,b)=>a-b).join('-');
    return pk===key;
  });
  return found?found.amount:0;
}

// ===== 全券種的中判定 =====
function checkAllTickets(r){
  // 予想の馬番（A=スコア1位, B=スコア2位, C=スコア3位 ※1番人気除外後）
  const bt=r.bet;
  let betNums=[];
  if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
  else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
  else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  
  const res=r.result;if(!res?.top3||res.top3.length<3)return null;
  const t3=res.top3.map(n=>+n); // [1着馬番, 2着馬番, 3着馬番]
  const pays=res.payouts||{};
  const A=betNums[0],B=betNums[1];
  // C = 予想3位の馬（買い目に入っていない次の候補）
  const scored=r.scored||[];
  const excl=scored.filter(h=>h.odds&&h.odds<3.0);
  const elig=scored.filter(h=>!h.odds||h.odds>=3.0);
  const useElig=elig.length>=2?elig:scored.filter(h=>h!==scored.slice().sort((a,b)=>(a.odds||999)-(b.odds||999))[0]);
  const C=useElig.find(h=>h.num!==A&&h.num!==B)?.num||0;
  
  const results={};
  // 単勝：Aが1着
  results['単勝']={hit:t3[0]===A,pay:findPayout(pays,'単勝',[A])||0};
  // 複勝A
  results['複勝A']={hit:t3.includes(A),pay:findPayout(pays,'複勝',[A])||0,num:A};
  // 複勝B
  results['複勝B']={hit:t3.includes(B),pay:findPayout(pays,'複勝',[B])||0,num:B};
  // ワイド
  results['ワイド']={hit:t3.includes(A)&&t3.includes(B),pay:findPayout(pays,'ワイド',[A,B])||0};
  // 馬連
  results['馬連']={hit:t3.slice(0,2).includes(A)&&t3.slice(0,2).includes(B),pay:findPayout(pays,'馬連',[A,B])||0};
  // 馬単 A→B
  results['馬単']={hit:t3[0]===A&&t3[1]===B,pay:findPayout(pays,'馬単',[A,B])||0};
  // 3連複
  results['3連複']={hit:t3.includes(A)&&t3.includes(B)&&t3.includes(C),pay:findPayout(pays,'3連複',[A,B,C])||0,third:C};
  // 3連単 A→B→C
  results['3連単']={hit:t3[0]===A&&t3[1]===B&&t3[2]===C,pay:findPayout(pays,'3連単',[A,B,C])||0,third:C};
  
  return results;
}

// ===== 的中判定・回収計算ヘルパー =====
// 推奨した馬券種のみで的中判定を行う（他券種の偶然の的中は計上しない）
function getHitInfo(r){
  const res=r.result,bt=r.bet;
  if(!res?.top3||res.top3.length<3)return{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0,tickets:null,skip:false,hitTickets:[]};
  const v6=r.v6;
  if(bt?.skipRecommended||bt?.totalInv===0||(v6&&v6.raceType==='SKIP'&&v6.raceType!=='UPSET')){
    return{wideHit:false,wideTicketHit:false,fukHit:false,anyHit:false,label:'見送り',ret:0,inv:0,tickets:null,skip:true,hitTickets:[]};
  }

  const t3=res.top3.map(n=>+n);
  const pays=res.payouts||{};
  const inv=(r.v6?.bet?.totalCost>0?r.v6.bet.totalCost:bt?.totalInv!=null?bt.totalInv:((bt?.wideAmount||0)+(bt?.fukAmount||0)))||0;

  // === 推奨チケットごとに的中判定（推奨券種のみ） ===
  let ret=0;
  const hitTickets=[];

  if(bt?.tickets?.length>0){
    bt.tickets.forEach(tk=>{
      const nums=tk.horses?.map(h=>h.num)||[];
      let hit=false;
      switch(tk.type){
        case '単勝': hit=nums.length>=1&&t3[0]===nums[0]; break;
        case '馬連': hit=nums.length>=2&&t3.slice(0,2).includes(nums[0])&&t3.slice(0,2).includes(nums[1]); break;
        case 'ワイド': hit=nums.length>=2&&t3.includes(nums[0])&&t3.includes(nums[1]); break;
        case '馬単': hit=nums.length>=2&&t3[0]===nums[0]&&t3[1]===nums[1]; break;
        case '枠連': {const wk=tk.horses?.map(h=>h.waku)||[];hit=wk.length>=2&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[0]})&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[1]});} break;
        case '3連複': hit=nums.length>=3&&t3.includes(nums[0])&&t3.includes(nums[1])&&t3.includes(nums[2]); break;
        case '3連単': hit=nums.length>=3&&t3[0]===nums[0]&&t3[1]===nums[1]&&t3[2]===nums[2]; break;
      }
      if(hit){
        const sortedNums=tk.type==='馬単'||tk.type==='3連単'?nums:[...nums].sort((a,b)=>a-b);
        let pay=findPayout(pays,tk.type,sortedNums)||0;
        // 払戻金が取得できない場合、手入力の払戻額またはcheckAllTicketsの結果をフォールバック
        if(pay===0){
          const allTk=checkAllTickets(r);
          if(allTk){
            // 券種名でcheckAllTicketsの結果を参照
            const tkKey=tk.type==='単勝'?'単勝':tk.type==='馬連'?'馬連':tk.type==='ワイド'?'ワイド':tk.type==='馬単'?'馬単':tk.type==='3連複'?'3連複':tk.type==='3連単'?'3連単':null;
            if(tkKey&&allTk[tkKey]?.hit&&allTk[tkKey]?.pay>0)pay=allTk[tkKey].pay;
          }
          // それでも0なら手入力の払戻額を使用
          if(pay===0&&res.payout>0)pay=res.payout;
        }
        ret+=pay*(tk.amount/100);
        hitTickets.push({type:tk.type,desc:tk.desc,pay,amount:tk.amount});
      }
    });
  }
  // v13以前（従来ロジック: tickets配列なし）
  else{
    let betNums=[];
    if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
    else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
    else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
    const wAmt=bt?.wideAmount||0;const fAmt=bt?.fukAmount||0;const fukNum=bt?.fukushoHorse?.num;
    const wHit=betNums.length>=2&&t3.slice(0,2).includes(betNums[0])&&t3.slice(0,2).includes(betNums[1]);
    if(wHit){const p=findPayout(pays,'ワイド',betNums)||res.payout||0;ret+=p*((wAmt||300)/100);hitTickets.push({type:'馬連',desc:betNums.join('─'),pay:p});}
    const fHit=!!(fukNum&&fAmt>0&&t3.includes(fukNum));
    if(fHit){const p=findPayout(pays,'複勝',[fukNum])||0;if(p>0)ret+=p*(fAmt/100);hitTickets.push({type:'複勝',desc:String(fukNum),pay:p});}
  }

  // V6的中判定（v6データがある場合、上記の従来判定に加えてv6買い目もチェック）
  if(v6?.bet?.bets?.length>0&&hitTickets.length===0){
    v6.bet.bets.forEach(vb=>{
      const nums=vb.horses||[];let hit=false;
      switch(vb.kind){
        case '複勝':hit=nums.length>=1&&t3.includes(nums[0]);break;
        case '馬連':hit=nums.length>=2&&t3.slice(0,2).includes(nums[0])&&t3.slice(0,2).includes(nums[1]);break;
        case 'ワイド':hit=nums.length>=2&&t3.includes(nums[0])&&t3.includes(nums[1]);break;
      }
      if(hit){const sn=[...nums].sort((a,b)=>a-b);let pay=findPayout(pays,vb.kind,sn)||0;if(!pay&&res.payout>0)pay=res.payout;ret+=pay*(vb.cost/100);hitTickets.push({type:vb.kind,desc:vb.desc,pay,amount:vb.cost})}
    });
  }

  const anyHit=hitTickets.length>0;
  const label=anyHit?hitTickets.map(h=>h.type+'的中').join('・'):'不的中';
  // 互換用フラグ
  const wideHit=hitTickets.some(h=>h.type==='馬連');
  const wideTicketHit=hitTickets.some(h=>h.type==='ワイド');
  const fukHit=hitTickets.some(h=>h.type==='複勝');

  return{wideHit,wideTicketHit,fukHit,anyHit,label,ret:Math.round(ret),inv,skip:false,hitTickets};
}

// ===== LOSS ANALYSIS =====
function analyzeLoss(rd,top3){
  if(!top3||top3.length<3)return[];
  const bt=rd.bet;
  let betNums=[];
  // V6買い目を優先（画面に表示される「統合推奨馬券」がV6）
  if(rd.v6?.bet?.bets?.length>0){
    const v6Nums=new Set();
    rd.v6.bet.bets.forEach(vb=>(vb.horses||[]).forEach(n=>v6Nums.add(n)));
    betNums=[...v6Nums];
  }
  // V6がなければチケットベースの買い目
  if(betNums.length<2&&bt?.tickets?.length>0){
    const tkNums=new Set();
    bt.tickets.forEach(tk=>(tk.horses||[]).forEach(h=>tkNums.add(h.num)));
    if(tkNums.size>=1)betNums=[...tkNums];
  }
  // それでもなければ従来のbest.horses
  if(betNums.length<2){
    if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
    else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
    else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  }
  if(betNums.length<1)return['買い目なし'];
  
  const t3=top3.map(n=>+n);
  const sc=rd.scored;const fH=n=>sc.find(h=>h.num===n);
  const inTop3=betNums.filter(n=>t3.includes(n));
  const fukNum=bt?.fukushoHorse?.num;
  const fukHit=fukNum&&t3.includes(fukNum);
  
  // 買い目の2頭が両方3着以内 → 外れた原因の分析は不要
  if(inTop3.length>=2)return[];

  const reasons=[];
  
  if(inTop3.length===1){
    const hitN=betNums.find(n=>t3.includes(n));
    const missN=betNums.find(n=>!t3.includes(n));
    const hh=fH(hitN);const mh=fH(missN);
    const hitRank=t3.indexOf(hitN)+1;
    if(hh)reasons.push(hh.num+'番'+hh.name+'は'+hitRank+'着に好走 ○');
    if(mh)reasons.push('相手 '+mh.num+'番'+mh.name+'が'+((fH(missN)&&rd.result?.allResults)?rd.result.allResults.find(a=>a.num===missN)?.rank+'着':'圏外')+'で不的中');
    reasons.push('軸馬は好走→相手選びの精度向上が課題');
  }else{
    const winners=t3.map(n=>fH(n)).filter(Boolean);
    const bh=betNums.map(n=>fH(n)).filter(Boolean);
    if(bh.length>0&&bh.every(h=>h.ns<50))reasons.push('選出馬の実力不足');
    const favW=winners.filter(w=>w.odds&&w.odds<=5);
    if(favW.length>=2)reasons.push('人気馬で決着（堅いレース）');
    const big=winners.filter(w=>w.odds&&w.odds>=30);
    if(big.length)reasons.push('大穴馬が激走（予測困難）');
    if(reasons.length<=(fukHit?1:0))reasons.push('選出馬が2頭とも圏外');
  }
  return reasons;
}

// ===== TRENDS =====
function getTrends(){
  const done=RACES.filter(r=>r.result?.top3?.length>=3);
  if(done.length<2)return null;
  const tot=done.length;
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const anyHits=hits;
  const inv=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const ret=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const causes={};
  done.forEach(r=>{(r.result.reasons||[]).forEach(x=>{if(x&&!x.includes('的中')&&!x.includes('当たり')&&!x.includes('取込')&&x.trim()){const k=x.split('（')[0].split('→')[0].trim();if(k)causes[k]=(causes[k]||0)+1}})});
  const topC=Object.entries(causes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  // 騎手別・厩舎別・血統別成績（scored起点で集計、allResults/top3から着順取得）
  const jockeyStats={},trainerStats={},sireStats={};
  done.forEach(r=>{
    if(!r.scored)return;
    const allRes=r.result?.allResults||[];
    const top3=r.result?.top3||[];
    r.scored.forEach(horse=>{
      // 着順: allResultsから取得、なければtop3から推定
      const ar=allRes.find(a=>a.num===horse.num);
      let rank=ar?.rank||0;
      if(!rank){
        const idx=top3.findIndex(n=>+n===horse.num);
        if(idx>=0)rank=idx+1;
      }
      // 騎手: scored.jk → allResults.jockey の順でフォールバック
      const jk=horse.jk||ar?.jockey;
      if(jk){
        if(!jockeyStats[jk])jockeyStats[jk]={total:0,w1:0,w2:0,w3:0};
        jockeyStats[jk].total++;
        if(rank===1)jockeyStats[jk].w1++;
        if(rank>=1&&rank<=2)jockeyStats[jk].w2++;
        if(rank>=1&&rank<=3)jockeyStats[jk].w3++;
      }
      // 厩舎: scored.trainer → allResults.trainer
      const tr=horse.trainer||ar?.trainer;
      if(tr){
        if(!trainerStats[tr])trainerStats[tr]={total:0,w1:0,w2:0,w3:0};
        trainerStats[tr].total++;
        if(rank===1)trainerStats[tr].w1++;
        if(rank>=1&&rank<=2)trainerStats[tr].w2++;
        if(rank>=1&&rank<=3)trainerStats[tr].w3++;
      }
      // 血統（種牡馬）
      const sire=horse.sire;
      if(sire){
        if(!sireStats[sire])sireStats[sire]={total:0,w1:0,w2:0,w3:0};
        sireStats[sire].total++;
        if(rank===1)sireStats[sire].w1++;
        if(rank>=1&&rank<=2)sireStats[sire].w2++;
        if(rank>=1&&rank<=3)sireStats[sire].w3++;
      }
    });
  });

  // 人気別着順分布（結果入力済みレースの全馬データから集計）
  const popStats={}; // {1:{total,w1,w2,w3,w5}, 2:{...}, ...}
  done.forEach(r=>{
    if(!r.result?.allResults||!r.scored)return;
    r.result.allResults.forEach(ar=>{
      // 出馬表のpop（人気）を取得
      const horse=r.scored.find(h=>h.num===ar.num);
      const pop=horse?.pop;
      if(!pop||pop<1||pop>18)return;
      if(!popStats[pop])popStats[pop]={total:0,w1:0,w2:0,w3:0,w5:0};
      const ps=popStats[pop];
      ps.total++;
      if(ar.rank===1)ps.w1++;
      if(ar.rank<=2)ps.w2++;
      if(ar.rank<=3)ps.w3++;
      if(ar.rank<=5)ps.w5++;
    });
  });
  
  return{tot,hits,fukHits,anyHits,rate:Math.round(hits/tot*100),inv,ret,roi:inv>0?Math.round(ret/inv*100):0,topC,popStats,jockeyStats,trainerStats,sireStats};
}

  const v4races=done.filter(r=>r.bet?.patReason?.includes('レース質：')).length;

  if(count>=50&&v4races>=P3_TARGET){

      color:'var(--grn)',bg:'rgba(45,106,48,.08)',urgent:true};
  }else if(count>=50){
    return{phase:2,count,v4count:v4races,target:P3_TARGET,
      message:'📊 フェーズ3まであと '+(P3_TARGET-v4races)+' レース（v4.1設計）',
      detail:'フェーズ2（ファクター重み改定）完了済み。v4.1設計でのデータ蓄積中（'+v4races+'/'+P3_TARGET+'レース）。',
      color:'var(--blu)',bg:'rgba(26,68,136,.06)',urgent:false};
  }else if(count>=40){
    return{phase:1,count,v4count:v4races,target:50,
      message:'📊 フェーズ2まであと '+(50-count)+' レース',
      detail:'現在 '+count+'/50 レース蓄積済み。引き続き結果を入力してください。',
      color:'var(--gld)',bg:'rgba(184,134,11,.08)',urgent:false};
  }else{
    return{phase:1,count,v4count:v4races,target:50,
      message:'📊 データ蓄積中 '+count+'/50 レース',
      detail:'フェーズ2（ファクター検証）には50レースの結果データが必要です。',
      color:'var(--blu)',bg:'rgba(26,68,136,.06)',urgent:false};
  }
}

// === BULK IMPORT（過去結果一括取り込み）===
function doBulkImport(){
  const text=(document.getElementById('raceIn')?.value||document.getElementById('bulkIn')?.value||'').trim();
  if(!text){alert('テキストを貼り付けてください');return}
  const status=document.getElementById('bulkStatus')||document.getElementById('importSummary');
  const preview=document.getElementById('bulkPreview')||document.getElementById('importSummary');
  status.textContent='解析中...';
  preview.innerHTML='';
  
  if(!text.match(/着順/)&&!text.match(/枠\d/)&&!text.match(/レース/)&&!text.match(/\d+メートル/)){
    status.textContent='';
    preview.innerHTML='<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red)">レース結果データが見つかりません。</div>';
    return;
  }
  
  setTimeout(()=>{
  try{
  
  // レースごとに分割
  const raceBlocks=[];
  const lines=text.split('\n');
  let currentBlock=[];

  for(const line of lines){
    const trimmed=line.trim();
    const isNewRace=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed)&&/発走時刻/.test(trimmed);
    const isDateLine=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed);
    const isPageTop=trimmed==='ページトップへ戻る';

    if((isPageTop||isNewRace||(isDateLine&&currentBlock.length>20))&&currentBlock.length>15){
      raceBlocks.push(currentBlock.join('\n'));
      currentBlock=[];
      if(isPageTop)continue;
    }
    currentBlock.push(line);
  }
  if(currentBlock.length>10)raceBlocks.push(currentBlock.join('\n'));

  // ブロックが1つもなければテキスト全体を1ブロックとして処理
  if(raceBlocks.length===0)raceBlocks.push(text);

  // 着順データを含まないブロック（払戻金のみ等）を除外し、前のレースブロックにマージ
  const mergedBlocks=[];
  for(const block of raceBlocks){
    const hasEntry=block.match(/枠\d/) && (block.match(/[ァ-ヶー]{3,}/) || block.match(/\d:\d{2}\.\d/));
    if(hasEntry){
      mergedBlocks.push(block);
    }else if(mergedBlocks.length>0){
      // 払戻金等のデータは直前のレースブロックに結合
      mergedBlocks[mergedBlocks.length-1]+='\n'+block;
    }
    // 先頭で着順なしのブロックは捨てる
  }
  if(mergedBlocks.length===0)mergedBlocks.push(text); // フォールバック
  
  let totalHorses=0,totalRaces=0,errors=0,errMsgs=[];
  const imported=[];
  
  mergedBlocks.forEach((block,bi)=>{
    try{
      let m,info={};
      m=block.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m)info.date=`${m[1]}/${m[2]}/${m[3]}`;
      m=block.match(/(\d+回\S+\d+日)/);if(m)info.course=m[1];
      m=block.match(/(\d+)レース/);if(m)info.raceNum=m[1];
      m=block.match(/コース[：:][\s]*([\d,]+)メートル[（(](.+?)[)）]/);
      if(m){info.dist=parseInt(m[1].replace(',',''));info.surf=m[2]}
      m=block.match(/(芝|ダート)\s+(良|稍重|重|不良)/);
      if(m){info.type=m[1];info.cond=m[2]}
      
      const pr=parseResult(block,[]);
      if(!pr.allResults||pr.allResults.length<3){
        // 着順データがないブロックは静かにスキップ（払戻のみ等）
        const cnt=(pr.allResults||[]).length;
        if(cnt===0)return; // 着順ゼロ = レースデータではないブロック
        errors++;
        errMsgs.push('ブロック'+(bi+1)+': 着順'+cnt+'頭(3頭未満)');
        return;
      }
      
      const venue=(info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      
      // 馬DB専用ストレージに追加（詳細データ）
      pr.allResults.forEach(ar=>{
        const name=ar.name;if(!name)return;
        if(!HORSE_STORE[name])HORSE_STORE[name]=[];
        const dup=HORSE_STORE[name].some(x=>x.date===(info.date||'')&&x.rank===ar.rank&&x.dist===(info.dist||0));
        if(!dup){
          HORSE_STORE[name].push({
            date:info.date||'',venue,dist:info.dist||0,surface:info.type||'',
            cond:info.cond||'',rank:ar.rank,runners:pr.allResults.length,
            time:ar.time||'',last3f:ar.last3f||0,
            positions:ar.positions||null,jockey:ar.jockey||'',bodyWeight:ar.bodyWeight||''
          });
        }
      });
      
      // RACESに馬データ付きエントリを登録
      const id='bulk_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)+'_'+bi;
      const dupRace=RACES.some(r=>r.info?.date===info.date&&r.info?.raceNum===info.raceNum&&(r.info?.course||'').includes(venue));
      if(!dupRace){
        // allResultsから統一形式のscoredを構築
        const bulkScored=pr.allResults.map(ar=>{
          const sm=ar.sexAge?.match(/(牡|牝|せん)(\d)/);
          const bwm=ar.bodyWeight?.match(/(\d+)\(([+\-\d]+)\)/);
          return{
            num:ar.num,name:ar.name||'',waku:0,
            sex:sm?sm[1]:'',age:sm?+sm[2]:0,
            imp:ar.weight||0,jk:ar.jockey||'',
            wt:bwm?+bwm[1]:0,wc:bwm?parseInt(bwm[2]):null,
            bl:false,prev:[],rec:null,starts:0,
            ns:0,score:0,f:{},
            _resultRank:ar.rank,_resultTime:ar.time||'',
            _resultLast3f:ar.last3f||0,_resultPositions:ar.positions||null,
            _resultMargin:ar.margin||'',_resultPopularity:ar.popularity||0
          };
        });
        RACES.push({
          id,
          label:(info.date||'?')+' '+venue+' '+(info.raceNum||'?')+'R',
          sortKey:(info.date?info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999')+String(info.raceNum||0).padStart(2,'0'),
          info:{date:info.date,course:info.course,raceNum:info.raceNum,dist:info.dist,surf:info.surf,type:info.type,cond:info.cond},
          scored:bulkScored,
          bet:{best:null,tickets:[],totalInv:0},
          result:{top3:pr.top3.map(String),payout:pr.payout||0,reasons:['取込データ'],allResults:pr.allResults,payouts:pr.payouts}
        });
      }
      
      totalRaces++;
      totalHorses+=pr.allResults.length;
      imported.push({venue,raceNum:info.raceNum,horses:pr.allResults.length,date:info.date});
    }catch(e){errors++;errMsgs.push('ブロック'+(bi+1)+': '+e.message);console.error('一括取込エラー:',e)}
  });
  
  let prevFilled=0;
  if(totalRaces>0){
    saveHorseStore(HORSE_STORE);
    saveR(RACES);
    HORSE_DB=buildHorseDB();
    prevFilled=buildPreviousFromHistory();
    if(prevFilled>0)saveR(RACES);
  }

  let h='';
  if(totalRaces>0){
    h+=`<div style="padding:10px 12px;border:2px solid var(--grn);background:rgba(45,106,48,.06);font-size:13px;line-height:1.8;border-radius:6px">`;

  },50);

// ===== オッズテキストパーサー（全券種対応・タブ区切り＋連結型の自動判定） =====
function parseOddsText(text,mode){
  if(!text||!text.trim())return {};
  const lines=text.split('\n');
  const result={};

  // --- 連結形式パーサー: "121010.93117.9..." → 軸1,相手2:1010.9,相手3:117.9... ---
  function parseConcatLine(line,mode){
    const s=line.replace(/[\s,]+/g,'');
    if(!s||!/^\d/.test(s)||!s.includes('.'))return {};
    let axis,rest;
    const one=parseInt(s.substring(0,1));
    const two=parseInt(s.substring(0,2));
    if(one>=1&&one<=9){axis=one;rest=s.substring(1);}
    else if(two>=10&&two<=18&&s.length>2){axis=two;rest=s.substring(2);}
    else return {};
    let partners=[];
    if(mode==='ordered'){for(let i=1;i<=18;i++){if(i!==axis)partners.push(i);}}
    else{for(let i=axis+1;i<=18;i++)partners.push(i);}
    const out={};let pi=0;
    while(rest.length>0&&pi<partners.length){
      const p=partners[pi];const pStr=String(p);
      if(rest.startsWith(pStr)){
        rest=rest.substring(pStr.length);
        const om=rest.match(/^(\d+\.\d)/);
        if(om){const v=parseFloat(om[1]);
          if(mode==='ordered'){out[axis+'-'+p]=v;}
          else{out[Math.min(axis,p)+'-'+Math.max(axis,p)]=v;}
          rest=rest.substring(om[1].length);
        }else break;
      }
      pi++;
    }
    return out;
  }

  // --- タブ区切りパーサー: 軸番号行＋「相手番号\tオッズ」行 ---
  function parseTabLines(lines,mode){
    const out={};let axis=0;
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue;}
      if(!axis)continue;
      if(mode==='wide'){
        const mw=line.match(/^(\d{1,2})\s+([\d,.]+)\s*[-ー－~〜]\s*([\d,.]+)/);
        if(mw){const p=parseInt(mw[1]);const lo=parseFloat(mw[2].replace(/,/g,''));
          out[Math.min(axis,p)+'-'+Math.max(axis,p)]=lo;continue;}
      }
      const mu=line.match(/^(\d{1,2})\s+([\d,.]+)/);
      if(mu){const p=parseInt(mu[1]);const v=parseFloat(mu[2].replace(/,/g,''));
        if(v>=1.0){
          if(mode==='ordered'){out[axis+'-'+p]=v;}
          else{out[Math.min(axis,p)+'-'+Math.max(axis,p)]=v;}
        }
      }
    }
    return out;
  }

  // --- 自動判定: タブ区切りか連結形式かを判別 ---
  // タブ区切り = 数字だけの行（軸番号行）が存在する
  // 連結形式 = 1行に軸＋全相手オッズが詰まっている（小数点を含む長い行）
  function hasTabFormat(lines){
    return lines.some(l=>/^\s*\d{1,2}\s*$/.test(l))&&lines.some(l=>/^\s*\d{1,2}\s+[\d,.]+/.test(l));
  }

  // ========== single（単勝・複勝）==========
  if(mode==='single'){
    // タブ区切り: "1 2.5" per line
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      const m=line.match(/^(\d{1,2})\s+([\d.]+)/);
      if(m){result[String(parseInt(m[1]))]=parseFloat(m[2]);continue;}
    }
    // タブ区切りで取れなければ連結形式
    if(Object.keys(result).length===0){
      for(const raw of lines){
        const s=raw.replace(/[\s,]+/g,'');
        if(!s||!/^\d/.test(s)||!s.includes('.'))continue;
        let rest=s,num=1;
        while(rest.length>0&&num<=18){
          const ns=String(num);
          if(rest.startsWith(ns)){rest=rest.substring(ns.length);
            const om=rest.match(/^(\d+\.\d)/);
            if(om){result[String(num)]=parseFloat(om[1]);rest=rest.substring(om[1].length);}
            else break;
          }
          num++;
        }
      }
    }
    console.log('[ODDS PARSE] 単勝:',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+'番:'+v+'倍').join(', '));
    return result;
  }

  // ========== trio（3連複・3連単）==========
  // JRA形式: 「1着 X」「2着 Y」「3着」見出し → 「Z オッズ」行の繰り返し
  if(mode==='trio'){
    let first=0,second=0;
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      // 「1着 X」形式
      const m1=line.match(/^1着\s+(\d{1,2})/);
      if(m1){first=parseInt(m1[1]);second=0;continue;}
      const m2=line.match(/^2着\s+(\d{1,2})/);
      if(m2){second=parseInt(m2[1]);continue;}
      if(/^3着/.test(line))continue; // 「3着」見出し行はスキップ
      // 1着・2着が確定している状態で「番号 オッズ」行
      if(first&&second){
        const mt=line.match(/^(\d{1,2})\s+([\d,.]+)/);
        if(mt){const third=parseInt(mt[1]);const v=parseFloat(mt[2].replace(/,/g,''));
          if(v>=1.0){
            if(mode==='trio'){
              const nums=[first,second,third].sort((a,b)=>a-b);
              result[nums.join('-')]=v;
            }
          }
        }
      }
    }
    // フォールバック: 旧形式（軸番号 → 相手1-相手2 オッズ）
    if(Object.keys(result).length===0){
      let axis=0;
      for(const raw of lines){
        const line=raw.replace(/[\t ]+/g,' ').trim();
        if(!line)continue;
        if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue;}
        if(!axis)continue;
        const m3=line.match(/^(\d{1,2})\s*[-ー－]\s*(\d{1,2})\s+([\d,.]+)/)||line.match(/^(\d{1,2})\s+(\d{1,2})\s+([\d,.]+)/);
        if(m3){const a=parseInt(m3[1]),b=parseInt(m3[2]);const v=parseFloat(m3[3].replace(/,/g,''));
          if(v>=1.0){const nums=[axis,a,b].sort((x,y)=>x-y);result[nums.join('-')]=v;}}
      }
    }
    console.log('[ODDS PARSE] 3連:',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
    return result;
  }

  // ========== pair / wide / ordered（馬連・ワイド・馬単・枠連）==========
  // タブ区切り形式を先に試す
  if(hasTabFormat(lines)){
    Object.assign(result,parseTabLines(lines,mode));
  }
  // タブ区切りで取れなければ連結形式を試す
  if(Object.keys(result).length===0){
    for(const raw of lines){
      const out=parseConcatLine(raw,mode);
      Object.assign(result,out);
    }
  }
  const label=mode==='wide'?'ワイド':mode==='ordered'?'馬単':'馬連/枠連';
  if(Object.keys(result).length>0){
    console.log('[ODDS PARSE]',label+':',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
  }
  return result;
}

let _dupOverwrite=false;
function doAutoImport(){
  const t=(document.getElementById('raceIn')?.value||'').trim();
  if(!t){alert('テキストを貼り付けてください');return}
  const summary=document.getElementById('importSummary');
  // 自動判定
  let type='unknown';
  if(t.includes('払戻金')&&(t.includes('着順')||t.match(/\d+\s+枠\d/))){type='results'}
  else if(t.match(/\d+着\s+\d+頭/)||t.includes('番人気')){type='shutsuba'}
  else if(t.match(/枠\d/)){type='shutsuba'}
  if(type==='results'){
    if(summary)summary.innerHTML='<div style="font-size:12px;color:var(--blu)">自動判定: レース結果 → 取込中...</div>';
    setTimeout(()=>doBulkImport(),100);
  }else if(type==='shutsuba'){
    if(summary)summary.innerHTML='<div style="font-size:12px;color:var(--red)">自動判定: 出馬表 → 分析中...</div>';
    setTimeout(()=>doAnalyze(),100);
  }else{
    if(summary)summary.innerHTML='<div style="font-size:12px;color:var(--red)">テキストの種類を判定できませんでした。「出馬表として分析」か「レース結果として取込」を選んでください。</div>';
  }
}

function doAnalyze(){
  try{
  const t=document.getElementById('raceIn').value.trim();
  if(!t){alert('テキストを貼り付けてください');return}
  const parsed=parse(t);
  if(parsed.horses.length===0){
    const wakuCount=t.split('\n').filter(l=>l.trim().startsWith('枠')).length;
    const errDiv=document.getElementById('analyzeError');
    if(errDiv){errDiv.innerHTML=`<div style="padding:10px 14px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red);border-radius:4px;margin-top:8px">
      馬が検出できませんでした。JRAの出馬表ページを「枠」から始まるテキスト形式でコピーしてください。<br>
      <span style="font-size:11px;color:var(--dim)">（ヒント：検出できた「枠」行数が ${wakuCount} 行でした）</span>
    </div>`;errDiv.classList.remove('hidden')}
    return;
  }
  // === 重複チェック ===
  const pVenue=(parsed.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  const pDate=parsed.info.date||'';
  const pNum=parsed.info.raceNum||'';
  const dupKey=pDate+'_'+pVenue+'_'+pNum;
  const existingDup=RACES.find(r=>{
    const v=(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    return (r.info?.date||'')==pDate&&v==pVenue&&(r.info?.raceNum||'')==pNum;
  });
  if(existingDup&&!_dupOverwrite){
    const errDiv=document.getElementById('analyzeError');
    if(errDiv){
      errDiv.innerHTML=`<div style="padding:12px 14px;border-left:4px solid var(--red);background:rgba(196,30,58,.08);font-size:13px;color:var(--ink);border-radius:4px;margin-top:8px;position:relative">
        <button onclick="this.parentElement.parentElement.classList.add('hidden')" style="position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--dim)">×</button>
        <div style="font-weight:700;color:var(--red);margin-bottom:6px">⚠️ このレースはすでに登録されています</div>
        <div style="margin-bottom:8px">${pDate} ${pVenue} ${pNum}R</div>
        <div style="font-size:12px;color:var(--dim);margin-bottom:10px">再分析する場合は「上書きして再分析」を押してください。</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-r" onclick="_dupOverwrite=true;doAnalyze();_dupOverwrite=false;" style="padding:8px 16px;font-size:13px">上書きして再分析</button>
          <button class="btn-s" onclick="document.getElementById('analyzeError').classList.add('hidden')" style="padding:8px 16px;font-size:13px">キャンセル</button>
        </div>
      </div>`;
      errDiv.classList.remove('hidden');
    }
    return;
  }
  // 上書き時: 既存データを削除
  if(existingDup&&_dupOverwrite){
    RACES=RACES.filter(r=>r.id!==existingDup.id);
  }
  const errDiv2=document.getElementById('analyzeError');if(errDiv2)errDiv2.classList.add('hidden');
  const scored=score(parsed);
  const bet=genBet(scored,parsed.info);
  const v6data=computeV6(scored,parsed.info);
  const id=Date.now().toString();
  const venue=pVenue;
  const label=(pDate||'?')+' '+venue+' '+(pNum||'?')+'R '+(parsed.info.dist||'')+'m '+(parsed.info.surf||'');
  const sk=pDate?pDate.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999';
  const sortKey=sk+String(pNum||0).padStart(2,'0');
  const race={id,label,sortKey,info:parsed.info,scored,bet,v6:v6data,result:null,_scoreVer:'v6.0.0'};
  RACES.unshift(race);saveR(RACES);
  autoSaveAll();
  document.getElementById('raceIn').value='';
  CUR=id;showView('detail');
  }catch(e){alert('分析エラー: '+e.message+'\n'+e.stack)}
}

// === LIST ===
function renderList(){
  let needSave=false;
  RACES.forEach(r=>{
    if(r.info?.date&&r.sortKey){
      const correct=r.info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('')+String(r.info.raceNum||0).padStart(2,'0');
      if(r.sortKey!==correct){r.sortKey=correct;needSave=true}
    }
  });
  if(needSave)saveR(RACES);
  document.getElementById('countBadge').textContent='('+RACES.length+')';
  let h='';
  if(!RACES.length){h='<div style="text-align:center;padding:40px;color:var(--dim)">レースデータなし</div>';h+=`<div style="text-align:center;margin-top:12px"><button class="btn btn-b" onclick="triggerCSVImport()" style="padding:10px 28px;font-size:15px;background:var(--grn)">📂 検証データCSV取込</button></div>`;document.getElementById('vList').innerHTML=h;return}
  
  // 日付グループ化
  const sorted=[...RACES].sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  const groups={};
  sorted.forEach(r=>{const dt=r.info.date||'日付不明';if(!groups[dt])groups[dt]=[];groups[dt].push(r)});
  const padDate=d=>d.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('/');
  const dates=Object.keys(groups).sort((a,b)=>padDate(b).localeCompare(padDate(a)));
  const latestDate=dates[0]||'';
  const pastDates=dates.slice(1);
  
  // 通算収支（見送り・取込を除外）
  const allAnalyzed=RACES.filter(r=>r.result?.top3?.length>=3);
  const skipped=allAnalyzed.filter(r=>getHitInfo(r).skip).length;
  const done=allAnalyzed.filter(r=>!getHitInfo(r).skip);
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const totalBet=done.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
  const totalReturn=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const profit=totalReturn-totalBet;

  // 軸馬的中率（A馬が3着以内に入った率）
  let axisIn3=0,axisTotal=0;
  done.forEach(r=>{
    if(!r.bet?.best?.horses?.[0]||!r.result?.top3)return;
    axisTotal++;
    const anum=r.bet.best.horses[0].num;
    if(r.result.top3.map(Number).includes(anum))axisIn3++;
  });

  // スコア帯別的中率
  const scoreBands=[{label:'90-100',min:90,max:100},{label:'80-89',min:80,max:89},{label:'70-79',min:70,max:79}];
  const bandStats=scoreBands.map(b=>{
    const rs=done.filter(r=>r.scored?.[0]?.ns>=b.min&&r.scored?.[0]?.ns<=b.max);
    const h2=rs.filter(r=>getHitInfo(r).anyHit).length;
    return{label:b.label,total:rs.length,hit:h2,rate:rs.length>0?Math.round(h2/rs.length*100):0};
  });

  h+=`<div class="pnl" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-weight:700;font-size:13px">📊 通算収支</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px">
        <span>購入 <b>${done.length}</b>R</span>
        <span style="color:var(--lt)">見送り <b>${skipped}</b>R</span>
        <span style="color:var(--grn)">的中 <b>${hits}</b></span>
        ${fukHits>0?`<span style="color:var(--blu)">複勝的中 <b>${fukHits}</b></span>`:''}
        <span style="color:var(--red)">不的中 <b>${done.length-hits-fukHits}</b></span>
      </div>
    </div>`;
  if(done.length>0){
    h+=`<div style="display:flex;align-items:baseline;gap:16px;margin-top:8px;flex-wrap:wrap;border-top:1px solid var(--bdr);padding-top:8px">
      <div style="font-size:12px;color:var(--dim)">投資 <b>${totalBet.toLocaleString()}円</b></div>
      <div style="font-size:12px;color:var(--dim)">回収 <b>${totalReturn.toLocaleString()}円</b></div>
      <div style="font-size:18px;font-weight:900;color:${profit>=0?'var(--grn)':'var(--red)'}">${profit>=0?'+':''}${profit.toLocaleString()}円</div>
      <div style="font-size:12px;color:${totalReturn>=totalBet?'var(--grn)':'var(--red)'}">回収率 <b>${totalBet>0?Math.round(totalReturn/totalBet*100):0}%</b></div>
    </div>`;
    h+=`<div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)">
      <span>軸馬3着内率 <b>${axisTotal>0?Math.round(axisIn3/axisTotal*100):0}%</b>(${axisIn3}/${axisTotal})</span>
      ${bandStats.filter(b=>b.total>0).map(b=>`<span>ns${b.label}: <b>${b.rate}%</b>(${b.hit}/${b.total})</span>`).join('')}
    </div>`;
  }
  h+=`<div style="margin-top:8px;text-align:right"><button class="btn-s" onclick="downloadAllCSV()" style="padding:6px 16px">📥 全データCSV出力</button></div>`;
  h+=`</div>`;

  // 全日付を統一表示
  const showDates=[latestDate,...pastDates].filter(Boolean);
  
  showDates.forEach(dt=>{
    if(!dt||!groups[dt])return;
    const dayRaces=groups[dt];
    const dayDone=dayRaces.filter(r=>r.result?.top3?.length>=3&&!isPastOnly(r)&&!getHitInfo(r).skip);
    const dayHits=dayDone.filter(r=>getHitInfo(r).anyHit).length;
    const dayFuk=0;
    const dayInv=dayDone.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
    const dayRet=dayDone.reduce((s,r)=>s+getHitInfo(r).ret,0);
    const dayProfit=dayRet-dayInv;
    const dayRoi=dayInv>0?Math.round(dayRet/dayInv*100):0;
    const dayPending=dayRaces.length-dayDone.length;
    const dp=dt.split('/');
    let dow='';
    if(dp.length===3){const d=new Date(+dp[0],+dp[1]-1,+dp[2]);dow=['日','月','火','水','木','金','土'][d.getDay()]||''}
    
    const gid='dg_'+dt.replace(/\//g,'');
    h+=`<div style="margin-top:8px">`;
    h+=`<div onclick="document.getElementById('${gid}').classList.toggle('hidden')" style="cursor:pointer;padding:10px 14px;background:var(--ink);color:var(--p);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'Shippori Mincho',serif;font-size:16px;font-weight:900;color:var(--gld)">${dt}${dow?'（'+dow+'）':''}</span>
        <span style="font-size:12px">${dayRaces.length}R</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px">
        <span style="color:var(--grn)">✓${dayHits}</span>
        ${dayFuk>0?`<span style="color:var(--blu)">△${dayFuk}</span>`:''}
        <span style="color:var(--red)">✗${dayDone.length-dayHits-dayFuk}</span>
        ${dayPending>0?`<span style="color:var(--gld)">未${dayPending}</span>`:''}
        ${dayDone.length>0?`<span style="font-weight:700;color:${dayProfit>=0?'var(--grn)':'var(--red)'}">${dayProfit>=0?'+':''}${dayProfit.toLocaleString()}円</span>
        <span style="color:${dayRoi>=100?'var(--grn)':'var(--red)'}">回収率${dayRoi}%</span>`:''}
      </div>
    </div>`;
    
    // 最新日は展開、過去は折りたたみ
    h+=`<div id="${gid}"${dt===latestDate?'':' class="hidden"'}>`;
    dayRaces.forEach(r=>{
      const hasR=r.result?.top3?.length>=3;
      const hi=getHitInfo(r);
      const isSkip=hi.skip;
      const cls=hasR?(isSkip?'pend':hi.anyHit?'hit':'miss'):'pend';
      const betInfo=(!isSkip&&r.v6?.bet?.bets?.length>0)?r.v6.bet.bets.map(b=>b.kind+' '+b.desc).join(' ／ '):(!isSkip&&r.bet?.best)?r.bet.best.type+' '+r.bet.best.desc:'';
      const inv=hi.inv||0;
      let profitStr='';
      if(hasR&&!isSkip){const p=hi.ret-inv;profitStr=p>=0?`+${Math.round(p).toLocaleString()}円`:`${Math.round(p).toLocaleString()}円`}
      const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      const pastLabel=isPastOnly(r)?`<span style="font-size:10px;color:var(--gld);font-weight:700;background:rgba(184,134,11,.12);padding:1px 6px;border-radius:3px;margin-left:5px">取込</span>`:'';
      const v6t=r.v6?.raceType||'';const v6badge=v6t==='SOLID'?'<span style="font-size:10px;color:var(--blu);font-weight:700;background:rgba(26,68,136,.1);padding:1px 6px;border-radius:3px;margin-left:4px">鉄</span>':v6t==='WIDE'?'<span style="font-size:10px;color:var(--grn);font-weight:700;background:rgba(45,125,70,.1);padding:1px 6px;border-radius:3px;margin-left:4px">W</span>':v6t==='ANA'?'<span style="font-size:10px;color:var(--gld);font-weight:700;background:rgba(184,134,11,.1);padding:1px 6px;border-radius:3px;margin-left:4px">穴</span>':v6t==='UPSET'?'<span style="font-size:10px;color:var(--gld);font-weight:700;background:rgba(184,134,11,.1);padding:1px 6px;border-radius:3px;margin-left:4px">穴</span>':v6t==='SKIP'?'<span style="font-size:10px;color:var(--dim);font-weight:700;background:rgba(0,0,0,.05);padding:1px 6px;border-radius:3px;margin-left:4px">見</span>':'';

      h+=`<div class="card ${cls}" onclick="CUR='${r.id}';showView('detail')">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px"><span style="font-weight:900">${venue}</span> ${r.info.raceNum||'?'}R${pastLabel}${v6badge}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:1px">${r.info.dist||''}m ${r.info.surf||''}${r.info.cond?' / '+r.info.cond:''}${(!r.info.surf||!r.info.cond)?'<span style="color:var(--red);font-weight:700"> ⚠馬場未入力</span>':''}${betInfo?' ／ '+betInfo:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${isSkip?`<div style="font-size:11px;color:var(--lt);font-weight:700">見送り</div>`
          :hasR?`<div style="font-weight:900;font-size:12px;color:${hi.anyHit?'var(--grn)':'var(--red)'}">${hi.anyHit?'✓ '+hi.label:'✗'}</div>
          <div style="font-size:11px;font-weight:700;color:${hi.ret>=inv?'var(--grn)':'var(--red)'}">${profitStr}</div>`
          :`<div style="font-size:11px;color:var(--gld);font-weight:700">未入力</div>`}
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  
  if(showDates.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--dim)">データなし</div>`;
  }

  if(RACES.length>0){
    h+=`<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn-s" onclick="recalcAll()" style="padding:6px 20px;color:var(--blu)">🔄 全レース再分析</button>
      <button class="btn-s" onclick="downloadAllCSV()" style="padding:6px 20px">📥 全データCSV出力</button>
      <button class="btn-s" onclick="triggerCSVImport()" style="padding:6px 20px;color:var(--grn)">📂 CSV取込</button>
      <button class="btn-s" onclick="if(confirm('保存データを全て削除しますか？（元に戻せません）')){RACES=[];saveR(RACES);renderList()}" style="padding:6px 20px;color:var(--red)">🗑 全データ削除</button>
    </div>`;
  }
  document.getElementById('vList').innerHTML=h;
}

function recalcAll(){
  if(!confirm('全'+RACES.length+'レースを最新ロジックで再分析します。\n買い目・的中判定が変わります。結果データ（着順・払戻金）は保持されます。\n\n実行しますか？'))return;
  let count=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0)return;
    const race={horses:r.scored.map(h=>({
      num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
      rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
      jk:h.jk,imp:h.imp,sire:h.sire,trainer:h.trainer,bl:h.bl,prev:h.prev||[]
    })),info:r.info};
    try{
      const newScored=score(race);
      const newBet=genBet(newScored,r.info,r._marketOdds);
      r.scored=newScored;
      r.bet=newBet;
      r.v6=computeV6(newScored,r.info);
      if(r.result?.top3?.length>=3){
        const reasons=analyzeLoss(r,r.result.top3);
        r.result.reasons=reasons;
      }
      count++;
    }catch(e){console.error('再分析エラー:',r.label,e)}
  });
  saveR(RACES);
  renderList();
  alert(count+'レースを再分析しました。買い目・的中判定が最新ロジックに更新されました。');
}

// === 全データCSV出力（統一形式） ===
function downloadAllCSV(){
  const BOM='\uFEFF';
  const header=['日付','競馬場','レース番号','クラス','距離','コース','回り','馬場状態','頭数',
    '馬番','枠番','馬名','性齢','斤量','騎手名','馬体重','馬体重増減','ブリンカー',
    '前走日付','前走競馬場','前走レース格','前走距離','前走コース','前走馬場',
    '前走着順','前走頭数','前走着差','前走上がりタイム','前走間隔(週)',
    'スコア合計','補正スコア','補正値','印',
    '実際着順','3着以内','単勝オッズ','人気',
    '実際上がりタイム','実際通過順位',
    '統計スコア','統計期待率','人気の盲点'];
  const rows=[];
  const sorted=[...RACES].filter(r=>(r.scored?.length>0)||(r.result?.allResults?.length>0)).sort((a,b)=>{
    const ka=a.sortKey||a.id,kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0;
  });
  const marks=['◎','○','▲','△'];

  sorted.forEach(r=>{
    const inf=r.info||{};
    const venue=(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    const top3=r.result?.top3?.map(n=>+n)||[];
    const allRes=r.result?.allResults||[];
    // 馬データソース: scored（出馬表分析・一括取込）
    const horses=r.scored?.length>0?r.scored:[];
    if(horses.length===0)return;
    const headCount=horses.length;
    const isBulk=r.id?.startsWith('bulk_')||r.id?.startsWith('csv_');

    horses.forEach((h,idx)=>{
      const l=h.prev?.[0];
      // 前走間隔(週)
      let weeks='';
      if(l?.dateKey&&inf.date){
        const parts=inf.date.split('/');
        const today=new Date(+parts[0],+parts[1]-1,+parts[2]);
        const ly=Math.floor(l.dateKey/10000),lm=Math.floor((l.dateKey%10000)/100),ld=l.dateKey%100;
        const lastDay=new Date(ly,lm-1,ld);
        weeks=Math.round(Math.round((today-lastDay)/(1000*60*60*24))/7);
      }
      // 前走データ
      const prevDate=l?.dateKey?String(l.dateKey).replace(/(\d{4})(\d{2})(\d{2})/,'$1/$2/$3'):'';
      // 印（出馬表分析レースのみ）
      const mark=(!isBulk&&idx<4)?marks[idx]:'';
      // 結果データ
      const ar=allRes.find(a=>a.num===h.num);
      const actualRank=ar?.rank||h._resultRank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:'');
      const inTop3=top3.includes(h.num)?1:(actualRank&&actualRank<=3?1:0);
      const resLast3f=ar?.last3f||h._resultLast3f||'';
      const resPos=ar?.positions?ar.positions.join('-'):(h._resultPositions?h._resultPositions.join('-'):'');

      rows.push([
        inf.date||'',venue,inf.raceNum||'',inf.cls||'',
        inf.dist||'',inf.type||'',inf.dir||'',inf.cond||'',headCount,
        h.num,h.waku||'',h.name||'',(h.sex||'')+(h.age||''),h.imp||'',h.jk||'',
        h.wt||'',h.wc!=null?(h.wc>=0?'+':'')+h.wc:'',h.bl?'有':'',
        prevDate,l?.venue||'',l?.cls||'',l?.dist||'',
        l?.surface==='ダ'?'ダート':l?.surface==='芝'?'芝':(l?.surface||''),l?.cond||'',
        l?.fin||'',l?.run||'',l?.gap!=null?l.gap:'',l?.f3||'',weeks,
        h.ns||'',h.adjNs!=null?h.adjNs:'',h.adjDelta||0,mark,
        actualRank,top3.length>=3?inTop3:'',
        h.odds||ar?.popularity?'':'',ar?.popularity||h._resultPopularity||'',
        resLast3f,resPos,
        h.statNs!=null?h.statNs:'',h.statRate!=null?h.statRate.toFixed(1):'',h.isBlindSpot?'盲点':''
      ]);
    });
  });
  if(rows.length===0){alert('出力するデータがありません。\nRACES: '+RACES.length+'件');return}
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{const s=String(cell==null?'':cell);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='keiba_all_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  alert('全データCSV出力完了: '+rows.length+'行（'+sorted.length+'レース）');
}

// === 以下は旧CSV関数（互換性維持） ===
function downloadCSV(){
  const BOM='\uFEFF';
  const header=['日付','競馬場','レース','距離','コース','馬場','券種','買目','馬名','結果','1着','2着','3着','配当(100円あたり)','回収額','投資','利益','回収率','信頼度','軸馬EV','◎馬番','◎スコア','◎EV','○馬番','○スコア','○EV'];
  const rows=[];
  const sorted=[...RACES].filter(r=>!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')).sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  sorted.forEach(r=>{
    const hasR=r.result?.top3?.length>=3;
    const hi=hasR?getHitInfo(r):{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0};
    const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    const betType=r.bet?.best?.type||'';
    const betNums=r.bet?.best?.desc||'';
    const betNames=r.bet?.best?.horses?.map(h=>h.name).join('×')||'';
    const payout=r.result?.payout||0;
    const ret=hi.ret;
    const inv=hi.inv||0;
    const profit=ret-inv;
    const nameOf=n=>{const h=r.scored?.find(x=>x.num===+n);return h?h.name:''};
    const t1=hasR?r.result.top3[0]:'';
    const t2=hasR?r.result.top3[1]:'';
    const t3=hasR?r.result.top3[2]:'';
    rows.push([
      r.info.date||'',
      venue,
      (r.info.raceNum||'')+'R',
      (r.info.dist||'')+'m',
      r.info.surf||'',
      r.info.cond||'',
      betType,
      betNums,
      betNames,
      hi.skip?'見送り':hasR?hi.label:'未入力',
      hasR?t1+'番 '+nameOf(t1):'',
      hasR?t2+'番 '+nameOf(t2):'',
      hasR?t3+'番 '+nameOf(t3):'',
      hasR&&!hi.skip?payout:'',
      hi.skip?'':hasR?ret:'',
      hi.skip?'':inv,
      hi.skip?'':hasR?profit:'',
      hi.skip?'':hasR&&inv>0?Math.round(ret/inv*100)+'%':'',
      r.bet?.confidence||'',
      r.bet?.best?.ev||r.scored?.[0]?.ev||'',
      r.scored?.[0]?.num||'',r.scored?.[0]?.ns||'',r.scored?.[0]?.ev||'',
      r.scored?.[1]?.num||'',r.scored?.[1]?.ns||'',r.scored?.[1]?.ev||''
    ]);
  });
  // 合計行
  const done=RACES.filter(r=>r.result?.top3?.length>=3&&!getHitInfo(r).skip);
  const totalBet=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const totalRet=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  rows.push([]);
  rows.push(['合計','','','','','','','','','',
    '','','','',totalRet,totalBet,totalRet-totalBet,totalBet>0?Math.round(totalRet/totalBet*100)+'%':'','','','','','','','','']);
  
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{
    const s=String(cell==null?'':cell);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='keiba_results_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}
