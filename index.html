  const r=RACES.find(x=>x.id===raceId);if(!r)return;
  if(!r._oddsInput)r._oddsInput={};
  const key=inputEl.dataset.oddsKey;
  const val=inputEl.value.trim();
  r._oddsInput[key]=val;
  saveR(RACES);
  // 乖離率・判定を即座に更新
  const tk=r.bet?.tickets?.find(t=>{const nums=t.horses.map(x=>x.num);return t.type+'_'+nums.join('-')===key});
  if(tk){
    const actual=parseFloat(val)||0;
    const theo=tk.est||0;
    const ratio=actual>0&&theo>0?Math.round(actual/theo*100):0;
    const judge=ratio===0?'-':ratio>=120?'★ 割安':ratio>=80?'適正':'割高';
    const judgeCol=ratio===0?'var(--dim)':ratio>=120?'var(--grn)':ratio>=80?'var(--dim)':'var(--red)';
    const ratioEl=document.querySelector(`[data-ratio="${key}"]`);
    const judgeEl=document.querySelector(`[data-judge="${key}"]`);
    if(ratioEl)ratioEl.textContent=ratio>0?ratio+'%':'-';
    if(judgeEl){judgeEl.textContent=judge;judgeEl.style.color=judgeCol}
  }
}

function showSyncStatus(msg,type){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.innerHTML=`<div class="sync-status sync-${type}">${msg}</div>`;
}

async function doGhSave(){
  const token=document.getElementById('ghTokenInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  setGhToken(token);
  // 空データの上書き防止
  if(RACES.length===0&&Object.keys(HORSE_STORE).length===0){
    showSyncStatus('❌ ローカルにデータがありません。空データでGitHubを上書きすることはできません。','err');return;
  }
  // リモートにデータが存在する場合、ローカルの方が少なければ警告
  const btn=document.getElementById('syncSaveBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  try{
    const rExist=await ghGet('data/races.json',token);
    const hExist=await ghGet('data/horse_store.json',token);
    if(rExist){
      try{
        const remote=JSON.parse(decodeURIComponent(escape(atob(rExist.content.replace(/\n/g,'')))));
        if(remote.length>0&&RACES.length<remote.length){
          if(!confirm(`⚠️ GitHubにはレース${remote.length}件ありますが、ローカルは${RACES.length}件です。\nデータが減ります。本当に上書きしますか？`)){
            btn.disabled=false;btn.textContent='📤 GitHubに保存';return;
          }
        }
      }catch{}
    }
    btn.textContent='⏳ 保存中...';
    showSyncStatus('GitHubにアップロード中...','info');
    await ghPut('data/races.json',JSON.stringify(RACES),token,rExist?.sha);
    await ghPut('data/horse_store.json',JSON.stringify(HORSE_STORE),token,hExist?.sha);
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 保存完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭<br><span class="sync-time">保存日時: ${now}</span>`,'ok');
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📤 GitHubに保存';
  }
}

async function doGhLoad(){
  const token=document.getElementById('ghTokenInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  setGhToken(token);
  const btn=document.getElementById('syncLoadBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  showSyncStatus('GitHubのデータを確認中...','info');
  try{
    const [rFile,hFile]=await Promise.all([
      ghGet('data/races.json',token),
      ghGet('data/horse_store.json',token)
    ]);
    if(!rFile)throw new Error('データが見つかりません。先にGitHubに保存してください。');
    const remoteRaces=JSON.parse(decodeURIComponent(escape(atob(rFile.content.replace(/\n/g,'')))));
    const remoteHorses=hFile?JSON.parse(decodeURIComponent(escape(atob(hFile.content.replace(/\n/g,''))))):{};
    if(remoteRaces.length===0&&Object.keys(remoteHorses).length===0){
      throw new Error('GitHubのデータが空です（レース0件、馬DB0頭）。先にデータがある状態で保存してください。');
    }
    if(!confirm(`GitHubのデータで上書きします。\n\nリモート: レース${remoteRaces.length}件, 馬DB${Object.keys(remoteHorses).length}頭\nローカル: レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭\n\n実行しますか？`))
    {btn.disabled=false;btn.textContent='📥 GitHubから復元';return}
    btn.textContent='⏳ 読込中...';
    RACES=remoteRaces;
    saveR(RACES);
    HORSE_STORE=remoteHorses;
    saveHorseStore(HORSE_STORE);
    HORSE_DB=buildHorseDB();
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 復元完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭`,'ok');
    updateCountBadge();
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📥 GitHubから復元';
  }
}

// Init
(async()=>{
  // 1. ファイルストレージ自動復元
  const fsOk=await initFileStorage();
  if(fsOk)console.log('ファイルストレージ接続済み');
  // 2. GitHub自動復元（ローカルが空の場合のみ）
  const ghRestored=await autoRestoreFromGithub();
  if(ghRestored){
    const banner=document.createElement('div');
    banner.style.cssText='position:fixed;top:0;left:0;right:0;background:var(--grn);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;z-index:9999;';
    banner.textContent='✅ GitHubからデータを自動復元しました（'+RACES.length+'レース）';
    document.body.prepend(banner);setTimeout(()=>banner.remove(),4000);
  }
  // 3. 起動時に全レースをv2スコアリングで再計算（バージョンフラグで制御）
  const SCORE_VER='v2.5.0';
  HORSE_DB=buildHorseDB();
  let rescored=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0||r.id?.startsWith('bulk_')||r.id?.startsWith('csv_'))return;
    if(r._scoreVer===SCORE_VER)return; // 既に最新バージョンで計算済み
    try{
      const race={horses:r.scored.map(h=>({
        num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
        rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
        jk:h.jk,jkDiscount:h.jkDiscount,imp:h.imp,sire:h.sire,bms:h.bms,trainer:h.trainer,bl:h.bl,prev:h.prev||[],prize:h.prize
      })),info:r.info};
      const oldTop=r.scored[0]?.ns||0;
      r.scored=score(race);
      r.bet=genBet(r.scored,r.info,r._marketOdds);
      r._scoreVer=SCORE_VER;
      const newTop=r.scored[0]?.ns||0;
      if(rescored===0)console.log('再スコア例: '+r.label+' 旧top='+oldTop+' → 新top='+newTop+' EV='+r.scored[0]?.ev);
      rescored++;
    }catch(e){console.warn('再スコア失敗:',r.label,e)}
  });
  if(rescored>0){saveR(RACES);console.log(rescored+'レースをSCORE_VER='+SCORE_VER+'で再スコアリング完了')}
  // snapshotの遡及生成
  RACES.forEach(r=>{
    if(r.result?.top3?.length>=3&&r.scored?.length>0&&!r.result.analysisSnapshot&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!isPastOnly(r)){
      try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){}
    }
  });
  updateCountBadge();
  showView('input');
})();
</script>
