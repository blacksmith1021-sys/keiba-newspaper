<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#f5f0e6;--p2:#ede8d8;--p3:#e5dfc8;--ink:#1a1410;--dim:#7a7060;--lt:#a09888;--red:#c41e3a;--grn:#2d6a30;--blu:#1a4488;--gld:#b8860b;--bdr:#c8c0a8;--bdt:#8a8068;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;background:#d8d0b8;color:var(--ink);min-height:100vh;min-height:100dvh;padding-bottom:var(--safe-bottom);overscroll-behavior-y:contain}
/* Header - sticky on mobile */
.hd{background:var(--p);border-bottom:4px double var(--bdt);text-align:center;padding:calc(var(--safe-top) + 8px) 16px 8px;position:sticky;top:0;z-index:100}
.hd::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
.hd h1{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:800;letter-spacing:4px}
.hd-date{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:2px}
.hd-ver{font-size:9px;color:var(--lt);letter-spacing:1px;margin-top:2px}
/* Nav - bottom fixed tab bar on mobile */
.nav{display:flex;gap:0;justify-content:center;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--p);border-top:2px solid var(--bdt);padding-bottom:var(--safe-bottom)}
.nav button{flex:1;padding:12px 4px;background:var(--p);border:none;border-top:3px solid transparent;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;color:var(--dim);letter-spacing:0;transition:background .15s;touch-action:manipulation}
.nav button.on{background:var(--p2);color:var(--ink);border-top-color:var(--gld)}
.nav button:active{opacity:.7}
.ct{max-width:900px;margin:0 auto;padding:8px;padding-bottom:calc(60px + var(--safe-bottom))}
/* Panels */
.pnl{background:var(--p);border:2px solid var(--bdt);padding:12px;margin-bottom:8px;border-radius:4px}
.pnl h3{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.pnl h3.r{color:var(--red)}.pnl h3.g{color:var(--grn)}.pnl h3.b{color:var(--blu)}
/* Inputs - larger touch targets */
textarea{width:100%;background:var(--p2);border:1px solid var(--bdr);padding:12px;font-size:14px;line-height:1.7;font-family:monospace;color:var(--ink);resize:vertical;border-radius:4px;min-height:120px}
textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(196,30,58,.15)}
input[type="number"]{font-size:16px;padding:8px;border-radius:4px;border:1px solid var(--bdr);background:var(--p2)}
input[type="number"]:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 2px rgba(26,68,136,.15)}
/* Buttons - larger for touch */
.btn{padding:12px 24px;border:none;border-radius:6px;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;touch-action:manipulation;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-r{background:var(--red);color:#fff}
.btn-b{background:var(--blu);color:#fff}
.btn-s{background:var(--p);color:var(--ink);font-size:13px;padding:8px 16px;border:1px solid var(--bdr);border-radius:4px;touch-action:manipulation}
.btn-s:active{background:var(--p3)}
/* Horse rows */
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--bdr);flex-wrap:wrap;min-height:44px}
.wk{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.sc{font-weight:900;font-size:18px;color:var(--red);margin-left:auto;min-width:36px;text-align:right}
/* Tags */
.tag{display:inline-block;padding:3px 7px;font-size:11px;font-weight:700;border-radius:3px;margin:2px 1px}
.tag-g{background:rgba(45,106,48,.12);color:var(--grn)}.tag-n{background:rgba(184,134,11,.12);color:var(--gld)}.tag-b{background:rgba(196,30,58,.12);color:var(--red)}
/* Jockey aptitude popup */
.jk-apt-trigger{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
#jkAptPopup{position:fixed;background:var(--p);border:1px solid var(--bdr);border-radius:8px;padding:12px 16px;font-size:12px;z-index:200;min-width:220px;max-width:320px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* Cards - larger touch targets */
.card{background:var(--p);border:2px solid var(--bdt);padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:6px;min-height:52px;touch-action:manipulation;transition:background .1s}
.card:active{background:var(--p3)}
.card.hit{border-color:var(--grn);border-left:5px solid var(--grn)}.card.miss{border-color:var(--red);border-left:5px solid var(--red)}.card.pend{border-color:var(--gld);border-left:5px solid var(--gld)}
/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--p2);border:1px solid var(--bdr);padding:10px 6px;text-align:center;border-radius:4px}
.stat .v{font-size:20px;font-weight:900}.stat .l{font-size:10px;color:var(--dim)}
/* Bet */
.bet-box{background:rgba(45,106,48,.06);border:2px solid var(--grn);padding:14px;border-radius:6px}
.bet-nums{font-family:'Shippori Mincho',serif;font-size:28px;font-weight:900;letter-spacing:4px}
.exc{background:var(--p3);border:1px dashed var(--bdr);padding:8px 12px;opacity:.6;font-size:12px;margin-bottom:8px;border-radius:4px}
.res-preview{background:rgba(26,68,136,.06);border:1px solid var(--blu);padding:10px 12px;margin:8px 0;font-size:13px;border-radius:4px}
.reasons{background:rgba(196,30,58,.06);border:1px solid var(--red);padding:12px 14px;margin-top:8px;border-radius:4px}
.reasons h4{font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px}
.trend-bar{width:60px;height:8px;background:var(--bdr);border-radius:4px;display:inline-block;vertical-align:middle}
.trend-fill{height:100%;background:var(--red);border-radius:4px}
.hidden{display:none}
/* Sync */
.sync-url{width:100%;padding:10px;font-size:13px;border:1px solid var(--bdr);background:var(--p2);border-radius:4px;font-family:monospace;color:var(--ink)}
.sync-url:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 2px rgba(26,68,136,.15)}
.sync-status{padding:10px;border-radius:4px;font-size:13px;margin-top:8px;line-height:1.6}
.sync-ok{background:rgba(45,106,48,.08);border:1px solid var(--grn);color:var(--grn)}
.sync-err{background:rgba(196,30,58,.08);border:1px solid var(--red);color:var(--red)}
.sync-info{background:rgba(26,68,136,.08);border:1px solid var(--blu);color:var(--blu)}
.sync-time{font-size:11px;color:var(--lt);margin-top:4px}
.fs-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;vertical-align:middle;margin-left:6px}
.fs-on{background:rgba(45,106,48,.15);color:var(--grn);border:1px solid var(--grn)}
.fs-off{background:rgba(196,30,58,.1);color:var(--lt);border:1px solid var(--bdr)}
/* Desktop */
@media(min-width:601px){
  .hd h1{font-size:26px;letter-spacing:5px}
  .hd{padding:12px 16px}
  .nav{position:sticky;top:52px;bottom:auto;border-top:none;border-bottom:2px solid var(--bdt);padding-bottom:0}
  .ct{padding:10px;padding-bottom:20px}
  .nav button{padding:8px 18px;font-size:12px}
  .row{gap:8px}
}
/* Small phone */
@media(max-width:380px){
  .hd h1{font-size:18px;letter-spacing:2px}
  .nav button{font-size:10px;padding:7px 2px}
  .tag{font-size:9px;padding:2px 4px}
  .sc{font-size:16px}
  .bet-nums{font-size:24px}
  .stat .v{font-size:16px}
}
</style>

<body>

<script>
// ===== 人気→推定オッズ変���テーブル（12,376レコードの統計に基づく）=====
const POP_TO_ODDS={1:2.8,2:5.0,3:7.5,4:11.0,5:16.0,6:22.0,7:32.0,8:45.0,9:60.0,10:80.0,11:110.0,12:150.0};
// 人気または実オッズから推定オッズを返す
function estimateOdds(horse){
  if(horse.odds&&horse.odds>0)return horse.odds;
  if(horse._resultOdds&&horse._resultOdds>0)return horse._resultOdds;
  const pop=horse.pop||horse._resultPopularity;
  if(pop&&POP_TO_ODDS[pop])return POP_TO_ODDS[pop];
  return 0;
}
// 人気→推定3着以内確率���12,376レコード統計）
const POP_TO_W3PROB={1:0.685,2:0.529,3:0.434,4:0.341,5:0.259,6:0.213,7:0.146,8:0.113,9:0.093,10:0.075,11:0.048,12:0.042};
function estimateW3Prob(horse){
  const pop=horse.pop||horse._resultPopularity;
  if(pop&&POP_TO_W3PROB[pop])return POP_TO_W3PROB[pop];
  // オッズから逆算（簡易）
  const odds=estimateOdds(horse);
  if(odds>0)return Math.min(0.85,1/odds*0.85);
  return 0.15; // デフォルト
}

// ===== 統計ユーティリティ =====
const BAYES_PRIOR_K=40; // ベイズ推定の事前サンプルサイズ（調整可能）

// ウィルソン信頼区間（95%）
function wilsonCI(successes,total){
  if(total===0)return{lo:0,hi:0};
  const z=1.96,p=successes/total,n=total;
  const denom=1+z*z/n;
  const center=(p+z*z/(2*n))/denom;
  const margin=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/denom;
  return{lo:Math.max(0,center-margin),hi:Math.min(1,center+margin)};
}
// ベイズ推定（ベータ分布事前）
function bayesEstimate(successes,total,priorMean){
  const alpha=priorMean*BAYES_PRIOR_K;
  const beta=(1-priorMean)*BAYES_PRIOR_K;
  return(successes+alpha)/(total+alpha+beta);
}

// ===== STORAGE (File System Access API + localStorage fallback) =====
const SK='keiba-races-v2';
const HK='keiba-horsedb-v1';
const SETTINGS_KEY='keiba-settings-v1';

// --- File System Access API ---
let _dirHandle=null; // 保存先フォルダのハンドル
const HAS_FS=!!window.showDirectoryPicker;

async function _fsWrite(name,data){
  if(!_dirHandle)return false;
  try{
    const fh=await _dirHandle.getFileHandle(name,{create:true});
    const wr=await fh.createWritable();
    await wr.write(data);
    await wr.close();
    return true;
  }catch(e){console.error('FS write error:',name,e);return false}
}
async function _fsRead(name){
  if(!_dirHandle)return null;
  try{
    const fh=await _dirHandle.getFileHandle(name);
    const f=await fh.getFile();
    return await f.text();
  }catch{return null}
}

// フォルダ選択＆権限チェック
async function connectFolder(){
  try{
    _dirHandle=await window.showDirectoryPicker({id:'keiba-data',mode:'readwrite',startIn:'documents'});
    // IndexedDBにハンドルを永続化
    await _idbSave('dirHandle',_dirHandle);
    return true;
  }catch(e){
    if(e.name!=='AbortError')console.error('Folder pick error:',e);
    return false;
  }
}
// 起動時にIndexedDBからハンドルを復元
async function restoreFolder(){
  try{
    const h=await _idbLoad('dirHandle');
    if(!h)return false;
    // 権限確認
    if(await h.queryPermission({mode:'readwrite'})==='granted'){
      _dirHandle=h;return true;
    }
    // 権限再要求（ユーザー操作が必要な場合がある）
    if(await h.requestPermission({mode:'readwrite'})==='granted'){
      _dirHandle=h;return true;
    }
    return false;
  }catch{return false}
}

// --- IndexedDB (ハンドル永続化用: keiba-fs) ---
function _idbOpen(){
  return new Promise((ok,ng)=>{
    const req=indexedDB.open('keiba-fs',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('kv');
    req.onsuccess=()=>ok(req.result);
    req.onerror=()=>ng(req.error);
  });
}
async function _idbSave(k,v){
  const db=await _idbOpen();
  return new Promise((ok,ng)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v,k);
    tx.oncomplete=()=>ok();tx.onerror=()=>ng(tx.error);
  });
}
async function _idbLoad(k){
  const db=await _idbOpen();
  return new Promise((ok,ng)=>{
    const tx=db.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(k);
    req.onsuccess=()=>ok(req.result);req.onerror=()=>ng(req.error);
  });
}

// --- IndexedDB メインデータストア (keiba-newspaper) ---
const APP_VERSION='2.8.0';
const DATA_SCHEMA_VERSION=1;
let _mainDb=null;

// マイグレーション定義（将来のスキーマ変更に対応）
const MIGRATIONS={
  // version 1→2 の例:
  // 2: async(db)=>{ /* 新フィールド追加等 */ }
};
async function runMigrations(fromVer,toVer){
  for(let v=fromVer+1;v<=toVer;v++){
    if(MIGRATIONS[v]){
      console.log('マイグレーション実行: v'+v);
      try{const db=await _mainDbOpen();await MIGRATIONS[v](db)}catch(e){console.error('マイグレーション失敗: v'+v,e)}
    }
  }
  await _dbPut('meta','schemaVersion',{version:toVer,date:new Date().toISOString()});
}

function _mainDbOpen(){
  if(_mainDb)return Promise.resolve(_mainDb);
  return new Promise((ok,ng)=>{
    const req=indexedDB.open('keiba-newspaper',DATA_SCHEMA_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('races'))db.createObjectStore('races');
      if(!db.objectStoreNames.contains('horsedb'))db.createObjectStore('horsedb');
      if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings');
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');
    };
    req.onsuccess=()=>{_mainDb=req.result;ok(_mainDb)};
    req.onerror=()=>ng(req.error);
  });
}
async function _dbPut(store,key,value){
  try{
    const db=await _mainDbOpen();
    return new Promise((ok,ng)=>{
      const tx=db.transaction(store,'readwrite');
      tx.objectStore(store).put(value,key);
      tx.oncomplete=()=>ok(true);tx.onerror=()=>{console.error('IDB put error:',tx.error);ok(false)};
    });
  }catch(e){console.error('IDB put error:',e);return false}
}
async function _dbGet(store,key){
  try{
    const db=await _mainDbOpen();
    return new Promise((ok,ng)=>{
      const tx=db.transaction(store,'readonly');
      const req=tx.objectStore(store).get(key);
      req.onsuccess=()=>ok(req.result);req.onerror=()=>{console.error('IDB get error:',req.error);ok(null)};
    });
  }catch(e){console.error('IDB get error:',e);return null}
}

// IndexedDBへの非同期バックグラウンド保存（デバウンス付き）
let _dbSaveTimer=null;
function _scheduleDbSave(){
  if(_dbSaveTimer)clearTimeout(_dbSaveTimer);
  _dbSaveTimer=setTimeout(async()=>{
    try{
      await _dbPut('races','all',RACES);
      await _dbPut('horsedb','all',HORSE_STORE);
      await _dbPut('settings','all',loadSettings());
      await _dbPut('meta','lastSave',{date:new Date().toISOString(),raceCount:RACES.length,horseCount:Object.keys(HORSE_STORE).length});
    }catch(e){console.warn('IDB background save error:',e)}
  },500);
}

// 起動時: IndexedDBからデータを復元し、localStorageより件数が多ければ採用
async function _loadFromIdb(){
  try{
    const idbRaces=await _dbGet('races','all');
    const idbHorses=await _dbGet('horsedb','all');
    const idbSettings=await _dbGet('settings','all');
    let restored=false;
    if(idbRaces&&Array.isArray(idbRaces)&&idbRaces.length>RACES.length){
      RACES=idbRaces;
      try{localStorage.setItem(SK,JSON.stringify(RACES))}catch{}
      restored=true;
      console.log('IndexedDBからレース復元:',RACES.length,'件');
    }
    if(idbHorses&&typeof idbHorses==='object'&&Object.keys(idbHorses).length>Object.keys(HORSE_STORE).length){
      HORSE_STORE=idbHorses;
      try{localStorage.setItem(HK,JSON.stringify(HORSE_STORE))}catch{}
      restored=true;
      console.log('IndexedDBから馬DB復元:',Object.keys(HORSE_STORE).length,'頭');
    }
    if(idbSettings&&typeof idbSettings==='object'){
      try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(idbSettings))}catch{}
    }
    // localStorageのデータをIndexedDBにも保存（初回マイグレーション）
    const meta=await _dbGet('meta','migrationDone');
    if(!meta){
      await _dbPut('races','all',RACES);
      await _dbPut('horsedb','all',HORSE_STORE);
      await _dbPut('settings','all',loadSettings());
      await _dbPut('meta','migrationDone',{done:true,date:new Date().toISOString(),raceCount:RACES.length});
      await _dbPut('meta','schemaVersion',{version:DATA_SCHEMA_VERSION,date:new Date().toISOString()});
      console.log('localStorage→IndexedDB初回マイグレーション完了');
    }else{
      // スキーマバージョンチェック＆マイグレーション
      const sv=await _dbGet('meta','schemaVersion');
      const currentVer=sv?.version||1;
      if(currentVer<DATA_SCHEMA_VERSION){
        await runMigrations(currentVer,DATA_SCHEMA_VERSION);
        console.log('スキーママイグレーション完了: v'+currentVer+'→v'+DATA_SCHEMA_VERSION);
      }
    }
    // アプリバージョンを記録
    await _dbPut('meta','appVersion',{version:APP_VERSION,date:new Date().toISOString()});
    return restored;
  }catch(e){console.warn('IDB load error:',e);return false}
}

// --- 統合ストレージ (FS優先、localStorage併用) ---
// 書き込みキュー（高頻度の保存をバッチ化）
let _writeQueue={};
let _writeTimer=null;
function _scheduleWrite(name,data){
  _writeQueue[name]=data;
  if(!_writeTimer){
    _writeTimer=setTimeout(async()=>{
      const q={..._writeQueue};_writeQueue={};_writeTimer=null;
      for(const[n,d]of Object.entries(q)){
        await _fsWrite(n,d);
      }
    },300);
  }
}

function loadR(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch{return[]}}
function saveR(r){
  r.sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  const json=JSON.stringify(r);
  try{localStorage.setItem(SK,json)}catch(e){

// ===== 蓄積馬データベース =====
function buildHorseDB(){
  const db={};
  // ソース1: allResults から構築（scored から jk・trainer を補完）
  RACES.forEach(r=>{
    if(!r.result?.allResults)return;
    const inf=r.info||{};
    r.result.allResults.forEach(ar=>{
      const name=ar.name;if(!name)return;
      if(!db[name])db[name]=[];
      const scoredHorse=r.scored?.find(h=>h.num===ar.num);
      db[name].push({
        date:inf.date||'',
        venue:(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
        dist:inf.dist||0,
        surface:inf.type||'',
        cond:inf.cond||'',
        rank:ar.rank,
        runners:r.result.allResults.length,
        time:ar.time||'',
        last3f:ar.last3f||0,
        positions:ar.positions||null,
        jockey:ar.jockey||scoredHorse?.jk||'',
        trainer:ar.trainer||scoredHorse?.trainer||'',
        bodyWeight:ar.bodyWeight||''
      });
    });
  });
  // ソース2: HORSE_STORE（一括取り込み分）
  Object.entries(HORSE_STORE).forEach(([name,runs])=>{
    if(!db[name])db[name]=[];
    runs.forEach(r=>{
      const dup=db[name].some(x=>x.date===r.date&&x.rank===r.rank&&x.dist===r.dist);
      if(!dup)db[name].push(r);
    });
  });
  // ソ���ス3: scored のみのレース（allResults なし）から構築
  RACES.forEach(r=>{
    if(r.result?.allResults?.length>0)return;
    if(!r.result?.top3?.length)return;
    const inf=r.info||{};
    const top3=r.result.top3.map(n=>+n);
    (r.scored||[]).forEach(h=>{
      if(!h.name)return;
      const rank=h._resultRank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:null);
      if(!rank)return;
      if(!db[h.name])db[h.name]=[];
      const dup=db[h.name].some(x=>x.date===(inf.date||'')&&x.rank===rank);
      if(!dup){
        db[h.name].push({
          date:inf.date||'',
          venue:(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
          dist:inf.dist||0,
          surface:inf.type||'',
          cond:inf.cond||'',
          rank,
          runners:r.scored.length,
          jockey:h.jk||'',
          trainer:h.trainer||'',
          last3f:h._resultLast3f||0,
          bodyWeight:''
        });
      }
    });
  });
  Object.values(db).forEach(arr=>arr.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));
  return db;
}

  let match=0;

  const surf=raceInfo?.type||'';const prevSurf=l.surface==='ダ'?'ダート':l.surface==='芝'?'芝':'';

  if(match>=3)return '<span style="background:#E1F5EE;color:#0F6E56;font-size:10px;padding:2px 6px;border-radius:3px;margin-left:4px;font-weight:700">同条件</span>';

function getJockeyAptPopup(jkName,raceInfo){
  const jkNorm=(jkName||'').replace(/[\s　]+/g,'');

  const apt=JOCKEY_APTITUDE[jkName]||JOCKEY_APTITUDE[jkNorm];

  const venue=(raceInfo?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');

  const distCat=dist<=1400?'短距離':dist<=1800?'マイル':dist<=2200?'中距離':'長距離';

  const vGrade=apt.venue?.[venue];

  return{apt,venue:vGrade,course:cGrade,dist:dGrade,venueName:venue,surfName:surf,distName:distCat};

function parse(t){const r={info:{},horses:[]};let m;m=t.match(/(\d{4})年(\d{1,2})月(\d{1,2})日[（(](.+?)[)）]/);if(m)r.info.date=`${m[1]}/${m[2]}/${m[3]}`;m=t.match(/(\d+回\S+\d+日)/);if(m)r.info.course=m[1];m=t.match(/(\d+)レース/);if(m)r.info.raceNum=m[1];m=t.match(/(3歳未勝利|3歳新馬|4歳以上\S+|[^\n]*(?:オープン|リステッド|G[ⅠⅡⅢ123]))/);if(m)r.info.cls=m[1];m=t.match(/コース：([\d,]+)メートル[（(](.+?)[)）]/);if(m){r.info.dist=parseInt(m[1].replace(',',''));r.info.surf=m[2];r.info.dir=m[2].includes('左')?'左':m[2].includes('右')?'右':null}m=t.match(/(芝|ダート)\s+(良|稍重|重|不良)/);if(m){r.info.type=m[1];r.info.cond=m[2]}
// コース方向フォールバック：競馬場名から自動判定
if(!r.info.dir){const vn=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');if(LEFT_VENUES.some(v=>vn.includes(v)))r.info.dir='左';else if(RIGHT_VENUES.some(v=>vn.includes(v)))r.info.dir='右'}
const secs=t.split(/(?=枠\d)/);for(const sec of secs){if(!sec.startsWith('枠'))continue;const h={};m=sec.match(/枠(\d+)/);if(m)h.waku=+m[1];m=sec.match(/枠\d+\S*\s+(\d+)/);if(m)h.num=+m[1];h.bl=/ブリンカー着用/.test(sec);const L=sec.split('\n').map(l=>l.trim()).filter(Boolean);
// 馬名検出（カタカナ3文字以上、英字混在も許容）
for(let i=0;i<Math.min(L.length,8);i++){
  const ln=L[i];
  // 「枠」「ブリンカー」「番人気」「kg」「父：」「母：」「勝負服」を除外
  if(ln.match(/^枠|ブリンカー|番人気|^\(|^父：|^母：|勝負服|kg$|^\d+\.\d|万円$|^[\d.]+$/))continue;
  // カタカナ3文字以上を含む行（英字混在OK）
  if(ln.match(/[ァ-ヶー]{3,}/)&&!ln.match(/クラス|コース|メートル|レース|未勝利|新馬|オープン|指定|定量|馬齢|牝|牡|せん/)){
    h.name=ln.replace(/\t.*$/,'').trim();break;
  }
}
// フォールバック：数字の次の行
if(!h.name)for(let i=0;i<L.length;i++){if(/^\d+$/.test(L[i])&&i+1<L.length){let nx=L[i+1];if(nx&&!nx.match(/^[\d.(]/)&&nx!=='ブリンカー着用'){h.name=nx.replace(/\t.*$/,'').trim();break}if(nx==='ブリンカー着用'&&i+2<L.length){h.name=L[i+2].replace(/\t.*$/,'').trim();break}}}
m=sec.match(/([\d.]+)\s*\n\s*\((\d+)番人気\)/);if(m){/* オッズ・人気は出馬表からは取得しない（結果入力時に記録） */}m=sec.match(/\((\d+\.\d+\.\d+\.\d+)\)/);if(m){const p=m[1].split('.');h.rec={w:+p[0],s:+p[1],t:+p[2],o:+p[3]};h.starts=+p[0]+ +p[1]+ +p[2]+ +p[3]}m=sec.match(/(\d{3,})kg\s*\(([+\-\d初出走]+)\)/);if(m){h.wt=+m[1];h.wc=m[2]==='初出走'?null:parseInt(m[2])}m=sec.match(/(牡|牝|せん)(\d)/);if(m){h.sex=m[1];h.age=+m[2]}
for(let i=0;i<L.length;i++){if(/^\d+\.\dkg$/.test(L[i])){for(let j=i+1;j<L.length;j++){const c=L[j];if(c&&!c.match(/^\d{4}年/)&&!c.match(/^父/)&&!c.match(/^母/)&&c.length<20&&(c.match(/[◇△▲★☆◆]/)||c.match(/[一-龥]{1,4}\s/)||c.match(/[ぁ-ん]/))){const dm=c.match(/^([◆◇])/);h.jkDiscount=dm?dm[1]:null;h.jk=c.replace(/[◇△▲★☆◆]/g,'').trim();h.imp=parseFloat(L[i]);break}}break}}
m=sec.match(/父：(.+)/);if(m)h.sire=m[1].trim();m=sec.match(/母の父：(.+)/);if(m)h.bms=m[1].trim();if(!h.bms){m=sec.match(/母父[:：]\s*(.+)/);if(m)h.bms=m[1].trim()}m=sec.match(/([^\n]+)\((美浦|栗東)\)/);if(m)h.trainer=m[1].trim();
// 総賞金（馬ごとのsec内から取得）
m=sec.match(/([0-9,]+)\s*万円/);if(m){const pv=parseInt(m[1].replace(/,/g,''));if(pv>0&&pv<100000)h.prize=pv}
h.prev=[];const pp=/(\d{4})年(\d{1,2})月(\d{1,2})日\s+(\S+)\s*\n\s*([^\n]+)\s*\n\s*(\d+)着\s+(\d+)頭/g;let pm;while((pm=pp.exec(sec))!==null){const pr={fin:+pm[6],run:+pm[7],dateKey:pm[1]*10000+ +pm[2]*100+ +pm[3],venue:pm[4],cls:pm[5]};const af=sec.substring(pm.index+pm[0].length);let x=af.match(/3F\s+([\d.]+)/);if(x)pr.f3=parseFloat(x[1]);x=af.match(/(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s*\n?\s*3F/);if(x)pr.pos=[+x[1],+x[2],+x[3],+x[4]];x=af.match(/(\d{4})(芝|ダ)/);if(x){pr.dist=+x[1];pr.surface=x[2]}
// 前走馬場状態
x=af.match(/(良|稍重|重|不良)/);if(x)pr.cond=x[1];
// 前走斤量・騎手
const wLines=af.split('\n').map(l=>l.trim()).filter(Boolean);
for(let wi=0;wi<wLines.length;wi++){if(wLines[wi].match(/^\d{2}\.\d$/)){pr.weight=parseFloat(wLines[wi]);if(wi+1<wLines.length){const jl=wLines[wi+1];if(jl&&jl.match(/^[一-龥ぁ-ん]/)&&jl.length<15)pr.jockey=jl.replace(/[◆◇△▲★☆]/g,'').trim()}break}}
// 前走の回り方向
if(LEFT_VENUES.some(v=>(pr.venue||'').includes(v)))pr.dir='左';else if(RIGHT_VENUES.some(v=>(pr.venue||'').includes(v)))pr.dir='右';
// 着差（1着馬との差）: "馬名(0.6)" パターン
x=af.match(/\n([ァ-ヶー\u3000-\u9FFFa-zA-Z]+)\(([\d.]+)\)/);if(x)pr.gap=parseFloat(x[2]);
// 1着馬の場合は gap=0
if(pr.fin===1)pr.gap=0;
h.prev.push(pr)}
// 日付の新しい順にソート（前走が[0]になるように）
h.prev.sort((a,b)=>b.dateKey-a.dateKey);
if(h.name&&h.num)r.horses.push(h)}
// === オッズデータは券種別テキストエリアから取得（doAnalyze側で処理） ===
r._marketOdds={tansho:{},wakuren:{},umaren:{},wide:{},umatan:{},sanrenpuku:{},sanrentan:{}};
return r}

// ===== SCORING =====
function score(race){const hs=race.horses,inf=race.info,dist=inf.dist||1800,surf=inf.type||'ダート';
const isDirt=surf==='ダート';
const raceDir=inf.dir||null;
const raceCond=inf.cond||'良';
const isHeavy=raceCond==='重'||raceCond==='不良';
const isSlight=raceCond==='稍重';

// --- STEP1: 各馬から「今回の条件に近い前走」を探す ---
// 条件一致度: 同芝ダ＋距離差200m以内→best、同芝ダのみ→ok、それ以外→前走[0]
function findMatchRace(h){
  if(!h.prev||h.prev.length===0)return null;
  // 完全一致（同芝ダ＋距離±200m）
  const surfKey=isDirt?'ダ':'芝';
  let best=h.prev.find(p=>p.dist&&Math.abs(p.dist-dist)<=200&&p.surface===surfKey);
  if(best)return best;
  // 芝ダ一致のみ
  best=h.prev.find(p=>p.surface===surfKey);
  if(best)return best;
  // 距離一致のみ
  best=h.prev.find(p=>p.dist&&Math.abs(p.dist-dist)<=200);
  if(best)return best;
  return h.prev[0];
}
hs.forEach(h=>{h._matchRace=findMatchRace(h)});

// --- STEP2: 条件一致レースの上がり3Fを集めて相対評価 ---
const f3list=hs.map(h=>h._matchRace?.f3).filter(v=>v&&v>0);
const f3avg=f3list.length>0?f3list.reduce((a,b)=>a+b,0)/f3list.length:38.5;
const f3sorted=[...f3list].sort((a,b)=>a-b); // 速い順

// --- STEP3: 展開予測（逃げ馬の数→ペース判定） ---
const escapes=hs.filter(h=>{
  if(!h.prev)return false;
  const ps=h.prev.filter(p=>p.pos?.length>=2).map(p=>p.pos[0]);
  if(ps.length===0)return false;
  return ps.reduce((a,b)=>a+b,0)/ps.length<=2; // 平均通過順位2番手以内＝逃げ馬
});
const leaders=hs.filter(h=>{
  if(!h.prev)return false;
  const ps=h.prev.filter(p=>p.pos?.length>=2).map(p=>p.pos[0]);
  if(ps.length===0)return false;
  const avg=ps.reduce((a,b)=>a+b,0)/ps.length;
  return avg<=4; // 4番手以内＝先行馬
});
// ペース判定: 逃げ馬2頭以上→ハイペース（差し有利）、0-1頭→スローペース（前残り）
const paceType=escapes.length>=3?'H超':escapes.length>=2?'H':leaders.length<=2?'S':'M';
const paceLabel=paceType==='H超'?'超ハイペース予想':paceType==='H'?'ハイペース予想':paceType==='S'?'スローペース予想':'ミドルペース予想';
const paceAdvantage=paceType==='H超'||paceType==='H'?'差し追込':'先行';

// --- STEP4: 各馬のスコアリング ---
// ファクター重み(g評価の加点に掛ける倍率。b評価の減点はそのまま)
// Phase2: 51レース706頭の実データ検証に基づく重み（g-b差＝予測力）
// 前走+37,着差+37→最有力 / 蓄積+34,安定+32→有力 / 上がり+25,距離+25→有力
// 回り+16→やや有効 / 血統+10→弱い / 間隔+1→無効
const FW={'前走':2.0,'着差':2.0,'蓄積':1.8,'安定':1.7,'上がり':1.5,'距離':1.5,'騎手':1.3,'回り':0.8,'血統':0.3,'間隔':0};
const fw=(k,pts)=>Math.round(pts*(FW[k]!=null?FW[k]:1)); // 重み付き加点

// 競馬場名取得
const raceVenue=(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,'');

hs.forEach(h=>{let s=50;const f={};
const l=h.prev?.[0];
const mr=h._matchRace;

// ===【能力】===

// 前走着順
if(l){const r=l.fin/l.run;if(r<=.2){s+=fw('前走',18);f['前走']={v:l.fin+'着/'+l.run+'頭',c:'g'}}else if(r<=.4){s+=fw('前走',12);f['前走']={v:l.fin+'着/'+l.run+'頭',c:'g'}}else if(r<=.6){s+=5;f['前走']={v:l.fin+'着/'+l.run+'頭',c:'n'}}else{s-=5;f['前走']={v:l.fin+'着/'+l.run+'頭',c:'b'}}}

// 前走着差
if(l?.gap!=null){
  if(l.gap===0){s+=fw('着差',5);f['着差']={v:'1着',c:'g'}}
  else if(l.gap<=0.3){s+=fw('着差',4);f['着差']={v:l.gap+'秒差',c:'g'}}
  else if(l.gap<=0.6){s+=fw('着差',2);f['着差']={v:l.gap+'秒差',c:'g'}}
  else if(l.gap<=1.5){f['着差']={v:l.gap+'秒差',c:'n'}}
  else{s-=2;f['着差']={v:l.gap+'秒差',c:'b'}}
}

// 上がり3F（出走馬同士の相対比較 → 順位表示）
if(mr?.f3&&f3list.length>=3){
  const faster=f3sorted.filter(v=>v<mr.f3).length;
  const rank=faster+1;
  const pct=faster/f3sorted.length;
  if(pct<=0.2){s+=fw('上がり',10);f['上がり']={v:rank+'位/'+f3sorted.length+'頭',c:'g'}}
  else if(pct<=0.4){s+=fw('上がり',5);f['上がり']={v:rank+'位/'+f3sorted.length+'頭',c:'g'}}
  else if(pct<=0.7){f['上がり']={v:rank+'位/'+f3sorted.length+'頭',c:'n'}}
  else{s-=3;f['上がり']={v:rank+'位/'+f3sorted.length+'頭',c:'b'}}
}else if(mr?.f3){
  let base=isDirt?(dist<=1600?37.8:dist<=2100?39.0:39.5):(dist<=1600?35.0:35.5);
  const diff=mr.f3-base;
  if(diff<=-1.0){s+=fw('上がり',8);f['上がり']={v:mr.f3+'s(速)',c:'g'}}
  else if(diff<=0.5){s+=3;f['上がり']={v:mr.f3+'s',c:'n'}}
  else{s-=2;f['上がり']={v:mr.f3+'s(遅)',c:'b'}}
}

// 過去4走トレンド
if(h.prev?.length>=2&&h.prev[0]?.fin&&h.prev[1]?.fin){
  const r1=h.prev[0].fin,r2=h.prev[1].fin;
  if(r1<r2){s+=10;f['トレンド']={v:'↑改善('+r2+'着→'+r1+'着)',c:'g'}}
  else if(r1===r2){s+=5;f['トレンド']={v:'→横ばい('+r1+'着)',c:'n'}}
  else{f['トレンド']={v:'↓悪化('+r2+'着→'+r1+'着)',c:'b'}}
}

// ===【条件適性】===

// 距離変化
if(l?.dist&&dist){
  const dd=dist-l.dist;
  if(dd===0){s+=8;f['距離']={v:'同距離',c:'g'}}
  else if(Math.abs(dd)<=200){s+=4;f['距離']={v:(dd>0?'+':'')+dd+'m',c:'n'}}
  else if(dd>0){s-=2;f['距離']={v:'+'+dd+'m延長',c:'b'}}
  else{s-=2;f['距離']={v:dd+'m短縮',c:'b'}}
}

// コース一致（芝/ダート）
if(l?.surface){
  const surfKey=isDirt?'ダ':'芝';
  if(l.surface===surfKey){s+=5;f['コース']={v:(isDirt?'ダート':'芝')+'→'+(isDirt?'ダート':'芝')+'○',c:'g'}}
  else{s-=5;f['コース']={v:(l.surface==='ダ'?'ダート':'芝')+'→'+(isDirt?'ダート':'芝')+'×',c:'b'}}
}

// 馬場一致（段階制: 良→稍重→重→不良）
if(h.prev?.length>0){
  const condOrder=['良','稍重','重','不良'];
  const raceCondIdx=condOrder.indexOf(raceCond);
  if(raceCondIdx>=0){
    let bestMatchPts=-1;let bestMatchLabel='';
    h.prev.forEach(p=>{
      if(!p.cond)return;
      const pIdx=condOrder.indexOf(p.cond);if(pIdx<0)return;
      const diff=Math.abs(raceCondIdx-pIdx);
      let pts=diff===0?5:diff===1?3:diff===2?1:0;
      if(pts>bestMatchPts){bestMatchPts=pts;bestMatchLabel=diff===0?'完全一致':diff===1?'一段階違い':diff===2?'二段階違い':'三段階違い'}
    });
    if(bestMatchPts>=0){
      s+=bestMatchPts;
      f['馬場']={v:bestMatchLabel,c:bestMatchPts>=5?'g':bestMatchPts>=3?'n':'b'};
    }
  }
}

// 競馬場一致
if(l?.venue&&raceVenue){
  if(l.venue===raceVenue){s+=5;f['競馬場']={v:l.venue+'→'+raceVenue+'○',c:'g'}}
  else{f['競馬場']={v:l.venue+'→'+raceVenue,c:'n'}}
}

// 回り一致
if(raceDir&&h.prev?.length>0){
  const sd=h.prev.filter(p=>p.dir===raceDir);
  const od=h.prev.filter(p=>p.dir&&p.dir!==raceDir);
  if(sd.length>0){
    const prevDir=sd[0].dir;
    const bs=Math.min(...sd.map(p=>p.fin));
    const as=sd.reduce((a,p)=>a+p.fin,0)/sd.length;
    const ao=od.length>0?od.reduce((a,p)=>a+p.fin,0)/od.length:99;
    if(bs<=3&&as<ao-1){s+=fw('回り',3);f['回り']={v:prevDir+'→'+raceDir+'○',c:'g'}}
    else if(bs<=5){s+=fw('回り',2);f['回り']={v:prevDir+'→'+raceDir+'○',c:'n'}}
    else if(od.length>0&&as>ao+2){s-=3;f['回り']={v:prevDir+'→'+raceDir+'×',c:'b'}}
    else{f['回り']={v:raceDir+'経験有',c:'n'}}
  }else if(h.prev.some(p=>p.dir)){
    const pd=h.prev.find(p=>p.dir)?.dir||'?';
    f['回り']={v:pd+'→'+raceDir+'×',c:'b'}
  }
}

// ===【状態】===

// 馬体重変化
if(h.wc!=null){
  const w=Math.abs(h.wc);
  const label='体重'+(h.wc>=0?'+':'')+h.wc+'kg';
  if(w<=4){s+=2;f['体重']={v:label,c:'g'}}
  else if(w>=8){s-=3;f['体重']={v:label+'注意',c:'b'}}
  else{f['体重']={v:label,c:'n'}}
}

// 間隔
if(l?.dateKey&&inf.date){
  const parts=inf.date.split('/');
  const today=new Date(+parts[0],+parts[1]-1,+parts[2]);
  const ly=Math.floor(l.dateKey/10000),lm=Math.floor((l.dateKey%10000)/100),ld=l.dateKey%100;
  const lastDay=new Date(ly,lm-1,ld);
  const days=Math.round((today-lastDay)/(1000*60*60*24));
  const weeks=Math.round(days/7);
  if(weeks>=13){s-=2;f['間隔']={v:'中'+weeks+'週休み明け',c:'b'}}
  else if(weeks>=5){f['間隔']={v:'中'+weeks+'週',c:'n'}}
  else if(weeks>=2){s+=2;f['間隔']={v:'中'+weeks+'週',c:'g'}}
  else if(weeks>=1){s+=1;f['間隔']={v:'中'+weeks+'週',c:'g'}}
}

// 斤量（出走馬の中での相対評価）
if(h.imp){
  const allImp=hs.filter(x=>x.imp).map(x=>x.imp);
  if(allImp.length>=3){
    const minImp=Math.min(...allImp),maxImp=Math.max(...allImp);
    if(h.imp===minImp&&maxImp-minImp>=1){s+=4;f['斤量']={v:h.imp+'kg(最軽量)',c:'g'}}
    else if(h.imp===maxImp&&maxImp-minImp>=1){s-=3;f['斤量']={v:h.imp+'kg(最重量)',c:'b'}}
    else{f['斤量']={v:h.imp+'kg',c:'n'}}
  }else if(h.imp){f['斤量']={v:h.imp+'kg',c:'n'}}
}

// 蓄積データ参照（内部スコアのみ、タグ非表示）
if(h.name&&HORSE_DB[h.name]){
  const hist=HORSE_DB[h.name];
  const sameCond=hist.filter(x=>x.surface===surf&&x.dist&&Math.abs(x.dist-dist)<=200);
  if(sameCond.length>0){
    const bestRank=Math.min(...sameCond.map(x=>x.rank));
    if(bestRank<=3)s+=fw('蓄積',8);
    else if(bestRank<=5)s+=fw('蓄積',4);
    else{const avgRank=sameCond.reduce((a,x)=>a+x.rank,0)/sameCond.length;if(avgRank<=8)s+=2}
  }else if(hist.length>0){
    const bestRank=Math.min(...hist.map(x=>x.rank));if(bestRank<=3)s+=4;
  }
  h._histData=hist;
}

// ===【データ分析ルール補正】===

// RULE 3: 競馬場×距離の荒れ条件（1番人気の信頼度が低い条件）
const R3_UPSET={'小倉1700':6,'阪神1200':5,'小倉2000':4,'小倉1200':4};
const r3key=raceVenue+dist;
if(R3_UPSET[r3key]){
  // 1番人気（pop=1）の信頼度を下げ、2-5番人気は加点
  if(h.pop===1){s-=R3_UPSET[r3key];f['荒れ条件']={v:r3key+'(1番人気不安)',c:'b'}}
  else if(h.pop>=2&&h.pop<=5){s+=Math.round(R3_UPSET[r3key]*0.5);f['荒れ条件']={v:r3key+'(穴チャンス)',c:'g'}}
}
// 堅い条件: 1番人気を加点
const R3_SOLID={'中山1600':4,'中山1800':5,'阪神1400':4,'京都1800':3};
if(R3_SOLID[r3key]&&h.pop===1){s+=R3_SOLID[r3key];f['堅い条件']={v:r3key+'(1番人気堅い)',c:'g'}}

// RULE 4: 騎手×競馬場/距離/コースの相性
const jkName=(h.jk||'').replace(/[\s　]+/g,'');
if(jkName&&raceVenue){
  // 騎手×競馬場
  const JK_VENUE={
    'C.ルメール':{'京都':8,'東京':5},
    'Ｃ．ルメール':{'京都':8,'東京':5},

// RULE 5×競馬場: 脚質×競馬場の傾向
if(h.prev?.length>0){

// RULE 6: 馬番の内外有利
if(h.num&&hs.length>=8){

// RULE 9: 馬場状態の影響
if(isSlight&&h.pop===2)s+=2;              // 稍重で2番人気の信頼度上昇

if(isHeavy&&h.pop===4)s-=2;             // 重馬場で4番人気の信頼度低下

h.score=Math.max(0,s);h.f=f});
// 正規化は最高得点を100として相対値
const mx=Math.max(...hs.map(h=>h.score),1);hs.forEach(h=>{h.ns=Math.round((h.score/mx)*100);h.ev=h.odds?Math.round((h.ns/100)*h.odds*100-100)/100:0});

// ===== v2.9: 予測精度向上補正（11,446出走データに基づく） =====

hs.forEach(h=>{

});
// 補正スコアでソート（印の割り当てに影響）

// ===== BET (v21: 単勝・馬連・ワイドの3択、レース質判定) =====
function getHorseStatBonus(horse,raceInfo){
  const reasons=[];
  let bonus=0;
  const jk=horse.jk||'';
  const tr=horse.trainer||'';
  const surf=raceInfo?.type||'';
  const dist=raceInfo?.dist||0;
  const venue=(raceInfo?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  let jkTotal=0,jkW3=0,trTotal=0,trW3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{
      const rank=h._resultRank||(top3.length>=3&&top3.includes(h.num)?top3.indexOf(h.num)+1:0);
      if(!rank)return;
      if(jk&&h.jk===jk){jkTotal++;if(rank<=3)jkW3++}
      if(tr&&h.trainer===tr){trTotal++;if(rank<=3)trW3++}
    });
    (r.result?.allResults||[]).forEach(ar=>{
      const sc=(r.scored||[]).find(h=>h.num===ar.num);
      const arJk=ar.jockey||sc?.jk||'';
      const arTr=ar.trainer||sc?.trainer||'';
      if(jk&&arJk===jk){jkTotal++;if(ar.rank<=3)jkW3++}
      if(tr&&arTr===tr){trTotal++;if(ar.rank<=3)trW3++}
    });
  });
  if(jkTotal>=3){const rate=jkW3/jkTotal;if(rate>=0.40){bonus+=15;reasons.push(jk+'複勝率'+Math.round(rate*100)+'%('+jkTotal+'走)')}else if(rate>=0.28){bonus+=8;reasons.push(jk+'複勝率'+Math.round(rate*100)+'%('+jkTotal+'走)')}else if(rate<0.15)bonus-=8}
  if(trTotal>=3){const rate=trW3/trTotal;if(rate>=0.45){bonus+=12;reasons.push(tr+'厩舎複勝率'+Math.round(rate*100)+'%')}else if(rate>=0.33){bonus+=6;reasons.push(tr+'厩舎複勝率'+Math.round(rate*100)+'%')}else if(rate<0.15)bonus-=6}
  if(horse.name&&HORSE_DB[horse.name]){
    const hist=HORSE_DB[horse.name];
    const cond=hist.filter(x=>x.surface===surf&&x.dist&&Math.abs(x.dist-dist)<=200);
    if(cond.length>=2){const w3=cond.filter(x=>x.rank<=3).length;const rate=w3/cond.length;if(rate>=0.5){bonus+=12;reasons.push('条件複勝率'+Math.round(rate*100)+'%')}else if(rate>=0.33)bonus+=6}
    if(venue){const vm=hist.filter(x=>x.venue===venue);if(vm.length>=2&&vm.filter(x=>x.rank<=3).length/vm.length>=0.5){bonus+=8;reasons.push(venue+'複勝率高')}}
  }
  // ns への代入は絶対にしない
  return{bonus,reasons};
}

// デバッグ: ブラウザコンソールで genBet(RACES[0].scored, RACES[0].info) を実行して確認可能
function genBet(scored,raceInfo,marketOdds){
  const marks=['◎','○','▲','△','×'];
  const eU=(a,b)=>{if(!a?.odds||!b?.odds)return 0;return Math.round(a.odds*b.odds*0.4*100)/100};
  const eW=(a,b)=>{if(!a?.odds||!b?.odds)return 0;return Math.round(a.odds*b.odds*0.15*100)/100};

  // ===== ① レース質スコア =====
  // 各条件でマイナス点を積み、合計が閾値を超えたら見送り
  const raceQuality={score:0,reasons:[]};
  const headCount=scored.length;

  // 出走頭数が少ない
  if(headCount<=6){raceQuality.score-=30;raceQuality.reasons.push('少頭数（'+headCount+'頭）')}
  else if(headCount<=8){raceQuality.score-=15;raceQuality.reasons.push('小頭数（'+headCount+'頭）')}

  // 各馬に推定オッズ・期待値を付与
  scored.forEach(h=>{
    h._estOdds=estimateOdds(h);
    h._estW3Prob=estimateW3Prob(h);
    h._ev=h._estOdds>0&&h._estW3Prob>0?Math.round(h._estW3Prob*h._estOdds*100)/100:0;
  });
  // 断然1番人気（単勝2倍未満）：的中しても配当が低い
  const favHorse=scored.slice().sort((a,b)=>(a._estOdds||999)-(b._estOdds||999))[0];
  const favOdds=favHorse?._estOdds||99;
  const hasOddsData=scored.some(h=>h._estOdds&&h._estOdds>0);
  if(hasOddsData){
    if(favOdds<1.5){raceQuality.score-=40;raceQuality.reasons.push('断然人気('+favOdds+'倍)')}
    else if(favOdds<2.0){raceQuality.score-=25;raceQuality.reasons.push('強い1番人気('+favOdds+'倍)')}
    else if(favOdds<2.5){raceQuality.score-=10;raceQuality.reasons.push('1番人気('+favOdds+'倍)')}
  }

  // 上位2頭のスコア差が小さい（甲乙つけがたい混戦）
  const top2=scored.slice(0,2);
  if(top2.length>=2){
    const scoreDiff=top2[0].ns-top2[1].ns;
    if(scoreDiff<=5){raceQuality.score-=20;raceQuality.reasons.push('上位2頭スコア差小('+scoreDiff+')')}
    else if(scoreDiff<=10){raceQuality.score-=10;raceQuality.reasons.push('上位差やや小('+scoreDiff+')')}
  }

  // 蓄積データのある馬が少ない（予測根拠が薄い）
  const withHistory=scored.filter(h=>h.f['蓄積']||h.prev?.length>=2).length;
  const histRate=withHistory/Math.max(headCount,1);
  if(histRate<0.3){raceQuality.score-=20;raceQuality.reasons.push('データ不足('+withHistory+'頭のみ)')}
  else if(histRate<0.5){raceQuality.score-=10;raceQuality.reasons.push('データ少('+withHistory+'頭)')}

  // スコア1位の絶対値が低い（全馬の実力が僅差）
  if(scored[0]?.ns<60){raceQuality.score-=15;raceQuality.reasons.push('スコア低(top:'+scored[0]?.ns+')')}

  // レース質判定：-40以下で見送り
  const poorRace=raceQuality.score<=-40;

  // オッズデータがある場合のみ除外、なければ全馬対象
  const excluded=[];
  const eligible=scored;
  const useEligible=eligible;

  function stableScore(h){
    let s=0;
    if(h.prev?.length>0){
      const board=h.prev.filter(p=>p.fin<=5).length;
      s+=board*15;const l=h.prev[0];
      if(l&&l.fin<=3)s+=12;else if(l&&l.fin<=5)s+=6;else if(l&&l.fin<=8)s+=2;
      if(l?.gap!=null){if(l.gap<=0.3)s+=12;else if(l.gap<=0.6)s+=8;else if(l.gap<=1.0)s+=4;else if(l.gap>2.0)s-=6}
    }
    if(h.f['距離']?.c==='g')s+=10;if(h.f['コース']?.c==='g')s+=8;
    if(h.f['上がり']?.c==='g')s+=6;if(h.f['トレンド']?.c==='g')s+=8;
    if(h.f['馬場']?.c==='g')s+=5;if(h.f['競馬場']?.c==='g')s+=5;
    if(h.f['間隔']?.c==='g')s+=3;
    if(h.rec){const tot=h.starts||1;const fr=(h.rec.w+h.rec.s+h.rec.t)/tot;if(fr>=0.4)s+=10;else if(fr>=0.25)s+=5}
    return s;
  }
  function whyPick(h){
    const r=[];if(h.prev?.length>0){const board=h.prev.filter(p=>p.fin<=5).length;const l=h.prev[0];
    if(l&&l.fin<=3)r.push('前走'+l.fin+'着/'+l.run+'頭');else if(l&&l.fin<=5)r.push('前走'+l.fin+'着');else if(l)r.push('前走'+l.fin+'着/'+l.run+'頭');
    if(board>=2)r.push('掲示板'+board+'回');if(l?.gap!=null&&l.gap<=0.6)r.push('着差'+l.gap+'秒');}
    if(h.f['距離']?.c==='g')r.push('同距離');if(h.f['コース']?.c==='g')r.push('コース○');
    if(h.f['トレンド']?.c==='g')r.push('トレンド↑');if(h.f['競馬場']?.c==='g')r.push('同競馬場');
    if(h.f['馬場']?.c==='g')r.push('馬場一致');
    if(h.rec?.w>0)r.push('勝利有');const rank=scored.indexOf(h);if(rank>=0&&rank<5)r.push(marks[rank]);
    if(!r.length)r.push('総合スコア');return r;
  }

  // 統計ボーナスを付与（ns は変更しない、ソート順も変えない）
  scored.forEach(h=>{
    try{
      const sb=getHorseStatBonus(h,raceInfo);
      h.statBonus=sb.bonus||0;
      h.statReasons=sb.reasons||[];
      h.totalScore=(h.ns||0)+Math.round((sb.bonus||0)*0.5);
      if(sb.bonus!==0||sb.reasons.length>0)console.log('[StatBonus]',h.name,'ns:',h.ns,'bonus:',sb.bonus,'reasons:',sb.reasons);
    }catch(e){
      h.statBonus=0;h.statReasons=[];h.totalScore=h.ns||0;
      console.warn('[StatBonus error]',h.name,e.message);
    }
  });

  const stables=useEligible.map(h=>({h,ss:stableScore(h)})).sort((a,b)=>b.ss-a.ss);

  // ===== 軸馬選定（ns基準） =====
  const STRONG_F=['前走','着差','上がり','トレンド','距離','コース','馬場','競馬場'];
  function countG(h){return STRONG_F.filter(k=>h.f?.[k]?.c==='g').length}
  const himoPool=scored.filter(h=>h.ns>=50&&h.ns<80).sort((a,b)=>b.ns-a.ns);
  // 軸馬: 補正スコア(adjNs)基準（人気・オッズに依存しない）
  const useNs=h=>h.adjNs!=null?h.adjNs:h.ns;
  let A=scored.find(h=>useNs(h)>=80)||scored.find(h=>useNs(h)>=50)||null;
  let B=scored.filter(h=>h!==A).find(h=>useNs(h)>=50)||scored.filter(h=>h!==A)[0]||null;
  let C=scored.filter(h=>h!==A&&h!==B).find(h=>useNs(h)>=50)||null;

  // ===== レース質判定（補正スコア使用） =====
  const topNs=useNs(scored[0])||0;
  const nsDiff=scored.length>=2?(useNs(scored[0])-useNs(scored[1])):0;
  const top3=scored.slice(0,3);
  const top3diff=top3.length>=3?(useNs(top3[0])-useNs(top3[2])):99;
  // 3パターン判定（補正スコアで判定、人気・オッズに依存しない）
  const isAxisClear=A&&useNs(A)>=80&&nsDiff>=10;
  const isMixedRace=scored.length>=3&&top3diff<=8;
  const isStandard=!isAxisClear&&!isMixedRace&&A&&useNs(A)>=50;

  // 見送り判定
  let budgetOver=false;
  if(typeof getDailyBudget==='function'&&typeof getTodayInvested==='function'){
    if(getDailyBudget()-getTodayInvested()<100)budgetOver=true;
  }
  let skipRecommended=topNs<50||budgetOver;
  if(!A||!B)skipRecommended=true;

  // 信頼度
  const axisG=A?countG(A):0;
  let confidence='',confLevel=1;
  if(axisG>=5){confidence='★★★ 高';confLevel=3}
  else if(axisG>=3){confidence='★★ 中';confLevel=2}
  else{confidence='★ 低';confLevel=1}

  const skipReason=budgetOver?'本日の予算上限に到達':topNs<50?'最高スコア不足('+topNs+')':(!A||!B)?'候補馬不足':'条件を満たす買い目なし';

  if(!A||!B){
    return{best:null,tickets:[],fav:favHorse,excluded,confidence,confLevel,
      fukushoHorse:null,totalInv:0,wideAmount:0,fukAmount:0,raceQuality,
      patName:'候補不足',patReason:skipReason,warning:'候補馬不足',skipRecommended:true,alternatives:[]};
  }

  const favStableRank=stables.findIndex(x=>x.h===favHorse);
  const favInEligible=favStableRank>=0;
  const favIsOverrated=!favInEligible||(favStableRank>=2);
  const favIsLegit=favInEligible&&favStableRank<=1;

  const estU=eU(A,B);
  const estW=C?eW(B,C):0;

  // ===== 馬券選択: 単勝・馬連・ワイドの3択 =====
  const mktOdds=marketOdds||{tansho:{},umaren:{},wide:{}};
  const hasMarket=Object.values(mktOdds).some(v=>v&&Object.keys(v).length>0);

  function getActualOdds(type,horses){
    if(type==='単勝'){const k=String(horses[0]?.num);return mktOdds.tansho?.[k]!=null?mktOdds.tansho[k]:null;}
    const nums=horses.map(x=>x.num).sort((a,b)=>a-b);const key=nums.join('-');
    if(type==='馬連')return mktOdds.umaren?.[key]!=null?mktOdds.umaren[key]:null;
    if(type==='ワイド')return mktOdds.wide?.[key]!=null?mktOdds.wide[key]:null;
    return null;
  }

  let tickets=[];
  // レース質タイプ名
  let raceType='見送り';

  if(!skipRecommended){
    const partners=[B,C,...himoPool.filter(h=>h!==A&&h!==B&&h!==C)].filter(Boolean);

    if(isAxisClear){
      // ===== 軸馬明確レース: 単勝100円 + 馬連100円×2点 = 300円 =====
      raceType='軸馬明確';
      // 単勝
      const tOdds=hasMarket?getActualOdds('単勝',[A]):A.odds;
      if(tOdds==null||tOdds>=5){
        tickets.push({type:'単勝',desc:String(A.num),amount:100,horses:[A],
          actualOdds:hasMarket?tOdds:null,grade:'◎',gradeLabel:'軸馬単勝',
          reason:A.num+'番が1着で的中'});
      }
      // 馬連×2（スコア2位・3位）
      [B,C].filter(Boolean).forEach(p=>{
        const uOdds=hasMarket?getActualOdds('馬連',[A,p]):null;
        if(uOdds!=null&&uOdds<10)return; // オッズ入力時: 10倍未満除外
        tickets.push({type:'馬連',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
          actualOdds:uOdds,grade:'○',gradeLabel:'軸馬絡み',
          reason:A.num+'番─'+p.num+'番が1・2着で的中'});
      });

    }else if(isMixedRace){
      // ===== 混戦レース: ワイド100円×3点（上位3頭の組み合わせ）= 300円 =====
      raceType='混戦';
      const trio=[top3[0],top3[1],top3[2]].filter(Boolean);
      for(let i=0;i<trio.length;i++){
        for(let j=i+1;j<trio.length;j++){
          const wOdds=hasMarket?getActualOdds('ワイド',[trio[i],trio[j]]):null;
          if(wOdds!=null&&wOdds<3)continue; // オッズ入力時: 3倍未満除外
          tickets.push({type:'ワイド',desc:trio[i].num+'─'+trio[j].num,amount:100,horses:[trio[i],trio[j]],
            actualOdds:wOdds,grade:'○',gradeLabel:'混戦上位組',
            reason:trio[i].num+'番─'+trio[j].num+'番が3着以内で的中'});
        }
      }

    }else if(isStandard){
      // ===== 標準レース: 馬連100円×3点（軸馬×上位3頭）= 300円 =====
      raceType='標準';
      partners.slice(0,3).forEach(p=>{
        const uOdds=hasMarket?getActualOdds('馬連',[A,p]):null;
        if(uOdds!=null&&uOdds<10)return; // オッズ入力時: 10倍未満除外
        tickets.push({type:'馬連',desc:A.num+'─'+p.num,amount:100,horses:[A,p],
          actualOdds:uOdds,grade:'○',gradeLabel:'軸馬絡み',
          reason:A.num+'番─'+p.num+'番が1・2着で的中'});
      });
    }

    // オッズフィルタ後に買い目が0点なら見送り
    if(tickets.length===0)skipRecommended=true;
  }

  if(!skipRecommended&&!hasMarket){
    // オッズ未入力時の注記
    tickets.forEach(tk=>{if(tk.actualOdds==null){tk.grade='-';tk.gradeLabel='※オッズ未入力'}});
  }

  if(skipRecommended)tickets=[];
  const totalInv=tickets.reduce((s,t)=>s+t.amount,0);

  // 戦略説明
  const favNote=favIsOverrated
    ?'1番人気('+favOdds+'倍)は過剰人気→除外'
    :'1番人気('+favOdds+'倍)は実力通り';
  const strategyMap={'軸馬明確':'単勝＋馬連戦略','標準':'馬連戦略','標準(ワイド)':'ワイド戦略','混戦':'ワイド戦略','見送り':'見送り'};
  const types=[...new Set(tickets.map(t=>t.type))];
  const patName=skipRecommended?'見送り推奨':types.join('＋')+'×'+tickets.length+'点('+totalInv+'円)';
  const bonusLabel=A?.statReasons?.length?'【統計補正: '+A.statReasons.join('・')+'】':'';
  const patReason=skipRecommended
    ?skipReason
    :'レース質：'+raceType+' → '+(strategyMap[raceType]||'')+'。軸A='+A.num+'番(ns'+A.ns+'/'+A.pop+'番人気)。'+bonusLabel+'【'+favNote+'】';

  const bestObj={type:types[0]||'',horses:[A,B],est:eU(A,B),ev:A?.ev||0,prob:0,
    why:[whyPick(A),whyPick(B)],desc:A.num+'─'+B.num,strategy:patName};

  // レース質の警告文
  const rqWarning=poorRace?'⚠ レース質不良：'+raceQuality.reasons.join('・'):'';

  return{
    best:bestObj,tickets,patName,patReason,skipRecommended,
    warning:rqWarning||((!skipRecommended&&!C)?'ワイド候補不足（馬連のみ）':''),
    isTurf:(raceInfo?.type||'')!=='ダート',
    fav:favHorse,excluded,confidence,confLevel,
    raceQuality,favIsOverrated,favIsLegit,
    fukushoHorse:A,
    wideAmount:0,fukAmount:0,totalInv,
    wideHorseB:B,wideHorseC:C,
    alternatives:[]
  };
}

// ===== RESULT PARSER (全情報取得版) =====
function parseResult(text,horses){
  const results=[];
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  
  // === 1. 着順行を「数字+枠」パターンで検出し、後続行から全情報を収集 ===
  // 着順行の候補インデックスを収集
  const entryIdxs=[];
  for(let i=0;i<lines.length;i++){
    const tokens=lines[i].split(/[\t\s]+/).filter(Boolean);
    if(tokens.length>=2&&+tokens[0]>=1&&+tokens[0]<=18){
      // 2番目のトークンが「枠N」で始まるか確認
      if(tokens[1]?.match(/^枠\d/))entryIdxs.push(i);
      // またはタブ区切りで枠が含まれる
      else if(lines[i].match(/枠\d/))entryIdxs.push(i);
    }
  }
  
  for(let ei=0;ei<entryIdxs.length;ei++){
    const startIdx=entryIdxs[ei];
    const endIdx=ei+1<entryIdxs.length?entryIdxs[ei+1]:Math.min(startIdx+12,lines.length);
    const block=lines.slice(startIdx,endIdx);
    
    // 着順行からrank,numを取得
    const tokens=block[0].split(/[\t\s]+/).filter(Boolean);
    let rank=0,num=0,name='',sexAge='',weight=0,jockey='',time='',margin='';
    let idx=0;
    if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
    while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
    if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
    
    // 同じ行の残りトークンと後続行を全て結合してスキャン
    const restTokens=tokens.slice(idx);
    
    // 馬名：カタカナ3文字以上を含むトークン（ブリンカー着用を除去）
    for(const tk of restTokens){
      if(tk.match(/[ァ-ヶー]{3,}/)&&!tk.match(/^枠/)){name=tk.replace(/ブリンカー着用/,'').trim();break}
    }
    // 同じ行で馬名が取れなければ後続行から
    if(!name){
      for(let j=1;j<block.length&&j<=3;j++){
        const ln=block[j];
        if(ln.match(/[ァ-ヶー]{3,}/)&&!ln.match(/^枠|着順|馬番/)){
          name=ln.replace(/ブリンカー着用/,'').replace(/\t.*/,'').trim();break;
        }
      }
    }
    
    // ブロック全体から各情報を抽出
    const fullText=block.join('\t');
    // 性齢
    let sm=fullText.match(/(牡|牝|せん)\d/);if(sm)sexAge=sm[0];
    // 斤量
    sm=fullText.match(/(?:牡|牝|せん)\d[\t\s]+(\d+\.\d)/);if(sm)weight=parseFloat(sm[1]);
    // タイム
    sm=fullText.match(/(\d:\d{2}\.\d)/);if(sm)time=sm[1];
    // 騎手名
    sm=fullText.match(/(?:牡|牝|せん)\d[\t\s]+\d+\.\d[\t\s]+([▲△☆◇★]?[^\t\d:（(][^\t:（(]*?)[\t]/);if(sm)jockey=sm[1].replace(/[▲△☆◇★]/g,'').trim();
    // 着差（タイムの後のトークン）
    sm=fullText.match(/\d:\d{2}\.\d[\t\s]+([\S]+)/);
    if(sm&&!sm[1].match(/^\d|^枠|^[一-龥]/))margin=sm[1];
    
    // 通過順位・上がり・馬体重・調教師
    let positions=null,last3f=null,bodyWeight='',trainer='',popularity=0;
    for(let j=1;j<block.length;j++){
      const nl=block[j];
      if(!positions&&nl.match(/^\d{1,2}\s+\d{1,2}(\s+\d{1,2}){0,2}$/)&&!nl.match(/枠|\./)){ 
        positions=nl.split(/\s+/).map(Number);continue;
      }
      if(!last3f&&nl.match(/^\d{2}\.\d/)){
        const parts=nl.split(/\t/).filter(Boolean);
        last3f=parseFloat(parts[0]);
        for(const p of parts){
          if(!bodyWeight&&p.match(/^\d{3}\(/))bodyWeight=p;
          if(+p>=1&&+p<=18&&p===parts[parts.length-1])popularity=+p;
        }
        for(const p of parts){
          if(!trainer&&p.match(/^[一-龥]/)&&!p.match(/^\d/)&&!p.match(/\(/))trainer=p.trim();
        }
        continue;
      }
      if(!bodyWeight&&nl.match(/^\d{3}\([+\-\d初]/)){bodyWeight=nl;continue}
    }
    
    results.push({rank,num,name,sexAge,weight,jockey,time,margin,positions,last3f,bodyWeight,trainer,popularity});
  }
  
  // フォールバック（性齢が取れない場合）
  if(results.length<3){
    results.length=0;
    for(const line of lines){
      if(line.match(/着順|馬番|馬名|払戻|単勝|複勝|枠連|馬連|ワイド|3連|コーナー|ハロン|レース映像|PLAY|パトロール|勝馬の紹介|開催選択|印刷用|更新/))continue;
      if(!line.match(/[ァ-ヶー]{3,}/))continue;
      const tokens=line.split(/[\t\s]+/).filter(Boolean);
      if(tokens.length<3)continue;
      let rank=0,num=0,name='';let idx=0;
      if(+tokens[0]>=1&&+tokens[0]<=18){rank=+tokens[0];idx=1}else continue;
      while(idx<tokens.length&&tokens[idx].match(/^枠/))idx++;
      if(idx<tokens.length&&+tokens[idx]>=1&&+tokens[idx]<=18){num=+tokens[idx];idx++}else continue;
      if(idx<tokens.length)name=tokens[idx];
      if(rank>0&&num>0)results.push({rank,num,name});
    }
  }
  
  // === 2. レース全体のタイム情報 ===
  let harlonTime='',racePace='';
  const htMatch=text.match(/ハロンタイム[\s\t]*([\d\s\-\.]+)/);
  if(htMatch)harlonTime=htMatch[1].trim();
  const paceMatch=text.match(/上り[\s\t]*(4F[\s\d\.\-]+3F[\s\d\.\-]+)/);
  if(paceMatch)racePace=paceMatch[1].trim();
  
  // === 3. コーナー通過順位（全体） ===
  let corners={};
  const cornerPattern=/([\d]コーナー)[\s\t]*(.+)/g;
  let cm;while((cm=cornerPattern.exec(text))!==null){corners[cm[1]]=cm[2].trim()}
  
  // === 4. 払戻金（全券種） ===
  let payouts={};
  const payTypes=['単勝','複勝','枠連','ワイド','馬連','馬単','3連複','3連単'];
  payTypes.forEach(pt=>{
    const re=new RegExp(pt+'\\s*\\n([\\s\\S]*?)(?='+payTypes.filter(x=>x!==pt).join('|')+'|$)');
    const pm=text.match(re);
    if(pm){
      const allPay=[...pm[1].matchAll(/(\d[\d\-ー－―]+)\s+(\d[\d,]+)円/g)];
      payouts[pt]=allPay.map(m=>({combo:m[1],amount:parseInt(m[2].replace(/,/g,''))}));
    }
  });
  
  // ワイド最初の払戻金を取得
  let payout=0;
  if(payouts['ワイド']?.length>0)payout=payouts['ワイド'][0].amount;
  
  // 単勝オッズを払戻金から各馬に付与
  // 単勝払戻: combo=馬番, amount=払戻金 → オッズ = amount / 100
  const tanshoMap={};
  if(payouts['単勝']){
    payouts['単勝'].forEach(p=>{
      const num=parseInt(p.combo);
      if(num>=1&&num<=18)tanshoMap[num]=p.amount/100;
    });
  }
  // 人気順を単勝オッズから推定（低い順=1番人気）
  const oddsEntries=Object.entries(tanshoMap).sort((a,b)=>a[1]-b[1]);
  const popFromOdds={};
  oddsEntries.forEach(([num,odds],i)=>{popFromOdds[+num]=i+1});

  results.forEach(r=>{
    if(tanshoMap[r.num])r.odds=tanshoMap[r.num];
    if(popFromOdds[r.num]&&!r.popularity)r.popularity=popFromOdds[r.num];
  });

  // 重複排除＆着順ソート
  const seen=new Set();const unique=[];
  results.sort((a,b)=>a.rank-b.rank);
  for(const r of results){if(!seen.has(r.num)){seen.add(r.num);unique.push(r)}}
  const top3=unique.slice(0,3).map(r=>r.num);

  return{
    top3,payout,
    allResults:unique,     // 全馬の詳細着順データ（odds, popularity付き）
    harlonTime,            // ハロンタイム
    racePace,              // ペース（上り4F/3F）
    corners,               // コーナー通過順位
    payouts                // 全券種の払戻金
  };
}

// ===== 払戻金マッチング =====
function findPayout(payouts,type,nums){
  if(!payouts||!payouts[type])return 0;
  // 馬単・3連単は順番が意味を持つのでソートしない
  const ordered=(type==='馬単'||type==='3連単');
  const key=ordered?nums.join('-'):nums.slice().sort((a,b)=>a-b).join('-');
  const found=payouts[type].find(p=>{
    // ハイフン・全角ダッシュ・全角マイナスなど各種区切り文字に対応
    const parts=p.combo.replace(/[ー－―\u2010-\u2015\u2212\uFF0D]/g,'-').split('-').map(Number).filter(n=>!isNaN(n));
    const pk=ordered?parts.join('-'):parts.sort((a,b)=>a-b).join('-');
    return pk===key;
  });
  return found?found.amount:0;
}

// ===== 全券種的中判定 =====
function checkAllTickets(r){
  // 予想の馬番（A=スコア1位, B=スコア2位, C=スコア3位 ※1番人気除外後）
  const bt=r.bet;
  let betNums=[];
  if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
  else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
  else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  
  const res=r.result;if(!res?.top3||res.top3.length<3)return null;
  const t3=res.top3.map(n=>+n); // [1着馬番, 2着馬番, 3着馬番]
  const pays=res.payouts||{};
  const A=betNums[0],B=betNums[1];
  // C = 予想3位の馬（買い目に入っていない次の候補）
  const scored=r.scored||[];
  const excl=scored.filter(h=>h.odds&&h.odds<3.0);
  const elig=scored.filter(h=>!h.odds||h.odds>=3.0);
  const useElig=elig.length>=2?elig:scored.filter(h=>h!==scored.slice().sort((a,b)=>(a.odds||999)-(b.odds||999))[0]);
  const C=useElig.find(h=>h.num!==A&&h.num!==B)?.num||0;
  
  const results={};
  // 単勝：Aが1着
  results['単勝']={hit:t3[0]===A,pay:findPayout(pays,'単勝',[A])||0};
  // 複勝A
  results['複勝A']={hit:t3.includes(A),pay:findPayout(pays,'複勝',[A])||0,num:A};
  // 複勝B
  results['複勝B']={hit:t3.includes(B),pay:findPayout(pays,'複勝',[B])||0,num:B};
  // ワイド
  results['ワイド']={hit:t3.includes(A)&&t3.includes(B),pay:findPayout(pays,'ワイド',[A,B])||0};
  // 馬連
  results['馬連']={hit:t3.slice(0,2).includes(A)&&t3.slice(0,2).includes(B),pay:findPayout(pays,'馬連',[A,B])||0};
  // 馬単 A→B
  results['馬単']={hit:t3[0]===A&&t3[1]===B,pay:findPayout(pays,'馬単',[A,B])||0};
  // 3連複
  results['3連複']={hit:t3.includes(A)&&t3.includes(B)&&t3.includes(C),pay:findPayout(pays,'3連複',[A,B,C])||0,third:C};
  // 3連単 A→B→C
  results['3連単']={hit:t3[0]===A&&t3[1]===B&&t3[2]===C,pay:findPayout(pays,'3連単',[A,B,C])||0,third:C};
  
  return results;
}

// ===== 的中判定・回収計算ヘルパー =====
// 推奨した馬券種のみで的中判定を行う（他券種の偶然の的中は計上しない）
function getHitInfo(r){
  const res=r.result,bt=r.bet;
  if(!res?.top3||res.top3.length<3)return{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0,tickets:null,skip:false,hitTickets:[]};
  if(bt?.skipRecommended||bt?.totalInv===0){
    return{wideHit:false,wideTicketHit:false,fukHit:false,anyHit:false,label:'見送り',ret:0,inv:0,tickets:null,skip:true,hitTickets:[]};
  }

  const t3=res.top3.map(n=>+n);
  const pays=res.payouts||{};
  const inv=(bt?.totalInv!=null?bt.totalInv:((bt?.wideAmount||0)+(bt?.fukAmount||0)))||0;

  // === 推奨チケットごとに的中判定（推奨券種のみ） ===
  let ret=0;
  const hitTickets=[];

  if(bt?.tickets?.length>0){
    bt.tickets.forEach(tk=>{
      const nums=tk.horses?.map(h=>h.num)||[];
      let hit=false;
      switch(tk.type){
        case '単勝': hit=nums.length>=1&&t3[0]===nums[0]; break;
        case '馬連': hit=nums.length>=2&&t3.slice(0,2).includes(nums[0])&&t3.slice(0,2).includes(nums[1]); break;
        case 'ワイド': hit=nums.length>=2&&t3.includes(nums[0])&&t3.includes(nums[1]); break;
        case '馬単': hit=nums.length>=2&&t3[0]===nums[0]&&t3[1]===nums[1]; break;
        case '枠連': {const wk=tk.horses?.map(h=>h.waku)||[];hit=wk.length>=2&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[0]})&&t3.slice(0,2).some(n=>{const h=r.scored?.find(x=>x.num===n);return h&&h.waku===wk[1]});} break;
        case '3連複': hit=nums.length>=3&&t3.includes(nums[0])&&t3.includes(nums[1])&&t3.includes(nums[2]); break;
        case '3連単': hit=nums.length>=3&&t3[0]===nums[0]&&t3[1]===nums[1]&&t3[2]===nums[2]; break;
      }
      if(hit){
        const sortedNums=tk.type==='馬単'||tk.type==='3連単'?nums:[...nums].sort((a,b)=>a-b);
        let pay=findPayout(pays,tk.type,sortedNums)||0;
        // 払戻金が取得できない場合、手入力の払戻額またはcheckAllTicketsの結果をフォールバック
        if(pay===0){
          const allTk=checkAllTickets(r);
          if(allTk){
            // 券種名でcheckAllTicketsの結果を参照
            const tkKey=tk.type==='単勝'?'単勝':tk.type==='馬連'?'馬連':tk.type==='ワイド'?'ワイド':tk.type==='馬単'?'馬単':tk.type==='3連複'?'3連複':tk.type==='3連単'?'3連単':null;
            if(tkKey&&allTk[tkKey]?.hit&&allTk[tkKey]?.pay>0)pay=allTk[tkKey].pay;
          }
          // それでも0なら手入力の払戻額を使用
          if(pay===0&&res.payout>0)pay=res.payout;
        }
        ret+=pay*(tk.amount/100);
        hitTickets.push({type:tk.type,desc:tk.desc,pay,amount:tk.amount});
      }
    });
  }
  // v13以前（従来ロジック: tickets配列なし）
  else{
    let betNums=[];
    if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
    else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
    else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
    const wAmt=bt?.wideAmount||0;const fAmt=bt?.fukAmount||0;const fukNum=bt?.fukushoHorse?.num;
    const wHit=betNums.length>=2&&t3.slice(0,2).includes(betNums[0])&&t3.slice(0,2).includes(betNums[1]);
    if(wHit){const p=findPayout(pays,'ワイド',betNums)||res.payout||0;ret+=p*((wAmt||300)/100);hitTickets.push({type:'馬連',desc:betNums.join('─'),pay:p});}
    const fHit=!!(fukNum&&fAmt>0&&t3.includes(fukNum));
    if(fHit){const p=findPayout(pays,'複勝',[fukNum])||0;if(p>0)ret+=p*(fAmt/100);hitTickets.push({type:'複勝',desc:String(fukNum),pay:p});}
  }

  const anyHit=hitTickets.length>0;
  const label=anyHit?hitTickets.map(h=>h.type+'的中').join('・'):'不的中';
  // 互換用フラグ
  const wideHit=hitTickets.some(h=>h.type==='馬連');
  const wideTicketHit=hitTickets.some(h=>h.type==='ワイド');
  const fukHit=hitTickets.some(h=>h.type==='複勝');

  return{wideHit,wideTicketHit,fukHit,anyHit,label,ret:Math.round(ret),inv,skip:false,hitTickets};
}

// ===== LOSS ANALYSIS =====
function analyzeLoss(rd,top3){
  if(!top3||top3.length<3)return[];
  const bt=rd.bet;
  let betNums=[];
  if(bt?.best?.horses)betNums=bt.best.horses.map(h=>h.num);
  else if(bt?.bets?.length>0)betNums=[bt.bets[0].a.num,bt.bets[0].b.num];
  else if(bt?.bet)betNums=[bt.bet.a.num,bt.bet.b.num];
  if(betNums.length<2)return['買い目なし'];
  
  const t3=top3.map(n=>+n);
  const sc=rd.scored;const fH=n=>sc.find(h=>h.num===n);
  const inTop3=betNums.filter(n=>t3.includes(n));
  const fukNum=bt?.fukushoHorse?.num;
  const fukHit=fukNum&&t3.includes(fukNum);
  
  // 買い目の2頭が両方3着以内 → 外れた原因の分析は不要
  if(inTop3.length>=2)return[];

  const reasons=[];
  
  if(inTop3.length===1){
    const missN=betNums.find(n=>!t3.includes(n));
    const mh=fH(missN);
    if(mh)reasons.push(mh.num+'番'+mh.name+'が圏外（相手選びが課題）');
    reasons.push('1頭は3着以内→相手の精度向上が課題');
  }else{
    const winners=t3.map(n=>fH(n)).filter(Boolean);
    const bh=betNums.map(n=>fH(n)).filter(Boolean);
    if(bh.length>0&&bh.every(h=>h.ns<50))reasons.push('選出馬の実力不足');
    const favW=winners.filter(w=>w.odds&&w.odds<=5);
    if(favW.length>=2)reasons.push('人気馬で決着（堅いレース）');
    const big=winners.filter(w=>w.odds&&w.odds>=30);
    if(big.length)reasons.push('大穴馬が激走（予測困難）');
    if(reasons.length<=(fukHit?1:0))reasons.push('選出馬が2頭とも圏外');
  }
  return reasons;
}

// ===== TRENDS =====
function getTrends(){
  const done=RACES.filter(r=>r.result?.top3?.length>=3);
  if(done.length<2)return null;
  const tot=done.length;
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const anyHits=hits;
  const inv=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const ret=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const causes={};
  done.forEach(r=>{(r.result.reasons||[]).forEach(x=>{if(x&&!x.includes('的中')&&!x.includes('当たり')&&!x.includes('取込')&&x.trim()){const k=x.split('（')[0].split('→')[0].trim();if(k)causes[k]=(causes[k]||0)+1}})});
  const topC=Object.entries(causes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  
  // 騎手別・厩舎別・血統別成績（scored起点で集計、allResults/top3から着順取得）
  const jockeyStats={},trainerStats={},sireStats={};
  done.forEach(r=>{
    if(!r.scored)return;
    const allRes=r.result?.allResults||[];
    const top3=r.result?.top3||[];
    r.scored.forEach(horse=>{
      // 着順: allResultsから取得、なければtop3から推定
      const ar=allRes.find(a=>a.num===horse.num);
      let rank=ar?.rank||0;
      if(!rank){
        const idx=top3.findIndex(n=>+n===horse.num);
        if(idx>=0)rank=idx+1;
      }
      // 騎手: scored.jk → allResults.jockey の順でフォールバック
      const jk=horse.jk||ar?.jockey;
      if(jk){
        if(!jockeyStats[jk])jockeyStats[jk]={total:0,w1:0,w2:0,w3:0};
        jockeyStats[jk].total++;
        if(rank===1)jockeyStats[jk].w1++;
        if(rank>=1&&rank<=2)jockeyStats[jk].w2++;
        if(rank>=1&&rank<=3)jockeyStats[jk].w3++;
      }
      // 厩舎: scored.trainer → allResults.trainer
      const tr=horse.trainer||ar?.trainer;
      if(tr){
        if(!trainerStats[tr])trainerStats[tr]={total:0,w1:0,w2:0,w3:0};
        trainerStats[tr].total++;
        if(rank===1)trainerStats[tr].w1++;
        if(rank>=1&&rank<=2)trainerStats[tr].w2++;
        if(rank>=1&&rank<=3)trainerStats[tr].w3++;
      }
      // 血統（種牡馬）
      const sire=horse.sire;
      if(sire){
        if(!sireStats[sire])sireStats[sire]={total:0,w1:0,w2:0,w3:0};
        sireStats[sire].total++;
        if(rank===1)sireStats[sire].w1++;
        if(rank>=1&&rank<=2)sireStats[sire].w2++;
        if(rank>=1&&rank<=3)sireStats[sire].w3++;
      }
    });
  });

  // 人気別着順分布（結果入力済みレースの全馬データから集計）
  const popStats={}; // {1:{total,w1,w2,w3,w5}, 2:{...}, ...}
  done.forEach(r=>{
    if(!r.result?.allResults||!r.scored)return;
    r.result.allResults.forEach(ar=>{
      // 出馬表のpop（人気）を取得
      const horse=r.scored.find(h=>h.num===ar.num);
      const pop=horse?.pop;
      if(!pop||pop<1||pop>18)return;
      if(!popStats[pop])popStats[pop]={total:0,w1:0,w2:0,w3:0,w5:0};
      const ps=popStats[pop];
      ps.total++;
      if(ar.rank===1)ps.w1++;
      if(ar.rank<=2)ps.w2++;
      if(ar.rank<=3)ps.w3++;
      if(ar.rank<=5)ps.w5++;
    });
  });
  
  return{tot,hits,fukHits,anyHits,rate:Math.round(hits/tot*100),inv,ret,roi:inv>0?Math.round(ret/inv*100):0,topC,popStats,jockeyStats,trainerStats,sireStats};
}
