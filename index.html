// === BULK IMPORT（過去結果一括取り込み）===
function doBulkImport(){
  const text=document.getElementById('bulkIn').value.trim();
  if(!text){alert('レース結果を貼り付けてください');return}
  const status=document.getElementById('bulkStatus');
  const preview=document.getElementById('bulkPreview');
  status.textContent='解析中...';
  preview.innerHTML='';
  
  if(!text.match(/着順/)&&!text.match(/枠\d/)&&!text.match(/レース/)&&!text.match(/\d+メートル/)){
    status.textContent='';
    preview.innerHTML='<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red)">レース結果データが見つかりません。</div>';
    return;
  }
  
  setTimeout(()=>{
  try{
  
  // レースごとに分割
  const raceBlocks=[];
  const lines=text.split('\n');
  let currentBlock=[];

  for(const line of lines){
    const trimmed=line.trim();
    const isNewRace=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed)&&/発走時刻/.test(trimmed);
    const isDateLine=/^\d{4}年\d{1,2}月\d{1,2}日[（(]/.test(trimmed);
    const isPageTop=trimmed==='ページトップへ戻る';

    if((isPageTop||isNewRace||(isDateLine&&currentBlock.length>20))&&currentBlock.length>15){
      raceBlocks.push(currentBlock.join('\n'));
      currentBlock=[];
      if(isPageTop)continue;
    }
    currentBlock.push(line);
  }
  if(currentBlock.length>10)raceBlocks.push(currentBlock.join('\n'));

  // ブロックが1つもなければテキスト全体を1ブロックとして処理
  if(raceBlocks.length===0)raceBlocks.push(text);

  // 着順データを含まないブロック（払戻金のみ等）を除外し、前のレースブロックにマージ
  const mergedBlocks=[];
  for(const block of raceBlocks){
    const hasEntry=block.match(/枠\d/) && (block.match(/[ァ-ヶー]{3,}/) || block.match(/\d:\d{2}\.\d/));
    if(hasEntry){
      mergedBlocks.push(block);
    }else if(mergedBlocks.length>0){
      // 払戻金等のデータは直前のレースブロックに結合
      mergedBlocks[mergedBlocks.length-1]+='\n'+block;
    }
    // 先頭で着順なしのブロックは捨てる
  }
  if(mergedBlocks.length===0)mergedBlocks.push(text); // フォールバック
  
  let totalHorses=0,totalRaces=0,errors=0,errMsgs=[];
  const imported=[];
  
  mergedBlocks.forEach((block,bi)=>{
    try{
      let m,info={};
      m=block.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m)info.date=`${m[1]}/${m[2]}/${m[3]}`;
      m=block.match(/(\d+回\S+\d+日)/);if(m)info.course=m[1];
      m=block.match(/(\d+)レース/);if(m)info.raceNum=m[1];
      m=block.match(/コース[：:][\s]*([\d,]+)メートル[（(](.+?)[)）]/);
      if(m){info.dist=parseInt(m[1].replace(',',''));info.surf=m[2]}
      m=block.match(/(芝|ダート)\s+(良|稍重|重|不良)/);
      if(m){info.type=m[1];info.cond=m[2]}
      
      const pr=parseResult(block,[]);
      if(!pr.allResults||pr.allResults.length<3){
        // 着順データがないブロックは静かにスキップ（払戻のみ等）
        const cnt=(pr.allResults||[]).length;
        if(cnt===0)return; // 着順ゼロ = レースデータではないブロック
        errors++;
        errMsgs.push('ブロック'+(bi+1)+': 着順'+cnt+'頭(3頭未満)');
        return;
      }
      
      const venue=(info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      
      // 馬DB専用ストレージに追加（詳細データ）
      pr.allResults.forEach(ar=>{
        const name=ar.name;if(!name)return;
        if(!HORSE_STORE[name])HORSE_STORE[name]=[];
        const dup=HORSE_STORE[name].some(x=>x.date===(info.date||'')&&x.rank===ar.rank&&x.dist===(info.dist||0));
        if(!dup){
          HORSE_STORE[name].push({
            date:info.date||'',venue,dist:info.dist||0,surface:info.type||'',
            cond:info.cond||'',rank:ar.rank,runners:pr.allResults.length,
            time:ar.time||'',last3f:ar.last3f||0,
            positions:ar.positions||null,jockey:ar.jockey||'',bodyWeight:ar.bodyWeight||''
          });
        }
      });
      
      // RACESに馬データ付きエントリを登録
      const id='bulk_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)+'_'+bi;
      const dupRace=RACES.some(r=>r.info?.date===info.date&&r.info?.raceNum===info.raceNum&&(r.info?.course||'').includes(venue));
      if(!dupRace){
        // allResultsから統一形式のscoredを構築
        const bulkScored=pr.allResults.map(ar=>{
          const sm=ar.sexAge?.match(/(牡|牝|せん)(\d)/);
          const bwm=ar.bodyWeight?.match(/(\d+)\(([+\-\d]+)\)/);
          return{
            num:ar.num,name:ar.name||'',waku:0,
            sex:sm?sm[1]:'',age:sm?+sm[2]:0,
            imp:ar.weight||0,jk:ar.jockey||'',
            wt:bwm?+bwm[1]:0,wc:bwm?parseInt(bwm[2]):null,
            bl:false,prev:[],rec:null,starts:0,
            ns:0,score:0,f:{},
            _resultRank:ar.rank,_resultTime:ar.time||'',
            _resultLast3f:ar.last3f||0,_resultPositions:ar.positions||null,
            _resultMargin:ar.margin||'',_resultPopularity:ar.popularity||0
          };
        });
        RACES.push({
          id,
          label:(info.date||'?')+' '+venue+' '+(info.raceNum||'?')+'R',
          sortKey:(info.date?info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999')+String(info.raceNum||0).padStart(2,'0'),
          info:{date:info.date,course:info.course,raceNum:info.raceNum,dist:info.dist,surf:info.surf,type:info.type,cond:info.cond},
          scored:bulkScored,
          bet:{best:null,tickets:[],totalInv:0},
          result:{top3:pr.top3.map(String),payout:pr.payout||0,reasons:['取込データ'],allResults:pr.allResults,payouts:pr.payouts}
        });
      }
      
      totalRaces++;
      totalHorses+=pr.allResults.length;
      imported.push({venue,raceNum:info.raceNum,horses:pr.allResults.length,date:info.date});
    }catch(e){errors++;errMsgs.push('ブロック'+(bi+1)+': '+e.message);console.error('一括取込エラー:',e)}
  });
  
  if(totalRaces>0){
    saveHorseStore(HORSE_STORE);
    saveR(RACES);
    HORSE_DB=buildHorseDB();
  }
  
  let h='';
  if(totalRaces>0){
    h+=`<div style="padding:8px;border:1px solid var(--grn);background:rgba(45,106,48,.06);font-size:13px;line-height:1.7">`;
    h+=`<div style="font-weight:700;color:var(--grn);margin-bottom:4px">✓ ${totalRaces}レース・${totalHorses}頭を取り込みました</div>`;
    imported.forEach(r=>{h+=`<div>${r.date} ${r.venue}${r.raceNum}R：${r.horses}頭</div>`});
    h+=`<div style="margin-top:6px;color:var(--dim)">馬DB：${Object.keys(HORSE_DB).length}頭</div>`;
    if(errors>0)h+=`<div style="color:var(--red);margin-top:4px">${errors}ブロック失敗</div>`;
    h+=`</div>`;
    status.textContent=`完了（${totalRaces}R/${totalHorses}頭）`;
  }else{
    h+=`<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red);line-height:1.7">`;
    h+=`検出できませんでした（${mergedBlocks.length}ブロック解析、${errors}失敗）<br>`;
    if(errMsgs.length>0)h+=errMsgs.slice(0,5).join('<br>');
    h+=`</div>`;
    status.textContent='失敗';
  }
  preview.innerHTML=h;
  document.getElementById('bulkIn').value='';
  
  }catch(e){
    status.textContent='エラー';
    preview.innerHTML='<div style="padding:8px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red)">処理中にエラーが発生しました：'+e.message+'</div>';
    console.error('一括取込全体エラー:',e);
  }
  },50);
}

// ===== オッズテキストパーサー（全券種対応・タブ区切り＋連結型の自動判定） =====
function parseOddsText(text,mode){
  if(!text||!text.trim())return {};
  const lines=text.split('\n');
  const result={};

  // --- 連結形式パーサー: "121010.93117.9..." → 軸1,相手2:1010.9,相手3:117.9... ---
  function parseConcatLine(line,mode){
    const s=line.replace(/[\s,]+/g,'');
    if(!s||!/^\d/.test(s)||!s.includes('.'))return {};
    let axis,rest;
    const one=parseInt(s.substring(0,1));
    const two=parseInt(s.substring(0,2));
    if(one>=1&&one<=9){axis=one;rest=s.substring(1);}
    else if(two>=10&&two<=18&&s.length>2){axis=two;rest=s.substring(2);}
    else return {};
    let partners=[];
    if(mode==='ordered'){for(let i=1;i<=18;i++){if(i!==axis)partners.push(i);}}
    else{for(let i=axis+1;i<=18;i++)partners.push(i);}
    const out={};let pi=0;
    while(rest.length>0&&pi<partners.length){
      const p=partners[pi];const pStr=String(p);
      if(rest.startsWith(pStr)){
        rest=rest.substring(pStr.length);
        const om=rest.match(/^(\d+\.\d)/);
        if(om){const v=parseFloat(om[1]);
          if(mode==='ordered'){out[axis+'-'+p]=v;}
          else{out[Math.min(axis,p)+'-'+Math.max(axis,p)]=v;}
          rest=rest.substring(om[1].length);
        }else break;
      }
      pi++;
    }
    return out;
  }

  // --- タブ区切りパーサー: 軸番号行＋「相手番号\tオッズ」行 ---
  function parseTabLines(lines,mode){
    const out={};let axis=0;
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue;}
      if(!axis)continue;
      if(mode==='wide'){
        const mw=line.match(/^(\d{1,2})\s+([\d,.]+)\s*[-ー－~〜]\s*([\d,.]+)/);
        if(mw){const p=parseInt(mw[1]);const lo=parseFloat(mw[2].replace(/,/g,''));
          out[Math.min(axis,p)+'-'+Math.max(axis,p)]=lo;continue;}
      }
      const mu=line.match(/^(\d{1,2})\s+([\d,.]+)/);
      if(mu){const p=parseInt(mu[1]);const v=parseFloat(mu[2].replace(/,/g,''));
        if(v>=1.0){
          if(mode==='ordered'){out[axis+'-'+p]=v;}
          else{out[Math.min(axis,p)+'-'+Math.max(axis,p)]=v;}
        }
      }
    }
    return out;
  }

  // --- 自動判定: タブ区切りか連結形式かを判別 ---
  // タブ区切り = 数字だけの行（軸番号行）が存在する
  // 連結形式 = 1行に軸＋全相手オッズが詰まっている（小数点を含む長い行）
  function hasTabFormat(lines){
    return lines.some(l=>/^\s*\d{1,2}\s*$/.test(l))&&lines.some(l=>/^\s*\d{1,2}\s+[\d,.]+/.test(l));
  }

  // ========== single（単勝・複勝）==========
  if(mode==='single'){
    // タブ区切り: "1 2.5" per line
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      const m=line.match(/^(\d{1,2})\s+([\d.]+)/);
      if(m){result[String(parseInt(m[1]))]=parseFloat(m[2]);continue;}
    }
    // タブ区切りで取れなければ連結形式
    if(Object.keys(result).length===0){
      for(const raw of lines){
        const s=raw.replace(/[\s,]+/g,'');
        if(!s||!/^\d/.test(s)||!s.includes('.'))continue;
        let rest=s,num=1;
        while(rest.length>0&&num<=18){
          const ns=String(num);
          if(rest.startsWith(ns)){rest=rest.substring(ns.length);
            const om=rest.match(/^(\d+\.\d)/);
            if(om){result[String(num)]=parseFloat(om[1]);rest=rest.substring(om[1].length);}
            else break;
          }
          num++;
        }
      }
    }
    console.log('[ODDS PARSE] 単勝:',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+'番:'+v+'倍').join(', '));
    return result;
  }

  // ========== trio（3連複・3連単）==========
  // JRA形式: 「1着 X」「2着 Y」「3着」見出し → 「Z オッズ」行の繰り返し
  if(mode==='trio'){
    let first=0,second=0;
    for(const raw of lines){
      const line=raw.replace(/[\t ]+/g,' ').trim();
      if(!line)continue;
      // 「1着 X」形式
      const m1=line.match(/^1着\s+(\d{1,2})/);
      if(m1){first=parseInt(m1[1]);second=0;continue;}
      const m2=line.match(/^2着\s+(\d{1,2})/);
      if(m2){second=parseInt(m2[1]);continue;}
      if(/^3着/.test(line))continue; // 「3着」見出し行はスキップ
      // 1着・2着が確定している状態で「番号 オッズ」行
      if(first&&second){
        const mt=line.match(/^(\d{1,2})\s+([\d,.]+)/);
        if(mt){const third=parseInt(mt[1]);const v=parseFloat(mt[2].replace(/,/g,''));
          if(v>=1.0){
            if(mode==='trio'){
              const nums=[first,second,third].sort((a,b)=>a-b);
              result[nums.join('-')]=v;
            }
          }
        }
      }
    }
    // フォールバック: 旧形式（軸番号 → 相手1-相手2 オッズ）
    if(Object.keys(result).length===0){
      let axis=0;
      for(const raw of lines){
        const line=raw.replace(/[\t ]+/g,' ').trim();
        if(!line)continue;
        if(/^\d{1,2}$/.test(line)){axis=parseInt(line);continue;}
        if(!axis)continue;
        const m3=line.match(/^(\d{1,2})\s*[-ー－]\s*(\d{1,2})\s+([\d,.]+)/)||line.match(/^(\d{1,2})\s+(\d{1,2})\s+([\d,.]+)/);
        if(m3){const a=parseInt(m3[1]),b=parseInt(m3[2]);const v=parseFloat(m3[3].replace(/,/g,''));
          if(v>=1.0){const nums=[axis,a,b].sort((x,y)=>x-y);result[nums.join('-')]=v;}}
      }
    }
    console.log('[ODDS PARSE] 3連:',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
    return result;
  }

  // ========== pair / wide / ordered（馬連・ワイド・馬単・枠連）==========
  // タブ区切り形式を先に試す
  if(hasTabFormat(lines)){
    Object.assign(result,parseTabLines(lines,mode));
  }
  // タブ区切りで取れなければ連結形式を試す
  if(Object.keys(result).length===0){
    for(const raw of lines){
      const out=parseConcatLine(raw,mode);
      Object.assign(result,out);
    }
  }
  const label=mode==='wide'?'ワイド':mode==='ordered'?'馬単':'馬連/枠連';
  if(Object.keys(result).length>0){
    console.log('[ODDS PARSE]',label+':',Object.keys(result).length+'件',
      Object.entries(result).slice(0,3).map(([k,v])=>k+':'+v+'倍').join(', '));
  }
  return result;
}

let _dupOverwrite=false;
function doAnalyze(){
  try{
  const t=document.getElementById('raceIn').value.trim();
  if(!t){alert('出馬表を貼り付けてください');return}
  const parsed=parse(t);
  if(parsed.horses.length===0){
    const wakuCount=t.split('\n').filter(l=>l.trim().startsWith('枠')).length;
    const errDiv=document.getElementById('analyzeError');
    if(errDiv){errDiv.innerHTML=`<div style="padding:10px 14px;border:1px solid var(--red);background:rgba(196,30,58,.06);font-size:13px;color:var(--red);border-radius:4px;margin-top:8px">
      馬が検出できませんでした。JRAの出馬表ページを「枠」から始まるテキスト形式でコピーしてください。<br>
      <span style="font-size:11px;color:var(--dim)">（ヒント：検出できた「枠」行数が ${wakuCount} 行でした）</span>
    </div>`;errDiv.classList.remove('hidden')}
    return;
  }
  // === 重複チェック ===
  const pVenue=(parsed.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
  const pDate=parsed.info.date||'';
  const pNum=parsed.info.raceNum||'';
  const dupKey=pDate+'_'+pVenue+'_'+pNum;
  const existingDup=RACES.find(r=>{
    const v=(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    return (r.info?.date||'')==pDate&&v==pVenue&&(r.info?.raceNum||'')==pNum;
  });
  if(existingDup&&!_dupOverwrite){
    const errDiv=document.getElementById('analyzeError');
    if(errDiv){
      errDiv.innerHTML=`<div style="padding:12px 14px;border-left:4px solid var(--red);background:rgba(196,30,58,.08);font-size:13px;color:var(--ink);border-radius:4px;margin-top:8px;position:relative">
        <button onclick="this.parentElement.parentElement.classList.add('hidden')" style="position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--dim)">×</button>
        <div style="font-weight:700;color:var(--red);margin-bottom:6px">⚠️ このレースはすでに登録されています</div>
        <div style="margin-bottom:8px">${pDate} ${pVenue} ${pNum}R</div>
        <div style="font-size:12px;color:var(--dim);margin-bottom:10px">再分析する場合は「上書きして再分析」を押してください。</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-r" onclick="_dupOverwrite=true;doAnalyze();_dupOverwrite=false;" style="padding:8px 16px;font-size:13px">上書きして再分析</button>
          <button class="btn-s" onclick="document.getElementById('analyzeError').classList.add('hidden')" style="padding:8px 16px;font-size:13px">キャンセル</button>
        </div>
      </div>`;
      errDiv.classList.remove('hidden');
    }
    return;
  }
  // 上書き時: 既存データを削除
  if(existingDup&&_dupOverwrite){
    RACES=RACES.filter(r=>r.id!==existingDup.id);
  }
  const errDiv2=document.getElementById('analyzeError');if(errDiv2)errDiv2.classList.add('hidden');
  const scored=score(parsed);
  const bet=genBet(scored,parsed.info);
  const id=Date.now().toString();
  const venue=pVenue;
  const label=(pDate||'?')+' '+venue+' '+(pNum||'?')+'R '+(parsed.info.dist||'')+'m '+(parsed.info.surf||'');
  const sk=pDate?pDate.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join(''):'99999999';
  const sortKey=sk+String(pNum||0).padStart(2,'0');
  const race={id,label,sortKey,info:parsed.info,scored,bet,result:null,_scoreVer:'v5.0.0'};
  RACES.unshift(race);saveR(RACES);
  autoSaveAll();
  document.getElementById('raceIn').value='';
  CUR=id;showView('detail');
  }catch(e){alert('分析エラー: '+e.message+'\n'+e.stack)}
}

// === LIST ===
function renderList(){
  let needSave=false;
  RACES.forEach(r=>{
    if(r.info?.date&&r.sortKey){
      const correct=r.info.date.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('')+String(r.info.raceNum||0).padStart(2,'0');
      if(r.sortKey!==correct){r.sortKey=correct;needSave=true}
    }
  });
  if(needSave)saveR(RACES);
  document.getElementById('countBadge').textContent='('+RACES.length+')';
  let h='';
  if(!RACES.length){h='<div style="text-align:center;padding:40px;color:var(--dim)">レースデータなし</div>';h+=`<div style="text-align:center;margin-top:12px"><button class="btn btn-b" onclick="triggerCSVImport()" style="padding:10px 28px;font-size:15px;background:var(--grn)">📂 検証データCSV取込</button></div>`;document.getElementById('vList').innerHTML=h;return}
  
  // 日付グループ化
  const sorted=[...RACES].sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  const groups={};
  sorted.forEach(r=>{const dt=r.info.date||'日付不明';if(!groups[dt])groups[dt]=[];groups[dt].push(r)});
  const padDate=d=>d.split('/').map((v,i)=>i===0?v:v.padStart(2,'0')).join('/');
  const dates=Object.keys(groups).sort((a,b)=>padDate(b).localeCompare(padDate(a)));
  const latestDate=dates[0]||'';
  const pastDates=dates.slice(1);
  
  // 通算収支（見送り・取込を除外）
  const allAnalyzed=RACES.filter(r=>r.result?.top3?.length>=3);
  const skipped=allAnalyzed.filter(r=>getHitInfo(r).skip).length;
  const done=allAnalyzed.filter(r=>!getHitInfo(r).skip);
  const hits=done.filter(r=>getHitInfo(r).anyHit).length;
  const fukHits=0;
  const totalBet=done.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
  const totalReturn=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  const profit=totalReturn-totalBet;

  // 軸馬的中率（A馬が3着以内に入った率）
  let axisIn3=0,axisTotal=0;
  done.forEach(r=>{
    if(!r.bet?.best?.horses?.[0]||!r.result?.top3)return;
    axisTotal++;
    const anum=r.bet.best.horses[0].num;
    if(r.result.top3.map(Number).includes(anum))axisIn3++;
  });

  // スコア帯別的中率
  const scoreBands=[{label:'90-100',min:90,max:100},{label:'80-89',min:80,max:89},{label:'70-79',min:70,max:79}];
  const bandStats=scoreBands.map(b=>{
    const rs=done.filter(r=>r.scored?.[0]?.ns>=b.min&&r.scored?.[0]?.ns<=b.max);
    const h2=rs.filter(r=>getHitInfo(r).anyHit).length;
    return{label:b.label,total:rs.length,hit:h2,rate:rs.length>0?Math.round(h2/rs.length*100):0};
  });

  h+=`<div class="pnl" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-weight:700;font-size:13px">📊 通算収支</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px">
        <span>購入 <b>${done.length}</b>R</span>
        <span style="color:var(--lt)">見送り <b>${skipped}</b>R</span>
        <span style="color:var(--grn)">的中 <b>${hits}</b></span>
        ${fukHits>0?`<span style="color:var(--blu)">複勝的中 <b>${fukHits}</b></span>`:''}
        <span style="color:var(--red)">不的中 <b>${done.length-hits-fukHits}</b></span>
      </div>
    </div>`;
  if(done.length>0){
    h+=`<div style="display:flex;align-items:baseline;gap:16px;margin-top:8px;flex-wrap:wrap;border-top:1px solid var(--bdr);padding-top:8px">
      <div style="font-size:12px;color:var(--dim)">投資 <b>${totalBet.toLocaleString()}円</b></div>
      <div style="font-size:12px;color:var(--dim)">回収 <b>${totalReturn.toLocaleString()}円</b></div>
      <div style="font-size:18px;font-weight:900;color:${profit>=0?'var(--grn)':'var(--red)'}">${profit>=0?'+':''}${profit.toLocaleString()}円</div>
      <div style="font-size:12px;color:${totalReturn>=totalBet?'var(--grn)':'var(--red)'}">回収率 <b>${totalBet>0?Math.round(totalReturn/totalBet*100):0}%</b></div>
    </div>`;
    h+=`<div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)">
      <span>軸馬3着内率 <b>${axisTotal>0?Math.round(axisIn3/axisTotal*100):0}%</b>(${axisIn3}/${axisTotal})</span>
      ${bandStats.filter(b=>b.total>0).map(b=>`<span>ns${b.label}: <b>${b.rate}%</b>(${b.hit}/${b.total})</span>`).join('')}
    </div>`;
  }
  h+=`<div style="margin-top:8px;text-align:right"><button class="btn-s" onclick="downloadAllCSV()" style="padding:6px 16px">📥 全データCSV出力</button></div>`;
  h+=`</div>`;

  // 全日付を統一表示
  const showDates=[latestDate,...pastDates].filter(Boolean);
  
  showDates.forEach(dt=>{
    if(!dt||!groups[dt])return;
    const dayRaces=groups[dt];
    const dayDone=dayRaces.filter(r=>r.result?.top3?.length>=3&&!isPastOnly(r)&&!getHitInfo(r).skip);
    const dayHits=dayDone.filter(r=>getHitInfo(r).anyHit).length;
    const dayFuk=0;
    const dayInv=dayDone.reduce((s,r)=>s+(getHitInfo(r).inv||0),0);
    const dayRet=dayDone.reduce((s,r)=>s+getHitInfo(r).ret,0);
    const dayProfit=dayRet-dayInv;
    const dayRoi=dayInv>0?Math.round(dayRet/dayInv*100):0;
    const dayPending=dayRaces.length-dayDone.length;
    const dp=dt.split('/');
    let dow='';
    if(dp.length===3){const d=new Date(+dp[0],+dp[1]-1,+dp[2]);dow=['日','月','火','水','木','金','土'][d.getDay()]||''}
    
    const gid='dg_'+dt.replace(/\//g,'');
    h+=`<div style="margin-top:8px">`;
    h+=`<div onclick="document.getElementById('${gid}').classList.toggle('hidden')" style="cursor:pointer;padding:10px 14px;background:var(--ink);color:var(--p);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'Shippori Mincho',serif;font-size:16px;font-weight:900;color:var(--gld)">${dt}${dow?'（'+dow+'）':''}</span>
        <span style="font-size:12px">${dayRaces.length}R</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px">
        <span style="color:var(--grn)">✓${dayHits}</span>
        ${dayFuk>0?`<span style="color:var(--blu)">△${dayFuk}</span>`:''}
        <span style="color:var(--red)">✗${dayDone.length-dayHits-dayFuk}</span>
        ${dayPending>0?`<span style="color:var(--gld)">未${dayPending}</span>`:''}
        ${dayDone.length>0?`<span style="font-weight:700;color:${dayProfit>=0?'var(--grn)':'var(--red)'}">${dayProfit>=0?'+':''}${dayProfit.toLocaleString()}円</span>
        <span style="color:${dayRoi>=100?'var(--grn)':'var(--red)'}">回収率${dayRoi}%</span>`:''}
      </div>
    </div>`;
    
    // 最新日は展開、過去は折りたたみ
    h+=`<div id="${gid}"${dt===latestDate?'':' class="hidden"'}>`;
    dayRaces.forEach(r=>{
      const hasR=r.result?.top3?.length>=3;
      const hi=getHitInfo(r);
      const isSkip=hi.skip;
      const cls=hasR?(isSkip?'pend':hi.anyHit?'hit':'miss'):'pend';
      const betInfo=(!isSkip&&r.bet?.best)?r.bet.best.type+' '+r.bet.best.desc:'';
      const inv=hi.inv||0;
      let profitStr='';
      if(hasR&&!isSkip){const p=hi.ret-inv;profitStr=p>=0?`+${Math.round(p).toLocaleString()}円`:`${Math.round(p).toLocaleString()}円`}
      const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
      const pastLabel=isPastOnly(r)?`<span style="font-size:10px;color:var(--gld);font-weight:700;background:rgba(184,134,11,.12);padding:1px 6px;border-radius:3px;margin-left:5px">取込</span>`:'';

      h+=`<div class="card ${cls}" onclick="CUR='${r.id}';showView('detail')">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px"><span style="font-weight:900">${venue}</span> ${r.info.raceNum||'?'}R${pastLabel}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:1px">${r.info.dist||''}m ${r.info.surf||''}${r.info.cond?' / '+r.info.cond:''}${(!r.info.surf||!r.info.cond)?'<span style="color:var(--red);font-weight:700"> ⚠馬場未入力</span>':''}${betInfo?' ／ '+betInfo:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${isSkip?`<div style="font-size:11px;color:var(--lt);font-weight:700">見送り</div>`
          :hasR?`<div style="font-weight:900;font-size:12px;color:${hi.anyHit?'var(--grn)':'var(--red)'}">${hi.anyHit?'✓ '+hi.label:'✗'}</div>
          <div style="font-size:11px;font-weight:700;color:${hi.ret>=inv?'var(--grn)':'var(--red)'}">${profitStr}</div>`
          :`<div style="font-size:11px;color:var(--gld);font-weight:700">未入力</div>`}
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  
  if(showDates.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--dim)">データなし</div>`;
  }

  if(RACES.length>0){
    h+=`<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn-s" onclick="recalcAll()" style="padding:6px 20px;color:var(--blu)">🔄 全レース再分析</button>
      <button class="btn-s" onclick="downloadAllCSV()" style="padding:6px 20px">📥 全データCSV出力</button>
      <button class="btn-s" onclick="triggerCSVImport()" style="padding:6px 20px;color:var(--grn)">📂 CSV取込</button>
      <button class="btn-s" onclick="if(confirm('保存データを全て削除しますか？（元に戻せません）')){RACES=[];saveR(RACES);renderList()}" style="padding:6px 20px;color:var(--red)">🗑 全データ削除</button>
    </div>`;
  }
  document.getElementById('vList').innerHTML=h;
}

function recalcAll(){
  if(!confirm('全'+RACES.length+'レースを最新ロジックで再分析します。\n買い目・的中判定が変わります。結果データ（着順・払戻金）は保持されます。\n\n実行しますか？'))return;
  let count=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0)return;
    const race={horses:r.scored.map(h=>({
      num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
      rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
      jk:h.jk,imp:h.imp,sire:h.sire,trainer:h.trainer,bl:h.bl,prev:h.prev||[]
    })),info:r.info};
    try{
      const newScored=score(race);
      const newBet=genBet(newScored,r.info,r._marketOdds);
      r.scored=newScored;
      r.bet=newBet;
      if(r.result?.top3?.length>=3){
        const reasons=analyzeLoss(r,r.result.top3);
        r.result.reasons=reasons;
      }
      count++;
    }catch(e){console.error('再分析エラー:',r.label,e)}
  });
  saveR(RACES);
  renderList();
  alert(count+'レースを再分析しました。買い目・的中判定が最新ロジックに更新されました。');
}

// === 全データCSV出力（統一形式） ===
function downloadAllCSV(){
  const BOM='\uFEFF';
  const header=['日付','競馬場','レース番号','クラス','距離','コース','回り','馬場状態','頭数',
    '馬番','枠番','馬名','性齢','斤量','騎手名','馬体重','馬体重増減','ブリンカー',
    '前走日付','前走競馬場','前走レース格','前走距離','前走コース','前走馬場',
    '前走着順','前走頭数','前走着差','前走上がりタイム','前走間隔(週)',
    'スコア合計','補正スコア','補正値','印',
    '実際着順','3着以内','単勝オッズ','人気',
    '実際上がりタイム','実際通過順位'];
  const rows=[];
  const sorted=[...RACES].filter(r=>(r.scored?.length>0)||(r.result?.allResults?.length>0)).sort((a,b)=>{
    const ka=a.sortKey||a.id,kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0;
  });
  const marks=['◎','○','▲','△'];

  sorted.forEach(r=>{
    const inf=r.info||{};
    const venue=(inf.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    const top3=r.result?.top3?.map(n=>+n)||[];
    const allRes=r.result?.allResults||[];
    // 馬データソース: scored（出馬表分析・一括取込）
    const horses=r.scored?.length>0?r.scored:[];
    if(horses.length===0)return;
    const headCount=horses.length;
    const isBulk=r.id?.startsWith('bulk_')||r.id?.startsWith('csv_');

    horses.forEach((h,idx)=>{
      const l=h.prev?.[0];
      // 前走間隔(週)
      let weeks='';
      if(l?.dateKey&&inf.date){
        const parts=inf.date.split('/');
        const today=new Date(+parts[0],+parts[1]-1,+parts[2]);
        const ly=Math.floor(l.dateKey/10000),lm=Math.floor((l.dateKey%10000)/100),ld=l.dateKey%100;
        const lastDay=new Date(ly,lm-1,ld);
        weeks=Math.round(Math.round((today-lastDay)/(1000*60*60*24))/7);
      }
      // 前走データ
      const prevDate=l?.dateKey?String(l.dateKey).replace(/(\d{4})(\d{2})(\d{2})/,'$1/$2/$3'):'';
      // 印（出馬表分析レースのみ）
      const mark=(!isBulk&&idx<4)?marks[idx]:'';
      // 結果データ
      const ar=allRes.find(a=>a.num===h.num);
      const actualRank=ar?.rank||h._resultRank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:'');
      const inTop3=top3.includes(h.num)?1:(actualRank&&actualRank<=3?1:0);
      const resLast3f=ar?.last3f||h._resultLast3f||'';
      const resPos=ar?.positions?ar.positions.join('-'):(h._resultPositions?h._resultPositions.join('-'):'');

      rows.push([
        inf.date||'',venue,inf.raceNum||'',inf.cls||'',
        inf.dist||'',inf.type||'',inf.dir||'',inf.cond||'',headCount,
        h.num,h.waku||'',h.name||'',(h.sex||'')+(h.age||''),h.imp||'',h.jk||'',
        h.wt||'',h.wc!=null?(h.wc>=0?'+':'')+h.wc:'',h.bl?'有':'',
        prevDate,l?.venue||'',l?.cls||'',l?.dist||'',
        l?.surface==='ダ'?'ダート':l?.surface==='芝'?'芝':(l?.surface||''),l?.cond||'',
        l?.fin||'',l?.run||'',l?.gap!=null?l.gap:'',l?.f3||'',weeks,
        h.ns||'',h.adjNs!=null?h.adjNs:'',h.adjDelta||0,mark,
        actualRank,top3.length>=3?inTop3:'',
        h.odds||ar?.popularity?'':'',ar?.popularity||h._resultPopularity||'',
        resLast3f,resPos
      ]);
    });
  });
  if(rows.length===0){alert('出力するデータがありません。\nRACES: '+RACES.length+'件');return}
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{const s=String(cell==null?'':cell);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='keiba_all_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  alert('全データCSV出力完了: '+rows.length+'行（'+sorted.length+'レース）');
}

// === 以下は旧CSV関数（互換性維持） ===
function downloadCSV(){
  const BOM='\uFEFF';
  const header=['日付','競馬場','レース','距離','コース','馬場','券種','買目','馬名','結果','1着','2着','3着','配当(100円あたり)','回収額','投資','利益','回収率','信頼度','軸馬EV','◎馬番','◎スコア','◎EV','○馬番','○スコア','○EV'];
  const rows=[];
  const sorted=[...RACES].filter(r=>!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')).sort((a,b)=>{const ka=a.sortKey||a.id;const kb=b.sortKey||b.id;return ka<kb?-1:ka>kb?1:0});
  sorted.forEach(r=>{
    const hasR=r.result?.top3?.length>=3;
    const hi=hasR?getHitInfo(r):{wideHit:false,fukHit:false,anyHit:false,label:'未入力',ret:0,inv:0};
    const venue=(r.info.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    const betType=r.bet?.best?.type||'';
    const betNums=r.bet?.best?.desc||'';
    const betNames=r.bet?.best?.horses?.map(h=>h.name).join('×')||'';
    const payout=r.result?.payout||0;
    const ret=hi.ret;
    const inv=hi.inv||0;
    const profit=ret-inv;
    const nameOf=n=>{const h=r.scored?.find(x=>x.num===+n);return h?h.name:''};
    const t1=hasR?r.result.top3[0]:'';
    const t2=hasR?r.result.top3[1]:'';
    const t3=hasR?r.result.top3[2]:'';
    rows.push([
      r.info.date||'',
      venue,
      (r.info.raceNum||'')+'R',
      (r.info.dist||'')+'m',
      r.info.surf||'',
      r.info.cond||'',
      betType,
      betNums,
      betNames,
      hi.skip?'見送り':hasR?hi.label:'未入力',
      hasR?t1+'番 '+nameOf(t1):'',
      hasR?t2+'番 '+nameOf(t2):'',
      hasR?t3+'番 '+nameOf(t3):'',
      hasR&&!hi.skip?payout:'',
      hi.skip?'':hasR?ret:'',
      hi.skip?'':inv,
      hi.skip?'':hasR?profit:'',
      hi.skip?'':hasR&&inv>0?Math.round(ret/inv*100)+'%':'',
      r.bet?.confidence||'',
      r.bet?.best?.ev||r.scored?.[0]?.ev||'',
      r.scored?.[0]?.num||'',r.scored?.[0]?.ns||'',r.scored?.[0]?.ev||'',
      r.scored?.[1]?.num||'',r.scored?.[1]?.ns||'',r.scored?.[1]?.ev||''
    ]);
  });
  // 合計行
  const done=RACES.filter(r=>r.result?.top3?.length>=3&&!getHitInfo(r).skip);
  const totalBet=done.reduce((s,r)=>s+getHitInfo(r).inv,0);
  const totalRet=done.reduce((s,r)=>s+getHitInfo(r).ret,0);
  rows.push([]);
  rows.push(['合計','','','','','','','','','',
    '','','','',totalRet,totalBet,totalRet-totalBet,totalBet>0?Math.round(totalRet/totalBet*100)+'%':'','','','','','','','','']);
  
  const csv=BOM+[header,...rows].map(row=>row.map(cell=>{
    const s=String(cell==null?'':cell);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='keiba_results_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// === CSV IMPORT / RESTORE ===
function triggerCSVImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>importAnalysisCSV(ev.target.result,file.name);
    reader.readAsText(file);
  };
  inp.click();
}

function parseCSVLine(line){
  const cells=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'&&line[i+1]==='"'){cur+='"';i++}
      else if(c==='"')inQ=false;
      else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){cells.push(cur);cur=''}
      else cur+=c;
    }
  }
  cells.push(cur);
  return cells;
}

function importAnalysisCSV(text,fileName){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){alert('CSVが空です');return}
  const hdr=parseCSVLine(lines[0]);
  const idx={};
  hdr.forEach((h,i)=>idx[h.trim()]=i);

  // 必須列: 日付・競馬場・馬名のみ。レース・馬番・スコアはオプション
  const need=['日付','競馬場','馬名'];
  const missing=need.filter(k=>idx[k]===undefined);
  if(missing.length>0){alert('必須列が見つかりません: '+missing.join(', ')+'\n\nCSVには最低限「日付」「競馬場」「馬名」列が必要です。');return}

  const g=k=>idx[k]!==undefined;
  // レースごとにグルーピング
  const raceMap=new Map();
  for(let i=1;i<lines.length;i++){
    const c=parseCSVLine(lines[i]);
    if(c.length<3)continue;
    const date=c[idx['日付']]||'';
    const venue=c[idx['競馬場']]||'';
    const raceStr=g('レース')?(c[idx['レース']]||''):(g('レース番号')?(c[idx['レース番号']]||''):'');
    const dist=g('距離')?parseInt(c[idx['距離']])||0:0;
    // レースキー: レース番号があればそれを使い、なければ日付+競馬場+距離
    const raceKey=raceStr?date+'_'+venue+'_'+raceStr:date+'_'+venue+'_'+dist;
    if(!raceMap.has(raceKey))raceMap.set(raceKey,{date,venue,raceStr,rows:[]});
    raceMap.get(raceKey).rows.push(c);
  }

  let imported=0,skipped=0,horseAccumulated=0;
  const factorKeys=['前走','上がり','距離','血統','騎手','安定','トレンド','着差','間隔','蓄積','回り','馬場'];

  for(const [raceKey,rd] of raceMap){
    const {date,venue,raceStr,rows}=rd;
    const raceNum=(raceStr||'').replace(/R$/i,'');
    const distStr=g('距離')?rows[0][idx['距離']]:'';
    const dist=parseInt(distStr)||0;
    const surf=g('コース')?rows[0][idx['コース']]:'';
    const cond=g('馬場')?rows[0][idx['馬場']]:(g('馬場状態')?rows[0][idx['馬場状態']]:'');
    const cls=g('クラス')?rows[0][idx['クラス']]:'';
    const headCount=g('頭数')?parseInt(rows[0][idx['頭数']])||rows.length:rows.length;

    // 重複チェック
    const sortKey=date.replace(/\//g,'')+(raceNum?('0'+raceNum).slice(-2):'00');
    const dupLabel=date+' '+venue+' '+(raceNum||'?')+'R';
    const exists=RACES.some(r=>{
      if(r.label===dupLabel)return true;
      if(r.sortKey===sortKey&&r.info?.date===date)return true;
      return false;
    });
    if(exists){skipped++;continue}

    // コース種別推定
    let type='';
    if(surf){
      if(surf.includes('ダート')||surf==='ダ')type='ダート';
      else if(surf.includes('芝'))type='芝';
    }

    // 馬データ構築（scored 配列 + HORSE_STORE蓄積）
    const scoredHorses=[];
    let hasResult=false;
    rows.forEach((c,rowIdx)=>{
      const num=g('馬番')?parseInt(c[idx['馬番']])||rowIdx+1:rowIdx+1;
      const name=(c[idx['馬名']]||'').trim();
      if(!name)return;
      const odds=g('単勝オッズ')?parseFloat(c[idx['単勝オッズ']])||0:0;
      const pop=g('人気')?parseInt(c[idx['人気']])||0:0;
      const ns=g('スコア(ns)')?parseFloat(c[idx['スコア(ns)']])||0:(g('スコア合計')?parseFloat(c[idx['スコア合計']])||0:0);
      const actualRank=g('実際着順')?parseInt(c[idx['実際着順']])||null:null;
      const inTop3=g('3着以内')?(c[idx['3着以内']]==='1'):actualRank!=null&&actualRank<=3;
      if(actualRank)hasResult=true;

      const waku=g('枠番')?parseInt(c[idx['枠番']])||0:0;
      const jk=g('騎手名')?(c[idx['騎手名']]||''):'';
      const trainer='';
      const wt=g('馬体重')?parseInt(c[idx['馬体重']])||0:0;
      const wc=g('馬体重増減')?parseInt(c[idx['馬体重増減']])||0:0;
      const sexAge=g('性齢')?(c[idx['性齢']]||''):'';
      const sexM=sexAge.match(/(牡|牝|せん)(\d)/);
      const sex=sexM?sexM[1]:'';
      const age=sexM?+sexM[2]:0;
      const imp=g('斤量')?parseFloat(c[idx['斤量']])||0:0;
      const bl=g('ブリンカー')?(c[idx['ブリンカー']]||'').trim():'';
      const sire=g('父')?(c[idx['父']]||''):'';
      const last3f=g('実際上がりタイム')?parseFloat(c[idx['実際上がりタイム']])||0:0;
      const posStr=g('実際通過順位')?(c[idx['実際通過順位']]||''):'';
      const positions=posStr?posStr.split('-').map(Number).filter(n=>!isNaN(n)):[];

      // --- 前走データ → prev 配列を構築 ---
      const prev=[];
      const prevDate=g('前走日付')?(c[idx['前走日付']]||'').trim():'';
      if(prevDate){
        const prevVenue=g('前走競馬場')?(c[idx['前走競馬場']]||''):'';
        const prevDist=g('前走距離')?parseInt(c[idx['前走距離']])||0:0;
        const prevCourse=g('前走コース')?(c[idx['前走コース']]||''):'';
        const prevCond=g('前走馬場')?(c[idx['前走馬場']]||''):'';
        const prevRank=g('前走着順')?parseInt(c[idx['前走着順']])||0:0;
        const prevRun=g('前走頭数')?parseInt(c[idx['前走頭数']])||0:0;
        const prevGap=g('前走着差')?parseFloat(c[idx['前走着差']]):null;
        const prevF3=g('前走上がりタイム')?parseFloat(c[idx['前走上がりタイム']])||0:0;
        const prevCls=g('前走レース格')?(c[idx['前走レース格']]||''):'';
        const prevSurf=prevCourse.includes('ダート')||prevCourse==='ダ'?'ダ':prevCourse.includes('芝')?'芝':prevCourse;
        const dp=prevDate.split('/');
        const dateKey=dp.length>=3?(+dp[0]*10000+ +dp[1]*100+ +dp[2]):0;
        prev.push({
          fin:prevRank,run:prevRun,dist:prevDist,surface:prevSurf,
          cond:prevCond,venue:prevVenue,cls:prevCls,
          gap:prevGap!=null&&!isNaN(prevGap)?prevGap:null,
          f3:prevF3,dateKey,pos:null
        });
      }

      // ファクター復元
      const f={};
      factorKeys.forEach(fk=>{
        const col='F_'+fk;
        if(!g(col))return;
        const val=c[idx[col]]||'';if(!val)return;
        if(fk==='昇降級')return;
        f[fk]={v:0,c:val.startsWith('g')?'g':val.startsWith('b')?'b':'n'};
      });

      scoredHorses.push({
        num,name,waku,odds,pop,ns,score:ns,
        jk,trainer,wt,wc,sex,age,imp,bl:bl?true:false,sire,
        prev,f,
        _resultRank:actualRank,
        _resultLast3f:last3f,
        _resultPositions:positions.length>0?positions:null,
        _resultOdds:odds,
        _resultPopularity:pop
      });

      // --- HORSE_STORE に蓄積 ---
      if(actualRank&&name){
        if(!HORSE_STORE[name])HORSE_STORE[name]=[];
        const dup=HORSE_STORE[name].some(x=>x.date===date&&x.rank===actualRank&&x.dist===dist);
        if(!dup){
          HORSE_STORE[name].push({
            date,venue,dist,surface:type||surf,cond,
            rank:actualRank,runners:headCount,
            time:'',last3f,positions:positions.length>0?positions:null,
            jockey:jk,bodyWeight:wt?String(wt):''
          });
          horseAccumulated++;
        }
      }
    });

    // scored をスコア降順ソート
    scoredHorses.sort((a,b)=>(b.ns||0)-(a.ns||0));

    // top3復元
    const top3=scoredHorses.filter(h=>h._resultRank&&h._resultRank<=3)
      .sort((a,b)=>a._resultRank-b._resultRank).map(h=>String(h.num));

    // 信頼度・レース質
    const confidence=g('信頼度')?rows[0][idx['信頼度']]:'';
    const raceQualityScore=g('レース質スコア')?parseInt(rows[0][idx['レース質スコア']])||0:0;
    const skipStr=g('見送り')?rows[0][idx['見送り']]:'';
    const skipRecommended=skipStr==='見送り';
    const inv=g('投資額')?parseInt(rows[0][idx['投資額']])||0:0;
    const ret=g('回収額')?parseInt(rows[0][idx['回収額']])||0:0;

    const raceId='csv_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+imported;
    const raceObj={
      id:raceId,
      label:date+' '+venue+' '+(raceNum||'?')+'R',
      sortKey,
      info:{date,course:venue,raceNum:raceNum||'',dist,surf:surf||'',type:type||'',cond:cond||'',cls:cls||''},
      scored:scoredHorses,
      bet:{best:null,tickets:[],totalInv:inv,confidence,skipRecommended,
        raceQuality:{score:raceQualityScore,reasons:[]}},
      result:{
        top3:top3.length>=3?top3:[],
        payout:ret,
        reasons:['CSV取込データ'],
        allResults:scoredHorses.filter(h=>h._resultRank).map(h=>({
          rank:h._resultRank,num:h.num,name:h.name,
          jockey:h.jk,last3f:h._resultLast3f,
          positions:h._resultPositions,
          popularity:h._resultPopularity,
          odds:h._resultOdds,
          bodyWeight:h.wt?String(h.wt):''
        })).sort((a,b)=>a.rank-b.rank)
      },
      _scoreVer:'csv_import_v2'
    };

    RACES.push(raceObj);
    imported++;
  }

  if(imported>0||horseAccumulated>0){
    saveR(RACES);
    // HORSE_STORE も保存
    try{localStorage.setItem(HK,JSON.stringify(HORSE_STORE))}catch{}
    HORSE_DB=buildHorseDB();
    renderList();
  }
  alert(`CSV取込完了\n\n取込: ${imported} レース\nスキップ（重複）: ${skipped} レース\n馬DB蓄積: ${horseAccumulated} 出走\nファイル: ${fileName}`);
}

// === 騎手・調教師複勝率ヘルパー ===
function calcJkRateForDetail(jkName){
  if(!jkName)return null;
  let total=0,w3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{if(h.jk!==jkName)return;const rank=h._resultRank||(top3.includes(h.num)?top3.indexOf(h.num)+1:0);if(!rank)return;total++;if(rank<=3)w3++});
    (r.result?.allResults||[]).forEach(ar=>{const sc=(r.scored||[]).find(h=>h.num===ar.num);if((ar.jockey||sc?.jk||'')!==jkName)return;total++;if(ar.rank<=3)w3++});
  });
  return total>=3?{rate:Math.round(w3/total*100),total}:null;
}
function calcTrRateForDetail(trName){
  if(!trName)return null;
  let total=0,w3=0;
  RACES.forEach(r=>{
    const top3=(r.result?.top3||[]).map(n=>+n);
    (r.scored||[]).forEach(h=>{if(h.trainer!==trName)return;const rank=h._resultRank||(top3.includes(h.num)?top3.indexOf(h.num)+1:0);if(!rank)return;total++;if(rank<=3)w3++});
  });
  return total>=3?{rate:Math.round(w3/total*100),total}:null;
}

  } else {
  // ===== 推奨馬券パネル =====

function buildAnalysisSnapshot(r){
  if(!r.scored||!r.result)return null;
  const top3=r.result.top3?.map(n=>+n)||[];
  const allResults=r.result.allResults||[];
  const payouts=r.result.payouts||{};
  return{
    raceInfo:{
      date:r.info?.date,
      venue:(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,''),
      dist:r.info?.dist,
      surface:r.info?.type,
      cond:r.info?.cond,
      dir:r.info?.dir,
      headCount:r.scored.length,
      cls:r.info?.cls
    },
    horses:r.scored.map(h=>{
      const ar=allResults.find(a=>a.num===h.num);
      const actualRank=ar?.rank||(top3.indexOf(h.num)>=0?top3.indexOf(h.num)+1:null);
      return{
        num:h.num,name:h.name,odds:h.odds,pop:h.pop,ns:h.ns,score:h.score,
        factors:Object.fromEntries(Object.entries(h.f||{}).map(([k,v])=>[k,{v:v.v,c:v.c}])),
        actualRank,inTop3:top3.includes(h.num),
        isA:r.bet?.best?.horses?.[0]?.num===h.num,
        isB:r.bet?.best?.horses?.[1]?.num===h.num,
        isC:r.bet?.wideHorseC?.num===h.num
      };
    }),
    betResult:{
      type:r.bet?.best?.type,desc:r.bet?.best?.desc,
      wideDesc:r.bet?.wideHorseB&&r.bet?.wideHorseC?r.bet.wideHorseB.num+'─'+r.bet.wideHorseC.num:null,
      totalInv:r.bet?.totalInv||0,confidence:r.bet?.confidence,confLevel:r.bet?.confLevel,
      raceQualityScore:r.bet?.raceQuality?.score,skipRecommended:r.bet?.skipRecommended
    },
    hitResult:(()=>{const hi=getHitInfo(r);return{wideHit:hi.wideHit,wideTicketHit:hi.wideTicketHit,anyHit:hi.anyHit,label:hi.label,ret:hi.ret,inv:hi.inv,profit:hi.ret-hi.inv,roi:hi.inv>0?Math.round(hi.ret/hi.inv*100):0}})(),
    keyPayouts:{
      wide:payouts['ワイド']?.slice(0,3)||[],
      umaren:payouts['馬連']?.slice(0,3)||[],
      tansho:payouts['単勝']?.slice(0,3)||[]
    }
  };
}

function doSaveResult(id){
  const ta=document.getElementById('resIn');
  if(!ta)return;
  const r=RACES.find(x=>x.id===id);if(!r)return;
  const pr=parseResult(ta.value,r.scored);
  if(pr.top3.length<3){alert('着順を読み取れませんでした。\n1着〜3着の馬番が含まれるテキストを貼り付けてください。');return}
  const pay=parseInt(document.getElementById('payIn')?.value)||pr.payout||0;
  const reasons=analyzeLoss(r,pr.top3);
  r.result={
    top3:pr.top3.map(String),
    payout:pay,
    reasons,
    allResults:pr.allResults,
    harlonTime:pr.harlonTime,
    racePace:pr.racePace,
    corners:pr.corners,
    payouts:pr.payouts
  };
  // allResultsのオッズ・人気・着順をscoredに反映
  if(pr.allResults&&r.scored){
    pr.allResults.forEach(ar=>{
      const h=r.scored.find(x=>x.num===ar.num);
      if(!h)return;
      h._resultRank=ar.rank;
      if(ar.odds)h._resultOdds=ar.odds;
      if(ar.popularity)h._resultPopularity=ar.popularity;
      if(ar.last3f)h._resultLast3f=ar.last3f;
      // オッズが未入力だった馬に結果のオッズを補完
      if(!h.odds&&ar.odds)h.odds=ar.odds;
      if(!h.pop&&ar.popularity)h.pop=ar.popularity;
    });
  }
  // 検証用スナップショット（フェーズ2でのファクター検証に使用）
  try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){console.warn('snapshot生成失敗:',e)}
  saveR(RACES);
  autoSaveAll(); // 結果保存後に自動保存
  renderDetail(id);
  updatePhaseBanner();
}

function resetResult(id){
  const r=RACES.find(x=>x.id===id);if(!r)return;
  r.result=null;saveR(RACES);renderDetail(id);
}

function generateHorseComment(h,r){

  const raceCond=inf.cond||'良';
  const isDirt=(inf.type||'')==='ダート';
  const surfLabel=isDirt?'ダート':'芝';
  const condOrder=['良','稍重','重','不良'];
  const l=h.prev?.[0];const l2=h.prev?.[1];
  const lines=[];

  // === 能力コメント ===
  if(l){
    const venue=l.venue||'';const ld=l.dist||0;
    const loc=venue+(ld?ld+'m':'');
    if(l.fin===1)lines.push('前走は'+loc+'で1着と好調。');
    else if(l.fin<=3)lines.push('前走は'+loc+'で'+l.fin+'着と好走。');
    else if(l.fin<=6)lines.push('前走は'+loc+'で'+l.fin+'着。');
    else lines.push('前走は'+loc+'で'+l.fin+'着と苦戦。');

    if(l.gap!=null&&l.gap>0&&l.gap<=0.2)lines.push('着差'+l.gap+'秒と僅差の内容。');
    else if(l.gap!=null&&l.gap>=0.5)lines.push('着差'+l.gap+'秒と差をつけられた。');
  }

  // 上がり
  if(h.f?.['上がり']){
    const m=h.f['上がり'].v.match(/(\d+)位\/(\d+)頭/);
    if(m){
      const rank=+m[1],total=+m[2];
      if(rank<=2)lines.push('上がりは'+total+'頭中'+rank+'位と末脚が光る。');
      else if(rank<=5)lines.push('上がりは'+total+'頭中'+rank+'位と標準的。');
      else lines.push('上がりは'+total+'頭中'+rank+'位と伸び切れず。');
    }
  }

  // トレンド
  if(l&&l2){
    if(l.fin<l2.fin)lines.push('近走は着順が改善傾向。');
    else if(l.fin>l2.fin)lines.push('近走は着順が悪化傾向。注意が必要。');
  }

  // === 条件コメント ===
  if(l?.dist&&dist){
    const dd=dist-l.dist;const sameV=l.venue&&l.venue===raceVenue;
    if(dd===0&&sameV)lines.push('今回は前走と同じ'+dist+'mの'+raceVenue+'。条件はベスト。');
    else if(dd===0)lines.push('今回は前走と同じ'+dist+'m。距離は合う。');
    else if(dd>0)lines.push('前走より'+dd+'m長い距離への延長。スタミナが問われる。');
    else lines.push('前走より'+Math.abs(dd)+'m短い距離への短縮。速い流れへの対応がポイント。');
  }

  if(l?.surface){
    const surfKey=isDirt?'ダ':'芝';
    if(l.surface!==surfKey){
      const from=l.surface==='ダ'?'ダート':'芝';
      lines.push('前走'+from+'から今回'+surfLabel+'へのコース変更。適性がポイント。');
    }
  }

  if(l?.cond&&raceCond){
    const ci=condOrder.indexOf(raceCond),pi=condOrder.indexOf(l.cond);
    if(ci>=0&&pi>=0&&ci>pi)lines.push('前走より馬場が悪い条件。道悪適性が問われる。');
  }

  // === 状態コメント ===
  if(h.wc!=null){
    const w=Math.abs(h.wc);
    if(w<=2)lines.push('馬体重は前走とほぼ変わらず安定。');
    else if(h.wc>=6)lines.push('馬体重が前走比+'+h.wc+'kgと大幅増。');
    else if(h.wc<=-6)lines.push('馬体重が前走比'+h.wc+'kgと大幅減。');
  }

  if(h.f?.['間隔']){
    const iv=h.f['間隔'].v;
    const wm=iv.match(/中(\d+)週/);
    if(wm){
      const w=+wm[1];
      if(w>=13)lines.push(w+'週ぶりの出走。休み明けの影響に注意。');
      else if(w>=2&&w<=4)lines.push('中'+w+'週の間隔で状態維持が期待できる。');
    }
  }

  if(h.f?.['斤量']){
    const v=h.f['斤量'].v;
    if(v.includes('最軽量'))lines.push('斤量はレース最軽量の'+h.imp+'kg。斤量面で有利。');
    else if(v.includes('最重量'))lines.push('斤量はレース最重量の'+h.imp+'kg。斤量面では厳しい。');
  }

  // フォールバック
  if(lines.length===0){
    if(!h.prev||h.prev.length===0)lines.push('出走データが少なく判断材料に乏しい。');
    else lines.push('特筆すべき加点・減点材料は見当たらない。');
  }

  return lines.join('');
}

function deleteRace(id){
  RACES=RACES.filter(x=>x.id!==id);saveR(RACES);showView('list');
}

// === TRENDS ===
function getTrendsFilter(){
  return {
    venue:document.getElementById('filterVenue')?.value||'',
    dist:document.getElementById('filterDist')?.value||'',
    surf:document.getElementById('filterSurf')?.value||''
  };
}
function clearTrendsFilter(){
  ['filterVenue','filterDist','filterSurf'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  renderTrends();
}
function renderTrends(){
  const t=getTrends();
  const f=getTrendsFilter();
  let h='';

  // フィルターUI
  const venues=[...new Set(RACES.map(r=>(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,'')).filter(Boolean))].sort();
  const dists=[...new Set(RACES.map(r=>r.info?.dist).filter(Boolean))].sort((a,b)=>a-b);

    <option value="">馬場：全て</option>
    <option value="芝"${f.surf==='芝'?' selected':''}>芝</option>
    <option value="ダート"${f.surf==='ダート'?' selected':''}>ダート</option>
  </select>
  <button class="btn-s" onclick="renderTrends()">絞り込む</button>
  <button class="btn-s" onclick="clearTrendsFilter()">リセット</button>
  </div>`;

  // フェーズ進捗バナー
  const pi=getPhaseInfo();
  h+=`<div style="background:${pi.bg};border:2px solid ${pi.color};padding:14px;border-radius:6px;margin-bottom:12px">
    <div style="font-weight:700;font-size:14px;color:${pi.color};margin-bottom:4px">${pi.message}</div>
    <div style="font-size:12px;color:var(--dim);line-height:1.7">${pi.detail}</div>
    ${pi.phase>=3?`<div style="margin-top:10px;padding:10px;background:rgba(45,106,48,.12);border-radius:4px;font-size:12px;line-height:1.8;color:var(--ink)">
      <b>フェーズ3でやること：</b><br>
      ・レース質3パターン（軸馬明確/標準/混戦）ごとの的中率・回収率を検証<br>
      ・パターン別に最適なオッズ閾値を調整する<br>
      ・見送り基準の精度を検証し、買うべきレースを絞り込む<br>
      <b style="color:var(--red)">→ CSVエクスポートしてClaude Codeに相談してください</b>
    </div>`:pi.phase>=2?`<div style="margin-top:10px;padding:10px;background:rgba(26,68,136,.08);border-radius:4px;font-size:12px;line-height:1.8;color:var(--ink)">
      <b>現在フェーズ2（完了済み）→ フェーズ3に向けてデータ蓄積中</b><br>
      ・v4.1設計（レース質3パターン）でのレース結果を蓄積中<br>
      ・${pi.target}レース到達でフェーズ3（回収率検証・閾値最適化）に移行<br>
      ・引き続き出馬表＋オッズを入力して結果を記録してください
    </div>`:''}
    <div style="margin-top:8px">
      <div style="background:var(--p2);height:8px;border-radius:4px;overflow:hidden">
        <div style="width:${pi.phase>=2?Math.min((pi.v4count||0)/pi.target*100,100):Math.min(pi.count/50*100,100)}%;height:100%;background:${pi.color};border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px;text-align:right">${pi.phase>=2?(pi.v4count||0)+'/'+pi.target+' (v4.1)':pi.count+'/50'}</div>
    </div>
  </div>`;

  if(!t){h+='<div class="pnl" style="text-align:center;padding:30px;color:var(--dim)">結果入力済みのレースが2件以上必要です</div>';document.getElementById('vTrends').innerHTML=h;return}

  const profit=t.ret-t.inv;

  // 通算成績
  h+=`<div class="pnl"><h3 class="b">📊 通算成績</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">`;
  [['レース数',t.tot+'R',''],['的中',t.hits+'R（'+t.rate+'%）',t.rate>=20?'var(--grn)':''],['不的中',(t.tot-t.hits)+'R','var(--red)']].forEach(([l,v,c])=>{
    h+=`<div style="background:var(--p2);padding:10px;border-radius:6px;text-align:center">
      <div style="font-size:11px;color:var(--dim)">${l}</div>
      <div style="font-size:18px;font-weight:700;${c?'color:'+c:''}">${v}</div>
    </div>`;
  });
  h+=`</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">`;
  [['総投資',t.inv.toLocaleString()+'円',''],['総回収',t.ret.toLocaleString()+'円',''],['損益',(profit>=0?'+':'')+profit.toLocaleString()+'円',profit>=0?'var(--grn)':'var(--red)']].forEach(([l,v,c])=>{
    h+=`<div style="background:var(--p2);padding:10px;border-radius:6px;text-align:center">
      <div style="font-size:11px;color:var(--dim)">${l}</div>
      <div style="font-size:18px;font-weight:700;${c?'color:'+c:''}">${v}</div>
    </div>`;
  });
  h+=`</div>`;
  // 回収率バー
  h+=`<div style="margin-top:12px;padding:10px 14px;background:${t.roi>=100?'rgba(45,106,48,.08)':'rgba(196,30,58,.06)'};border:1px solid ${t.roi>=100?'var(--grn)':'var(--red)'};border-radius:6px;text-align:center">
    <div style="font-size:12px;color:var(--dim)">回収率</div>
    <div style="font-size:28px;font-weight:900;color:${t.roi>=100?'var(--grn)':'var(--red)'}">${t.roi}%</div>
    <div style="background:var(--p2);height:8px;border-radius:4px;margin-top:6px;overflow:hidden">
      <div style="width:${Math.min(t.roi,150)}%;height:100%;background:${t.roi>=100?'var(--grn)':'var(--red)'};border-radius:4px"></div>
    </div>
  </div>`;
  h+=`</div>`;

  // === 蓄積データ統計（フィルター適用＋HORSE_STOREから集計） ===
  const filteredRaces=RACES.filter(r=>{
    const venue=(r.info?.course||'').replace(/\d+回/,'').replace(/\d+日/,'');
    if(f.venue&&venue!==f.venue)return false;
    if(f.dist&&String(r.info?.dist||'')!==f.dist)return false;
    if(f.surf&&(r.info?.type||'')!==f.surf)return false;
    return (r.result?.allResults?.length>0)||(r.result?.top3?.length>=3);
  });
  const filterLabel=[f.venue,f.dist?f.dist+'m':'',f.surf].filter(Boolean).join(' / ');
  if(filterLabel){
    h+=`<div style="background:rgba(26,68,136,.08);border:1px solid var(--blu);padding:8px 12px;border-radius:4px;margin-bottom:8px;font-size:13px;color:var(--blu);font-weight:700">絞り込み中：${filterLabel}（該当 ${filteredRaces.length} レース）</div>`;
  }
  const accJockey={},accTrainer={},accPop={};
  // ソース1: フィルター済みRACES
  filteredRaces.forEach(r=>{
    const allRes=r.result?.allResults||[];
    const scored=r.scored||[];
    const top3=r.result?.top3?.map(n=>+n)||[];
    if(allRes.length>0){
      allRes.forEach(ar=>{
        const rank=ar.rank||0;if(!rank)return;
        const horse=scored.find(h=>h.num===ar.num);
        const jk=ar.jockey||horse?.jk;
        if(jk){if(!accJockey[jk])accJockey[jk]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accJockey[jk];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}
        const tr=ar.trainer||horse?.trainer;
        if(tr){if(!accTrainer[tr])accTrainer[tr]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accTrainer[tr];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}
        const pop=ar.popularity||horse?.pop||horse?._resultPopularity||0;
        if(pop>=1&&pop<=18){if(!accPop[pop])accPop[pop]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accPop[pop];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}
      });
    }else if(scored.length>0&&top3.length>=3){
      scored.forEach(horse=>{
        const rank=horse._resultRank||(top3.indexOf(horse.num)>=0?top3.indexOf(horse.num)+1:0);
        if(!rank)return;
        const jk=horse.jk;if(jk){if(!accJockey[jk])accJockey[jk]={total:0,w1:0,w2:0,w3:0,w5:0};const s=accJockey[jk];s.total++;if(rank===1)s.w1++;if(rank<=2)s.w2++;if(rank<=3)s.w3++;if(rank<=5)s.w5++}
      });
    }
  });

  const totalAccRaces=filteredRaces.length;

  // --- 騎手ごとの成績 ---
  const jkMinRuns=parseInt(document.getElementById('jkMinRuns')?.value)||3;
  const jkShowStats=document.getElementById('jkShowStats')?.checked??false;
  // 全騎手の��重平均（ベイズ事前分布用）
  const allJkEntries=Object.entries(accJockey);
  const jkTotalAll=allJkEntries.reduce((a,[,v])=>a+v.total,0);
  const jkW1All=allJkEntries.reduce((a,[,v])=>a+v.w1,0);
  const jkW3All=allJkEntries.reduce((a,[,v])=>a+v.w3,0);
  const jkPriorW1=jkTotalAll>0?jkW1All/jkTotalAll:0.10;
  const jkPriorW3=jkTotalAll>0?jkW3All/jkTotalAll:0.25;
  // ベイズ補正後の複勝率でソート
  const jkEntries=allJkEntries.filter(([,v])=>v.total>=jkMinRuns)
    .map(([name,s])=>({name,s,bayesW3:bayesEstimate(s.w3,s.total,jkPriorW3),bayesW1:bayesEstimate(s.w1,s.total,jkPriorW1)}))
    .sort((a,b)=>b.bayesW3-a.bayesW3);
  h+=`<div class="pnl"><h3 class="r">🏇 騎手ごとの成績</h3>`;
  h+=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
    <span style="font-size:11px;color:var(--dim)">蓄積データ（${totalAccRaces}R）</span>
    <select id="jkMinRuns" onchange="renderTrends()" style="padding:4px 8px;font-size:12px;border:1px solid var(--bdr);border-radius:4px;background:var(--p2);font-family:'Noto Sans JP',sans-serif">

  if(jkEntries.length>0){
    h+=`<div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">`;
    h+=`<tr style="background:var(--ink);color:var(--p)"><th style="padding:6px 8px;text-align:left">騎手</th><th style="padding:6px 8px;text-align:right">出走</th><th style="padding:6px 8px;text-align:right">勝率</th><th style="padding:6px 8px;text-align:right">複勝率</th>${jkShowStats?'<th style="padding:6px 8px;text-align:right">95%CI</th><th style="padding:6px 8px;text-align:right">補正値</th>':''}<th style="padding:6px 8px;text-align:right">掲示板率</th></tr>`;
    jkEntries.slice(0,40).forEach((e,i)=>{
      const{name,s,bayesW3,bayesW1}=e;
      const bg=i%2===0?'var(--p)':'var(--p2)';
      const w1r=Math.round(s.w1/s.total*100);
      const w3r=Math.round(s.w3/s.total*100);
      const w5r=Math.round(s.w5/s.total*100);
      const badge=s.total<30?'<span style="font-size:9px;background:var(--p3);border:1px solid var(--bdr);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--lt)">少数</span>':'';
      let ciCol='',bayesCol='';
      if(jkShowStats){
        const ci=wilsonCI(s.w3,s.total);
        ciCol=`<td style="padding:4px 8px;text-align:right;font-size:11px;color:var(--lt)">[${Math.round(ci.lo*100)}-${Math.round(ci.hi*100)}%]</td>`;
        const bv=Math.round(bayesW3*100);
        const diff=bv-w3r;
        bayesCol=`<td style="padding:4px 8px;text-align:right;font-size:12px;color:${diff>0?'var(--grn)':diff<0?'var(--red)':'var(--dim)'}">${bv}%</td>`;
      }
      h+=`<tr style="background:${bg}"><td style="padding:4px 8px;font-weight:700">${name}${badge}</td><td style="padding:4px 8px;text-align:right">${s.total}</td><td style="padding:4px 8px;text-align:right;color:${w1r>=15?'var(--gld)':'var(--dim)'}">${w1r}%</td><td style="padding:4px 8px;text-align:right;font-weight:700;color:${w3r>=30?'var(--grn)':'var(--dim)'}">${w3r}%</td>${ciCol}${bayesCol}<td style="padding:4px 8px;text-align:right">${w5r}%</td></tr>`;
    });
    h+=`</table></div>`;
    if(jkShowStats)h+=`<div style="font-size:10px;color:var(--lt);margin-top:6px;line-height:1.6">95%CI: ウィルソン信頼区間。補正値: ベイズ推定（K=${BAYES_PRIOR_K}）。出走数が少ない騎手ほど全体平均（${Math.round(jkPriorW3*100)}%）に近づきます。</div>`;
  }else{h+=`<div style="color:var(--dim);font-size:13px">データ不足</div>`}
  h+=`</div>`;

  // --- 調教師ごとの成績 ---
  const trEntries=Object.entries(accTrainer).filter(([,v])=>v.total>=3).sort((a,b)=>(b[1].w3/b[1].total)-(a[1].w3/a[1].total));
  h+=`<div class="pnl"><h3 class="r">👔 調教師ごとの成績</h3>`;
  h+=`<div style="font-size:11px;color:var(--dim);margin-bottom:8px">3走以上の調教師のみ表示</div>`;
  if(trEntries.length>0){
    h+=`<div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">`;
    h+=`<tr style="background:var(--ink);color:var(--p)"><th style="padding:6px 8px;text-align:left">調教師</th><th style="padding:6px 8px;text-align:right">出走</th><th style="padding:6px 8px;text-align:right">勝率</th><th style="padding:6px 8px;text-align:right">連対率</th><th style="padding:6px 8px;text-align:right">複勝率</th><th style="padding:6px 8px;text-align:right">掲示板率</th></tr>`;
    trEntries.slice(0,30).forEach(([name,s],i)=>{
      const bg=i%2===0?'var(--p)':'var(--p2)';
      h+=`<tr style="background:${bg}"><td style="padding:4px 8px;font-weight:700">${name}</td><td style="padding:4px 8px;text-align:right">${s.total}</td><td style="padding:4px 8px;text-align:right;color:${s.w1/s.total>=.15?'var(--gld)':'var(--dim)'}">${Math.round(s.w1/s.total*100)}%</td><td style="padding:4px 8px;text-align:right">${Math.round(s.w2/s.total*100)}%</td><td style="padding:4px 8px;text-align:right;font-weight:700;color:${s.w3/s.total>=.3?'var(--grn)':'var(--dim)'}">${Math.round(s.w3/s.total*100)}%</td><td style="padding:4px 8px;text-align:right">${Math.round(s.w5/s.total*100)}%</td></tr>`;
    });
    h+=`</table></div>`;
  }else{h+=`<div style="color:var(--dim);font-size:13px">データ不足</div>`}
  h+=`</div>`;

  // --- 人気（オッズ）と実際の着順 ---
  const popEntries=Object.entries(accPop).sort((a,b)=>+a[0]- +b[0]);
  h+=`<div class="pnl"><h3 class="r">📈 人気と実際の着順</h3>`;
  h+=`<div style="font-size:11px;color:var(--dim);margin-bottom:8px">出走前の人気が実際にどの着順になったかの集計</div>`;
  if(popEntries.length>0){
    h+=`<div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">`;

    popEntries.forEach(([pop,s],i)=>{
      if(s.total<1)return;
      const w1r=Math.round(s.w1/s.total*100),w2r=Math.round(s.w2/s.total*100),w3r=Math.round(s.w3/s.total*100),w5r=Math.round(s.w5/s.total*100);
      const bg=i%2===0?'var(--p)':'var(--p2)';
      const barCol=w3r>=50?'var(--grn)':w3r>=25?'var(--gld)':'var(--red)';

    });
    h+=`</table></div>`;
  }else{h+=`<div style="color:var(--dim);font-size:13px">データ不足（人気データのあるレースがありません）</div>`}
  h+=`</div>`;

  document.getElementById('vTrends').innerHTML=h;
}

// ===== CLOUD SYNC (GitHub Gist API) =====
const GH_API='https://api.github.com';
const GH_TOKEN_IDB_KEY='ghToken';
const GIST_ID_IDB_KEY='gistId';

// --- トークン・Gist ID の永続化 ---
// Gist IDの唯一の永続ソース = URLハッシュ (#gist=xxx)
// トークンは localStorage + IndexedDB（URLには含めない）
function getGhToken(){return loadSettings().ghToken||''}
function getGistId(){return loadSettings().gistId||''}
function _getGistIdFromHash(){
  const m=location.hash.match(/[#&]gist=([a-f0-9]+)/);
  return m?m[1]:'';
}
function _setGistIdToHash(id){
  if(!id)return;
  if(location.hash.match(/[#&]gist=/)){
    location.hash=location.hash.replace(/gist=[a-f0-9]*/,'gist='+id);
  }else{
    location.hash=(location.hash||'#')+(location.hash.length>1?'&':'')+'gist='+id;
  }
}
function setGhToken(t){
  const s=loadSettings();s.ghToken=t;saveSettings(s);
  _idbSave(GH_TOKEN_IDB_KEY,t).catch(()=>{});
}
function setGistId(id){
  const s=loadSettings();s.gistId=id;saveSettings(s);
  _idbSave(GIST_ID_IDB_KEY,id).catch(()=>{});
  _setGistIdToHash(id);
}
async function restoreGhToken(){
  // 1. localStorage
  const ls=getGhToken();if(ls)return ls;
  // 2. IndexedDB
  try{const t=await _idbLoad(GH_TOKEN_IDB_KEY);if(t){const s=loadSettings();s.ghToken=t;saveSettings(s);return t}}catch{}
  return '';
}
async function restoreGistId(){
  // 1. URLハッシュ（全キャッシュ削除後も残る唯一のソース）
  const fromHash=_getGistIdFromHash();
  if(fromHash){
    const s=loadSettings();if(s.gistId!==fromHash){s.gistId=fromHash;saveSettings(s)}
    _idbSave(GIST_ID_IDB_KEY,fromHash).catch(()=>{});
    return fromHash;
  }
  // 2. localStorage
  const ls=getGistId();
  if(ls){_setGistIdToHash(ls);_idbSave(GIST_ID_IDB_KEY,ls).catch(()=>{});return ls}
  // 3. IndexedDB
  try{const id=await _idbLoad(GIST_ID_IDB_KEY);if(id){const s=loadSettings();s.gistId=id;saveSettings(s);_setGistIdToHash(id);return id}}catch{}
  return '';
}
function getLastSync(){return loadSettings().lastSync||''}
function setLastSync(t){const s=loadSettings();s.lastSync=t;saveSettings(s)}

// --- Gist API helpers ---
async function gistGet(gistId,token){
  const res=await fetch(`${GH_API}/gists/${gistId}`,{
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}
  });
  if(res.status===404)return null;
  if(!res.ok)throw new Error(`Gist GET ${res.status}: ${(await res.json()).message}`);
  return await res.json();
}
async function gistCreate(token){
  const res=await fetch(`${GH_API}/gists`,{
    method:'POST',
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({
      description:'競馬ファクター新聞 データ保存',
      public:false,
      files:{
        'races.json':{content:JSON.stringify(RACES)||'[]'},
        'horse_store.json':{content:JSON.stringify(HORSE_STORE)||'{}'},
        'settings.json':{content:JSON.stringify(loadSettings())||'{}'}
      }
    })
  });
  if(!res.ok){const e=await res.json();throw new Error(`Gist POST ${res.status}: ${e.message}`)}
  return await res.json();
}
async function gistUpdate(gistId,token){
  const res=await fetch(`${GH_API}/gists/${gistId}`,{
    method:'PATCH',
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({
      files:{
        'races.json':{content:JSON.stringify(RACES)},
        'horse_store.json':{content:JSON.stringify(HORSE_STORE)},
        'settings.json':{content:JSON.stringify(loadSettings())}
      }
    })
  });
  if(!res.ok){const e=await res.json();throw new Error(`Gist PATCH ${res.status}: ${e.message}`)}
  return await res.json();
}
function gistParseFile(gistData,filename){
  const f=gistData?.files?.[filename];
  return f?.content||null;
}

// --- 自動バックアップ（デバウンス付き） ---
let _gistSyncTimer=null;
async function scheduleGistSync(){
  if(_gistSyncTimer)clearTimeout(_gistSyncTimer);
  _gistSyncTimer=setTimeout(async()=>{
    const token=await restoreGhToken();
    const gistId=await restoreGistId();
    if(!token||!gistId)return;
    try{
      await gistUpdate(gistId,token);
      setLastSync(new Date().toLocaleString('ja-JP'));
      showSaveStatus('☁️ Gist同期完了','ok');updateSyncBadge();
    }catch(e){
      console.warn('Gist自動同期失敗:',e.message);
    }
  },2000);
}

// --- Gist自動復元: ローカルデータが空でトークン+GistIDがあれば自動取得 ---
async function autoRestoreFromGithub(){
  const token=await restoreGhToken();
  const gistId=await restoreGistId();
  if(!token||!gistId)return false;
  try{
    const gist=await gistGet(gistId,token);
    if(!gist)return false;
    const rJson=gistParseFile(gist,'races.json');
    const hJson=gistParseFile(gist,'horse_store.json');
    if(!rJson)return false;
    const remoteRaces=JSON.parse(rJson);
    const remoteHorses=hJson?JSON.parse(hJson):{};
    let restored=false;
    if(remoteRaces.length>RACES.length){
      RACES=remoteRaces;
      try{localStorage.setItem(SK,rJson)}catch{}
      restored=true;
      console.log('Gistから復元:',remoteRaces.length,'レース');
    }
    if(Object.keys(remoteHorses).length>Object.keys(HORSE_STORE).length){
      HORSE_STORE=remoteHorses;
      try{localStorage.setItem(HK,hJson)}catch{}
      restored=true;
    }
    if(restored){
      HORSE_DB=buildHorseDB();
      updateCountBadge();
    }
    return restored;
  }catch(e){console.warn('Gist自動復元失敗:',e.message);return false}
}

function doJsonBackup(){
  try{
    const backup={
      version:APP_VERSION,
      schemaVersion:DATA_SCHEMA_VERSION,
      exportedAt:new Date().toISOString(),
      data:{
        races:RACES,
        horseStore:HORSE_STORE,
        settings:loadSettings()
      },
      stats:{raceCount:RACES.length,horseCount:Object.keys(HORSE_STORE).length}
    };
    const json=JSON.stringify(backup);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const now=new Date();
    const ts=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    a.href=url;a.download='keiba_backup_'+ts+'.json';a.click();
    URL.revokeObjectURL(url);
    const s=loadSettings();s.lastJsonBackup=now.toLocaleString('ja-JP');saveSettings(s);
    const el=document.getElementById('jsonBackupStatus');
    if(el)el.innerHTML='<div class="sync-status sync-ok" style="margin-top:8px">✅ バックアップ保存完了（'+RACES.length+'レース, '+Object.keys(HORSE_STORE).length+'頭）</div>';
  }catch(e){
    const el=document.getElementById('jsonBackupStatus');
    if(el)el.innerHTML='<div class="sync-status sync-err" style="margin-top:8px">❌ '+e.message+'</div>';
  }
}
function doJsonRestore(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    const el=document.getElementById('jsonBackupStatus');
    try{
      const text=await file.text();
      const backup=JSON.parse(text);
      if(!backup.data?.races||!Array.isArray(backup.data.races))throw new Error('無効なバックアップファイルです');
      const rc=backup.data.races.length;
      const hc=backup.data.horseStore?Object.keys(backup.data.horseStore).length:0;
      if(!confirm('バックアップから復元します。\n\nバックアップ: '+rc+'レース, '+hc+'頭\n現在: '+RACES.length+'レース, '+Object.keys(HORSE_STORE).length+'頭\n\n実行しますか？'))return;
      RACES=backup.data.races;saveR(RACES);
      if(backup.data.horseStore){HORSE_STORE=backup.data.horseStore;saveHorseStore(HORSE_STORE)}
      if(backup.data.settings){const s={...loadSettings(),...backup.data.settings};saveSettings(s)}
      HORSE_DB=buildHorseDB();updateCountBadge();
      if(el)el.innerHTML='<div class="sync-status sync-ok" style="margin-top:8px">✅ 復元完了！ '+rc+'レース, '+hc+'頭</div>';
    }catch(e){
      if(el)el.innerHTML='<div class="sync-status sync-err" style="margin-top:8px">❌ '+e.message+'</div>';
    }
  };
  inp.click();
}

    renderSyncView();
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='✨ 新規Gist作成';
  }
}

async function doGhSave(){
  const token=document.getElementById('ghTokenInput').value.trim();
  const gistId=document.getElementById('gistIdInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  if(!gistId){showSyncStatus('Gist IDを入力してください。初回は「新規Gist作成」を押してください。','err');return}
  setGhToken(token);setGistId(gistId);
  if(RACES.length===0&&Object.keys(HORSE_STORE).length===0){
    showSyncStatus('❌ ローカルにデータがありません。空データでGistを上書きすることはできません。','err');return;
  }
  const btn=document.getElementById('syncSaveBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  try{
    const existing=await gistGet(gistId,token);
    if(existing){
      const rJson=gistParseFile(existing,'races.json');
      if(rJson){
        try{
          const remote=JSON.parse(rJson);
          if(remote.length>0&&RACES.length<remote.length){
            if(!confirm(`⚠️ Gistにはレース${remote.length}件ありますが、ローカルは${RACES.length}件です。\nデータが減ります。本当に上書きしますか？`)){
              btn.disabled=false;btn.textContent='📤 Gistに保存';return;
            }
          }
        }catch{}
      }
    }
    btn.textContent='⏳ 保存中...';
    showSyncStatus('Gistにアップロード中...','info');
    await gistUpdate(gistId,token);
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 保存完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭<br><span class="sync-time">保存日時: ${now}</span>`,'ok');
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📤 Gistに保存';
  }
}

async function doGhLoad(){
  const token=document.getElementById('ghTokenInput').value.trim();
  const gistId=document.getElementById('gistIdInput').value.trim();
  if(!token){showSyncStatus('トークンを入力してください','err');return}
  if(!gistId){showSyncStatus('Gist IDを入力してください','err');return}
  setGhToken(token);setGistId(gistId);
  const btn=document.getElementById('syncLoadBtn');
  btn.disabled=true;btn.textContent='⏳ 確認中...';
  showSyncStatus('Gistのデータを確認中...','info');
  try{
    const gist=await gistGet(gistId,token);
    if(!gist)throw new Error('Gistが見つかりません。Gist IDを確認してください。');
    const rJson=gistParseFile(gist,'races.json');
    const hJson=gistParseFile(gist,'horse_store.json');
    if(!rJson)throw new Error('Gistにレースデータがありません。先にGistに保存してください。');
    const remoteRaces=JSON.parse(rJson);
    const remoteHorses=hJson?JSON.parse(hJson):{};
    if(remoteRaces.length===0&&Object.keys(remoteHorses).length===0){
      throw new Error('Gistのデータが空です（レース0件、馬DB0頭）。');
    }
    if(!confirm(`Gistのデータで上書きします。\n\nリモート: レース${remoteRaces.length}件, 馬DB${Object.keys(remoteHorses).length}頭\nローカル: レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭\n\n実行しますか？`))
    {btn.disabled=false;btn.textContent='📥 Gistから復元';return}
    btn.textContent='⏳ 読込中...';
    RACES=remoteRaces;
    saveR(RACES);
    HORSE_STORE=remoteHorses;
    saveHorseStore(HORSE_STORE);
    HORSE_DB=buildHorseDB();
    const now=new Date().toLocaleString('ja-JP');
    setLastSync(now);
    showSyncStatus(`✅ 復元完了！ レース${RACES.length}件, 馬DB${Object.keys(HORSE_STORE).length}頭`,'ok');
    updateCountBadge();
  }catch(e){
    showSyncStatus('❌ エラー: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='📥 Gistから復元';
  }
}

// Init
(async()=>{
  // 0. URLハッシュからGist IDを復元（全キャッシュ削除後も残る唯一のソース）
  const hashGistId=_getGistIdFromHash();
  if(hashGistId){
    const curr=loadSettings();
    if(!curr.gistId||curr.gistId!==hashGistId){
      curr.gistId=hashGistId;
      try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(curr))}catch{}
      console.log('URLハッシュからGist ID復元:',hashGistId);
    }
  }

  // 1. IndexedDBからデータ復元（localStorage→IDB初回マイグレーション含む）
  const idbRestored=await _loadFromIdb();
  if(idbRestored){HORSE_DB=buildHorseDB();console.log('IndexedDBからデータ復元完了')}
  const fsOk=await initFileStorage();
  if(fsOk)console.log('ファイルストレージ接続済み');
  // 2. Gist自動復元（ローカルが空の場合のみ）
  const ghRestored=await autoRestoreFromGithub();
  if(ghRestored){
    const banner=document.createElement('div');
    banner.style.cssText='position:fixed;top:0;left:0;right:0;background:var(--grn);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;z-index:9999;';
    banner.textContent='✅ Gistからデータを自動復元しました（'+RACES.length+'レース）';
    document.body.prepend(banner);setTimeout(()=>banner.remove(),4000);
  }
  // 3. 起動時に全レースをv2スコアリングで再計算（バージョンフラグで制御）
  const SCORE_VER='v5.0.0';
  HORSE_DB=buildHorseDB();
  let rescored=0;
  RACES.forEach(r=>{
    if(!r.scored||r.scored.length===0||r.id?.startsWith('bulk_')||r.id?.startsWith('csv_'))return;
    if(r._scoreVer===SCORE_VER)return; // 既に最新バージョンで計算済み
    if(r.result?.top3?.length>=3)return; // 結果入力済みレースは再スコアリングしない（データリーケージ防止）
    try{
      const race={horses:r.scored.map(h=>({
        num:h.num,name:h.name,waku:h.waku,odds:h.odds,pop:h.pop,
        rec:h.rec,starts:h.starts,wt:h.wt,wc:h.wc,sex:h.sex,age:h.age,
        jk:h.jk,jkDiscount:h.jkDiscount,imp:h.imp,sire:h.sire,bms:h.bms,trainer:h.trainer,bl:h.bl,prev:h.prev||[],prize:h.prize
      })),info:r.info};
      const oldTop=r.scored[0]?.ns||0;
      r.scored=score(race);
      r.bet=genBet(r.scored,r.info,r._marketOdds);
      r._scoreVer=SCORE_VER;
      const newTop=r.scored[0]?.ns||0;
      if(rescored===0)console.log('再スコア例: '+r.label+' 旧top='+oldTop+' → 新top='+newTop+' EV='+r.scored[0]?.ev);
      rescored++;
    }catch(e){console.warn('再スコア失敗:',r.label,e)}
  });
  if(rescored>0){saveR(RACES);console.log(rescored+'レースをSCORE_VER='+SCORE_VER+'で再スコアリング完了')}
  // snapshotの遡及生成
  RACES.forEach(r=>{
    if(r.result?.top3?.length>=3&&r.scored?.length>0&&!r.result.analysisSnapshot&&!r.id?.startsWith('bulk_')&&!r.id?.startsWith('csv_')&&!isPastOnly(r)){
      try{r.result.analysisSnapshot=buildAnalysisSnapshot(r)}catch(e){}
    }
  });
  updateCountBadge();
  updateSyncBadge();
  showView('input');
  // Service Worker 登録
  if('serviceWorker'in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            showSaveStatus('🔄 アプリが更新されました。再読み込みで反映されます。','ok');
          }
        });
      });
    }).catch(e=>console.warn('SW登録失敗:',e));
  }
})();

function showJkAptPopup(e,jkName){
  e.stopPropagation();
  let popup=document.getElementById('jkAptPopup');
  if(!popup){popup=document.createElement('div');popup.id='jkAptPopup';document.body.appendChild(popup)}
  popup.innerHTML=renderJockeyPopupHTML(jkName);
  popup.style.display='block';
  // モバイル対応：画面内に収める
  const rect=e.target.getBoundingClientRect();
  let top=rect.bottom+4;let left=rect.left;
  if(left+320>window.innerWidth)left=window.innerWidth-330;
  if(left<10)left=10;
  if(top+200>window.innerHeight)top=rect.top-210;
  popup.style.top=top+'px';popup.style.left=left+'px';
}
document.addEventListener('click',()=>{const p=document.getElementById('jkAptPopup');if(p)p.style.display='none'});
